<style>
/*
 * デザイントークン。
 *
 * 値を直接書かず、必ずここのトークンを参照する。light / dark を
 * 対で定義するため、片方だけ壊れることがない。
 *
 * ダーク単色ではなく両対応にしているのは、このアプリが就業規則のような
 * 業務文書を読むものだから。文書本文は白地で読む前提の利用者が多い。
 */
:root {
  color-scheme: light dark;

  /* 面 */
  --bg: #ffffff;
  --bg-2: #f6f8fa;
  --bg-3: #eaeef2;
  --line: #d0d7de;
  --line-strong: #afb8c1;

  /* 文字 */
  --ink: #1f2328;
  --ink-2: #59636e;

  /* 意味を持つ色 */
  --accent: #0969da;
  --accent-bg: #ddf4ff;
  --success: #1a7f37;
  --success-bg: #dafbe1;
  --danger: #cf222e;
  --danger-bg: #ffebe9;
  --warn: #9a6700;
  --warn-bg: #fff8c5;
  --merged: #8250df;
  --merged-bg: #fbefff;

  /* accent の上に載る文字。地の明るさが逆転するため対で持つ */
  --on-accent: #ffffff;
  /* 浮いて見せる面。ライトでは白、ダークでは地より明るくする */
  --surface-raised: #ffffff;

  /* 余白 (4pt スケール) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;

  /* その他 */
  --radius: 6px;
  --radius-sm: 4px;
  --shadow: 0 1px 3px rgba(31, 35, 40, 0.12);
  --motion: 160ms;
  --sidebar-w: 260px;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
}

/*
 * ダークの値。以下の2つのセレクタに同じ内容を当てる。
 *   1. システム設定がダーク、かつ手動でライトを選んでいないとき
 *   2. 手動でダークを選んだとき
 * 片方だけ直すと不整合になるため、test/ui-structure.test.js で
 * 2つのブロックが同一であることを検査している。
 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --bg-2: #161b22;
    --bg-3: #21262d;
    --line: #3d444d;
    --line-strong: #6e7681;

    --ink: #e6edf3;
    --ink-2: #9198a1;

    --accent: #4493f8;
    --accent-bg: #121d2f;
    --success: #3fb950;
    --success-bg: #0f2417;
    --danger: #f85149;
    --danger-bg: #2a1416;
    --warn: #d29922;
    --warn-bg: #2b2413;
    --merged: #ab7df8;
    --merged-bg: #1d1626;

    --on-accent: #0d1117;
    --surface-raised: #21262d;

    --shadow: 0 1px 3px rgba(1, 4, 9, 0.6);
  }
}

:root[data-theme="dark"] {
    --bg: #0d1117;
    --bg-2: #161b22;
    --bg-3: #21262d;
    --line: #3d444d;
    --line-strong: #6e7681;

    --ink: #e6edf3;
    --ink-2: #9198a1;

    --accent: #4493f8;
    --accent-bg: #121d2f;
    --success: #3fb950;
    --success-bg: #0f2417;
    --danger: #f85149;
    --danger-bg: #2a1416;
    --warn: #d29922;
    --warn-bg: #2b2413;
    --merged: #ab7df8;
    --merged-bg: #1d1626;

    --on-accent: #0d1117;
    --surface-raised: #21262d;

    --shadow: 0 1px 3px rgba(1, 4, 9, 0.6);
}

* { box-sizing: border-box; }

/*
 * hidden 属性を確実に効かせる。
 *
 * ブラウザ標準の [hidden]{display:none} は UA スタイルシートにあるため、
 * 作者スタイルの .empty{display:flex} に詳細度で負ける。その結果
 * el.hidden = true にしても要素が消えず、レイアウトを占有し続ける。
 * display を指定するクラスを持つ要素を JS で開閉する場合は必須。
 */
[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue',
               'Hiragino Sans', 'Noto Sans JP', sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.7;
}

.layout { display: flex; height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  border-right: 1px solid var(--line);
  background: var(--bg-2);
  overflow-y: auto;
  padding: 16px 0;
}

.sidebar h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-2);
  margin: 0 16px 8px;
}

.file-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 16px;
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink);
  font-family: inherit;
}

.file-item:hover { background: rgba(0, 0, 0, 0.04); }
.file-item[aria-current="true"] { background: rgba(26, 115, 232, 0.1); color: var(--accent); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
}

.toolbar h1 { font-size: 15px; margin: 0; font-weight: 600; }
.toolbar .spacer { flex: 1; }

.toolbar a {
  color: var(--accent);
  text-decoration: none;
  font-size: 13px;
}

.viewer { flex: 1; border: 0; width: 100%; background: var(--bg); }

.empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-2);
}

/* ===== Phase 2: タブ・履歴・差分・PR ===== */

.badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--warn-bg);
  color: var(--warn);
}

.chip {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--bg-2);
  color: var(--ink-2);
  border: 1px solid var(--line);
}

.btn {
  font-family: inherit;
  font-size: 13px;
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
}

.btn:hover:not(:disabled) { background: var(--bg-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.tabs {
  display: flex;
  gap: 4px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
}

.tab {
  font-family: inherit;
  font-size: 13px;
  padding: 8px 14px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
}

.tab[aria-current="true"] {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.panel { flex: 1; display: flex; overflow: hidden; }
.panel-col { flex-direction: column; }

.panel-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
}

.list-area { flex: 1; overflow-y: auto; }

.history-list {
  width: 320px;
  flex: 0 0 320px;
  overflow-y: auto;
  border-right: 1px solid var(--line);
}

.commit-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 16px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  cursor: pointer;
  font-family: inherit;
}

.commit-item:hover { background: var(--bg-2); }
.commit-item[aria-current="true"] { background: rgba(26, 115, 232, 0.08); }

.commit-message { font-size: 13px; color: var(--ink); margin-bottom: 3px; }
.commit-meta { font-size: 11px; color: var(--ink-2); }

.diff-view {
  flex: 1;
  overflow: auto;
  padding: 16px 20px;
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 12px;
  line-height: 1.6;
}

.diff-line {
  white-space: pre-wrap;
  word-break: break-all;
  padding: 1px 8px;
  border-radius: 2px;
}

.diff-equal  { color: var(--ink-2); }
.diff-insert { background: var(--success-bg); color: var(--success); }
.diff-delete { background: var(--danger-bg); color: var(--danger); }

.diff-empty { color: var(--ink-2); font-family: inherit; }

.row-item {
  padding: 10px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
}

.row-title { font-size: 13px; }
.row-meta { font-size: 11px; color: var(--ink-2); }

.state {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--bg-2);
  color: var(--ink-2);
}

.state-open { background: var(--success-bg); color: var(--success); }
.state-approved { background: var(--accent-bg); color: var(--accent); }
.state-merged { background: var(--merged-bg); color: var(--merged); }

.pr-actions {
  display: flex;
  gap: 8px;
  padding: 12px 0;
  flex-wrap: wrap;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
}

/* ブランチ選択は上部に1つだけ置く。ファイル一覧とグラフの両方を支配する */
.branch-switch {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  flex: 0 0 auto;
}

.branch-switch select {
  min-width: 150px;
  padding: 4px 6px;
  font-size: 12px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
}

.tree-dir {
  font-size: 11px;
  color: var(--ink-2);
  padding: 6px 16px 2px;
}

.tree-row { display: flex; align-items: center; }
.tree-row .file-item { flex: 1; }
.file-item.nested { padding-left: 28px; }

.guide {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
  max-width: 760px;
  color: var(--ink);
  line-height: 1.9;
  font-size: 14px;
}

.guide h2 {
  font-size: 16px;
  margin: 28px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line);
}

.guide h2:first-child { margin-top: 0; }
.guide h3 { font-size: 14px; margin: 20px 0 4px; }
.guide p { margin: 6px 0; }
.guide ol { margin: 8px 0; padding-left: 24px; }
.guide li { margin: 6px 0; }

.guide code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  background: var(--bg-2);
  border-radius: 3px;
  padding: 1px 4px;
}

.guide-table { border-collapse: collapse; margin: 8px 0; }

.guide-table td {
  border: 1px solid var(--line);
  padding: 4px 10px;
  font-size: 13px;
}

.guide-table td:first-child { color: var(--ink-2); white-space: nowrap; }

.guide-foot {
  margin-top: 32px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.type-badge {
  font-size: 10px;
  color: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 0 4px;
}

.file-link {
  font-size: 12px;
  color: var(--accent);
  padding: 0 12px 0 4px;
  text-decoration: none;
}

.diff-split { display: table; width: 100%; border-collapse: collapse; }

.diff-row { display: table-row; }

.diff-cell {
  display: table-cell;
  width: 50%;
  padding: 1px 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-all;
  vertical-align: top;
  border-left: 1px solid var(--line);
}

.diff-cell.del { background: var(--danger-bg); }
.diff-cell.ins { background: var(--success-bg); }
.diff-cell.empty { background: var(--bg-2); }

.pr-tabs { display: flex; gap: 4px; margin: 10px 0; }

.pr-tab {
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink-2);
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 12px;
  cursor: pointer;
}

.pr-tab[aria-current="true"] { color: var(--ink); background: var(--bg-2); }

.comment {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 8px;
}

.comment-head { font-size: 11px; color: var(--ink-2); margin-bottom: 4px; }
.comment-body { font-size: 13px; color: var(--ink); white-space: pre-wrap; }

.comment-form { display: flex; gap: 6px; margin-top: 10px; }

.comment-form textarea {
  flex: 1;
  min-height: 60px;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 8px;
  font-size: 13px;
  color: var(--ink);
  background: var(--bg);
}

.editor {
  flex: 1;
  width: 100%;
  border: 0;
  padding: 16px 20px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink);
  background: var(--bg);
  resize: none;
}

.editor:disabled { background: var(--bg-2); color: var(--ink-2); }

.linked-issues {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
}

.linked-issue {
  font-size: 12px;
  color: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 10px;
}

.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(180px, 1fr));
  gap: 12px;
  padding: 12px;
  overflow-x: auto;
  align-items: start;
}

.board-column {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
  min-height: 80px;
}

.board-column h3 {
  font-size: 12px;
  color: var(--ink-2);
  margin: 0 0 8px;
}

.board-card {
  background: var(--surface-raised);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 8px;
  margin-bottom: 6px;
  font-size: 13px;
  color: var(--ink);
  cursor: grab;
}

.board-card .row-meta { display: block; margin-top: 4px; }

.board-column.drop-target { border-color: var(--accent); }

.conflict-block {
  border: 1px solid var(--danger);
  border-radius: 4px;
  margin: 12px 0;
  overflow: hidden;
}

.conflict-head {
  background: var(--danger-bg);
  color: var(--danger);
  padding: 6px 10px;
  font-size: 12px;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
}

.conflict-side { padding: 6px 10px; border-top: 1px solid var(--line); }

.conflict-label {
  font-size: 11px;
  color: var(--ink-2);
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
}

.conflict-choice {
  padding: 8px 10px;
  border-top: 1px solid var(--line);
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  font-size: 12px;
}

.pr-title {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
}


/* =====================================================================
 * デザインシステム — 相互作用・モーション・レスポンシブ
 * ここから下は全体に効く規則。個別コンポーネントの上書きではない。
 * ===================================================================== */

/*
 * フォーカスは必ず見せる。キーボードだけで操作する人が現在地を
 * 見失わないため。マウス操作時には出さない (:focus-visible)。
 */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

button, select, textarea, a { font-family: inherit; }

button, select, a[href] { cursor: pointer; }

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

/* 状態の変化は 160ms で滑らかに。色と背景だけを動かす */
.btn, .tab, .pr-tab, .file-item, .row-item, .board-card, .file-link {
  transition: background-color var(--motion) ease-out,
              border-color var(--motion) ease-out,
              color var(--motion) ease-out;
}

/* 動きを減らす設定を尊重する */
@media (prefers-reduced-motion: reduce) {
  * {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

.btn:hover:not(:disabled) { background: var(--bg-3); }
.tab:hover { color: var(--ink); }
.file-item:hover, .row-item:hover, .board-card:hover { background: var(--bg-3); }
.file-link:hover { background: var(--bg-3); }

/* 現在地を色だけで示さない。太さと下線も併せて変える */
.tab[aria-current="true"] { font-weight: 600; }

/*
 * 空の状態。「何も無い」ではなく「次に何をすればよいか」を出す。
 */
.blank-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  color: var(--ink-2);
  font-size: 13px;
}

.blank-state strong {
  display: block;
  color: var(--ink);
  font-size: 14px;
}

.blank-state .btn { margin-top: var(--sp-2); }

/* テーマ切替 */
.theme-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--ink-2);
}

.theme-btn:hover { background: var(--bg-3); color: var(--ink); }

/* アイコン。絵文字ではなく SVG を使う */
.icon {
  width: 16px;
  height: 16px;
  flex: 0 0 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: -3px;
}

/*
 * 狭い画面では左ペインを畳む。GAS の Web App は iframe に埋め込まれる
 * ことがあり、幅が読めない。
 */
@media (max-width: 767px) {
  .layout { flex-direction: column; height: auto; min-height: 100dvh; }

  .sidebar {
    width: 100%;
    flex: none;
    max-height: 40vh;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .main { min-height: 60vh; }

  .toolbar { flex-wrap: wrap; gap: var(--sp-2); }

  .board { grid-template-columns: 1fr; }

  .diff-cell { font-size: 11px; }
}


/* =====================================================================
 * コミットグラフ
 * ===================================================================== */

.graph-row {
  display: flex;
  align-items: stretch;
  gap: var(--sp-2);
}

.graph-cell { flex: 0 0 auto; }

.graph-body { flex: 1; min-width: 0; padding: var(--sp-1) 0; }

.graph-line { stroke-width: 2; }
.graph-dot { stroke-width: 2; fill: var(--bg); }
.graph-dot.merge { fill: var(--merged); stroke: var(--merged); }

/* レーンの色。色だけに意味を持たせず、ブランチ名のチップも併記する */
.lane-0 { stroke: var(--ink-2); }
.lane-1 { stroke: var(--accent); }
.lane-2 { stroke: var(--success); }
.lane-3 { stroke: var(--warn); }

.lane-chip { margin-left: auto; align-self: center; }
.lane-chip.lane-0 { color: var(--ink-2); border-color: var(--line); }
.lane-chip.lane-1 { color: var(--accent); border-color: var(--accent); }
.lane-chip.lane-2 { color: var(--success); border-color: var(--success); }
.lane-chip.lane-3 { color: var(--warn); border-color: var(--warn); }


/* =====================================================================
 * アイコンを伴うラベル
 * ===================================================================== */

.tab, .btn, .file-item, .pr-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.file-item { display: flex; }

/*
 * アイコンは currentColor を継承する。文字と同じ色になるため、
 * 文字のコントラストを満たしていればアイコンも満たす。
 */
.tab .icon, .btn .icon, .pr-tab .icon { opacity: 0.85; }
.tab[aria-current="true"] .icon { opacity: 1; }

.blank-state .icon {
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  stroke-width: 1.25;
  color: var(--ink-2);
}

/* =====================================================================
 * モードレスな通知と入力
 *
 * ブラウザの alert / confirm / prompt はモーダルであり、操作を中断させ、
 * 取り消しの手段も与えない。バナー通知と画面内フォームに置き換える。
 * ===================================================================== */

.snackbar {
  position: fixed;
  left: 50%;
  bottom: var(--sp-5);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  max-width: min(560px, calc(100vw - 32px));
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink-2);
  border-radius: var(--radius);
  background: var(--bg-2);
  color: var(--ink);
  box-shadow: var(--shadow);
