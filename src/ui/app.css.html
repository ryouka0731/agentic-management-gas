<style>
:root {
  --ink: #1a1a1a;
  --ink-2: #666;
  --line: #e0e0e0;
  --bg: #ffffff;
  --bg-2: #f7f7f7;
  --accent: #1a73e8;
}

* { box-sizing: border-box; }

/*
 * hidden 属性を確実に効かせる。
 *
 * ブラウザ標準の [hidden]{display:none} は UA スタイルシートにあるため、
 * 作者スタイルの .empty{display:flex} に詳細度で負ける。その結果
 * el.hidden = true にしても要素が消えず、レイアウトを占有し続ける。
 * display を指定するクラスを持つ要素を JS で開閉する場合は必須。
 */
[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue',
               'Hiragino Sans', 'Noto Sans JP', sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.7;
}

.layout { display: flex; height: 100vh; }

.sidebar {
  width: 260px;
  flex: 0 0 260px;
  border-right: 1px solid var(--line);
  background: var(--bg-2);
  overflow-y: auto;
  padding: 16px 0;
}

.sidebar h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-2);
  margin: 0 16px 8px;
}

.file-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 16px;
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink);
  font-family: inherit;
}

.file-item:hover { background: rgba(0, 0, 0, 0.04); }
.file-item[aria-current="true"] { background: rgba(26, 115, 232, 0.1); color: var(--accent); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
}

.toolbar h1 { font-size: 15px; margin: 0; font-weight: 600; }
.toolbar .spacer { flex: 1; }

.toolbar a {
  color: var(--accent);
  text-decoration: none;
  font-size: 13px;
}

.viewer { flex: 1; border: 0; width: 100%; background: var(--bg); }

.empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-2);
}

/* ===== Phase 2: タブ・履歴・差分・PR ===== */

.badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: #fef3c7;
  color: #92400e;
}

.chip {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--bg-2);
  color: var(--ink-2);
  border: 1px solid var(--line);
}

.btn {
  font-family: inherit;
  font-size: 13px;
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
}

.btn:hover:not(:disabled) { background: var(--bg-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.tabs {
  display: flex;
  gap: 4px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
}

.tab {
  font-family: inherit;
  font-size: 13px;
  padding: 8px 14px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
}

.tab[aria-current="true"] {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.panel { flex: 1; display: flex; overflow: hidden; }
.panel-col { flex-direction: column; }

.panel-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
}

.list-area { flex: 1; overflow-y: auto; }

.history-list {
  width: 320px;
  flex: 0 0 320px;
  overflow-y: auto;
  border-right: 1px solid var(--line);
}

.commit-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 16px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  cursor: pointer;
  font-family: inherit;
}

.commit-item:hover { background: var(--bg-2); }
.commit-item[aria-current="true"] { background: rgba(26, 115, 232, 0.08); }

.commit-message { font-size: 13px; color: var(--ink); margin-bottom: 3px; }
.commit-meta { font-size: 11px; color: var(--ink-2); }

.diff-view {
  flex: 1;
  overflow: auto;
  padding: 16px 20px;
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 12px;
  line-height: 1.6;
}

.diff-line {
  white-space: pre-wrap;
  word-break: break-all;
  padding: 1px 8px;
  border-radius: 2px;
}

.diff-equal  { color: var(--ink-2); }
.diff-insert { background: #e6ffed; color: #22863a; }
.diff-delete { background: #ffeef0; color: #b31d28; }

.diff-empty { color: var(--ink-2); font-family: inherit; }

.row-item {
  padding: 10px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
}

.row-title { font-size: 13px; }
.row-meta { font-size: 11px; color: var(--ink-2); }

.state {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--bg-2);
  color: var(--ink-2);
}

.state-open { background: #dcfce7; color: #166534; }
.state-approved { background: #dbeafe; color: #1e40af; }
.state-merged { background: #ede9fe; color: #5b21b6; }

.pr-actions {
  display: flex;
  gap: 8px;
  padding: 12px 0;
  flex-wrap: wrap;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
}

.conflict-block {
  border: 1px solid #fca5a5;
  border-radius: 4px;
  margin: 12px 0;
  overflow: hidden;
}

.conflict-head {
  background: #fee2e2;
  color: #991b1b;
  padding: 6px 10px;
  font-size: 12px;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
}

.conflict-side { padding: 6px 10px; border-top: 1px solid #fecaca; }

.conflict-label {
  font-size: 11px;
  color: var(--ink-2);
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
}

.conflict-choice {
  padding: 8px 10px;
  border-top: 1px solid #fecaca;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  font-size: 12px;
}

.pr-title {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
}
</style>
