<style>
/*
 * デザイントークン。
 *
 * 値を直接書かず、必ずここのトークンを参照する。light / dark を
 * 対で定義するため、片方だけ壊れることがない。
 *
 * ダーク単色ではなく両対応にしているのは、このアプリが就業規則のような
 * 業務文書を読むものだから。文書本文は白地で読む前提の利用者が多い。
 */
:root {
  color-scheme: light dark;

  /* 面 */
  --bg: #ffffff;
  --bg-2: #f6f8fa;
  --bg-3: #eaeef2;
  --line: #d0d7de;
  --line-strong: #afb8c1;

  /* 文字 */
  --ink: #1f2328;
  --ink-2: #59636e;

  /* 意味を持つ色 */
  --accent: #0969da;
  --accent-bg: #ddf4ff;
  --success: #1a7f37;
  --success-bg: #dafbe1;
  --danger: #cf222e;
  --danger-bg: #ffebe9;
  --warn: #9a6700;
  --warn-bg: #fff8c5;
  --merged: #8250df;
  --merged-bg: #fbefff;

  /* accent の上に載る文字。地の明るさが逆転するため対で持つ */
  --on-accent: #ffffff;
  /* 塗りつぶしの危険色と、その上に載る文字 */
  --danger-solid: #cf222e;
  --on-danger: #ffffff;
  /* 浮いて見せる面。ライトでは白、ダークでは地より明るくする */
  --surface-raised: #ffffff;

  /* 余白 (4pt スケール) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;

  /* その他 */
  --radius: 6px;
  --radius-sm: 4px;
  --shadow: 0 1px 3px rgba(31, 35, 40, 0.12);
  /* 押せることを示す影。段が上がるほど手前に見える (Material の elevation) */
  --elev-1: 0 1px 2px rgba(31, 35, 40, 0.16), 0 2px 6px rgba(31, 35, 40, 0.10);
  --elev-2: 0 3px 6px rgba(31, 35, 40, 0.20), 0 8px 20px rgba(31, 35, 40, 0.14);
  --hairline: inset 0 0 0 1px rgba(31, 35, 40, 0.14);
  --motion: 160ms;
  --sidebar-w: 260px;
  /* 系統の列幅。枝の本数に応じて画面側が書き換える */
  --graph-w: 60px;
  /* 目盛りの週の区切り位置。画面側が書き換える */
  --week-offset: 0;
  /* 工程表の名前列の幅。目盛りの下敷きの左端と揃える */
  --gantt-name-w: 220px;
  /* 履歴と差分の分け目。掴んで動かせる */
  --graph-pane-w: 46%;
  /* 確認依頼の一覧と中身の分け目 */
  --pr-pane-w: 38%;
  /* 報告の一覧と話の分け目 */
  --report-pane-w: 38%;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  /* 選択肢や巻き取りにもテーマを伝える。OS 側の明暗に引きずられない */
  color-scheme: light;
}

/*
 * ダークの値。以下の2つのセレクタに同じ内容を当てる。
 *   1. システム設定がダーク、かつ手動でライトを選んでいないとき
 *   2. 手動でダークを選んだとき
 * 片方だけ直すと不整合になるため、test/ui-structure.test.js で
 * 2つのブロックが同一であることを検査している。
 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --bg-2: #161b22;
    --bg-3: #21262d;
    --line: #3d444d;
    --line-strong: #6e7681;

    --ink: #e6edf3;
    --ink-2: #9198a1;

    --accent: #4493f8;
    --accent-bg: #121d2f;
    --success: #3fb950;
    --success-bg: #0f2417;
    --danger: #f85149;
    --danger-bg: #2a1416;
    --warn: #d29922;
    --warn-bg: #2b2413;
    --merged: #ab7df8;
    --merged-bg: #1d1626;

    --on-accent: #0d1117;
    --danger-solid: #c93c37;
    --on-danger: #ffffff;
    --surface-raised: #21262d;

    --shadow: 0 1px 3px rgba(1, 4, 9, 0.6);
    /* 暗い地では影がほぼ見えない。縁の明るい線で段を表す */
    --elev-1: 0 1px 3px rgba(1, 4, 9, 0.5);
    --elev-2: 0 3px 8px rgba(1, 4, 9, 0.7);
    --hairline: inset 0 0 0 1px rgba(255, 255, 255, 0.10);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
    --bg: #0d1117;
    --bg-2: #161b22;
    --bg-3: #21262d;
    --line: #3d444d;
    --line-strong: #6e7681;

    --ink: #e6edf3;
    --ink-2: #9198a1;

    --accent: #4493f8;
    --accent-bg: #121d2f;
    --success: #3fb950;
    --success-bg: #0f2417;
    --danger: #f85149;
    --danger-bg: #2a1416;
    --warn: #d29922;
    --warn-bg: #2b2413;
    --merged: #ab7df8;
    --merged-bg: #1d1626;

    --on-accent: #0d1117;
    --danger-solid: #c93c37;
    --on-danger: #ffffff;
    --surface-raised: #21262d;

    --shadow: 0 1px 3px rgba(1, 4, 9, 0.6);
    /* 暗い地では影がほぼ見えない。縁の明るい線で段を表す */
    --elev-1: 0 1px 3px rgba(1, 4, 9, 0.5);
    --elev-2: 0 3px 8px rgba(1, 4, 9, 0.7);
    --hairline: inset 0 0 0 1px rgba(255, 255, 255, 0.10);
    color-scheme: dark;
}

* { box-sizing: border-box; }

/*
 * hidden 属性を確実に効かせる。
 *
 * ブラウザ標準の [hidden]{display:none} は UA スタイルシートにあるため、
 * 作者スタイルの .empty{display:flex} に詳細度で負ける。その結果
 * el.hidden = true にしても要素が消えず、レイアウトを占有し続ける。
 * display を指定するクラスを持つ要素を JS で開閉する場合は必須。
 */
[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue',
               'Hiragino Sans', 'Noto Sans JP', sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.7;
}

.layout { display: flex; height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  /*
   * flex の既定 (min-width: auto) は中身より小さくならない。指定しないと
   * 幅を狭める操作だけが効かず「広げられるのに縮まない」状態になる
   */
  min-width: 0;
  border-right: 1px solid var(--line);
  background: var(--bg-2);
  overflow-y: auto;
  padding: 16px 0;
}

.sidebar h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-2);
  margin: 0 16px 8px;
}

.file-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 16px;
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink);
  font-family: inherit;
}

.file-item:hover { background: var(--bg-3); }
/* 選択中は色だけでなく左の罫でも示す */
.file-item[aria-current="true"] {
  background: var(--accent-bg);
  color: var(--accent);
  box-shadow: inset 3px 0 0 var(--accent);
  font-weight: 600;
}

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/*
 * 上の帯。狭いときは右の操作を次の行に落とす。
 *
 * 一列に押し込めると、札や戻り先の文字が1文字ずつ折り返って読めなくなる。
 * 縮めてよいのは文書名だけで、そこは末尾を「…」にする
 */
.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
}

.toolbar h1 { font-size: 15px; margin: 0; font-weight: 600; }
.toolbar .spacer { flex: 1; }

.toolbar a {
  color: var(--accent);
  text-decoration: none;
  font-size: 13px;
}

.viewer { flex: 1; border: 0; width: 100%; background: var(--bg); }

.empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-2);
}

/* ===== Phase 2: タブ・履歴・差分・PR ===== */

.badge {
  flex: 0 0 auto;
  white-space: nowrap;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--warn-bg);
  color: var(--warn);
}

.chip {
  flex: 0 0 auto;
  white-space: nowrap;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--bg-3);
  color: var(--ink-2);
  border: 0;
}

/*
 * ボタン。
 *
 * 枠線は「境界」の記号であって「押せる」の記号ではない。面を一段
 * 持ち上げて影を落とし、触れると浮き、押すと沈む。目で見て手が
 * 動かせることが分かる状態にする (シグニファイア)。
 */
.btn {
  font-family: inherit;
  font-size: 13px;
  min-height: 32px;
  padding: 6px 14px;
  border: 0;
  border-radius: var(--radius);
  background: var(--surface-raised);
  color: var(--ink);
  cursor: pointer;
  box-shadow: var(--hairline), var(--elev-1);
  transition: box-shadow var(--motion) ease-out,
              transform var(--motion) ease-out,
              background-color var(--motion) ease-out;
}

.btn:hover:not(:disabled) {
  background: var(--surface-raised);
  box-shadow: var(--hairline), var(--elev-2);
  transform: translateY(-1px);
}

/* 押した瞬間に沈む。操作が届いたことが指で分かる */
.btn:active:not(:disabled) {
  box-shadow: var(--hairline);
  transform: translateY(1px);
}

/*
 * その画面で主となる操作は1つだけ塗る。すべてを目立たせると
 * どれが本筋か分からなくなる。
 */
.btn-primary {
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
  box-shadow: var(--elev-1);
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent);
  box-shadow: var(--elev-2);
}

/* 押せないものは浮かせない。影が無いこと自体が signifier になる */
.btn:disabled {
  opacity: .55;
  cursor: not-allowed;
  box-shadow: var(--hairline);
  transform: none;
}

.tabs {
  display: flex;
  gap: 4px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
}

.tab {
  font-family: inherit;
  font-size: 13px;
  padding: 8px 14px;
  border: 0;
  border-bottom: 3px solid transparent;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
}

/* 触れると下線が薄く出る。押せる場所であることが分かる */
.tab:hover:not([aria-current="true"]) { border-bottom-color: var(--line-strong); }
.tab[aria-current="true"] { border-bottom-color: var(--accent); color: var(--ink); }

.tab[aria-current="true"] {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.panel { flex: 1; display: flex; overflow: hidden; }
.panel-col { flex-direction: column; }

.panel-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
}

/* 一覧の器。行を浮かせるため、地を一段沈める */
.list-area {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-3) 0 var(--sp-6);
  background: var(--bg-2);
}

.history-list {
  width: 320px;
  flex: 0 0 320px;
  overflow-y: auto;
  border-right: 1px solid var(--line);
}

.commit-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 16px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  cursor: pointer;
  font-family: inherit;
}

.commit-item:hover { background: var(--bg-2); }
.commit-item[aria-current="true"] { background: rgba(26, 115, 232, 0.08); }

.commit-message { font-size: 13px; color: var(--ink); margin-bottom: 3px; }
.commit-meta { font-size: 11px; color: var(--ink-2); }

/*
 * 差分の器。
 *
 * 等幅は差分の行そのものにだけ効かせる。器ごと等幅にすると、題名も
 * 依頼した人もコメントも等幅になり、ただ古びて見える
 */
.diff-view {
  flex: 1;
  overflow: auto;
  padding: var(--sp-4) var(--sp-5);
  font-size: 13px;
  line-height: 1.7;
}

.diff-line {
  white-space: pre-wrap;
  word-break: break-all;
  padding: 2px var(--sp-2);
  border-radius: var(--radius-sm);
  font-family: var(--mono);
  font-size: 12px;
}

.diff-equal  { color: var(--ink-2); }
.diff-insert { background: var(--success-bg); color: var(--success); }
.diff-delete { background: var(--danger-bg); color: var(--danger); }

.diff-empty { color: var(--ink-2); font-family: inherit; }



.row-title { font-size: 13px; color: var(--ink); }
.row-meta { font-size: 11px; color: var(--ink-2); }

.state {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--bg-2);
  color: var(--ink-2);
}

.state-open { background: var(--success-bg); color: var(--success); }
.state-approved { background: var(--accent-bg); color: var(--accent); }
.state-merged { background: var(--merged-bg); color: var(--merged); }

.pr-actions {
  display: flex;
  gap: 8px;
  padding: 12px 0;
  flex-wrap: wrap;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
}

/* ブランチ選択は上部に1つだけ置く。ファイル一覧とグラフの両方を支配する */
.branch-switch {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  flex: 0 0 auto;
}

.branch-switch select {
  min-width: 150px;
  padding: 4px 6px;
  font-size: 12px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
}

.tree-dir {
  font-size: 11px;
  color: var(--ink-2);
  padding: 6px 16px 2px;
}

.tree-row { display: flex; align-items: center; }
.tree-row .file-item { flex: 1; }
.file-item.nested { padding-left: 28px; }

.guide {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
  max-width: 760px;
  color: var(--ink);
  line-height: 1.9;
  font-size: 14px;
}

.guide h2 {
  font-size: 16px;
  margin: var(--sp-6) 0 var(--sp-2);
}

.guide h2:first-child { margin-top: 0; }
.guide h3 { font-size: 14px; margin: 20px 0 4px; }
.guide p { margin: 6px 0; }
.guide ol { margin: 8px 0; padding-left: 24px; }
.guide li { margin: 6px 0; }

.guide code {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--bg-2);
  border-radius: 3px;
  padding: 1px 4px;
}

.guide-table { border-collapse: collapse; margin: 8px 0; }

.guide-table td {
  border: 0;
  padding: var(--sp-2) var(--sp-3);
  font-size: 13px;
}

.guide-table tr:nth-child(odd) { background: var(--bg-2); }
.guide-table tr:first-child td:first-child { border-top-left-radius: var(--radius); }
.guide-table tr:first-child td:last-child { border-top-right-radius: var(--radius); }

.guide-table td:first-child { color: var(--ink-2); white-space: nowrap; }

.guide-foot {
  margin-top: 32px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.type-badge {
  font-size: 10px;
  color: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 0 4px;
}

.file-link {
  font-size: 12px;
  color: var(--accent);
  padding: 0 12px 0 4px;
  text-decoration: none;
}

.diff-split { display: table; width: 100%; border-collapse: collapse; }

.diff-row { display: table-row; }

.diff-cell {
  display: table-cell;
  width: 50%;
  padding: 1px 8px;
  font-family: var(--mono);
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-all;
  vertical-align: top;
}

/* 左右は塗りで分ける。縦罫を引くと行ごとに線が積み上がる */
.diff-cell + .diff-cell { box-shadow: inset 1px 0 0 var(--line); }

.diff-cell.del { background: var(--danger-bg); }
.diff-cell.ins { background: var(--success-bg); }
.diff-cell.empty { background: var(--bg-2); }

/* 他の切り替え (.segmented) と同じ形にする。同じ役目は同じ見た目で */
.pr-tabs {
  display: inline-flex;
  margin: var(--sp-4) 0 var(--sp-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.pr-tab {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  padding: 0 var(--sp-3);
  border: 0;
  background: var(--bg);
  color: var(--ink-2);
  font-size: 13px;
  cursor: pointer;
}

.pr-tab + .pr-tab { border-left: 1px solid var(--line); }
.pr-tab:hover { background: var(--bg-3); color: var(--ink); }

.pr-tab[aria-current="true"] {
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
}

.comment {
  border: 0;
  border-radius: 8px;
  padding: var(--sp-3);
  margin-bottom: var(--sp-2);
  background: var(--surface-raised);
  box-shadow: var(--hairline), var(--elev-1);
}

.comment-head { font-size: 11px; color: var(--ink-2); margin-bottom: 4px; }
.comment-body { font-size: 13px; color: var(--ink); white-space: pre-wrap; }

/*
 * コメント欄。
 *
 * 横に並べると入力欄が痩せ、ボタンだけが背高になる。書く場所を広く取り、
 * 送る操作は下の右端に置く
 */
.comment-form {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--sp-2);
  margin-top: var(--sp-4);
}

.comment-form textarea {
  width: 100%;
  min-height: 84px;
  border: 0;
  border-radius: var(--radius);
  box-shadow: var(--hairline);
  padding: var(--sp-3);
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink);
  background: var(--surface-raised);
  resize: vertical;
  transition: box-shadow var(--motion) ease-out;
}

.comment-form textarea:focus {
  outline: none;
  box-shadow: 0 0 0 2px var(--accent);
}

.editor {
  flex: 1;
  width: 100%;
  border: 0;
  padding: 16px 20px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink);
  background: var(--bg);
  resize: none;
}

.editor:disabled { background: var(--bg-2); color: var(--ink-2); }

.linked-issues {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: var(--sp-2) var(--sp-4);
  background: var(--bg-2);
}

.linked-issue {
  font-size: 12px;
  color: var(--ink-2);
  border: 0;
  border-radius: 999px;
  padding: 3px 10px;
  background: var(--bg-3);
}

.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(200px, 1fr));
  gap: var(--sp-4);
  padding: var(--sp-5) var(--sp-4);
  overflow-x: auto;
  align-items: start;
}

.board-column {
  /* 囲いではなく塗りでまとまりを作る (共通領域)。
     白いカードを載せるため、面のほうを一段沈める */
  background: var(--bg-3);
  border: 0;
  border-radius: 10px;
  padding: var(--sp-3);
  min-height: 120px;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.board-column h3 {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  margin: 0;
  padding: 0 var(--sp-1) var(--sp-1);
}

.board-card {
  background: var(--surface-raised);
  /* 枠ではなく影で持ち上げる。触れる対象であることを形で示す */
  border: 0;
  border-radius: 8px;
  padding: var(--sp-3);
  margin: 0;
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink);
  cursor: grab;
  box-shadow: var(--hairline), var(--elev-1);
  transition: box-shadow var(--motion) ease-out, transform var(--motion) ease-out;
}

.board-card:hover {
  background: var(--surface-raised);
  box-shadow: var(--hairline), var(--elev-2);
  transform: translateY(-2px);
}

.board-card:active { transform: translateY(0); box-shadow: var(--hairline); }

.board-card .row-meta { display: block; margin-top: 4px; }

.board-column.drop-target { box-shadow: inset 0 0 0 2px var(--accent); }

.conflict-block {
  border: 1px solid var(--danger);
  border-radius: 4px;
  margin: 12px 0;
  overflow: hidden;
}

.conflict-head {
  background: var(--danger-bg);
  color: var(--danger);
  padding: 6px 10px;
  font-size: 12px;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
}

.conflict-side { padding: var(--sp-2) var(--sp-3); }

.conflict-label {
  font-size: 11px;
  color: var(--ink-2);
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
}

.conflict-choice {
  padding: var(--sp-2) var(--sp-3);
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  font-size: 12px;
}

.pr-title {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
}


/* =====================================================================
 * デザインシステム — 相互作用・モーション・レスポンシブ
 * ここから下は全体に効く規則。個別コンポーネントの上書きではない。
 * ===================================================================== */

/*
 * フォーカスは必ず見せる。キーボードだけで操作する人が現在地を
 * 見失わないため。マウス操作時には出さない (:focus-visible)。
 */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/*
 * 部品は地の色を継ぐ。
 *
 * ボタンの既定の色 (buttontext) は OS の設定で決まるため、暗い OS で
 * 明るいテーマを選ぶと、白い面に白い文字が乗って消える。実際に
 * 確認依頼の題名だけが見えなくなった (色を書いていないのがそこだけだった)。
 */
button, select, textarea, a { font-family: inherit; }
button, select, textarea { color: inherit; }

/*
 * ボタンの既定の枠 (outset buttonborder) を落とす。
 *
 * 面と影で段を表しているので、既定の枠が残ると濃い縁だけが浮いて見える。
 * 枠が要るものは各クラスで自分で指定している
 */
button { border: 0; }

button, select, a[href] { cursor: pointer; }

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

/* 状態の変化は 160ms で滑らかに。色と背景だけを動かす */
.btn, .tab, .pr-tab, .file-item, .row-item, .board-card, .file-link {
  transition: background-color var(--motion) ease-out,
              border-color var(--motion) ease-out,
              color var(--motion) ease-out;
}

/* 動きを減らす設定を尊重する */
@media (prefers-reduced-motion: reduce) {
  * {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

.btn:hover:not(:disabled) { background: var(--bg-3); }
.tab:hover { color: var(--ink); }
/*
 * 触れたときに面を変えるのは、地の上に直接置かれているものだけ。
 * カードは自前の面を持つため、色を変えると載っている面と同化する。
 * 持ち上げて示す。
 */
.file-item:hover { background: var(--bg-3); }
.file-link:hover { background: var(--bg-3); }

/* 現在地を色だけで示さない。太さと下線も併せて変える */
.tab[aria-current="true"] { font-weight: 600; }

/*
 * 空の状態。「何も無い」ではなく「次に何をすればよいか」を出す。
 */
.blank-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  color: var(--ink-2);
  font-size: 13px;
}

.blank-state strong {
  display: block;
  color: var(--ink);
  font-size: 14px;
}

.blank-state .btn { margin-top: var(--sp-2); }

/* テーマ切替 */
.theme-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--ink-2);
}

.theme-btn:hover { background: var(--bg-3); color: var(--ink); }

/* アイコン。絵文字ではなく SVG を使う */
.icon {
  width: 16px;
  height: 16px;
  flex: 0 0 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: -3px;
}

/*
 * 狭い画面では左ペインを畳む。GAS の Web App は iframe に埋め込まれる
 * ことがあり、幅が読めない。
 */
@media (max-width: 767px) {
  .layout { flex-direction: column; height: auto; min-height: 100dvh; }

  .sidebar {
    width: 100%;
    flex: none;
    max-height: 40vh;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .main { min-height: 60vh; }

  .toolbar { flex-wrap: wrap; gap: var(--sp-2); }

  .board { grid-template-columns: 1fr; }

  .diff-cell { font-size: 11px; }
}


/* =====================================================================
 * コミットグラフ
 * ===================================================================== */

.graph-row {
  display: flex;
  align-items: stretch;
  gap: var(--sp-2);
}

.graph-cell { flex: 0 0 var(--graph-w); }

.graph-body { flex: 1; min-width: 0; padding: var(--sp-1) 0; }

.graph-line { stroke-width: 2; }
.graph-dot { stroke-width: 2; fill: var(--bg); }
.graph-dot.merge { fill: var(--merged); stroke: var(--merged); }

/* レーンの色。色だけに意味を持たせず、ブランチ名のチップも併記する */
.lane-0 { stroke: var(--ink-2); }
.lane-1 { stroke: var(--accent); }
.lane-2 { stroke: var(--success); }
.lane-3 { stroke: var(--warn); }

.lane-chip { margin-left: auto; align-self: center; }
.lane-chip.lane-0 { color: var(--ink-2); border-color: var(--line); }
.lane-chip.lane-1 { color: var(--accent); border-color: var(--accent); }
.lane-chip.lane-2 { color: var(--success); border-color: var(--success); }
.lane-chip.lane-3 { color: var(--warn); border-color: var(--warn); }


/* =====================================================================
 * アイコンを伴うラベル
 * ===================================================================== */

.tab, .btn, .file-item, .pr-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.file-item { display: flex; }

/*
 * アイコンは currentColor を継承する。文字と同じ色になるため、
 * 文字のコントラストを満たしていればアイコンも満たす。
 */
.tab .icon, .btn .icon, .pr-tab .icon { opacity: 0.85; }
.tab[aria-current="true"] .icon { opacity: 1; }

.blank-state .icon {
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  stroke-width: 1.25;
  color: var(--ink-2);
}

/* =====================================================================
 * モードレスな通知と入力
 *
 * ブラウザの alert / confirm / prompt はモーダルであり、操作を中断させ、
 * 取り消しの手段も与えない。バナー通知と画面内フォームに置き換える。
 * ===================================================================== */

.snackbar {
  position: fixed;
  left: 50%;
  bottom: var(--sp-5);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  max-width: min(560px, calc(100vw - 32px));
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink-2);
  border-radius: var(--radius);
  background: var(--bg-2);
  color: var(--ink);
  box-shadow: var(--shadow);
  font-size: 13px;
  z-index: 100;
}

.snackbar.ok { border-left-color: var(--success); }
.snackbar.ng { border-left-color: var(--danger); }

.snackbar-text { flex: 1; min-width: 0; }

.snackbar button {
  flex: 0 0 auto;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  padding: var(--sp-1) var(--sp-2);
  border-radius: var(--radius-sm);
}

.snackbar button:hover { background: var(--bg-3); }

.inline-form {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
}

.inline-form label {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  font-size: 12px;
  color: var(--ink-2);
}

.inline-form input, .inline-form textarea {
  border: 0;
  box-shadow: var(--hairline);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  padding: 6px 8px;
  font-size: 13px;
  font-family: inherit;
}

.inline-form textarea { min-height: 56px; resize: vertical; }

.inline-form-actions { display: flex; gap: var(--sp-2); }

.confirm-strip {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--warn);
  border-radius: var(--radius);
  background: var(--warn-bg);
  color: var(--ink);
  font-size: 13px;
  margin: var(--sp-2) 0;
}

.confirm-strip .btn { margin-left: auto; }

/*
 * タブの2群化。
 *
 * 「選択中の文書に対するビュー」と「リポジトリ全体のオブジェクト」は
 * スコープが違う。並べて置くと、どれが今の文書に効く操作なのかが
 * 読めなくなる。見出しを付けて分ける。
 */

/*
 * ペインの境界。掴んで幅を変えられる。
 *
 * 画面の使い方は人によって違う。ファイル名が長い人は左を広げ、
 * 差分を読みたい人は右を広げる。固定幅にすると必ずどちらかが困る。
 */
/*
 * 掴む前から境界だと分かるように、細い線を常に出しておく。
 * 触れると線が育って色が付く。掴める場所は線より広く取る
 */
.resizer {
  position: relative;
  flex: 0 0 11px;
  cursor: col-resize;
  background: transparent;
}

.resizer::before {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 5px;
  width: 1px;
  background: var(--line);
  transition: background-color var(--motion) ease-out,
              width var(--motion) ease-out, left var(--motion) ease-out;
}

.resizer:hover::before,
.resizer:focus-visible::before,
.resizer.dragging::before {
  left: 4px;
  width: 3px;
  background: var(--accent);
}

.resizer:focus-visible { outline: none; }

@media (max-width: 767px) {
  /* 縦積みになるため境界は掴めない */
  .resizer { display: none; }
}

/* 一括操作の対象選択 */
.bulk-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  max-height: 30vh;
  overflow-y: auto;
  padding: var(--sp-3);
  border: 0;
  border-radius: var(--radius);
  background: var(--bg);
  box-shadow: var(--hairline);
}

.bulk-row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: 13px;
  color: var(--ink);
  padding: 2px 0;
}

.bulk-row input { width: 16px; height: 16px; accent-color: var(--accent); }

/* =====================================================================
 * ナビゲーション
 *
 * 「リポジトリ全体のオブジェクト」は左に縦で置き、「選択中の文書の
 * ビュー」だけを上のタブに残す。8個を横一列に並べると、どれが今の
 * 文書に効くのか読めず、走査もしづらい。
 *
 * 近接と共通領域でまとまりを作る (ゲシュタルト)。同じ枠の中にあり、
 * 間隔が近いものは同じ仲間だと読める。
 * ===================================================================== */

.nav-section { padding: var(--sp-3) 0; }

.nav-section + .nav-section { margin-top: var(--sp-3); }

.nav-section h2 {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-2);
  margin: 0 var(--sp-4) var(--sp-2);
  text-transform: none;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  /* 44px の当たり判定を確保する */
  min-height: 40px;
  padding: var(--sp-2) var(--sp-4);
  border: 0;
  border-left: 3px solid transparent;
  background: transparent;
  color: var(--ink-2);
  font-size: 13px;
  text-align: left;
}

.nav-item:hover { background: var(--bg-3); color: var(--ink); }

/* 現在地は色だけでなく、線と太さでも示す */
.nav-item[aria-current="true"] {
  color: var(--ink);
  background: var(--bg-3);
  border-left-color: var(--accent);
  font-weight: 600;
}

/* =====================================================================
 * 表示 / 編集の切り替え
 * ===================================================================== */

.doc-modes {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-4);
  border-bottom: 1px solid var(--line);
}

.segmented {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.seg {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 0 var(--sp-3);
  border: 0;
  background: var(--bg);
  color: var(--ink-2);
  font-size: 13px;
}

.seg + .seg { border-left: 1px solid var(--line); }
.seg:hover { background: var(--bg-3); color: var(--ink); }

.seg[aria-pressed="true"] {
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
}

.seg[aria-pressed="true"] .icon { opacity: 1; }

/* =====================================================================
 * 余白の調整
 *
 * 情報の階層に合わせて間隔を変える。すべて同じ間隔だと、どこで話題が
 * 変わるのかが読めない。
 * ===================================================================== */

.toolbar { padding: var(--sp-3) var(--sp-4); gap: var(--sp-3); }
.tabs { padding: 0 var(--sp-4); gap: var(--sp-1); }

.tab {
  min-height: 40px;
  padding: 0 var(--sp-3);
  border-radius: var(--radius) var(--radius) 0 0;
}

.panel-actions { padding: var(--sp-3) var(--sp-4); gap: var(--sp-3); }
.file-item { padding: var(--sp-2) var(--sp-4); min-height: 36px; }

/* =====================================================================
 * コミットグラフの表
 *
 * 列を固定して、走査するときに視線が縦に落ちるようにする。
 * ===================================================================== */

.graph-head {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-4);
  background: var(--bg-2);
  font-size: 11px;
  color: var(--ink-2);
}

.graph-split { display: flex; flex: 1; min-height: 0; width: 100%; }

/*
 * 見出しと行は同じ器に入れる。見出しだけを外に出すと、差分の幅まで
 * 含めて列が置かれ、行の列とずれる。
 */
.graph-pane {
  display: flex;
  flex-direction: column;
  flex: 0 0 var(--graph-pane-w);
  min-width: 0;
  overflow: hidden;
  /* 幅は掴んで動かすため、画面幅ではなくこの器の幅で列を減らす */
  container-type: inline-size;
  container-name: graph;
}

/*
 * 狭めたら、変更の内容を削るのではなく脇の列から順に畳む。
 *
 * 何が変わったかが読めなくなるのでは、狭める意味がない。
 * 見出しと行は同じクラスを使っているので、両方まとめて消える。
 * 消えた値は記録を押せば差分の帯と本文で読める。
 */
@container graph (max-width: 660px) {
  .graph-col-sha { display: none; }
}

@container graph (max-width: 580px) {
  .graph-col-author { display: none; }
}

@container graph (max-width: 470px) {
  .graph-col-date { display: none; }
}

/*
 * 履歴の一覧は、確認依頼の一覧と器を共用している。あちらは 320px 固定だが、
 * こちらは見出しと同じ幅でなければ列がずれるため、幅の指定を打ち消す。
 */
#pr-pane { flex-basis: var(--pr-pane-w); }
#report-pane { flex-basis: var(--report-pane-w); }

/*
 * 確認依頼は行がカードなので、他の一覧 (.list-area) と同じく器を
 * 一段沈めて余白を取る。履歴は表なので沈めない
 */
#pr-list,
#report-list {
  padding: var(--sp-3) 0 var(--sp-6);
  background: var(--bg-2);
}

.graph-pane .history-list {
  flex: 1;
  width: auto;
  overflow-y: auto;
  background: var(--bg);
  border-right: 0;
  padding: 0;
}
/*
 * 差分の器。中の帯で「画面いっぱいに広げる」を切り替える。
 *
 * 長い条文は横も縦も足りない。広げているあいだは履歴の一覧の上に
 * かぶせるのではなく、画面そのものを差分だけにする。
 */
.diff-pane {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  overflow: hidden;
}

.diff-pane .diff-view { flex: 1; min-height: 0; overflow: auto; }

.diff-bar {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-1) var(--sp-2) var(--sp-1) var(--sp-4);
  background: var(--bg-2);
}

.diff-bar .row-meta {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.diff-pane.full {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  /* 通知 (100) と入力パネル (150) より下。広げても知らせは見える */
  z-index: 90;
  background: var(--bg);
}

.graph-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  padding: 0 var(--sp-4);
  border: 0;
  background: transparent;
  text-align: left;
}

.graph-col-graph { flex: 0 0 var(--graph-w); }
.graph-col-desc { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--sp-2); }
.graph-col-date { flex: 0 0 130px; font-size: 11px; color: var(--ink-2); }
.graph-col-author { flex: 0 0 90px; font-size: 11px; color: var(--ink-2); }

.graph-col-sha {
  flex: 0 0 66px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-2);
}

.graph-row .commit-message {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  color: var(--ink);
}

.graph-row[aria-current="true"] { background: var(--bg-3); }

/* ブランチ名の札。先頭コミットにだけ出す */
.branch-label {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  /* 説明を潰さないよう、名前のほうが縮む */
  flex: 0 1 auto;
  min-width: 0;
  max-width: 140px;
  padding: 1px 8px 1px 6px;
  border-radius: 999px;
  border: 1px solid currentColor;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
}

.branch-label .icon { width: 12px; height: 12px; flex: 0 0 12px; }
.branch-label.lane-0 { color: var(--ink-2); }
.branch-label.lane-1 { color: var(--accent); }
.branch-label.lane-2 { color: var(--success); }
.branch-label.lane-3 { color: var(--warn); }

@media (max-width: 1023px) {
  /* 狭いと5列は入らない。作成者と日時を落とす */
  .graph-col-author, .graph-col-date { display: none; }
  .graph-split { flex-direction: column; }
  .graph-split .history-list { border-right: 0; border-bottom: 1px solid var(--line); }
}

/* =====================================================================
 * 現在の位置と、対象どうしの関係
 *
 * 初めて使う人に「今どこにいるか」と「何がどう繋がっているか」を
 * 画面に出す。覚えていることを前提にしない。
 * ===================================================================== */

/*
 * 現在の位置。
 *
 * flex: 1 だと基準が 0 になり、右の余白と場所を等分してしまう。
 * まだ空きがあるのに文書名が「…」に削られ、札が折り返っていた。
 * 必要なぶんだけ取り、足りないときだけ縮む
 */
.crumbs {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
  flex: 0 1 auto;
}

.crumb-repo {
  font-size: 13px;
  color: var(--ink-2);
  white-space: nowrap;
}

.crumb-sep { flex: 0 0 auto; color: var(--ink-2); opacity: 0.6; }

.crumbs h1 {
  font-size: 14px;
  font-weight: 600;
  margin: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 関係の流れ */
.flow {
  padding: var(--sp-4);
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
}

.flow-lead {
  margin: 0 0 var(--sp-3);
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.8;
}

.flow-lead strong { color: var(--ink); }

.flow-steps {
  display: flex;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin: 0;
  padding: 0;
  list-style: none;
}

.flow-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 92px;
}

.flow-arrow {
  align-self: center;
  color: var(--ink-2);
  font-size: 16px;
  padding-bottom: 18px;
}

.flow-btn {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  min-height: 40px;
  padding: var(--sp-2) var(--sp-3);
  border: 0;
  border-radius: var(--radius);
  background: var(--surface-raised);
  color: var(--ink);
  box-shadow: var(--hairline), var(--elev-1);
  cursor: pointer;
  transition: box-shadow var(--motion) ease-out, transform var(--motion) ease-out;
}

.flow-btn:hover { box-shadow: var(--hairline), var(--elev-2); transform: translateY(-1px); }
.flow-btn:active { box-shadow: var(--hairline); transform: translateY(1px); }

.flow-name { font-size: 13px; font-weight: 600; white-space: nowrap; }

.flow-count {
  margin-left: auto;
  min-width: 22px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--accent-bg);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  text-align: center;
}

.flow-desc { font-size: 11px; color: var(--ink-2); }

@media (max-width: 767px) {
  /* 狭いと横に流せない。矢印を落として縦に積む */
  .flow-arrow { display: none; }
  .flow-step { min-width: 0; flex: 1 1 45%; }
}

/* ナビの説明 */
.nav-item { flex-wrap: wrap; }
.nav-label { font-size: 13px; }

.nav-desc {
  width: 100%;
  padding-left: 24px;
  font-size: 11px;
  color: var(--ink-2);
  line-height: 1.4;
}

.nav-item[aria-current="true"] .nav-desc { color: var(--ink-2); }

/* =====================================================================
 * 文書の一覧 (ホーム)
 * ===================================================================== */

.doc-name {
  flex: 1;
  min-width: 0;
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 一覧の行のうち、開くための部分 */
.row-open {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex: 1;
  min-width: 0;
  min-height: 40px;
  padding: var(--sp-2);
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink);
  text-align: left;
}

.row-open:hover { background: var(--bg-3); }
.row-main { flex: 1; min-width: 0; }

/*
 * 一覧の行。
 *
 * 自前の面を持たせ、器のほうを一段沈める。地の上に直接置くと、
 * 触れたときに面の色を変えるしかなくなり、載っている面と同化する。
 */
/*
 * 行は <button> のこともある。ボタンの既定は中央寄せなので、
 * 明示しないと確認依頼の一覧だけ文字が真ん中に寄る (実際に踏んだ)
 */
/*
 * 幅は指定しない。display: flex で器いっぱいに伸びるので、width: 100%
 * を足すと左右の margin のぶんだけはみ出す (実際に右端が見切れた)
 */
.row-item {
  display: flex;
  align-items: center;
  text-align: left;
  gap: var(--sp-2);
  margin: 0 var(--sp-4) var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius);
  background: var(--surface-raised);
  box-shadow: var(--hairline), var(--elev-1);
  transition: box-shadow var(--motion) ease-out, transform var(--motion) ease-out;
}

/* ボタンの既定 (text-align: center) より強く指す */
button.row-item, button.commit-item { text-align: left; }

.row-item:hover {
  box-shadow: var(--hairline), var(--elev-2);
  transform: translateY(-1px);
}

/* 戻り道 */
.crumb-back {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  white-space: nowrap;
  gap: var(--sp-1);
  min-height: 32px;
  padding: 0 var(--sp-2);
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink-2);
  font-size: 13px;
}

.crumb-back:hover { background: var(--bg-3); color: var(--ink); }

/* 左ナビの件数 */
.nav-count {
  min-width: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--accent-bg);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  text-align: center;
}

.nav-section { padding: var(--sp-2) 0; }
.sidebar { padding: var(--sp-3) 0; }

/* =====================================================================
 * 読み込み中の骨組み (スケルトン)
 *
 * 「読み込み中…」の文字より、これから出る形をそのまま見せたほうが
 * 待ち時間が短く感じられ、出たときに位置もずれない。
 * ===================================================================== */

.skeleton {
  background: linear-gradient(90deg,
    var(--bg-2) 25%, var(--bg-3) 37%, var(--bg-2) 63%);
  background-size: 400% 100%;
  border-radius: var(--radius-sm);
  animation: skeleton-shimmer 1.4s ease infinite;
}

@keyframes skeleton-shimmer {
  0% { background-position: 100% 50%; }
  100% { background-position: 0 50%; }
}

/* 動きを減らす設定では光らせない。形だけ見せる */
@media (prefers-reduced-motion: reduce) {
  .skeleton { animation: none; background: var(--bg-3); }
}

/* 骨組みは実物と同じ器 (row-item / graph-row など) の中に置くため、
 * ここでは中身の並べ方だけを決める */
.sk-lines { display: flex; flex-direction: column; gap: 6px; }

/* =====================================================================
 * 工程表 (ガントチャート)
 *
 * 1列 = 1日。棒の位置と長さを列で表すため、日付とずれない。
 * ===================================================================== */

.gantt-scroll { flex: 1; overflow: auto; padding: 0 var(--sp-5) var(--sp-6); }

.gantt {
  --gantt-days: 1;
  --gantt-col: 26px;
  min-width: 100%;
  display: inline-block;
}

.gantt-head, .gantt-row {
  display: flex;
  align-items: stretch;
  gap: var(--sp-4);
}

.gantt-head {
  position: sticky;
  top: 0;
  z-index: 3;
  background: var(--bg);
  padding: var(--sp-2) 0;
}

.gantt-head .gantt-name { z-index: 4; }

/* 見出しの下だけは境界を示す。ただし2段の一番下に1本だけ */
.gantt-head + .gantt-head { box-shadow: 0 1px 0 var(--line); }

/*
 * 名前の列は左に貼り付けておく。横に流すと棒だけが残り、
 * どの行が何の作業なのか対応が取れなくなる。
 */
.gantt-name {
  position: sticky;
  left: 0;
  z-index: 2;
  flex: 0 0 var(--gantt-name-w);
  min-width: 0;
  display: flex;
  align-items: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  color: var(--ink);
  text-align: left;
  border: 0;
  background: var(--bg);
  padding: 0 var(--sp-3) 0 var(--sp-2);
  /* 面の切り替わりを影で示す。線は引かない */
  box-shadow: 6px 0 6px -6px rgba(31, 35, 40, 0.18);
}

button.gantt-name { cursor: pointer; border-radius: var(--radius-sm); }
button.gantt-name:hover { color: var(--accent); }

.gantt-scale, .gantt-track {
  display: grid;
  grid-template-columns: repeat(var(--gantt-days), var(--gantt-col));
  flex: 0 0 auto;
}

.gantt-scale { align-items: end; }

/* 目盛りと棒の列がずれて見えないよう、日の区切りを同じ位置に敷く */
.gantt-head:last-of-type .gantt-scale {
  background-image: repeating-linear-gradient(to right,
    var(--line) 0 1px, transparent 1px var(--gantt-col));
  background-position: calc(var(--gantt-col) * var(--week-offset) * -1) 0;
}

.gantt-day {
  font-size: 10px;
  color: var(--ink-2);
  text-align: center;
  padding: 2px 0;
}

.gantt-day.today { color: var(--accent); font-weight: 600; }

/* 行は線で区切らず、余白で離す。高さは揃える */
.gantt-row { padding: var(--sp-1) 0; min-height: 40px; align-items: center; }
.gantt-row:hover .gantt-name { background: var(--bg-2); }
.gantt-row:hover .gantt-track { filter: brightness(0.985); }

.gantt-track {
  position: relative;
  min-height: 28px;
  align-items: center;
}

/*
 * 目盛りは行ごとではなく1枚の下敷きに描く。
 * 行ごとに描くと行間で途切れ、日付を縦にたどれない。
 *
 * 3層にする。日の線は薄く、週の線は濃く、土日は塗る。濃さに差を
 * つけないと線の数が情報量を上回るが、日の線が無いと期日までの
 * 日数を目で数えられない。
 * --week-offset は先頭の日から月曜までのずれ (画面側が入れる)
 */
.gantt-rows { position: relative; }

.gantt-grid {
  position: absolute;
  top: 0;
  bottom: 0;
  left: calc(var(--gantt-name-w) + var(--sp-4));
  right: 0;
  pointer-events: none;
  z-index: 0;

  background-image:
    repeating-linear-gradient(to right,
      transparent 0 calc(var(--gantt-col) * 5),
      var(--bg-2) calc(var(--gantt-col) * 5) calc(var(--gantt-col) * 7)),
    repeating-linear-gradient(to right,
      var(--line-strong) 0 1px,
      transparent 1px calc(var(--gantt-col) * 7)),
    repeating-linear-gradient(to right,
      var(--line) 0 1px,
      transparent 1px var(--gantt-col));
  background-position: calc(var(--gantt-col) * var(--week-offset) * -1) 0;
}

/* 行は下敷きの上に置く */
.gantt-row, .gantt .group-head { position: relative; z-index: 1; }

.gantt-bar {
  grid-row: 1;
  min-height: 24px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 10px;
  padding: 0 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: left;
  box-shadow: var(--elev-1);
  cursor: pointer;
  transition: box-shadow var(--motion) ease-out, transform var(--motion) ease-out;
}

.gantt-bar:hover { box-shadow: var(--elev-2); transform: translateY(-1px); }
.gantt-bar.done { background: var(--success); }
.gantt-bar.overdue { background: var(--danger); }

/* 期限が無いものは点で置く。長さに意味を持たせない */
.gantt-bar.nodue {
  background: var(--bg-3);
  color: var(--ink-2);
  box-shadow: var(--hairline);
}

/* 今日の線も1本で全体を貫く */
.gantt-today {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  margin-left: calc(var(--gantt-col) / 2 - 1px);
  background: var(--accent);
  opacity: 0.55;
  pointer-events: none;
}

/*
 * 画面側のエラー。
 *
 * この画面は入れ子の iframe の中で動くため、ブラウザのコンソールには
 * 既定で出てこない。人の目に触れる場所に出す。
 */
.fatal-error {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  z-index: 200;
  padding: var(--sp-2) var(--sp-4);
  background: var(--danger-bg);
  color: var(--danger);
  border-bottom: 1px solid var(--danger);
  font-size: 12px;
  font-family: var(--mono);
  word-break: break-all;
}

.panel-count { margin-left: auto; }

/* =====================================================================
 * 入力は右のパネルで受ける
 *
 * 一覧の上に差し込むと、書いている間に一覧が押し下げられ、何に対する
 * 入力なのかが見えなくなる。右に出せば対象を見ながら書ける。
 * ===================================================================== */

.side-panel {
  flex: 0 0 360px;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--line);
  background: var(--bg-2);
  overflow: hidden;
}

.side-head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--line);
}

.side-head h2 {
  flex: 1;
  min-width: 0;
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.side-close {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink-2);
  font-size: 18px;
  line-height: 1;
}

.side-close:hover { background: var(--bg-3); color: var(--ink); }

.side-body { flex: 1; overflow-y: auto; padding: var(--sp-4); }

/* 右パネルの中では、差し込み用の枠飾りを外す */
.side-body .inline-form {
  padding: 0;
  border: 0;
  background: transparent;
}

.side-body .inline-form-actions { flex-wrap: wrap; }

@media (max-width: 767px) {
  /* 狭いと横に並べられない。手前に重ねる */
  .side-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(90vw, 360px);
    z-index: 150;
    box-shadow: var(--elev-2);
  }
}

/*
 * 編集中の対象。
 *
 * 右に入力が出ても、一覧のどの行に対するものかが分からないと、
 * 直したつもりの対象を取り違える。色だけでなく左の帯でも示す。
 */
.editing {
  background: var(--surface-raised);
  box-shadow: 0 0 0 2px var(--accent), var(--elev-2);
  border-radius: var(--radius);
}

.board-card.editing {
  /* 塗りを変えると載っている面と近くなる。輪郭で示す */
  background: var(--surface-raised);
  box-shadow: 0 0 0 2px var(--accent), var(--elev-2);
  transform: translateY(-2px);
}

.gantt-row.editing { background: var(--accent-bg); box-shadow: none; }
.gantt-row.editing .gantt-bar { box-shadow: 0 0 0 2px var(--accent); }

/* =====================================================================
 * 工程表: 月の見出し・束ね・棒の伸縮
 * ===================================================================== */

.gantt-month {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink);
  text-align: left;
  padding: 2px 6px;
  white-space: nowrap;
  overflow: hidden;
  /* 月の切れ目だけを示す。日ごとに線を引くと目が滑る */
  box-shadow: inset 1px 0 0 var(--line);
}

/* 土日は薄く敷いて、週の切れ目を読めるようにする */
.gantt-day.weekend { color: var(--ink-2); opacity: 0.7; }

.gantt-bar { cursor: grab; touch-action: none; }
.gantt-bar.dragging { cursor: grabbing; box-shadow: var(--elev-2); opacity: 0.9; }

/* 掴める端を示す */
.gantt-bar::before, .gantt-bar::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  width: 6px;
  border-radius: 999px;
}

.gantt-bar { position: relative; }
.gantt-bar::before { left: 0; }
.gantt-bar::after { right: 0; }

.gantt-bar:hover::before, .gantt-bar:hover::after {
  background: var(--on-accent);
  opacity: 0.5;
}

.gantt-bar.nodue:hover::before, .gantt-bar.nodue:hover::after {
  background: var(--ink-2);
}

/* 束ねの見出し */
.group-head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-4) var(--sp-4) var(--sp-2);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--ink);
}

.group-head:first-child { padding-top: var(--sp-3); }

/*
 * 工程表の見出しも左に貼り付ける。横に流すと、どの束を見ているのかが
 * 分からなくなる。
 */
.gantt .group-head {
  position: sticky;
  left: 0;
  width: var(--gantt-name-w);
  padding: var(--sp-5) var(--sp-2) var(--sp-1);
  background: var(--bg);
}

.gantt .group-head:first-child { padding-top: var(--sp-2); }

.group-head .row-meta { margin-left: auto; }

.group-switch {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
}

.group-switch select {
  min-width: 120px;
  padding: 4px 6px;
  font-size: 12px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
}

/*
 * 差分は種別と本文に分けて見せる。
 *
 * タグのまま出すと、何が変わったのかを読むのに知識が要る。
 */
.diff-cell {
  display: flex;
  gap: var(--sp-2);
  align-items: baseline;
  font-family: inherit;
  font-size: 13px;
  padding: 3px 10px;
}

.diff-kind {
  flex: 0 0 auto;
  font-size: 10px;
  color: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 0 4px;
  white-space: nowrap;
}

.diff-text { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }

/* =====================================================================
 * 見え方の切り替えと絞り込み
 * ===================================================================== */

.view-bar {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  flex-wrap: wrap;
  padding: var(--sp-3) var(--sp-4);
  background: var(--bg-2);
}

.filter-box { display: flex; flex: 0 1 260px; }

.filter-box input {
  width: 100%;
  min-height: 32px;
  padding: 0 var(--sp-3);
  border: 0;
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--ink);
  font-size: 13px;
  box-shadow: var(--hairline);
}

/* 束ねの見出しは押して畳める */
.group-head {
  width: 100%;
  background: transparent;
  border: 0;
  cursor: pointer;
  text-align: left;
}

.group-head:hover { color: var(--accent); }
.group-mark { flex: 0 0 auto; color: var(--ink-2); font-size: 10px; }

.group-count {
  min-width: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--bg-3);
  color: var(--ink-2);
  font-size: 11px;
  font-weight: 600;
  text-align: center;
}

/* カードと行の中身 */
.labels { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: var(--sp-2); }

.label-pill {
  font-size: 10px;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--accent-bg);
  color: var(--accent);
  white-space: nowrap;
}

.avatar {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 11px;
  font-weight: 700;
}

.avatar.none { background: var(--bg-3); color: var(--ink-2); }

.card-number { font-size: 11px; color: var(--ink-2); }
.card-title { font-size: 13px; line-height: 1.5; margin: 2px 0 var(--sp-2); }

.card-foot {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-2);
}

.card-foot .row-meta { flex: 1; }

/* 板の上では小さく置く。カードの主役は題名で、捨てるは脇役 */
.card-foot .btn-danger { width: 26px; min-height: 26px; }
.card-foot .btn-danger .icon { width: 14px; height: 14px; }
.board-card .labels { margin: 0; }

/* =====================================================================
 * 文書のカード
 * ===================================================================== */

.doc-card {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin: 0 var(--sp-4) var(--sp-3);
  padding: var(--sp-2);
  border-radius: 10px;
  background: var(--surface-raised);
  box-shadow: var(--hairline), var(--elev-1);
  transition: box-shadow var(--motion) ease-out, transform var(--motion) ease-out;
}

.doc-card:hover {
  box-shadow: var(--hairline), var(--elev-2);
  transform: translateY(-2px);
}

.doc-open {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--sp-2);
  flex: 1;
  min-width: 0;
  padding: var(--sp-3);
  border: 0;
  border-radius: var(--radius);
