  margin-left: var(--sp-1);
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
  font-size: 12px;
  line-height: 1;
  font-family: inherit;
  cursor: pointer;
}

.chip-off:hover {
  background: var(--danger-solid);
  color: var(--on-danger);
}

/*
 * 読む形。
 *
 * 読むために開いたのに書き換えの形で出てくると、触っただけで中身が
 * 変わりそうで怖い。読む形を先に見せる
 */
.side-view {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

.view-title {
  margin: 0;
  font-size: 15px;
  color: var(--ink);
}

.view-label {
  margin-top: var(--sp-2);
  font-weight: 600;
}

.view-facts {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: var(--sp-2) var(--sp-3);
  margin: 0;
  font-size: 12px;
}

.view-facts dt { color: var(--ink-2); }

.view-facts dd {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-1);
  margin: 0;
  color: var(--ink);
}

/*
 * 補足の見え方。
 *
 * 書いたとおりの塊で読めるようにする。字の大きさは本文に近づけ、
 * 見出しだけを少し強くする
 */
.md { font-size: 13px; line-height: 1.8; color: var(--ink); }
.md > *:first-child { margin-top: 0; }
.md > *:last-child { margin-bottom: 0; }

.md p { margin: var(--sp-2) 0; white-space: pre-wrap; }
.md h3 { margin: var(--sp-4) 0 var(--sp-1); font-size: 14px; }
.md h4 { margin: var(--sp-3) 0 var(--sp-1); font-size: 13px; }
.md h5 { margin: var(--sp-3) 0 var(--sp-1); font-size: 12px; color: var(--ink-2); }
.md ul, .md ol { margin: var(--sp-2) 0; padding-left: var(--sp-5); }
.md li { margin: 2px 0; }

.md blockquote {
  margin: var(--sp-2) 0;
  padding: var(--sp-1) var(--sp-3);
  box-shadow: inset 3px 0 0 var(--line-strong);
  color: var(--ink-2);
}

.md hr {
  margin: var(--sp-3) 0;
  border: 0;
  height: 1px;
  background: var(--line);
}

.md code {
  padding: 1px 4px;
  border-radius: var(--radius-sm);
  background: var(--bg-3);
  font-family: var(--mono);
  font-size: 12px;
}

.md a { color: var(--accent); }

.md-tasks { list-style: none; padding-left: var(--sp-2); }

.md-check {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  margin-right: var(--sp-2);
  border-radius: var(--radius-sm);
  background: var(--bg-3);
  color: var(--success);
  font-size: 11px;
  vertical-align: middle;
}

.md-check.done { background: var(--success-bg); }

/* やることの中のやりとり */
.issue-talk-list { margin-bottom: var(--sp-2); }

/* 補足の下書き */
.template-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin: var(--sp-2) 0;
}

.template-chip {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  background: var(--bg-3);
}

.template-use {
  padding: 2px var(--sp-2);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}

.template-use:hover { color: var(--accent); }

/*
 * 使われ方。
 *
 * 数字だけを並べても、どれが飛び抜けているのかは読み取れない。
 * 長さで比べられるようにする
 */
.usage-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-3);
  border-radius: var(--radius);
  background: var(--surface-raised);
}

.usage-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  font-size: 12px;
}

/* 人の行は押してその人に絞れる */
.usage-person {
  background: transparent;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  /* button は中身に合わせて縮む。隣の <div> の行と幅が揃わなくなる */
  width: -moz-available;
  width: -webkit-fill-available;
  width: stretch;
}

.usage-person:hover .usage-name { color: var(--accent); }

.usage-rank {
  flex: 0 0 20px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.usage-name {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex: 0 0 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink);
}

.usage-track {
  flex: 1;
  height: 10px;
  border-radius: 999px;
  background: var(--bg-3);
  overflow: hidden;
}

.usage-bar {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
}

.usage-count {
  flex: 0 0 48px;
  text-align: right;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.usage-days {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 80px;
  padding: var(--sp-3);
  border-radius: var(--radius);
  background: var(--surface-raised);
}

.usage-day {
  display: flex;
  align-items: flex-end;
  flex: 1 1 6px;
  height: 100%;
  min-width: 4px;
}

.usage-day-bar {
  display: block;
  width: 100%;
  border-radius: 2px 2px 0 0;
  background: var(--accent);
}

/* 前の期間との増減。数の横に小さく添える */
.usage-delta {
  color: var(--ink-2);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.usage-row .usage-delta {
  flex: 0 0 40px;
  text-align: right;
}

.usage-unseen {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
}

/* CSV は行ごとに読めるよう、折り返さずに改行を残す */
.usage-export .copy-line code {
  max-height: 240px;
  overflow: auto;
  white-space: pre;
}

@media (max-width: 767px) {
  .usage-name { flex-basis: 110px; }
}

/*
 * 自分まわり。
 *
 * 名前を決める・道具を落とすは読み物ではなく操作なので、上の帯から
 * いつでも開ける場所に置く
 */
.me-btn { padding: 0; position: relative; }

/* 手元の道具が古いときの印。知らせの数 (.bell-count) と同じ色で、数は持たない */
.me-dot {
  position: absolute;
  top: 0;
  right: 0;
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--danger-solid);
}
.me-btn .avatar { width: 24px; height: 24px; }

.me-panel { width: min(92vw, 320px); }

.me-body {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  padding: var(--sp-4);
  background: var(--bg-2);
}

.me-actions {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.me-actions .btn { justify-content: flex-start; }

/* 会議の時間 (自分まわり)。3つの数を並べ、狭ければ折り返す。区切りは線でなく余白で */
.me-meetings {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding-top: var(--sp-2);
}
.me-meetings-head { font-weight: 600; color: var(--ink); }
.me-meetings-nums {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
}
.me-meetings-cell {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1 1 64px;
}
.me-meetings-value {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

/* 使い方の頭に置く操作 */
.guide-top { margin-bottom: var(--sp-4); }

/* 使い方の絞り込み。本文の上に置く */
.guide-filter { margin-bottom: var(--sp-4); max-width: 360px; }
.guide-empty { margin: var(--sp-4) 0; }
.guide h2 .chip { margin-left: var(--sp-2); vertical-align: middle; }

/*
 * 画面の見出しの横の「?」。その画面の使い方の節を開く。
 *
 * 字が「?」だけなので、何を開くかは aria-label と title で言う (画面側で入れている)
 */
.guide-link {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  /* 押せる大きさの下限 (WCAG 2.5.8) */
  min-width: 24px;
  min-height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px var(--line);
  background: transparent;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 600;
  transition: background-color var(--motion) ease-out, color var(--motion) ease-out;
}

.guide-link:hover { background: var(--bg-2); color: var(--ink); }

/*
 * 手順。
 *
 * 番号を振って、何番まで進んだかを目で追えるようにする
 */
.setup-steps {
  margin: 0;
  padding-left: var(--sp-5);
  font-size: 13px;
}

.setup-steps li { margin-bottom: var(--sp-3); }
.setup-steps strong { color: var(--ink); }
.setup-steps .row-meta { margin-top: 2px; }

/* 写して貼るところ。打ち直させると必ずどこかで間違える */
.copy-row {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.copy-line {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2);
  border-radius: var(--radius);
  background: var(--bg-2);
}

.copy-line code {
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink);
  white-space: nowrap;
}

/* はじめの案内の、始めるための入口。見出しのすぐ下に並べる (区切りの線は置かない) */
.guideline-extra {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-2);
}

/*
 * 名前の印。
 *
 * 画像は置かず、字と同じ色で描く。明るい地でも暗い地でも同じように
 * 読め、読み込みも1つ増えない
 */
.brand {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--sp-1);
  padding: 0 var(--sp-4) var(--sp-4);
  color: var(--ink);
}

.brand-row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
}

.brand-mark {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 栞だけは塗る。印の中で、どこを見ているかが一目で分かる */
.brand-mark .brand-mark-fill {
  fill: var(--accent);
  stroke: var(--accent);
}

.brand-words {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.2;
}

.brand-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.brand-sub {
  font-size: 10px;
  color: var(--ink-2);
}

/* 何をする道具かの一行。名前の横ではなく下に置き、折り返させる */
.brand-tag {
  font-size: 11px;
  line-height: 1.35;
  color: var(--ink-2);
}

/*
 * いまどのワークスペースを見ているか。
 *
 * 複数のワークスペースに置くと画面だけでは見分けが付かない。説明より
 * 強く出す必要があるので、面を持たせて名前の色を当てる
 */
.brand-place {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  gap: var(--sp-1);
  max-width: 100%;
  min-width: 0;
  margin-top: var(--sp-1);
  padding: 2px var(--sp-2);
  border-radius: 999px;
  background: var(--accent-bg);
  color: var(--accent);
  font-size: 11px;
  line-height: 1.6;
  text-decoration: none;
}

.brand-place:hover { text-decoration: underline; }
.brand-place .icon { flex: 0 0 auto; width: 12px; height: 12px; }

/* 長い名前は器を広げずに切る。左の帯の幅は変えない */
.brand-place-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/*
 * 説明の図。
 *
 * 字だけの説明は読まれない。地の色に合わせて描き、外からは何も
 * 取ってこない
 */
.diagram {
  margin: var(--sp-3) 0 var(--sp-4);
  padding: var(--sp-3);
  border-radius: var(--radius);
  background: var(--bg-2);

  /* 狭い画面では縮めずに横へ流す。幅に合わせて縮めると字が潰れ、
     読めない図になる。図だけは横に出してよい */
  overflow-x: auto;
}

.diagram svg {
  display: block;
  width: 100%;
  min-width: 680px;
  height: auto;
}

.diagram figcaption { margin-top: var(--sp-2); }

/* 帯は主語を囲むもの。地よりわずかに沈ませ、箱と競わせない */
.diagram-lane {
  fill: var(--bg-3);
  stroke: var(--line);
  stroke-width: 1;
}

.diagram-lane.strong { fill: var(--accent-bg); stroke: var(--accent); }
.diagram-lane.ok { fill: var(--success-bg); stroke: var(--success); }
.diagram-lane.warn { fill: var(--warn-bg); stroke: var(--warn); }

.diagram-lane-text {
  fill: var(--ink-2);
  font-size: 12px;
  font-family: inherit;
}

.diagram-lane-text.strong { fill: var(--accent); }
.diagram-lane-text.ok { fill: var(--success); }
.diagram-lane-text.warn { fill: var(--warn); }

.diagram-box {
  fill: var(--surface-raised);
  stroke: var(--line-strong);
  stroke-width: 1;
}

.diagram-box.strong { fill: var(--accent-bg); stroke: var(--accent); }
.diagram-box.ok { fill: var(--success-bg); stroke: var(--success); }
.diagram-box.warn { fill: var(--warn-bg); stroke: var(--warn); }

.diagram-text {
  fill: var(--ink);
  font-size: 13px;
  font-family: inherit;
}

.diagram-text.strong { fill: var(--accent); }
.diagram-text.ok { fill: var(--success); }
.diagram-text.warn { fill: var(--warn); }

/* 箱の下に添える一行。見出しと同じ重さで置くと、どちらが主か消える */
.diagram-sub {
  fill: var(--ink-2);
  font-size: 11px;
  font-family: inherit;
}

.diagram-dot {
  fill: var(--surface-raised);
  stroke: var(--ink-2);
  stroke-width: 2;
}

.diagram-dot.strong { fill: var(--accent); stroke: var(--accent); }
.diagram-dot.ok { fill: var(--success); stroke: var(--success); }

.diagram-arrow {
  fill: none;
  stroke: var(--ink-2);
  stroke-width: 1.5;
}

.diagram-head { fill: var(--ink-2); }
.diagram-head.soft { fill: var(--line-strong); }

/* 戻りの線は控えめに。主役は左から右への流れ */
.diagram-arrow.soft {
  stroke: var(--line-strong);
  stroke-dasharray: 4 4;
}

/* 破線は「してもよい」「ここへ入れる」のような、必ずではない結び付き */
.diagram-arrow.dash { stroke-dasharray: 5 4; }

.diagram-label {
  fill: var(--ink-2);
  font-size: 11px;
  font-family: inherit;
}

.diagram-note {
  fill: var(--ink-2);
  font-size: 12px;
  font-family: inherit;
}

.diagram-note.mono {
  fill: var(--ink);
  font-family: var(--mono);
}

/* ===== エージェンティックスクラム (既定はオフ) ===== */
/*
 * 形は集計の画面 (.tally-*) に寄せてある。結論のカード → 区切りごとの
 * 見出しと表、の順。新しい形を足すのは、集計に無いもの (線・進み具合) だけ。
 */
.scrum-heading {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-2);
  margin: var(--sp-4) 0 var(--sp-2);
  font-size: 13px;
  color: var(--ink-2);
}

/* 用語の「?」。どの見出しの脇でも同じ大きさにする */
.term-help { display: inline-flex; align-items: center; flex-wrap: wrap; gap: var(--sp-1); }
.term-help-btn {
  width: 18px;
  min-width: 18px;
  height: 18px;
  min-height: 18px;
  padding: 0;
  border-radius: 999px;
  background: var(--bg-3);
  color: var(--ink-2);
  font-size: 11px;
  font-weight: 600;
  line-height: 18px;
}
.term-help-btn:hover,
.term-help-btn[aria-expanded="true"] { background: var(--accent-bg); color: var(--accent); }
.term-help-text {
  flex-basis: 100%;
  max-width: 560px;
  font-weight: 400;
  color: var(--ink-2);
}

/* 結論のカード。器 (.list-area) が一段沈んでいるので、カードは浮かせる */
.scrum-summary .tally-card {
  background: var(--surface-raised);
  box-shadow: var(--hairline);
}
.scrum-card-label { display: flex; align-items: center; gap: var(--sp-1); }
.scrum-card-warn .tally-value { color: var(--warn); }

.scrum-progress {
  height: 6px;
  margin-top: var(--sp-2);
  border-radius: 999px;
  background: var(--bg-3);
  overflow: hidden;
}
.scrum-progress span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
}

.scrum-goals {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--sp-3);
  padding: 0 var(--sp-4);
}
.scrum-goal-card {
  display: flow-root;
  padding: 0 var(--sp-3) var(--sp-3);
  border-radius: var(--radius);
  background: var(--surface-raised);
  box-shadow: var(--hairline);
}
.scrum-goal-card .scrum-heading { margin-top: var(--sp-3); }
.scrum-goal { margin: 0; color: var(--ink); line-height: 1.7; }
.scrum-goal.row-meta { color: var(--ink-2); }

.scrum-block .scrum-heading { margin-top: var(--sp-5); }

/* 表の字の列は左に寄せる (集計の表は数の列が主なので既定が右寄せ) */
.tally-table .cell-text { text-align: left; }
.tally-table .cell-center { text-align: center; }
.tally-table .cell-wrap { white-space: normal; min-width: 160px; }
.tally-table tbody tr.is-selected th,
.tally-table tbody tr.is-selected td { background: var(--accent-bg); }

.burndown { padding: var(--sp-3); }

/* ===== 目標 (js-goals) =====
   届いていない数を赤くしない (責める色にしない)。帯は --accent、超えた分は字で示す */
.goal-bar { flex-wrap: wrap; }
.goal-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
}
.goal-section h3 { margin: var(--sp-4) var(--sp-4) 0; font-size: 13px; color: var(--ink-2); }
.goal-card {
  display: flow-root;
  min-width: 0;
  padding: var(--sp-3);
  border-radius: var(--radius);
  background: var(--surface-raised);
  box-shadow: var(--hairline);
}
.goal-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.goal-title { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 14px; color: var(--ink); }
.goal-card p { margin: var(--sp-1) 0; font-size: 12px; line-height: 1.6; color: var(--ink); }
.goal-card p.row-meta { color: var(--ink-2); font-size: 11px; }
.goal-auto { margin-top: var(--sp-2); font-size: 12px; color: var(--ink); }
.goal-changed, .goal-note { padding: var(--sp-1) var(--sp-2); border-radius: var(--radius-sm); background: var(--bg-2); }
.goal-pace-slight, .goal-pace-behind { color: var(--ink-2); }
.goal-meter-row { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); }
.goal-meter {
  flex: 1 1 auto;
  height: 6px;
  border-radius: 999px;
  background: var(--bg-3);
  overflow: hidden;
}
.goal-meter span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.goal-meter-num { flex: 0 0 auto; min-width: 40px; text-align: right; font-size: 11px; color: var(--ink-2); }
.goal-items { list-style: none; margin: var(--sp-3) 0 0; padding: 0; display: grid; gap: var(--sp-2); }
.goal-item { padding: var(--sp-2); border-radius: var(--radius-sm); background: var(--bg-2); min-width: 0; }
.goal-item-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1); }
.goal-item-title { flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--ink); }
.goal-input, .goal-link { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); }
.goal-link span:not(.state) { flex: 1 1 auto; min-width: 0; font-size: 12px; }
.goal-link-select, .issue-goal-select { min-width: 0; max-width: 100%; }
.goal-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }
.goal-decide { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3); }
.goal-decide textarea, .goal-note-form textarea {
  flex: 1 1 100%;
  min-width: 0;
  padding: var(--sp-2);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  box-shadow: var(--hairline);
  font: inherit;
}
.goal-editor { padding: var(--sp-3) var(--sp-4); display: grid; gap: var(--sp-2); max-width: 760px; }
.goal-editor h3, .goal-editor h4 { margin: var(--sp-2) 0 0; font-size: 13px; color: var(--ink); }
.goal-field { display: grid; gap: var(--sp-1); }
.goal-field input, .goal-field select { min-width: 0; }
.goal-editor-items { display: grid; gap: var(--sp-2); }
.goal-item-editor {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: var(--sp-2);
  margin: 0;
  padding: var(--sp-2) var(--sp-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--bg-2);
}
.goal-item-editor p { grid-column: 1 / -1; margin: 0; }
.goal-report { padding: var(--sp-3) var(--sp-4); display: grid; gap: var(--sp-3); }
.goal-report-pick { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.goal-report-text {
  margin: 0 0 var(--sp-2);
  padding: var(--sp-3);
  border-radius: var(--radius);
  background: var(--surface-raised);
  box-shadow: var(--hairline);
  font-family: var(--mono);
  font-size: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.goal-team { margin: var(--sp-3) var(--sp-4) 0; }
.issue-goals { margin-top: var(--sp-3); }
.issue-goals p { margin: var(--sp-1) 0; font-size: 12px; }
.burndown-chart { display: block; width: 100%; max-width: 760px; min-width: 480px; height: auto; }
.burndown-axis { stroke: var(--line-strong); }
.burndown-grid { stroke: var(--line); stroke-dasharray: 2 4; }
.burndown-today { stroke: var(--warn); stroke-dasharray: 3 3; }
.burndown-ideal { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 5; }
.burndown-remaining { stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.burndown-dot { fill: var(--accent); }
.burndown-label { fill: var(--ink-2); font-size: 11px; }
.burndown-legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-2); }
.burndown-legend > span { display: inline-flex; align-items: center; gap: var(--sp-1); }
.burndown-key { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid var(--accent); }
.burndown-key-ideal { border-top: 1.5px dashed var(--ink-2); }

.roadmap-mark { margin: 0; }
.roadmap-open {
  padding: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.roadmap-open:hover { color: var(--accent); text-decoration: underline; }
.tally-scroll > .tally-note { padding: var(--sp-2) var(--sp-3) var(--sp-3); }

.impediment-row .row-main { display: flex; flex-direction: column; gap: 2px; }

.settings-section { max-width: 760px; padding: var(--sp-2) var(--sp-4) var(--sp-4); }
.settings-field {
  /* 見出しの余白がカードの外へ抜けないようにする */
  display: flow-root;
  margin-top: var(--sp-3);
  padding: 0 var(--sp-4) var(--sp-4);
  border-radius: var(--radius);
  background: var(--surface-raised);
  box-shadow: var(--hairline);
}
.settings-field textarea {
  display: block;
  width: stretch;
  width: -webkit-fill-available;
  width: -moz-available;
  margin-bottom: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border: 0;
  border-radius: var(--radius);
  box-shadow: var(--hairline);
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  line-height: 1.7;
}
.settings-field textarea:focus { outline: none; box-shadow: 0 0 0 2px var(--accent); }
.settings-field ol { margin: 0 0 var(--sp-2); padding-left: var(--sp-5); line-height: 1.8; }
.settings-field code { font-family: var(--mono); font-size: 12px; padding: 0 var(--sp-1); border-radius: var(--radius-sm); background: var(--bg-3); }
/* 設定の一覧 (#18)。自分の設定とチームの設定の2つに分け、その中を見出しごとに並べる */
.settings-group { padding-top: var(--sp-3); }
/* 成果の数 (管理者だけ)。見出しと説明・週ごとの棒・先週の数を1行に並べ、狭い画面では折り返す */
.outcomes-list { display: flex; flex-direction: column; gap: var(--sp-3); margin-top: var(--sp-2); }
.outcome-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); padding-bottom: var(--sp-2); border-bottom: 1px solid var(--line); }
.outcome-text { flex: 1 1 260px; min-width: 0; }
.outcome-label { font-weight: 600; }
.outcome-bars { flex: none; width: 186px; height: 40px; }
.outcome-bar { fill: var(--accent); }
.outcome-bar-watch { fill: var(--warn); }
.outcome-bar-hidden { fill: none; stroke: var(--line); stroke-dasharray: 3 2; }
.outcome-now { flex: none; min-width: 72px; color: var(--ink-2); font-size: 12px; text-align: right; }
.settings-group > .view-title,
.settings-group > .row-meta { max-width: 760px; margin-left: var(--sp-4); margin-right: var(--sp-4); }
/* 2つの区切りは線ではなく間で分ける (罫線を増やさない) */
.settings-group + .settings-group { margin-top: var(--sp-6); }
.settings-warning {
  max-width: 760px;
  margin: var(--sp-2) var(--sp-4) 0;
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius);
  background: var(--warn-bg);
  color: var(--warn);
}
.pref-field {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2) var(--sp-3);
  margin-top: var(--sp-2);
  padding-top: var(--sp-3);
}
.pref-field > p { margin: 0; }
.pref-field > .row-meta:last-child { flex-basis: 100%; }
.pref-label { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.pref-steps { display: inline-flex; gap: var(--sp-2); }
/* 予定に入れる (js-calendar): 組み直す・カレンダーで開く・作る・貼るを1行に並べ、狭ければ折り返す */
.calendar-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin: var(--sp-2) 0; }
.calendar-id { flex: 1 1 240px; min-width: 0; }
.calendar-link { text-decoration: none; }
.calendar-late { padding: 0 var(--sp-3) var(--sp-2); }
.pref-field select { min-width: 72px; }
.pref-field input[type="number"] {
  min-width: 72px;
  padding: 4px 6px;
  color: var(--ink);
  background: var(--bg);
  border: 0;
  border-radius: var(--radius-sm);
  box-shadow: var(--hairline);
  font: inherit;
}
.pref-field input[type="number"] { width: 80px; }
.pref-field input:focus { outline: none; box-shadow: 0 0 0 2px var(--accent); }
/* はじめての人への案内。説明 → 1巡りのいまの位置 → 次の一手 */
.scrum-intro {
  margin: var(--sp-4) var(--sp-4) 0;
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius);
  background: var(--accent-bg);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.8;
}
.scrum-intro summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.scrum-intro p { max-width: 760px; margin: var(--sp-2) 0 0; }

.scrum-cycle {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--sp-2);
  margin: var(--sp-3) var(--sp-4) 0;
  padding: 0;
  list-style: none;
}
.scrum-cycle-step {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius);
  background: var(--surface-raised);
  box-shadow: var(--hairline);
  color: var(--ink-2);
}
.scrum-cycle-step.is-current { box-shadow: 0 0 0 2px var(--accent); color: var(--ink); }
.scrum-cycle-num {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 999px;
  background: var(--bg-3);
  font-size: 12px;
  font-weight: 600;
  line-height: 22px;
  text-align: center;
}
.scrum-cycle-step.is-current .scrum-cycle-num { background: var(--accent); color: var(--on-accent); }
.scrum-cycle-step.is-done .scrum-cycle-num { background: var(--success-bg); color: var(--success); }

/* 入力欄の決まりと必須の印 (どの入力欄でも同じ形) */
.field-note { display: block; margin-top: var(--sp-1); font-weight: 400; }
/* 入力例は入れた値と見分けが付くよう淡い字で出す (濃いと入力済みに見える)。
   透かすと読めなくなるので、色だけで差を付ける */
input::placeholder,
textarea::placeholder { color: var(--ink-2); opacity: 1; }
.field-label { display: flex; align-items: center; gap: var(--sp-2); }
/* 入力時の確かめ。エラーは送るのを止め、注意は止めない。色だけに頼らず頭に字を付ける */
.field-msg { display: block; margin-top: var(--sp-1); font-size: 12px; font-weight: 600; }
.field-error { color: var(--danger); }
.field-warn { color: var(--warn); }
.inline-form [aria-invalid="true"] { box-shadow: 0 0 0 2px var(--danger); }
.sprint-quick { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin-top: var(--sp-1); }
.sprint-quick-btn { cursor: pointer; }
.sprint-quick-btn:hover { background: var(--accent-bg); color: var(--accent); }
.field-required { flex: 0 0 auto; }
.scrum-cycle-body { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }

.scrum-next {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-3);
  margin: var(--sp-3) var(--sp-4) 0;
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius);
  background: var(--surface-raised);
  box-shadow: var(--hairline), var(--elev-1);
}
.scrum-next-text { flex: 1 1 280px; display: flex; flex-direction: column; gap: 2px; }
.scrum-next-text strong { font-size: 15px; }

.scrum-chips { display: inline-flex; flex-wrap: wrap; gap: var(--sp-1); }
.group-points { margin-left: var(--sp-1); }

/*
 * ホーム。主 (あなたの番・草・最近の動き) と従 (前進・全体の数) の2列。
 *
 * 区画は1枚の面にし、中の行は線で区切るだけにする。1行ずつを影つきの
 * カードにすると、どれも同じ重さに見えて何から見ればよいか分からない。
 */
/* 器は flex の縦並びにしない。高さの限られた器の中で縮み、はじめに (overflow: hidden) が高さ0に潰れた */
.home-scroll { display: block; padding-left: var(--sp-4); padding-right: var(--sp-4); }
.home-summary {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-3);
  margin: 0 0 var(--sp-3);
  font-size: 13px;
  color: var(--ink-2);
}
.home-summary strong { font-size: 15px; color: var(--ink); }
/* 幅の広い画面で、中身が横いっぱいに伸びて右の列が遠くならないように、真ん中に寄せて幅を抑える */
.home-scroll > * { max-width: 1360px; margin-left: auto; margin-right: auto; }
.home-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--sp-4);
  align-items: start;
}
@media (min-width: 1024px) {
  .home-grid { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); }
}
/* さらに広ければ、右の列 (カード) を2列に並べて縦に積み上がらないようにし、主と従を半々にする */
@media (min-width: 1440px) {
  .home-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .home-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
/* 返事が届くまでの骨組み (homeSkeletonInto)。薄い棒がゆっくり明滅する。動きを減らす設定では止める */
.home-skel-lines { display: grid; gap: var(--sp-2); padding: var(--sp-3); }
.home-skel-line { display: block; height: 12px; border-radius: var(--radius-sm); background: var(--bg-3); animation: home-skel 1.4s ease-in-out infinite; }
.home-skel-line:nth-child(2) { width: 72%; }
.home-skel-line:nth-child(3) { width: 48%; }
.home-skel-line:nth-child(4) { width: 86%; }
@keyframes home-skel { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .home-skel-line { animation: none; } }
/* 待つあいだの推し (js-oshi の oshiWaitInto)。骨組みの右に重ねて置き、骨組みの寸法 (高さ) は変えない
   (届いて中身に置き換わっても画面が跳ねない)。棒は左に寄せて重ならないようにする。狭い画面では絵を出さず一言だけ */
.home-skel { position: relative; }
.home-skel.has-oshi .home-skel-lines { padding-right: 46%; }
.oshi-wait {
  position: absolute; top: 44px; right: var(--sp-3); bottom: var(--sp-2); width: 42%;
  display: flex; align-items: center; justify-content: flex-end; gap: var(--sp-2);
  pointer-events: none; animation: oshi-wait-in var(--motion) ease-out;
}
.oshi-wait .oshi-figure { width: 56px; height: 56px; }
.oshi-wait .oshi-avatar { width: 40px; height: 40px; font-size: 16px; }
.oshi-wait .oshi-line {
  min-width: 0; font-size: 12px; line-height: 1.4; padding: var(--sp-1) var(--sp-2);
  overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
}
@keyframes oshi-wait-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .oshi-wait { animation: none; } }
@media (max-width: 767px) {
  .oshi-wait .oshi-figure { display: none; }
  .oshi-wait .oshi-line { -webkit-line-clamp: 2; }
}
.home-main,
.home-side,
.home-cards { display: grid; gap: var(--sp-4); align-content: start; min-width: 0; }
.home-cards:empty { display: none; }
.home-block,
.home-card {
  border-radius: var(--radius);
  background: var(--surface-raised);
  box-shadow: var(--hairline);
  overflow: hidden;
}
.home-block:empty { display: none; }
/* 管理者が置いたお知らせ (js-announce)。本文は字のまま、改行だけ活かす */
.announce-inner { display: grid; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3) var(--sp-3); }
.announce-title { margin: 0; font-size: 14px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.announce-text { margin: 0; font-size: 13px; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.announce-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.announce-list { display: grid; gap: var(--sp-2); margin-top: var(--sp-3); }
.announce-item {
  display: grid;
  gap: var(--sp-1);
  justify-items: start;
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius);
  background: var(--surface-raised);
  box-shadow: var(--hairline);
}
.announce-item-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.announce-item-title { font-size: 13px; color: var(--ink); overflow-wrap: anywhere; }
.announce-counts { margin: 0; padding-left: var(--sp-5); font-size: 13px; color: var(--ink); }
.announce-period { display: flex; flex-wrap: wrap; gap: var(--sp-3); }
/* 区画の見出しの行。題は左、数や切り替えは右。見出しの形はここだけ */
.home-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-2);
  min-height: 40px;
  padding: var(--sp-2) var(--sp-3);
  box-sizing: border-box;
  box-shadow: inset 0 -1px 0 var(--line);
}
.home-section-head {
  margin: 0 auto 0 0;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}
.home-head .side-close { position: static; }
.home-turn-group + .home-turn-group { box-shadow: inset 0 1px 0 var(--line); }
/* 改善のヒント。1件ごとに、なぜ (数字) と次にすること */
.advice-item {
  display: grid;
  gap: var(--sp-1);
  padding: var(--sp-2) var(--sp-3) var(--sp-3);
  box-shadow: inset 0 -1px 0 var(--line);
}
.advice-item:last-child { box-shadow: none; }
.advice-title { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink); }
.advice-why,
.advice-tip { margin: 0; font-size: 13px; color: var(--ink-2); }
.advice-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-1); }
.home-sub {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin: 0;
  padding: var(--sp-2) var(--sp-3) var(--sp-1);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
}
/* 区画の中の行。button の一覧は width: 100% を使わない (docs/dev/design.md) */
.home-row {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: -moz-available;
  width: -webkit-fill-available;
  width: stretch;
  min-height: 40px;
  margin: 0;
  padding: var(--sp-2) var(--sp-3);
  border-radius: 0;
  background: transparent;
  text-align: left;
  font-size: 13px;
  box-shadow: inset 0 -1px 0 var(--line);
  cursor: pointer;
}
.home-row:last-child { box-shadow: none; }
.home-row:hover { background: var(--bg-2); }
/* 面の端で切れないよう、枠は内側に描く */
.home-row:focus-visible { outline-offset: -2px; }
.home-row-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-row-when { flex: 0 0 auto; font-size: 12px; color: var(--ink-2); }
.home-more { color: var(--accent); }
.home-empty { margin: 0; padding: var(--sp-3); font-size: 13px; color: var(--ink-2); }
/* カードは中に余白を持つ。見出しの行だけ面の端まで広げる */
.home-card { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3); }
.home-card > .home-head { margin: calc(var(--sp-3) * -1) calc(var(--sp-3) * -1) 0; }
/* 全体の数は、狭い従の列に 2×2 の札で並べる。流れの矢印は横に並ばないので出さない */
#home-counts .flow-steps {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sp-2);
  padding: var(--sp-3);
}
#home-counts .flow-arrow { display: none; }
#home-counts .flow-step { min-width: 0; align-items: stretch; }
#home-counts .flow-btn { box-shadow: var(--hairline); }
#home-counts .flow-btn:hover { box-shadow: var(--hairline); transform: none; background: var(--bg-2); }
#home-counts .flow-desc { text-align: center; }
/* 草。53週 × 7日。マスの色は既存トークンだけで5段 */
.activity-body { padding: var(--sp-2) var(--sp-3) var(--sp-3); }
/*
 * マスは列の幅いっぱいに広がる正方形。枠の幅 (100cqi) から曜日の名・間・余白を引き、
 * 週の数で割る。8px を下回る狭い画面でだけ 8px で止めて横に流す (右端を見せて開く)。
 * 広い画面で大きくなりすぎないよう 16px で止める。11px 固定にしていたときは、
 * 1280px の主の列 (約610px) に 53週 (約742px) が入らず、古い10週ほどが流した先に隠れた。
 * 月の名・曜日の名・マスは同じ --cell と同じ間 (2px) を使うので、列と名がずれない。
 * 間を 3px から 2px にしたのは、1280px でも 8px を割らずに収めるため。
 */
.activity-frame {
  display: flex;
  gap: var(--sp-1);
  container-type: inline-size;
  --weeks: 53;
}
.activity-days,
.activity-scroll {
  --cell: clamp(8px, calc((100cqi - 12px - var(--sp-1) - 8px - (var(--weeks) - 1) * 2px) / var(--weeks)), 16px);
}
/* 曜日の名は流さない。上の余白は月の名の行 (枠の余白 4 + 高さ 15 + 間 3) のぶん */
.activity-days {
  flex: 0 0 12px;
  width: 12px;
  display: grid;
  grid-template-rows: repeat(7, var(--cell));
  gap: 2px;
  padding-top: 22px;
  font-size: 10px;
  line-height: var(--cell);
  color: var(--ink-2);
}
/* 選んだマスの枠が切れないよう、流す枠に少し余白を持たせる */
.activity-scroll { flex: 1 1 auto; min-width: 0; overflow-x: auto; padding: 4px; }
.activity-months {
  display: flex;
  gap: 2px;
  width: max-content;
  height: 15px;
  margin-bottom: 3px;
  font-size: 10px;
  line-height: 15px;
  color: var(--ink-2);
}
.activity-month { flex: 0 0 var(--cell); width: var(--cell); white-space: nowrap; overflow: visible; }
/* 右端の2週の名は左へはみ出させる。右へはみ出すと、収まっている草まで数px 横に流れる */
.activity-month:nth-last-child(-n+2) { display: flex; justify-content: flex-end; }
.activity-grid { display: inline-flex; gap: 2px; }
.activity-week { display: grid; grid-template-rows: repeat(7, var(--cell)); gap: 2px; }
/* 見本 (少 □□□□□ 多) は枠の外にあるので 11px のまま */
.activity-cell { width: 11px; height: 11px; border-radius: 2px; background: var(--line); }
.activity-scroll .activity-cell { width: var(--cell); height: var(--cell); }
.activity-cell.lv-none { background: transparent; }
.activity-cell.lv1 { background: var(--accent); opacity: 0.3; }
.activity-cell.lv2 { background: var(--accent); opacity: 0.5; }
.activity-cell.lv3 { background: var(--accent); opacity: 0.75; }
.activity-cell.lv4 { background: var(--accent); }
.activity-cell.is-picked { outline: 2px solid var(--ink); outline-offset: 1px; }
.activity-live { min-height: 1.5em; margin: var(--sp-2) 0 0; font-size: 12px; color: var(--ink); }
.activity-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--sp-2);
}
.activity-foot .row-meta { margin: 0; }
.activity-legend { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--ink-2); }
.activity-legend .activity-cell { display: inline-block; }
.game-level { margin: var(--sp-1) 0; }
.game-level-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.game-level-bar span { display: block; height: 100%; background: var(--accent); }
.game-top { margin: var(--sp-1) 0; padding-left: 0; list-style: none; }
.game-top .is-me { font-weight: 600; }
.game-note { margin: var(--sp-2) 0 0; }
.game-team { margin: var(--sp-2) 0; }
.game-badges { margin: var(--sp-2) 0 0; padding-left: 0; list-style: none; display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-2); }
.game-badges li { color: var(--ink-2); opacity: 0.6; }
.game-badges li.is-done { color: var(--ink); opacity: 1; font-weight: 600; }
.report-kind { max-width: 100%; }
.report-preview { white-space: pre-wrap; margin: 0; padding: var(--sp-2); background: var(--bg-2); border-radius: var(--radius-sm); font-size: 12px; }
.my-today-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.my-today-list { margin: var(--sp-1) 0 var(--sp-2); padding-left: 18px; }
.my-today-none { margin: var(--sp-1) 0 0; color: var(--ink-2); }
.my-today-copy { display: block; width: 100%; min-height: 72px; margin-top: var(--sp-2); box-sizing: border-box; }
.team-progress-line { font-size: 14px; font-weight: 600; color: var(--ink); }
.team-goal { display: flex; flex-direction: column; gap: var(--sp-1); }
.team-goal .state { align-self: flex-start; }
.team-goal-edit { align-self: flex-start; }
.first-steps-list { display: flex; flex-direction: column; gap: var(--sp-2); margin: 0; padding: 0; list-style: none; }
.first-step { display: flex; align-items: flex-start; gap: var(--sp-2); color: var(--ink-2); font-size: 13px; }
.first-step.is-done .scrum-cycle-num { background: var(--success-bg); color: var(--success); }
.first-step.is-next { color: var(--ink); }
.first-step.is-next .scrum-cycle-num { background: var(--accent); color: var(--on-accent); }
.first-step-body { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1); }

/* 狭い画面では操作の帯を折り返す。詰めると「スプリント」の字が縦に割れる */
.scrum-actions { flex-wrap: wrap; }
.scrum-actions .tally-switch .row-meta,
.scrum-actions .btn { white-space: nowrap; }
.change-history { margin-top: var(--sp-4); }
.change-history summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }
.history-item { padding: var(--sp-2) 0; font-size: 12px; }
.history-head { margin-bottom: var(--sp-1); }
.history-change { margin: var(--sp-1) 0 0; }
.history-diff {
  margin-top: var(--sp-1);
  padding: var(--sp-1) 0;
  border-radius: var(--radius-sm);
  background: var(--bg-2);
  font-family: var(--mono);
  white-space: pre-wrap;
  word-break: break-word;
}
.history-line { display: block; padding: 0 var(--sp-2); text-decoration: none; }
.history-mark { display: inline-block; width: 1.5em; color: var(--ink-2); }
/* 色だけに頼らない。消えた行は取り消し線と「−」、足した行は「＋」 */
.history-del { color: var(--danger); background: var(--danger-bg); }
.history-del .history-text { text-decoration: line-through; }
.history-add { color: var(--accent); background: var(--accent-bg); }
.history-more { margin-top: var(--sp-2); }

/* =====================================================================
 * スマホ
 *
 * Material Design 3 の「ナビゲーションバー」と「モーダルのナビゲーション
 * ドロワー」に倣う。主な行き先は親指の届く下の帯に、残りは「メニュー」から
 * 引き出す。広い画面では下の帯も幕も出さない。
 * ===================================================================== */
.mobile-nav,
.nav-scrim { display: none; }

@media (max-width: 767px) {
  /* 左の行き先は常に出さず、引き出しにする (上に積むと画面の4割を占めていた) */
  .layout { height: 100dvh; min-height: 0; }
  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 210;
    width: min(85vw, 320px);
    max-height: none;
    overflow-y: auto;
    border: 0;
    background: var(--bg);
    box-shadow: var(--elev-2);
    transform: translateX(-105%);
    transition: transform var(--motion) ease-out;
    visibility: hidden;
  }
  .sidebar.drawer-open { transform: translateX(0); visibility: visible; }

  .nav-scrim:not([hidden]) {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(31, 35, 40, 0.4);
  }

  .main {
    min-height: 0;
    /* 下の帯のぶん空ける。iPhone の下の帯 (ホームバー) も避ける */
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }

  /* 全画面では下の帯を隠すので、そのぶんは空けない */
  body.doc-full .main { padding-bottom: env(safe-area-inset-bottom); }

  .mobile-nav {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 140;
    padding: var(--sp-1) var(--sp-1) calc(var(--sp-1) + env(safe-area-inset-bottom));
    background: var(--bg);
    box-shadow: 0 -1px 0 var(--line), var(--elev-1);
  }

  /* 通知は下の帯の上に、左右いっぱいで出す (中央寄せのままだと幅が画面の半分になり、
     閉じるボタンが帯の下に隠れた) */
  .snackbar {
    left: var(--sp-4);
    right: var(--sp-4);
    transform: none;
    max-width: none;
    bottom: calc(64px + env(safe-area-inset-bottom) + var(--sp-3));
  }

  .mobile-nav-item {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 0;
    /* 押せる大きさは 48px を下回らせない (Material Design 3) */
    min-height: 52px;
    padding: var(--sp-1) 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--ink-2);
    font-size: 11px;
  }
  .mobile-nav-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .mobile-nav-item .icon { width: 20px; height: 20px; }
  .mobile-nav-item[aria-current="true"],
  .mobile-nav-item.is-here { color: var(--accent); font-weight: 600; }
  .mobile-nav-item[aria-current="true"] .icon,
  .mobile-nav-item.is-here .icon {
    padding: 2px 14px;
    border-radius: 999px;
    background: var(--accent-bg);
    box-sizing: content-box;
  }

  /* 右から出る入力や詳細は、狭い画面では全面に出す。9割だと右に半端な隙間が残る */
  .side-panel { width: 100vw; }

  /* 切り替えのボタンは1行のまま横に流す。詰めると「一/覧」と縦に割れていた */
  .segmented { max-width: 100%; overflow-x: auto; }
  .seg { flex: 0 0 auto; white-space: nowrap; }

  /* 入力の字は 16px 以上にする。小さいと iPhone が勝手に拡大する */
  input, select, textarea { font-size: 16px; }

  /* やることの一覧の行は、題名を広く取る。直す・捨てるは開いた詳細にもあるので畳む。
     ほかの一覧 (改訂版など) では行のボタンが唯一の入口なので畳まない */
  #issue-list .row-item .icon-btn[aria-label$="を直す"],
  #issue-list .row-item .btn-danger { display: none; }

  .mobile-nav-item { position: relative; }
  .mobile-nav-count {
    position: absolute;
    top: 2px;
    left: calc(50% + 8px);
    min-width: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 10px;
    font-weight: 600;
    line-height: 16px;
  }

  /* 押せる大きさを指に合わせる */
  .icon-btn { min-width: 40px; min-height: 40px; }

  /* 上の操作の帯は折り返す。ボタンの字は割らない (「文書を登録/する」と割れていた) */
  .panel-actions { flex-wrap: wrap; }
  .panel-actions .btn { white-space: nowrap; }
}

@media (max-width: 767px) and (prefers-reduced-motion: reduce) {
  .sidebar { transition: none; }
}

/* 横断検索。広い画面ではヘッダーの欄、狭い画面では虫めがねから開く */
.search-box { position: relative; }
.search-open { display: none; }
/* 欄の見た目は絞り込みの欄 (.filter-box input) と同じ。ここでは幅だけ決める */
.search-field { align-items: center; width: 240px; max-width: 32vw; }
.search-close { display: none; }
.search-results {
  position: absolute; right: 0; top: calc(100% + var(--sp-1)); z-index: 30;
  width: min(440px, 90vw); max-height: 60vh; overflow-y: auto;
  background: var(--surface-raised); box-shadow: var(--hairline); border-radius: var(--radius);
  padding: var(--sp-1) 0;
}
.search-group-head { padding: var(--sp-2) var(--sp-3) var(--sp-1); }
.search-row { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); cursor: pointer; }
.search-row[aria-selected="true"], .search-row:hover { background: var(--bg-2); }
.search-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-title mark { background: var(--accent-bg); color: inherit; }
.search-empty { padding: var(--sp-2) var(--sp-3); margin: 0; }

@media (max-width: 767px) {
  .search-open { display: inline-flex; }
  .search-box .search-field { display: none; }
  .search-box.is-open .search-field {
    display: flex; position: fixed; left: 0; right: 0; top: 0; z-index: 40; width: auto; max-width: none;
    padding: var(--sp-2) var(--sp-4); background: var(--bg); box-shadow: var(--hairline); gap: var(--sp-2);
  }
  .search-box.is-open .search-input { flex: 1 1 auto; width: auto; }
  .search-box.is-open .search-close { display: inline-flex; }
  .search-box.is-open .search-results { position: fixed; left: var(--sp-4); right: var(--sp-4); top: 56px; width: auto; }
}
/* ----- 楽しい演出 (js-fun。既定はオフ) -----
   1枚の重ねにだけ描く。押せず (pointer-events: none)、読み上げにも載らない (aria-hidden)。
   色はトークンだけ。tone の色を color に置き、影や枠は currentColor で引く */
.fun-layer { position: fixed; inset: 0; pointer-events: none; z-index: 400; overflow: hidden; }
.fun-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.fun-tone-accent { color: var(--accent); }
.fun-tone-success { color: var(--success); }
.fun-tone-warn { color: var(--warn); }
.fun-tone-danger { color: var(--danger); }
.fun-tone-merged { color: var(--merged); }
.fun-flash { position: absolute; inset: 0; opacity: 0; box-shadow: inset 0 0 0 6px currentColor, inset 0 0 48px currentColor; }
.fun-flash.is-on { animation: fun-flash 600ms ease-out; }
.fun-combo {
  position: absolute; transform: translate(-100%, -115%); white-space: nowrap;
  font-weight: 900; font-style: italic; font-size: 22px; letter-spacing: 0.02em; line-height: 1;
  text-shadow: 0 2px 0 var(--bg), 0 0 10px currentColor;
}
.fun-combo-n { font-size: 30px; }
.fun-combo-word { color: var(--ink); }
.fun-combo-grade { font-size: 28px; }
.fun-combo.is-bump { animation: fun-bump 180ms ease-out; }
.fun-banner { position: absolute; white-space: nowrap; font-weight: 900; font-style: italic; line-height: 1;
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); }
.fun-big { left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: clamp(36px, 9vw, 88px);
  animation: fun-pop 1200ms ease-out forwards; }
.fun-big .fun-banner-text, .fun-small .fun-banner-text {
  background-image: linear-gradient(100deg, var(--warn), currentColor 45%, var(--merged) 80%, var(--accent));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 3px 0 var(--bg)) drop-shadow(0 0 14px currentColor);
  padding: 0 0.15em;
}
.fun-small { transform: translate(-50%, -50%); font-size: 28px; animation: fun-rise 900ms ease-out forwards; }
.fun-banner-sub { font-size: 0.55em; color: var(--ink); text-shadow: 0 2px 0 var(--bg); }
.fun-badge {
  transform: translate(-50%, -50%); font-size: 13px; font-style: normal; font-weight: 700;
  flex-direction: row; padding: var(--sp-1) var(--sp-3); border-radius: 999px;
  background: var(--surface-raised); box-shadow: var(--hairline), var(--elev-2);
}
.fun-badge .fun-banner-sub { font-size: 11px; text-shadow: none; color: var(--ink-2); }
@keyframes fun-flash { 0% { opacity: 0.9; } 100% { opacity: 0; } }
@keyframes fun-bump { 0% { transform: translate(-100%, -115%) scale(1.25); } 100% { transform: translate(-100%, -115%) scale(1); } }
@keyframes fun-pop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(-6deg); }
  18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(-3deg); }
  30% { transform: translate(-50%, -50%) scale(1) rotate(-3deg); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -60%) scale(1.04) rotate(-3deg); }
}
@keyframes fun-rise {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -110%) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .fun-layer * { animation: none !important; }
  .fun-canvas, .fun-flash { display: none; }
}
/* ----- 思いがけない当たり・ノリノリタイム (js-luck。既定はオフ) -----
   当たりは fun-layer に描く (押せず、読み上げにも載らない)。色はトークンだけ。金色は --warn */
.luck-win {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
  white-space: nowrap; font-weight: 900; line-height: 1;
  animation: fun-pop 2800ms ease-out forwards;
}
.luck-win-title {
  font-size: clamp(40px, 10vw, 96px); font-style: italic; padding: 0 0.15em;
  background-image: linear-gradient(100deg, var(--warn), var(--danger) 40%, var(--warn) 70%, var(--merged));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 3px 0 var(--bg)) drop-shadow(0 0 18px currentColor);
}
.luck-reels { display: flex; gap: var(--sp-2); }
.luck-reel {
  width: 64px; height: 72px; overflow: hidden; border-radius: var(--radius);
  background: var(--surface-raised); box-shadow: inset 0 0 0 3px currentColor, var(--elev-2);
}
.luck-strip { display: flex; flex-direction: column; animation: luck-spin 900ms cubic-bezier(.2, .7, .2, 1) both; }
.luck-cell { display: flex; align-items: center; justify-content: center; height: 72px; font-size: 40px; color: var(--ink); }
.luck-win-line { font-size: 16px; font-weight: 700; color: var(--ink); text-shadow: 0 2px 0 var(--bg); }
.luck-win.is-static { left: auto; right: var(--sp-4); top: auto; bottom: var(--sp-6); transform: none; animation: none; }
.luck-win.is-static .luck-win-title { font-size: 15px; font-style: normal; filter: none; }
.luck-win.is-static .luck-win-line { font-size: 12px; font-weight: 400; text-shadow: none; color: var(--ink-2); }
@keyframes luck-spin { 0% { transform: translateY(-360px); } 100% { transform: translateY(0); } }
.fun-banner.is-fever.fun-big { font-size: clamp(48px, 12vw, 120px); }
.fun-banner.is-fever.fun-small { font-size: 40px; }
.luck-fever-frame {
  position: fixed; inset: 0; pointer-events: none; z-index: 390; color: var(--warn);
  box-shadow: inset 0 0 0 3px currentColor, inset 0 0 36px currentColor; opacity: 0.55;
  animation: luck-glow 2400ms ease-in-out infinite alternate;
}
@keyframes luck-glow { 0% { opacity: 0.3; } 100% { opacity: 0.7; } }
/* 右下に置く (左下は推しの吹き出し)。集中の置き場が出ていればその上に積む (実機では js-luck が高さを合わせる) */
.luck-fever-chip {
  position: fixed; right: var(--sp-4); bottom: var(--sp-4); z-index: 391;
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-3); border-radius: 999px;
  font-size: 12px; font-weight: 700; color: var(--warn);
  background: var(--warn-bg); box-shadow: var(--hairline), var(--elev-1);
}
.luck-fever-chip.is-above-dock { bottom: 240px; }
.reward-changed { margin: var(--sp-2) 0; padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-sm); background: var(--bg-2); }
