          row.addEventListener('click', function () { openIssueByNumber(it.number, row); });
        } else {
          row.dataset.pr = String(it.number);
          row.addEventListener('click', function () { openPrByNumber(it.number); });
        }
        sec.appendChild(row);
      });
      if (part.total > items.length) {
        var more = homeRow('ほか ' + (part.total - items.length) + ' 件', 'home-more');
        more.addEventListener('click', function () { switchTab(g[2]); });
        sec.appendChild(more);
      }
      box.appendChild(sec);
    });
    if (!any) {
      var none = document.createElement('p');
      none.className = 'home-empty';
      none.textContent = 'いまあなたを待っているものはありません';
      box.appendChild(none);
    }
    return box;
  }

  /**
   * 確認依頼を番号で開く。画面はすぐ移り、一覧が届いたらその依頼を選ぶ
   * (返事を待ってから移ると、待つあいだに別の画面へ移った人を引き戻す)。
   */
  function openPrByNumber(number) {
    switchTab('pulls', { pr: number });
  }

  /**
   * 文書を fileId で開く。文書の一覧がまだ届いていなければ取ってから開く
   * (openDoc は allFiles から正式版を引く)。
   *
   * @param {string} fileId
   * @param {string} title 一覧に見当たらないときの題名
   */
  function openDocById(fileId, title) {
    function go() {
      var f = allFiles.filter(function (x) { return x.fileId === fileId; })[0];
      openDoc(fileId, f ? f.path : title);
    }
    if (allFiles.length) go();
    else loadFiles(go);
  }

  /**
   * 草の色の段の切れ目。1件以上の日の分布の 1/4・2/4・3/4 (GitHub と同じ考え方) と、
   * いちばん多い日・少ない日。
   *
   * @param {number[]} counts
   * @returns {number[]} [1/4, 2/4, 3/4, 最多, 最少]
   */
  function activityCuts(counts) {
    var on = counts.filter(function (n) { return n > 0; }).sort(function (a, b) { return a - b; });
    if (!on.length) return [1, 1, 1, 1, 1];
    function q(f) { return on[Math.min(on.length - 1, Math.floor(on.length * f))]; }
    return [q(0.25), q(0.5), q(0.75), on[on.length - 1], on[0]];
  }

  /**
   * いちばん多い日は必ず4段目。どの日も同じ数なら、全部を真ん中の段にする
   * (全部を1段目にすると、いちばん動いた日まで薄く見える)。
   *
   * @param {number} n
   * @param {number[]} cuts activityCuts
   * @returns {number} 0〜4
   */
  function activityLevel(n, cuts) {
    if (!n) return 0;
    if (cuts[3] === cuts[4]) return 2;
    if (n >= cuts[3]) return 4;
    if (n <= cuts[0]) return 1;
    if (n <= cuts[1]) return 2;
    if (n <= cuts[2]) return 3;
    return 4;
  }

  var WEEKDAYS = '月火水木金土日';

  /** 「10月14日 (火) 3件」 */
  function activityDayText(day, d, n) {
    return Number(day.substring(5, 7)) + '月' + Number(day.substring(8, 10)) + '日 (' +
      WEEKDAYS.charAt(d) + ') ' + n + '件';
  }

  /**
   * 月の名を置く列。その月の1日を含む週に置き、近すぎる名は落とす (重なって読めない)。
   * 左端の週は、すぐ右に名が来ないときだけ名を持つ。
   *
   * @param {Array<Array<{day: string}>>} weeks
   * @returns {string[]} 週ごとの名 (無ければ '')
   */
  function activityMonths(weeks) {
    var firsts = weeks.map(function (w) {
      var hit = w.filter(function (c) { return String(c.day || '').substring(8, 10) === '01'; })[0];
      return hit ? String(hit.day) : '';
    });
    var out = weeks.map(function () { return ''; });
    var last = -99;
    weeks.forEach(function (w, i) {
      var day = firsts[i];
      if (!day && i === 0 && !firsts.slice(1, 3).some(Boolean) && w.length) day = String(w[0].day || '');
      if (!day || i - last < 3) return;
      out[i] = Number(day.substring(5, 7)) + '月';
      last = i;
    });
    return out;
  }

  /**
   * 草。あなたとチームを切り替えて1つだけ描く。**日が続いた数・その最高は出さない。**
   *
   * マスは role="img" の中に置いて押せる形にはしない (img の中身は読み上げに出ない
   * ので、中に押せるものを置くと「見えないのに押せる」になる)。代わりに外側の
   * スクロールの枠に1つだけフォーカスを置き、矢印キーで日を選ぶ。選んだ日は下の
   * 1行 (aria-live) に字で出す。指で押したマスも同じ行に出す。
   * マスは列の幅いっぱいに広がる (CSS の --cell)。8px でも収まらない狭い画面でだけ
   * 横に流し、右端 (今週) を見せる。
   */
  function makeActivityBlock(act) {
    var box = document.createElement('div');
    var weeks = act.weeks || [];
    var view = 'me';
    try { if (window.localStorage.getItem('activityView') === 'team') view = 'team'; } catch (e) { /* 既定はあなた */ }

    var mine = privatePill();
    var seg = document.createElement('div');
    seg.className = 'segmented';
    seg.setAttribute('role', 'group');
    seg.setAttribute('aria-label', '草に出す数');
    var segs = [['me', 'あなた'], ['team', 'チーム']].map(function (pair) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'seg';
      b.dataset.view = pair[0];
      b.textContent = pair[1];
      b.addEventListener('click', function () {
        view = pair[0];
        try { window.localStorage.setItem('activityView', view); } catch (e) { /* 覚えられなくても切り替わる */ }
        draw();
      });
      seg.appendChild(b);
      return b;
    });
    box.appendChild(homeHead('アクティビティ', [mine, seg]));

    var body = document.createElement('div');
    body.className = 'activity-body';
    box.appendChild(body);

    function draw() {
      segs.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.view === view)); });
      mine.hidden = view !== 'me';
      body.textContent = '';
      var key = view;
      var name = view === 'me' ? 'あなた' : 'チーム (全員の合計)';

      var days = [];
      var counts = [];
      weeks.forEach(function (w) { w.forEach(function (c) { if (!c.future) counts.push(Number(c[key]) || 0); }); });
      var cuts = activityCuts(counts);
      var total = view === 'me' && act.meTotal !== undefined ? Number(act.meTotal) || 0
        : counts.reduce(function (s, n) { return s + n; }, 0);

      var frame = document.createElement('div');
      frame.className = 'activity-frame';
      // マスの大きさは枠の幅を週の数で割って決まる (CSS の --cell)。既定は 53週
      if (weeks.length) frame.style.setProperty('--weeks', String(weeks.length));

      var dayNames = document.createElement('div');
      dayNames.className = 'activity-days';
      dayNames.setAttribute('aria-hidden', 'true');
      ['月', '', '水', '', '金', '', ''].forEach(function (t) {
        var s = document.createElement('span');
        s.textContent = t;
        dayNames.appendChild(s);
      });
      frame.appendChild(dayNames);

      var scroll = document.createElement('div');
      scroll.className = 'activity-scroll';
      scroll.tabIndex = 0;
      scroll.setAttribute('role', 'group');
      scroll.setAttribute('aria-label', name + 'の日ごとの数。左右の矢印で週、上下の矢印で日を動かします');

      var months = document.createElement('div');
      months.className = 'activity-months';
      months.setAttribute('aria-hidden', 'true');
      activityMonths(weeks).forEach(function (m) {
        var s = document.createElement('span');
        s.className = 'activity-month';
        s.textContent = m;
        months.appendChild(s);
      });
      scroll.appendChild(months);

      var grid = document.createElement('div');
      grid.className = 'activity-grid';
      grid.setAttribute('role', 'img');
      grid.setAttribute('aria-label', name + 'の行い。直近1年で ' + total + ' 件');
      weeks.forEach(function (w) {
        var col = document.createElement('div');
        col.className = 'activity-week';
        w.forEach(function (c, d) {
          var cell = document.createElement('span');
          var n = Number(c[key]) || 0;
          cell.className = 'activity-cell lv' + (c.future ? '-none' : activityLevel(n, cuts));
          if (!c.future) {
            var day = String(c.day || '');
            cell.dataset.day = day;
            cell.dataset.at = String(days.length);
            cell.title = activityDayText(day, d, n);
            days.push(cell);
          }
          col.appendChild(cell);
        });
        grid.appendChild(col);
      });
      scroll.appendChild(grid);
      frame.appendChild(scroll);
      body.appendChild(frame);

      var live = document.createElement('p');
      live.className = 'activity-live';
      live.setAttribute('aria-live', 'polite');
      body.appendChild(live);

      var picked = days.length - 1;
      function pick(i, mark) {
        if (!days.length) return;
        picked = Math.max(0, Math.min(days.length - 1, i));
        days.forEach(function (c) { c.classList.remove('is-picked'); });
        var cell = days[picked];
        if (mark) {
          cell.classList.add('is-picked');
          if (cell.scrollIntoView) cell.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        }
        live.textContent = cell.title;
      }
      pick(picked, false);

      // 日は週ごとに7つ並ぶので、上下は1日、左右は7日
      var STEP = { ArrowUp: -1, ArrowDown: 1, ArrowLeft: -7, ArrowRight: 7 };
      scroll.addEventListener('keydown', function (e) {
        if (STEP[e.key]) pick(picked + STEP[e.key], true);
        else if (e.key === 'Home') pick(0, true);
        else if (e.key === 'End') pick(days.length - 1, true);
        else return;
        e.preventDefault();
      });
      grid.addEventListener('click', function (e) {
        var at = e.target && e.target.dataset ? e.target.dataset.at : undefined;
        if (at !== undefined) pick(Number(at), true);
      });

      var foot = document.createElement('div');
      foot.className = 'activity-foot';
      var sum = document.createElement('p');
      sum.className = 'row-meta';
      sum.textContent = '直近1年で ' + total + ' 件';
      foot.appendChild(sum);
      var legend = document.createElement('div');
      legend.className = 'activity-legend';
      legend.setAttribute('aria-hidden', 'true');
      legend.appendChild(document.createTextNode('少'));
      [0, 1, 2, 3, 4].forEach(function (lv) {
        var c = document.createElement('span');
        c.className = 'activity-cell lv' + lv;
        legend.appendChild(c);
      });
      legend.appendChild(document.createTextNode('多'));
      foot.appendChild(legend);
      body.appendChild(foot);

      // 開いたら右端 (今週) を見せる
      window.requestAnimationFrame(function () { scroll.scrollLeft = scroll.scrollWidth; });
    }
    draw();
    return box;
  }

  /** 最近の動きの種類の札。字と色の種類 */
  var RECENT_KINDS = {
    merged: ['反映', 'state state-merged'],
    closed: ['完了', 'state state-open'],
    pull: ['依頼', 'chip chip-accent'],
    file: ['登録', 'chip'],
  };

  /** 最近の動き。種類の札・題・いつ。**名前を出さない。** 押すと開く */
  function makeRecentBlock(list) {
    var box = document.createElement('div');
    box.appendChild(homeHead('最近の動き'));
    if (!list.length) {
      var none = document.createElement('p');
      none.className = 'home-empty';
      none.textContent = 'まだ動きはありません';
      box.appendChild(none);
      return box;
    }
    list.forEach(function (x) {
      var kind = RECENT_KINDS[x.kind] || ['', 'chip'];
      var what = x.kind === 'file' ? x.title : (x.kind === 'closed' ? '#' : '確認依頼 #') + x.number + ' ' + x.title;
      var row = homeRow(what, 'home-recent-row');
      if (kind[0]) row.insertBefore(makePill(kind[0], kind[1]), row.firstChild);
      var when = document.createElement('span');
      when.className = 'home-row-when';
      when.textContent = relativeTime(x.at);
      row.appendChild(when);
      row.setAttribute('aria-label', (kind[0] ? kind[0] + ' ' : '') + what + (when.textContent ? ' (' + when.textContent + ')' : ''));
      // 文書の行は番号を持たない (0) ので fileId で名指す
      if (x.kind === 'file') {
        row.dataset.file = x.fileId;
        row.addEventListener('click', function () { openDocById(x.fileId, x.title); });
      } else if (x.kind === 'closed') {
        row.dataset.issue = String(x.number);
        row.addEventListener('click', function () { openIssueByNumber(x.number, row); });
      } else {
        row.dataset.pr = String(x.number);
        row.addEventListener('click', function () { openPrByNumber(x.number); });
      }
      box.appendChild(row);
    });
    return box;
  }

  /**
   * 関係の流れに実数を入れる。
   *
   * 何がいくつあるかが見えないと、次に何をすればよいか分からない。
   */
  function loadOverview() {
    // 何かを動かすたびに取り直すので、先に頼んだぶんの返事で古い数に戻さない
    var still = latest('overview');
    call('apiOverview', [], function (result) {
      if (!still()) return;
      var o = result || { openIssues: 0, branches: 0, openPrs: 0, docs: 0 };
      document.getElementById('flow-issues').textContent = o.openIssues;
      document.getElementById('flow-branches').textContent = o.branches;
      document.getElementById('flow-prs').textContent = o.openPrs;
      document.getElementById('flow-docs').textContent = o.docs;

      setCount('count-drafts', o.branches);
      setCount('count-requests', o.openPrs);
      setCount('count-todos', o.openIssues);
    }, failQuiet('数が出なくても操作はできる'));
  }

  function setCount(id, n) {
    var el = document.getElementById(id);
    el.textContent = n;
    el.hidden = !n;
  }

  // ===== 文書を開く =====

  /**
   * 文書を開く。版の選択肢もここで作る。
   *
   * @param {string} fileId 開く版の fileId
   * @param {string} docPath 正式版の論理パス
   * @param {{full: boolean, since: number}} [opts] full なら開いたあと全画面にする
   *   (全画面のリンクから)。since を渡すと、それ以後に画面を切り替えていたら描かない
   */
  function openDoc(fileId, docPath, opts) {
    // 前の文書のリンクを残さない
    docLinkRow.hidden = true;
    docLinkRow.textContent = '';

    var doc = allFiles.filter(function (f) {
      return splitPath(f.path).branch === 'main' && f.path === docPath;
    })[0];

    // 描かずにやめたとき・開けなかったときに戻すため、前に開いていた文書を控える
    var prev = { fileId: current.fileId, docFileId: current.docFileId, docPath: current.docPath };
    // 遅れて届いた返事が、そのあとに開いた文書を上書きしないように見分ける
    var still = latest('doc');

    current.docPath = docPath;
    current.docFileId = doc ? doc.fileId : fileId;
    current.fileId = fileId;

    titleEl.textContent = docPath;
    renderVersionSelect();

    // 開きかけた文書をいまの文書として残さない。残すと本文のタブで空の本文が出る。
    // あとから別の文書を開いていたら、そちらのものなので触らない
    function restore() {
      if (!still()) return;
      current.fileId = prev.fileId;
      current.docFileId = prev.docFileId;
      current.docPath = prev.docPath;
      renderVersionSelect();
      updateCrumbs();
    }

    call('apiGetFileHtml', [fileId], function (res) {
      // 返事が届くまでに別の文書・版を開き直していたら描かない。描くと、別の文書の
      // 本文がいまの題名の下に出る
      if (!still() || current.fileId !== fileId) return;
      // リンクから開いたときは、返事を待つあいだに人が移った先を奪わない
      if (opts && opts.since !== undefined && navCount !== opts.since) {
        restore();
        return;
      }
      openLink.href = res.url;
      renderIntoViewer(res.html);
      loadLinkedIssues(fileId);
      setDocMode('view');
      refreshStatus();
      switchTab('content');
      // switchTab は全画面を抜けるので、そのあとで入る
      if (opts && opts.full) setDocFull(true);
      prefetchAppUrl();
    }, function (err) {
      restore();
      failSnack('開けませんでした: ')(err);
    });
  }

  /**
   * 全画面と「リンクをコピー」は、本文を読んでいるときだけ出す。
   * 直すモードには全画面を出さない (全画面のあいだは上の操作が隠れて、保存できない)。
   */
  function syncDocViewBtns() {
    var show = !!current.fileId && currentTab === 'content' && !viewer.hidden;
    docFullBtn.hidden = !show;
    docLinkBtn.hidden = !show;
  }

  /**
   * 文書の全画面を出し入れする。
   *
   * **ブラウザの Fullscreen API は使わない。** Apps Script の Web アプリは
   * iframe の中で動き、`allow="fullscreen"` が無いので断られる。body に
   * `doc-full` を付け、CSS で周りを隠して本文を広げる。
   *
   * @param {boolean} on
   */
  function setDocFull(on) {
    if (on && docFullBtn.hidden) return;
    // 右のペインと引き出しは全画面で隠れる。開いたまま隠すと、最初の Esc が
    // 見えないものを閉じるだけになる
    if (on && !sidePanel.hidden) closeSide();
    if (on && sidebarEl.classList.contains('drawer-open')) setNavDrawer(false);
    document.body.classList.toggle('doc-full', on);
    // 押した状態 (aria-pressed) は持たせない。字が「全画面を閉じる」に変わるので、
    // 両方あると読み上げが「全画面を閉じる 押されています」と二重になる
    docFullBtn.textContent = '';
    docFullBtn.appendChild(makeIcon(on ? 'shrink' : 'expand'));
    docFullBtn.appendChild(document.createTextNode(on ? '全画面を閉じる' : '全画面'));
    docFullBtn.title = on ? 'Esc でも閉じます' : '';
    // 本文 (sandbox の iframe) に入った Esc は外へ届かない。閉じるボタンに置いておく
    if (on) docFullBtn.focus();
  }

  /**
   * 全画面で開くリンク。この Web アプリの URL に ?doc=…&full=1 を付ける。
   *
   * @param {string} base apiAppUrl
   * @param {string} fileId
   * @returns {string}
   */
  function docFullLink(base, fileId) {
    return base + (base.indexOf('?') < 0 ? '?' : '&') +
      'doc=' + encodeURIComponent(fileId) + '&full=1';
  }

  /** この Web アプリの URL。変わらないので1回だけ尋ねる */
  var appUrl = '';
  var appUrlAsked = false;

  /**
   * 文書を開いたときに URL を先に尋ねておく。
   *
   * **押してから尋ねると写せない。** ブラウザは押した操作の中でしか書き込みを
   * 許さず、サーバの返事を待ったあとでは断られて、毎回「選んで写す」欄になる。
   */
  function prefetchAppUrl() {
    if (appUrl || appUrlAsked) return;
    appUrlAsked = true;
    call('apiAppUrl', [], function (url) {
      appUrl = String(url || '');
    }, function (err) {
      // 次に開いたとき、または押したときに尋ね直す
      appUrlAsked = false;
      failQuiet('リンクの URL は押したときに尋ね直せる')(err);
    });
  }

  /** 写せなかったとき・写せないときに、選んで写せる欄にリンクを出す */
  function showDocLinkRow(link) {
    docLinkRow.textContent = '';
    docLinkRow.appendChild(makeCopyRow('全画面で開くリンク。選んで写してください', link));
    docLinkRow.hidden = false;
  }

  /**
   * いま見ている版を全画面で開くリンクを写す。書き込みは押した操作の中で
   * 同期に呼ぶ。URL がまだ届いていなければ、尋ねてから欄に出す (返事のあとに
   * 書き込もうとしても断られるので試さない)。
   */
  function copyDocLink() {
    var fileId = current.fileId;
    if (!fileId) return;

    if (appUrl) {
      var link = docFullLink(appUrl, fileId);
      var clip = window.navigator.clipboard;
      if (!clip || !clip.writeText) { showDocLinkRow(link); return; }
      clip.writeText(link).then(function () {
        showSnack('コピーしました', { kind: 'ok' });
      }, function () {
        // 返事を待つあいだに別の文書へ移っていたら出さない
        if (current.fileId === fileId) showDocLinkRow(link);
      });
      return;
    }

    call('apiAppUrl', [], function (url) {
      appUrl = String(url || '');
      if (!appUrl) {
        showSnack('この画面の URL が分からず、リンクを作れませんでした', { kind: 'ng' });
        return;
      }
      if (current.fileId === fileId) showDocLinkRow(docFullLink(appUrl, fileId));
    }, failSnack('リンクを作れませんでした: '));
  }

  /**
   * 開いた URL の ?doc=…&full=1 から文書を開く。
   *
   * 文書の一覧に**ある fileId のときだけ**開く。一覧は開いた人に見えるものだけ
   * なので、見られない文書や登録されていない id は開かずにホームのまま知らせる。
   *
   * @param {Object<string, string>} p google.script.url.getLocation の parameter
   */
  function openFromLink(p, since) {
    var fileId = String((p && p.doc) || '');
    if (!fileId) return;
    var wantFull = String(p.full || '') === '1';
    var docStill = latestSoFar('doc');

    function go() {
      // 一覧を待つあいだに人が別の画面へ移った・別の文書を開いたなら、そちらを奪わない
      if (navCount !== since || !docStill()) return;
      var f = allFiles.filter(function (x) { return x.fileId === fileId; })[0];
      if (!f) {
        showSnack('この文書は見られないか、登録されていません', { kind: 'ng' });
        return;
      }
      // 改訂版の作業コピーでも、題名は正式版の名前 (openDoc がそれで版を並べる)
      openDoc(f.fileId, splitPath(f.path).path, { full: wantFull, since: navCount });
    }
    function ng() {
      if (navCount !== since || !docStill()) return;
      // 文書の一覧の欄はホームでは見えないので、帯で知らせる
      showSnack('文書の一覧を取れず、リンクの文書を開けませんでした', { kind: 'ng' });
    }
    // 起動のときに尋ねた一覧の返事を待つ (同じものを2回尋ねない)
    whenStartupFiles(go, ng);
  }

  /** 起動のときに尋ねた文書の一覧の返事。null は待っているあいだ */
  var startupFiles = { ok: null, waiters: [] };

  function settleStartupFiles(ok) {
    startupFiles.ok = ok;
    var waiters = startupFiles.waiters;
    startupFiles.waiters = [];
    waiters.forEach(function (w) { (ok ? w.ok : w.ng)(); });
  }

  function whenStartupFiles(ok, ng) {
    if (startupFiles.ok === true) ok();
    else if (startupFiles.ok === false) ng();
    else startupFiles.waiters.push({ ok: ok, ng: ng });
  }

  /**
   * この文書が持つ版を選択肢にする。正式版を先頭に置く。
   */
  function renderVersionSelect() {
    branchSelect.textContent = '';

    var versions = allFiles.filter(function (f) {
      return splitPath(f.path).path === current.docPath;
    });

    versions.sort(function (a, b) {
      return splitPath(a.path).branch === 'main' ? -1 : 1;
    });

    versions.forEach(function (f) {
      var branch = splitPath(f.path).branch;
      var opt = document.createElement('option');
      opt.value = f.fileId;
      opt.textContent = branchLabel(branch);
      if (f.fileId === current.fileId) opt.selected = true;
      branchSelect.appendChild(opt);
    });
  }

  function refreshStatus() {
    var asked = current.fileId;
    call('apiFileStatus', [asked], function (st) {
      // 別の版へ移っていたら捨てる。古い headSha を持つと、記録が「HEADが
      // 進んでいます」で断られ、版の表示も前の文書のものになる
      if (current.fileId !== asked) return;
      current.headSha = st.headSha;
      current.branch = st.branch;

      branchChip.textContent = branchLabel(st.branch);
      branchChip.hidden = false;
      dirtyBadge.hidden = !st.dirty;

      var isOfficial = st.branch === 'main';
      commitBtn.hidden = isOfficial || !st.dirty;
      stashBtn.hidden = !isOfficial || !st.dirty;
    }, failQuiet('状態表示の失敗は致命的ではない'));
  }

  // ===== 本文: 読む / 直す =====

  /**
   * 本文の見せ方を切り替える。
   *
   * 「直す」は文書に対する動作であってビューではないため、タブにしない。
   *
   * @param {string} mode 'view' | 'edit'
   */
  function setDocMode(mode) {
    var editing = mode === 'edit';

    modeViewBtn.setAttribute('aria-pressed', String(!editing));
    modeEditBtn.setAttribute('aria-pressed', String(editing));

    viewer.hidden = editing;
    if (!editing) showEditorSkeleton(false);
    editorEl.hidden = !editing;
    editSaveBtn.hidden = !editing;

    if (editing) loadEditor();
    else editHint.textContent = '';
    syncDocViewBtns();
  }

  /**
   * 編集欄の骨組みを出し入れする。
   *
   * @param {boolean} on
   */
  function showEditorSkeleton(on) {
    var existing = document.getElementById('editor-skeleton');
    if (existing) existing.remove();

    editorEl.hidden = on;
    if (!on) return;

    var wrap = document.createElement('div');
    wrap.id = 'editor-skeleton';
    wrap.style.flex = '1';
    showSkeleton(wrap, 'list', 6);
    editorEl.parentNode.appendChild(wrap);
  }

  function loadEditor() {
    if (!current.fileId) return;

    editorEl.value = '';
    editorEl.disabled = true;
    editSaveBtn.disabled = true;
    showEditorSkeleton(true);
    var asked = current.fileId;

    google.script.run
      .withSuccessHandler(function (res) {
        // 別の版へ移っていたら入れない。入れると、別の文書の中身を直すことになる
        if (current.fileId !== asked) return;
        showEditorSkeleton(false);
        editorEl.value = res.markdown;
        // 保存のときに添える。開いたあとで Docs で直された分を上書きしないため
        editorBaseSha = res.baseSha || '';
        editorEl.disabled = !res.editable;
        editSaveBtn.disabled = !res.editable;
        editHint.textContent = res.editable
          ? '保存しても記録はされません。記録は上の「変更を記録」から'
          : OFFICIAL + 'は直接なおせません。改訂版を作って直してください';
      })
      .withFailureHandler(function (err) {
        showEditorSkeleton(false);
        editorEl.value = '';
        editHint.textContent = 'エラー: ' + err.message;
      })
      .apiGetMarkdown(current.fileId);
  }

  function saveEditor() {
    editSaveBtn.disabled = true;
    editHint.textContent = '保存中…';

    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.baseSha) editorBaseSha = res.baseSha;
        editSaveBtn.disabled = false;
        editHint.textContent = '保存しました';
        refreshStatus();
      })
      .withFailureHandler(function (err) {
        editSaveBtn.disabled = false;
        editHint.textContent = '';
        showSnack(err.message, { kind: 'ng' });
      })
      .apiSaveMarkdown(current.fileId, editorEl.value, editorBaseSha);
  }

  function doCommit() {
    openInlineForm(
      '変更を記録する',
      [{ name: 'message', label: 'この変更をひとことで', required: true }],
      '記録する',
      function (v) {
        commitBtn.disabled = true;
        call('apiCommit', [current.fileId, v.message, current.headSha], function () {
          commitBtn.disabled = false;
          showSnack('変更を記録しました', { kind: 'ok' });
          refreshStatus();
          loadOverview();
        }, failEnable(commitBtn, '記録できませんでした: '));
      }
    );
  }

  function stashMainDrift() {
    openConfirmStrip(
      panelContent,
      OFFICIAL + 'を直接なおした分を、退避用の記録として残します。',
      '退避する',
      doStash
    );
  }

  function doStash() {
    stashBtn.disabled = true;
    call('apiStashMainDrift', [current.fileId], function () {
      stashBtn.disabled = false;
      showSnack('直接編集を退避しました', { kind: 'ok' });
      refreshStatus();
    }, failEnable(stashBtn));
  }

  function loadLinkedIssues(fileId) {
    linkedIssuesEl.textContent = '';
    linkedIssuesEl.hidden = true;

    call('apiIssuesForFile', [fileId], function (list) {
      if (current.fileId !== fileId) return;
      var issues = list || [];
      if (!issues.length) return;
      issues.forEach(function (issue) {
        var chip = document.createElement('span');
        chip.className = 'linked-issue';
        chip.textContent = 'やること #' + issue.number + ' ' + issue.title;
        linkedIssuesEl.appendChild(chip);
      });
      linkedIssuesEl.hidden = false;
    }, failQuiet('知らせなくてよい'));
  }

  // ===== 改訂の履歴 =====

  /**
   * 変更の記録の系統を描く。
   *
   * 版ごとに縦の列を持ち、分かれた地点まで線を通す。線が無いと、
   * どの記録がどの版のものか読めない。
   *
   * @param {object} row
   * @param {number} laneCount
   * @returns {SVGElement}
   */
  function makeGraphCell(row, laneCount) {
    var ns = 'http://www.w3.org/2000/svg';
    var step = 14;
    var height = 44;
    var width = Math.max(1, laneCount) * step + 6;

    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'graph-cell');
    svg.setAttribute('width', String(width));
    svg.setAttribute('height', String(height));
    svg.setAttribute('aria-hidden', 'true');

    function x(lane) { return lane * step + step / 2 + 2; }

    row.activeLanes.forEach(function (lane) {
      var line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', String(x(lane)));
      line.setAttribute('x2', String(x(lane)));
      line.setAttribute('y1', '0');
      line.setAttribute('y2', String(height));
      line.setAttribute('class', 'graph-line lane-' + (lane % 4));
      svg.appendChild(line);
    });

    // 合流してくる枝を、上の縁からこの行の点まで寄せる。
    // 線の色は寄ってくる枝のもの。真上の縦線と続いて見える
    (row.forkFrom || []).forEach(function (lane) {
      var from = x(lane);
      var to = x(row.lane);
      var mid = height / 2;

      var path = document.createElementNS(ns, 'path');
      path.setAttribute('d',
        'M' + from + ' 0' +
        ' C' + from + ' ' + (mid * 0.8) + ' ' + from + ' ' + mid + ' ' + to + ' ' + mid);
      path.setAttribute('class', 'graph-line lane-' + (lane % 4));
      path.setAttribute('fill', 'none');
      svg.appendChild(path);
    });

    var dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', String(x(row.lane)));
    dot.setAttribute('cy', String(height / 2));
    dot.setAttribute('r', row.merge ? '5' : '4');
    dot.setAttribute('class',
      'graph-dot lane-' + (row.lane % 4) + (row.merge ? ' merge' : ''));
    svg.appendChild(dot);

    return svg;
  }

  /**
   * 差分を画面いっぱいに広げる / 元に戻す。
   *
   * 長い条文は横も縦も足りない。読むあいだだけ履歴の一覧を退かせる。
   *
   * @param {boolean} on
   */
  function setDiffFull(on) {
    diffPane.classList.toggle('full', on);
    diffExpandBtn.setAttribute('aria-pressed', String(on));

    diffExpandBtn.textContent = '';
    diffExpandBtn.appendChild(makeIcon(on ? 'shrink' : 'expand'));
    diffExpandBtn.title = on ? '元の大きさに戻す (Esc)' : '画面いっぱいに広げる';
    diffExpandBtn.setAttribute('aria-label', diffExpandBtn.title);
  }

  function loadHistory() {
    if (!current.fileId) return;

    showSkeleton(historyList, 'graph', 6);
    diffView.textContent = '';

    var asked = current.fileId;
    call('apiCommitGraph', [asked], function (result) {
      if (current.fileId !== asked) return;
      var graph = result || { rows: [], laneCount: 1 };
      historyList.textContent = '';

      if (!graph.rows.length) {
        historyList.appendChild(makeBlankState(
          'まだ記録がありません',
          '本文を直して「変更を記録」を押すと、ここに残ります。'
        ));
        return;
      }

      // 系統の列幅を見出しと行で揃える。ずれると読み手が列を追えない
      var laneWidth = Math.max(1, graph.laneCount) * 14 + 6;
      document.getElementById('graph-pane')
        .style.setProperty('--graph-w', laneWidth + 'px');

      var headOf = {};
      graph.rows.forEach(function (c) {
        if (!headOf[c.branch]) headOf[c.branch] = c.sha;
      });

      graph.rows.forEach(function (c) {
        var btn = document.createElement('button');
        btn.className = 'commit-item graph-row';
        btn.appendChild(makeGraphCell(c, graph.laneCount));

        var desc = document.createElement('div');
        desc.className = 'graph-col-desc';

        if (headOf[c.branch] === c.sha) {
          var label = document.createElement('span');
          label.className = 'branch-label lane-' + (c.lane % 4);
          label.appendChild(makeIcon('git-branch'));
          label.appendChild(document.createTextNode(branchLabel(c.branch)));
          desc.appendChild(label);
        }

        var msg = document.createElement('span');
        msg.className = 'commit-message';
        msg.textContent = c.message;
        desc.appendChild(msg);
        btn.appendChild(desc);

        var date = document.createElement('span');
        date.className = 'graph-col-date';
        date.textContent = new Date(c.timestamp).toLocaleString('ja-JP', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
        });
        btn.appendChild(date);

        var author = document.createElement('span');
        author.className = 'graph-col-author';
        author.textContent = personName(c.author);
        btn.appendChild(author);

        var sha = document.createElement('span');
        sha.className = 'graph-col-sha';
        sha.textContent = String(c.sha).substring(0, 7);
        btn.appendChild(sha);

        btn.addEventListener('click', function () {
          var items = historyList.querySelectorAll('.commit-item');
          for (var i = 0; i < items.length; i++) {
            items[i].setAttribute('aria-current', String(items[i] === btn));
          }
          // 狭めて列を畳んでいても、選んだ記録の素性はここで読める
          diffCaption.textContent = [
            c.message,
            date.textContent,
            String(c.author).replace(/@.*$/, ''),
            String(c.sha).substring(0, 7),
          ].join(' · ');

          showSkeleton(diffView, 'block');
          call('apiCommitDiff', [c.diffFrom || c.parentSha || '', c.sha], function (ops) {
            diffView.textContent = '';
            renderDiffInto(ops || [], diffView, false);
          }, failInto(diffView));
        });

        historyList.appendChild(btn);
      });

      historyList.firstChild.click();
    }, failInto(historyList));
  }

  // ===== この文書の改訂版 =====

  function loadDrafts() {
    draftListEl.textContent = '';

    var drafts = allFiles.filter(function (f) {
      var s = splitPath(f.path);
      return s.branch !== 'main' && s.path === current.docPath;
    });

    if (!drafts.length) {
      draftListEl.appendChild(makeBlankState(
        'この文書の改訂版はありません',
        OFFICIAL + 'をコピーして改訂版を作ると、正式版に影響を与えずに直せます。',
        { label: 'この文書の改訂版を作る', onClick: createDraft }
      ));
      return;
    }

    drafts.forEach(function (f) {
      var branch = splitPath(f.path).branch;

      var row = document.createElement('div');
      row.className = 'row-item';

      var open = document.createElement('button');
      open.className = 'row-open';
      open.appendChild(makeIcon('git-branch'));

      var title = document.createElement('span');
      title.className = 'row-title';
      title.textContent = branch;
      open.appendChild(title);

      open.addEventListener('click', function () {
        openDoc(f.fileId, current.docPath);
      });
      row.appendChild(open);
      row.appendChild(makeFileLink(f.type, f.fileId));

      draftListEl.appendChild(row);
    });
  }

  function createDraft() {
    if (!current.docFileId) {
      showSnack('先に文書を選んでください', { kind: 'ng' });
      return;
    }

    openInlineForm(
      'この文書の改訂版を作る',
      [{ name: 'name', label: '改訂版の名前 (例: 第7条の見直し)。/ と \\ は使えません', required: true }],
      '作る',
      function (v) {
        call('apiBranchCreate', [v.name, current.docFileId], function () {
          showSnack('改訂版「' + v.name + '」を作りました', { kind: 'ok' });
          loadFiles(function () {
            loadDrafts();
            renderVersionSelect();
          });
          loadOverview();
        }, failSnack('作れませんでした: '));
      }
    );
  }

  // ===== 改訂中の版 (横断) =====

  function loadBranches() {
    // 捨てたあとにも取り直すので、先に頼んだぶんの返事で捨てた版を描き戻さない
    var still = latest('branches');
    showSkeleton(branchListEl, 'list', 3);

    call('apiBranchList', [], function (list) {
      if (!still()) return;
      var branches = list || [];
      branchListEl.textContent = '';

      var drafts = branches.filter(function (b) { return b.name !== 'main'; });
      if (!drafts.length) {
        branchListEl.appendChild(makeBlankState(
          '改訂中の版はありません',
          '文書を開いて「この文書の改訂版」から作れます。'
        ));
        return;
      }

      drafts.forEach(function (b) {
        var row = document.createElement('div');
        row.className = 'row-item';

        var main = document.createElement('div');
        main.className = 'row-main';

        var title = document.createElement('div');
        title.className = 'row-title';
        title.textContent = b.name;
        main.appendChild(title);

        var files = allFiles.filter(function (f) {
          return splitPath(f.path).branch === b.name;
        });

        var meta = document.createElement('div');
        meta.className = 'row-meta';
        var names = files.map(function (f) { return splitPath(f.path).path; });

        meta.textContent = personName(b.createdBy) +
          (b.state === 'merged' ? ' · 反映済み' : ' · 改訂中') +
          // 1件目の名前だけだと、2件目があることが分からない
          (names.length ? ' · ' + names.join('、') : '');
        main.appendChild(meta);

        // 版そのものを押して中身に入れるようにする。
        // 一覧に並んでいて押せないものは、押せると思って押される
        var open = document.createElement('button');
        open.className = 'row-open';
        open.appendChild(makeIcon('git-branch'));
        open.appendChild(main);
        open.disabled = !files.length;
        open.title = files.length
          ? '「' + b.name + '」の本文を開く'
          : 'この版に文書がありません';
        open.addEventListener('click', function () {
          if (!files.length) return;
          openDoc(files[0].fileId, splitPath(files[0].path).path);
        });
        row.appendChild(open);

        if (b.state !== 'merged') {
          // 1つの改訂で規程と細則の両方を直したい、というのが現実にある。
          // 別々の改訂版に分けると確認依頼も別々になり、片方だけ反映されうる
          var addBtn = document.createElement('button');
          addBtn.className = 'btn';
          addBtn.textContent = '文書を足す';
          hint(addBtn, 'act:branch-add');
          addBtn.addEventListener('click', function () { addToBranch(b.name); });
          row.appendChild(addBtn);

          var prBtn = document.createElement('button');
          prBtn.className = 'btn btn-primary';
          prBtn.textContent = '確認を依頼する';
          prBtn.addEventListener('click', function () { createRequest(b.name); });
          row.appendChild(prBtn);
        }

        var del = document.createElement('button');
        del.className = 'btn btn-danger';
        del.appendChild(makeIcon('trash'));
        // アイコンだけなので、読み上げと吹き出しに名前を持たせる
        del.title = '改訂版「' + b.name + '」を捨てる';
        del.setAttribute('aria-label', del.title);
        del.addEventListener('click', function () {
          openConfirmStrip(panelBranches,
            '改訂版「' + b.name + '」を捨てます。中の変更は元に戻せません。',
            '捨てる',
            function () {
              call('apiBranchDelete', [b.name], function () {
                showSnack('改訂版を捨てました', { kind: 'ok' });
                loadFiles(loadBranches);
                loadOverview();
              });
            });
        });
        row.appendChild(del);

        branchListEl.appendChild(row);
      });
    }, still.only(failInto(branchListEl)));
  }

  /**
   * 改訂版の変更を、正式版に反映してよいか尋ねる。
   *
   * @param {string} branchName
   */
  /**
   * 既にある改訂版に、もう1つ文書を足す。
   *
   * 足せるものだけを選ばせる。入っているものを選べてしまうと、押してから
   * 断られる。**候補はサーバに出させる。** 画面で組むと、足せない理由
   * (Slides は反映できない等) を2か所に書くことになる。
   *
   * @param {string} branchName
   */
  function addToBranch(branchName) {
    call('apiBranchAddable', [branchName], function (list) {
      var docs = list || [];

      if (!docs.length) {
        showSnack('足せる文書がありません', { kind: 'ng' });
        return;
      }

      var choices = docs.map(function (d) { return [d.fileId, d.path]; });

      openInlineForm(
        '「' + branchName + '」に文書を足す',
        [{ name: 'fileId', label: 'どの文書を足すか', choices: choices }],
        '足す',
        function (v) {
          call('apiBranchAddFile', [branchName, v.fileId], function (res) {
            showSnack(splitPath(res.path).path + ' を足しました', { kind: 'ok' });
            loadFiles(loadBranches);
          }, failSnack('足せませんでした: '));
        }
      );
    }, failSnack('候補を取れませんでした: '));
  }

  /**
   * 確認依頼の差分を、文書ごとに出す。
   *
   * 1つの依頼に複数の文書が入るので、**どれの差分なのかを言わずに並べると
   * 読めない。** 1件だけのときは見出しを出さない (自明なので邪魔になる)。
   *
   * @param {object} preview apiPrPreview の返り
   * @param {HTMLElement} host
   */
  function renderPrDiffs(preview, host) {
    var files = preview.files || [];

    if (files.length < 2) {
      renderDiffInto(preview.ops, host, true);
      return;
    }
    host.textContent = '';

    files.forEach(function (one) {
      var head = document.createElement('div');
      head.className = 'diff-file-head';

      var name = document.createElement('span');
      name.className = 'diff-file-name';
      name.textContent = one.path;
      head.appendChild(name);

      // 食い違いがある文書は先に分かるようにする
      if (!one.clean) {
        head.appendChild(makePill(
          '同じ場所が両方で変わっています', 'chip chip-pri-high'));
      }
      host.appendChild(head);

      var box = document.createElement('div');
      host.appendChild(box);
      renderDiffInto(one.ops, box, true);
    });
  }

  /**
   * コードの変更 (unified diff) を描く。
   *
   * 文書の差分の描き方は使い回さない。あちらは HTML の行を「見出し2」の
   * ように読み替えて見せるもので、コードには当てはまらない。**コードは
   * 書いたとおりの字で見せる。** 1バイト違えば別物なのが前提なので、
   * 整形して見せると読み手が判断を誤る。
   *
   * @param {string} text
   * @param {HTMLElement} host
   */
  function renderPatch(text, host) {
    var lines = String(text || '').split('\n');
    var box = document.createElement('div');
    box.className = 'patch';

    lines.forEach(function (line) {
      var row = document.createElement('div');
      var head = line.charAt(0);
      var kind = 'ctx';

      if (line.indexOf('@@') === 0) kind = 'hunk';
      else if (line.indexOf('+++') === 0 || line.indexOf('---') === 0) kind = 'file';
      else if (head === '+') kind = 'add';
      else if (head === '-') kind = 'del';

      row.className = 'patch-line patch-' + kind;
      // 他人が書いたコードを出すので、字としてだけ置く
      row.textContent = line === '' ? ' ' : line;
      box.appendChild(row);
    });
    host.appendChild(box);
  }

  /**
   * 確認依頼に添えられたコードの変更を出す。
   *
   * **この道具はコードを反映しない。** 読んで決めるためのものなので、
   * そう書いてある断りを必ず添える。書いていないと「承認したのに入って
   * いない」になる。
   *
   * @param {object} pr
   * @param {HTMLElement} host
   */
  function renderPrPatches(pr, host) {
    host.textContent = '';

    var note = document.createElement('div');
    note.className = 'side-note';
    note.textContent = 'コードの変更は、この道具では反映されません。' +
      '読んで確かめるためのもので、実際に入れるのは手元の git です。';
    host.appendChild(note);

    call('apiPrPatches', [pr.number], function (list) {
      var rows = list || [];

      if (!rows.length) {
        host.appendChild(makeBlankState(
          'コードの変更はありません',
          '手元から「agent patch <確認依頼の番号> <ファイル>」で添えられます。'
        ));
        return;
      }

      rows.forEach(function (one) {
        var head = document.createElement('div');
        head.className = 'diff-file-head';

        var name = document.createElement('span');
        name.className = 'diff-file-name mono';
        name.textContent = one.path;
        head.appendChild(name);

        head.appendChild(makePill(
          '+' + one.added + ' −' + one.removed, 'patch-stat'));

        var who = document.createElement('span');
        who.className = 'row-meta';
        who.textContent = personName(one.by) +
          (one.at ? ' · ' + tokyoDay(one.at) : '');
        head.appendChild(who);

        host.appendChild(head);
        renderPatch(one.text, host);
      });
    }, failInto(host));
  }

  /**
   * 手元への頼みごとを出す。
   *
   * この道具から手元へ向かう経路は Drive の同期だけで、**押すのではなく
   * 取りに来る形**である。まだ取られていないものは「待っています」と出す。
   * 「送りました」と書くと、すぐ動くと思われる。
   *
   * @param {object} pr
   * @param {HTMLElement} host
   */
  function renderPrWork(pr, host) {
    host.textContent = '';

    call('apiOutboxList', [''], function (list) {
      var mine = (list || []).filter(function (w) {
        return Number(w.prNumber) === Number(pr.number);
      });

      if (!mine.length) {
        host.appendChild(makeBlankState(
          '手元への頼みごとはありません',
          '承認すると「取り込んでください」が自動で置かれます。'
        ));
      }

      mine.forEach(function (w) {
        var row = document.createElement('div');
        row.className = 'row-item';

        var main = document.createElement('div');
        main.className = 'row-main';

        var title = document.createElement('div');
        title.className = 'row-title';
        title.textContent = w.label || w.verb;
        main.appendChild(title);

        var meta = document.createElement('div');
        meta.className = 'row-meta';
        meta.textContent = w.note;
        main.appendChild(meta);

        if (w.result) {
          var said = document.createElement('div');
          said.className = 'row-meta';
          said.textContent = '手元から: ' + w.result;
          main.appendChild(said);
        }
        row.appendChild(main);

        row.appendChild(makePill(workStateLabel(w.state),
          'state state-' + workStateClass(w.state)));

        host.appendChild(row);
      });

      var note = document.createElement('div');
      note.className = 'side-note';
      // 「送りました」と書くと、すぐ動くと思われる
      note.textContent = '頼みごとは手元から取りに来る形です。' +
        '手元で作業する人が「agent work」を実行したときに届きます。';
      host.appendChild(note);

      var ask = document.createElement('div');
      ask.className = 'pr-actions';
      ask.appendChild(makeAskButton(pr, host));
      host.appendChild(ask);
    }, failInto(host));
  }

  /**
   * 手元に頼む入口を作る。
   *
   * 頼めることはサーバに出させる (`apiOutboxVerbs`)。画面に写すと、動詞を
   * 足したときに「選べるのに置けない」ものが出る。
   *
   * @param {object} pr
   * @param {HTMLElement} host 頼んだあとに描き直す器
   * @returns {HTMLElement}
   */
  function makeAskButton(pr, host) {
    var btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '手元に頼む';
    hint(btn, 'act:ask-work');

    btn.addEventListener('click', function () {
      call('apiOutboxVerbs', [], function (list) {
        var verbs = (list || []).filter(function (v) {
          // 取り込みは承認したときに自動で置かれる。手で二重に頼ませない
          return v[0] !== 'merge';
        });

        if (!verbs.length) {
          showSnack('頼めることがありません', { kind: 'ng' });
          return;
        }

        openInlineForm(
          '手元に頼む: 確認依頼 #' + pr.number,
          [
            { name: 'verb', label: '何を頼むか', choices: verbs },
            { name: 'note', label: '一言 (任意)', multiline: true },
          ],
          '頼む',
          function (v) {
            call('apiOutboxAdd',
              [v.verb, { branch: pr.sourceBranch, against: pr.targetBranch },
                { prNumber: pr.number, note: v.note }],
              function () {
                showSnack('頼みごとを置きました', { kind: 'ok' });
                renderPrWork(pr, host);
              }, failSnack('頼めませんでした: '));
          },
          btn
        );
      }, failSnack('頼めることを取れませんでした: '));
    });
    return btn;
  }

  /**
   * @param {string} state
   * @returns {string}
   */
  function workStateLabel(state) {
    return {
      open: '待っています', taken: '手元で進行中',
      done: '終わりました', failed: 'できませんでした',
    }[String(state)] || String(state);
  }

  /**
   * @param {string} state
   * @returns {string}
   */
  function workStateClass(state) {
    return {
      open: 'open', taken: 'approved', done: 'merged', failed: 'closed',
    }[String(state)] || 'open';
  }

  function createRequest(branchName) {
    // 改訂版は複数の文書を持てる。**1つ目だけ送ってはいけない。** 残りは
    // 確認も反映もされないまま、直したつもりで置き去りになる
    var paths = allFiles
      .filter(function (f) { return splitPath(f.path).branch === branchName; })
      .map(function (f) { return splitPath(f.path).path; });

    if (!paths.length) {
      showSnack('対象の文書が見つかりません', { kind: 'ng' });
      return;
    }

    var docs = [];
    paths.forEach(function (path) {
      var main = allFiles.filter(function (f) {
        return splitPath(f.path).branch === 'main' && f.path === path;
      })[0];
      if (main) docs.push(main);
    });

    if (docs.length !== paths.length) {
      showSnack(OFFICIAL + 'の文書が見つかりません', { kind: 'ng' });
      return;
    }

    /*
     * 反映先。既定は正式版だが、別の改訂版にも出せる。長い改訂を分けて
     * 進めるとき、途中の版に先に取り込めないと待ち行列ができる。
     *
     * ただし**この改訂版の文書を全部持っている版だけ**を出す。1つでも
     * 欠けている版に出すと、反映のときに作業コピーが見つからず落ちる
     */
    var have = {};
    allFiles.forEach(function (f) {
      var parts = splitPath(f.path);
      if (parts.branch === 'main') return;

      if (!have[parts.branch]) have[parts.branch] = {};
      have[parts.branch][parts.path] = true;
    });

    var targets = [['main', OFFICIAL]];
    for (var name in have) {
      if (!Object.prototype.hasOwnProperty.call(have, name)) continue;
      if (name === branchName) continue;

      var all = true;
      for (var i = 0; i < paths.length; i++) {
        if (!have[name][paths[i]]) all = false;
      }
      if (all) targets.push([name, name]);
    }

    var fields = [
      { name: 'title', label: '何を変えたか', required: true },
      { name: 'body', label: '補足 (任意)', multiline: true },
      { name: 'into', label: 'どこに反映するか', choices: targets },
    ];

    var form = openInlineForm(
      '確認を依頼する: ' + branchName,
      fields,
      '確認を依頼する',
      function (v) {
        var ids = docs.map(function (d) { return d.fileId; });

        call('apiPrCreate', [v.title, v.body, branchName, ids, v.into],
          function () {
            showSnack('確認を依頼しました', { kind: 'ok' });
            switchTab('pulls');
            loadOverview();
          }, failSnack('依頼できませんでした: '));
      }
    );

    // 何が一緒に出るのかを先に見せる。1件のときは自明なので出さない
    if (docs.length > 1) {
      var note = document.createElement('div');
      note.className = 'side-note';
      note.textContent = 'この依頼には ' + docs.length + '件の文書が入ります: ' +
        docs.map(function (d) { return d.path; }).join(' / ');
      form.insertBefore(note, form.firstChild);
    }

    if (targets.length < 2) {
      // 選びようが無いときに選択肢を見せても、迷わせるだけ
      form.querySelector('select').parentNode.hidden = true;
    }
  }

  function bulkCommit() {
    bulkCommitBtn.disabled = true;

    call('apiBranchList', [], function (branches) {
      bulkCommitBtn.disabled = false;

      var drafts = branches.filter(function (b) {
        return b.name !== 'main' && b.state !== 'merged';
      });

      if (!drafts.length) {
        showSnack('改訂中の版がありません');
        return;
      }
      collectDirty(drafts.map(function (b) { return b.name; }));
    }, failEnable(bulkCommitBtn));
  }

  /**
   * 記録していない変更を集めてから、まとめて記録する。
   *
   * 対象は既定ですべて選ぶ。毎回選び直す作業は、ほとんどの場合
   * 「全部」を選ぶだけの手間にしかならない。
   *
   * @param {string[]} branchNames
   */
  function collectDirty(branchNames) {
    var pending = branchNames.length;
    var files = [];

    branchNames.forEach(function (name) {
      google.script.run
        .withSuccessHandler(function (dirty) {
          files = files.concat(dirty);
          if (--pending === 0) askBulkCommit(files);
        })
        .withFailureHandler(function () {
          if (--pending === 0) askBulkCommit(files);
        })
        .apiDirtyFiles(name);
    });
  }

  function askBulkCommit(files) {
    if (!files.length) {
      showSnack('記録していない変更はありません');
      return;
    }

    var checks = [];
    var list = document.createElement('div');
    list.className = 'bulk-list';

    files.forEach(function (f) {
      var row = document.createElement('label');
      row.className = 'bulk-row';

      var box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = true;
      box.value = f.fileId;
      checks.push(box);
      row.appendChild(box);

      var name = document.createElement('span');
      name.textContent = f.path;
      row.appendChild(name);

      list.appendChild(row);
    });

    var form = openInlineForm(
      'まとめて記録する',
      [{ name: 'message', label: files.length + '件の変更をまとめて記録', required: true }],
      '記録する',
      function (v) {
        var ids = checks.filter(function (c) { return c.checked; })
          .map(function (c) { return c.value; });

        if (!ids.length) {
          showSnack('対象が選ばれていません', { kind: 'ng' });
          return;
        }

        call('apiCommitMany', [ids, v.message], function (res) {
          var text = res.committed.length + '件記録しました';
          if (res.failed.length) {
            text += ' / ' + res.failed.length + '件できませんでした: ' +
              res.failed[0].path + ' ' + res.failed[0].error;
          }
          showSnack(text, { kind: res.failed.length ? 'ng' : 'ok' });
          loadOverview();
        });
      }
    );
    form.insertBefore(list, form.querySelector('.inline-form-actions'));
  }

  // ===== 確認依頼 =====

  function stateLabel(state) {
    return {
      open: '確認待ち', approved: '承認済み',
      merged: '反映済み', closed: '取り下げ',
    }[state] || state;
  }

  /**
   * 確認依頼の一覧を出し、1件を開く。
   *
   * **返事の時点で、最後に頼んだ一覧か・まだこの画面かを見る。** 見ないと、
   * ホームから #3 を開いたあとに届いた一覧の返事が先頭の #1 を開き直していた。
   *
   * @param {number} [selectNumber] 先頭の代わりに開く依頼の番号
   */
  function loadPulls(selectNumber) {
    var still = latest('pulls');
    showSkeleton(prListEl, 'list', 4);
    prDetail.textContent = '';

    call('apiPrList', [], function (list) {
      if (!still() || panelPulls.hidden) return;
      var prs = list || [];
      var pick = null;
      prListEl.textContent = '';

      if (!prs.length) {
        prListEl.appendChild(makeBlankState(
          '確認依頼はありません',
          '改訂版を直したら「改訂中の版」から確認を依頼してください。'
        ));
        return;
      }

      prs.forEach(function (pr) {
        var btn = document.createElement('button');
        btn.className = 'row-item';

        var main = document.createElement('div');
        main.className = 'row-main';

        var title = document.createElement('div');
        title.className = 'row-title';
        title.textContent = '#' + pr.number + ' ' + pr.title;
        main.appendChild(title);

        var meta = document.createElement('div');
        meta.className = 'row-meta';
        meta.textContent = pr.sourceBranch + ' → ' + branchLabel(pr.targetBranch) +
          ' · ' + personName(pr.author);

        if (pr.reviewers && pr.reviewers.length) {
          meta.appendChild(document.createTextNode(' · 確認 '));
          meta.appendChild(makeAvatars(pr.reviewers));
        }
        main.appendChild(meta);

        // 他の一覧と同じ器に入れる。入れないとこの行だけ背が低くなる
        var open = document.createElement('span');
        open.className = 'row-open';
        open.appendChild(makeIcon('clipboard-check'));
        open.appendChild(main);
        btn.appendChild(open);

        var state = document.createElement('span');
        state.className = 'state state-' + pr.state;
        state.textContent = stateLabel(pr.state);
        btn.appendChild(state);

        btn.addEventListener('click', function () {
          var items = prListEl.querySelectorAll('.row-item');
          for (var i = 0; i < items.length; i++) {
            items[i].setAttribute('aria-current', String(items[i] === btn));
          }
          showPrDetail(pr);
        });

        if (selectNumber && Number(pr.number) === Number(selectNumber)) pick = btn;
        prListEl.appendChild(btn);
      });

      if (selectNumber && !pick) showSnack('確認依頼 #' + selectNumber + ' が見つかりません', { kind: 'ng' });
      (pick || prListEl.firstChild).click();
    }, function (err) {
      if (!still()) return;
      failInto(prListEl)(err);
    });
  }

  /**
   * 食い違いの解決を選ばせる。
   *
   * @param {object[]} conflicts
   * @param {HTMLElement} container
   * @returns {function(): string[]}
   */
  function renderConflicts(conflicts, container) {
    var selects = [];

    conflicts.forEach(function (c, i) {
      var block = document.createElement('div');
      block.className = 'conflict-block';

      var head = document.createElement('div');
      head.className = 'conflict-head';
      head.textContent = '同じ場所が両方で変わっています ' + (i + 1) + ' / ' + conflicts.length;
      block.appendChild(head);

      [[OFFICIAL + '側', c.ours], ['改訂版側', c.theirs]].forEach(function (pair) {
        var side = document.createElement('div');
        side.className = 'conflict-side';

        var label = document.createElement('div');
        label.className = 'conflict-label';
        label.textContent = pair[0];
        side.appendChild(label);

        if (!pair[1] || !pair[1].length) {
          var del = document.createElement('div');
          del.className = 'conflict-label';
          del.textContent = '(削除)';
          side.appendChild(del);
        } else {
          pair[1].forEach(function (line) {
            var div = document.createElement('div');
            div.className = 'diff-line';
            div.textContent = line;
            side.appendChild(div);
          });
        }
        block.appendChild(side);
      });

      var choiceWrap = document.createElement('div');
      choiceWrap.className = 'conflict-choice';

      var sel = document.createElement('select');
      [['ours', OFFICIAL + '側を残す'], ['theirs', '改訂版側を採用'],
       ['both', '両方を残す']].forEach(function (opt) {
        var o = document.createElement('option');
        o.value = opt[0];
        o.textContent = opt[1];
        sel.appendChild(o);
      });

      choiceWrap.appendChild(sel);
      block.appendChild(choiceWrap);
      selects.push(sel);

      container.appendChild(block);
    });

    return function () {
      return selects.map(function (s) { return s.value; });
    };
  }

  /**
   * 誰が書いたかを顔と名前で示す見出しを作る。
   *
   * 名前だけの行が縦に積まれると、どれが誰の発言か追いにくい。
   *
   * @param {string} who
   * @param {string} what
   * @returns {HTMLElement}
   */
  function makeCommentHead(who, what) {
    var head = document.createElement('div');
    head.className = 'comment-head';
    head.appendChild(makeAvatar(who));

    var name = document.createElement('span');
    name.className = 'comment-who';
    name.appendChild(makePersonLabel(who));
    head.appendChild(name);

    var note = document.createElement('span');
    note.textContent = what;
    head.appendChild(note);
    return head;
  }

  /**
   * 確認してもらう人の行。
   *
   * 誰に頼んだのかが残らないと、依頼が宙に浮いたまま誰も見ない。
   *
   * @param {object} pr
   * @returns {HTMLElement}
   */
  function makeReviewerRow(pr) {
    var row = document.createElement('div');
    row.className = 'reviewer-row';

    var label = document.createElement('span');
    label.className = 'row-meta';
    label.textContent = '確認してもらう人';
    row.appendChild(label);

    var people = (pr.reviewers || []);
    if (!people.length) {
      var none = document.createElement('span');
      none.className = 'row-meta';
      none.textContent = 'まだ誰にも頼んでいません';
      row.appendChild(none);
    } else {
      people.forEach(function (who) {
        var chip = document.createElement('span');
        chip.className = 'reviewer-chip';
        chip.appendChild(makeAvatar(who));
        chip.appendChild(makePersonLabel(who));
        row.appendChild(chip);
      });
    }

    if (pr.state === 'merged' || pr.state === 'closed') return row;

    var edit = document.createElement('button');
    edit.className = 'icon-btn';
    edit.appendChild(makeIcon('pencil'));
    edit.title = '確認してもらう人を決める';
    edit.setAttribute('aria-label', edit.title);
    edit.addEventListener('click', function () { askReviewers(pr, edit); });
    row.appendChild(edit);
    return row;
  }

  /**
   * 確認してもらう人を入力させる。
   *
   * @param {object} pr
   * @param {HTMLElement} sourceEl
   */
  function askReviewers(pr, sourceEl) {
    var form = openInlineForm(
      '確認してもらう人',
      [{
        name: 'people',
        label: 'メールアドレス (カンマ区切り)',
        placeholder: 'a@example.com, b@example.com',
      }],
      '決める',
      function (v) {
        call('apiPrSetReviewers', [pr.number, String(v.people || '').split(',')], function (list) {
          pr.reviewers = list || [];
          showSnack((pr.reviewers.length || 0) + '人に頼みました', { kind: 'ok' });
          showPrDetail(pr);
        });
      },
      sourceEl
    );

    var input = form.querySelector('input');
    input.value = (pr.reviewers || []).join(', ');
    input.setAttribute('list', 'people-list');
    attachPeopleList(form);
  }

  function renderConversation(pr, container) {
    var first = document.createElement('div');
    first.className = 'comment';
    first.appendChild(makeCommentHead(pr.author, 'が依頼'));

    var body = document.createElement('div');
    body.className = 'comment-body';
    body.textContent = pr.body || '(補足なし)';
    first.appendChild(body);
    container.appendChild(first);

    call('apiPrReviews', [pr.number], function (list) {
      var reviews = list || [];
      var labels = {
        approve: '承認', request_changes: '直してほしい', comment: 'コメント',
      };

      reviews.forEach(function (r) {
        var el = document.createElement('div');
        el.className = 'comment';

        var h = makeCommentHead(r.reviewer,
          (labels[r.state] || r.state) + (r.editedAt ? ' · 直しました' : ''));

        if (r.canEdit) h.appendChild(makeCommentTools(pr, r, el));
        el.appendChild(h);

        if (r.body) {
          var b = document.createElement('div');
          b.className = 'comment-body';
          b.textContent = r.body;
          el.appendChild(b);
        }
        container.appendChild(el);
      });

      container.appendChild(makeCommentForm(pr));
    }, failInto(container));
  }

  /**
   * 自分のコメントを直す / 消す。
   *
   * 他人の発言は動かせない。動かせると、やりとりの記録が信じられなくなる。
   *
   * @param {object} pr
   * @param {object} review
   * @param {HTMLElement} host コメントの器
   * @returns {HTMLElement}
   */
  function makeCommentTools(pr, review, host) {
    var tools = document.createElement('span');
    tools.className = 'comment-tools';

    var edit = document.createElement('button');
    edit.className = 'icon-btn';
    edit.appendChild(makeIcon('pencil'));
    edit.title = 'このコメントを直す';
    edit.setAttribute('aria-label', edit.title);
    edit.addEventListener('click', function () {
      var form = openInlineForm(
        'コメントを直す',
        [{ name: 'body', label: '中身', required: true, multiline: true }],
        '直す',
        function (v) {
          call('apiReviewEdit', [review.id, v.body], function () {
            showSnack('コメントを直しました', { kind: 'ok' });
            showPrDetail(pr);
          });
        },
        host
      );
      form.querySelector('textarea, input').value = review.body || '';
    });
    tools.appendChild(edit);

    var del = document.createElement('button');
    del.className = 'btn btn-danger';
    del.appendChild(makeIcon('trash'));
    del.title = 'このコメントを消す';
    del.setAttribute('aria-label', del.title);
    del.addEventListener('click', function () {
      openConfirmStrip(prDetail,
        'このコメントを消します。元には戻せません。',
        '消す',
        function () {
          call('apiReviewDelete', [review.id], function (msg) {
            showSnack(msg, { kind: 'ok' });
            showPrDetail(pr);
          });
        });
    });
    tools.appendChild(del);
    return tools;
  }

  function makeCommentForm(pr) {
    var form = document.createElement('div');
    form.className = 'comment-form';

    var input = document.createElement('textarea');
    input.placeholder = 'コメントを書く';
    form.appendChild(input);

    var send = document.createElement('button');
    send.className = 'btn btn-primary';
    send.textContent = '書き込む';
    send.addEventListener('click', function () {
      if (!input.value) return;
      send.disabled = true;
      call('apiPrReview', [pr.number, 'comment', input.value],
        function () { showPrDetail(pr); },
        failEnable(send));
    });

    form.appendChild(send);
    return form;
  }

  function renderPrCommits(pr, container) {
    showSkeleton(container, 'list', 3);

    call('apiPrCommits', [pr.number], function (list) {
      var commits = list || [];
      container.textContent = '';
      if (!commits.length) {
        container.textContent = '記録はありません';
        return;
      }

      var paths = {};
      commits.forEach(function (c) { if (c.path) paths[c.path] = true; });
      var multi = Object.keys(paths).length > 1;

      commits.forEach(function (c) {
        var row = document.createElement('div');
        row.className = 'row-item';

        var title = document.createElement('div');
        title.className = 'row-title';
        title.textContent = c.message;
        row.appendChild(title);

        var meta = document.createElement('div');
        meta.className = 'row-meta';
        // 変更セットでは、どの文書の記録かも出す
        meta.textContent = String(c.sha).substring(0, 7) + ' · ' + c.author +
          (multi && c.path ? ' · ' + c.path : '');
        row.appendChild(meta);

        container.appendChild(row);
      });
    }, failInto(container));
  }

  function showPrDetail(pr) {
    // 続けて押したとき、前の依頼の返事で後の依頼の中身を上書きしない
    var still = latest('prDetail');
    showSkeleton(prDetail, 'block');

    call('apiPrPreview', [pr.number], function (preview) {
      if (!still()) return;
      prDetail.textContent = '';

      var head = document.createElement('div');
      head.className = 'pr-title';
      head.textContent = '#' + pr.number + ' ' + pr.title;
      prDetail.appendChild(head);

      var meta = document.createElement('div');
      meta.className = 'row-meta';
      meta.textContent =
        pr.sourceBranch + ' → ' + branchLabel(pr.targetBranch) + ' · ' +
        personName(pr.author) +
        ' · 承認 ' + preview.approvals + '件 · ' +
        (preview.clean ? 'そのまま反映できます' : '同じ場所が両方で変わっています');
      prDetail.appendChild(meta);

      prDetail.appendChild(makeReviewerRow(pr));

      var getChoices = function () { return []; };

      if (preview.problems && preview.problems.length) {
        var warn = document.createElement('div');
        warn.className = 'confirm-strip';
        warn.textContent = '反映できません: ' + preview.problems.join(' / ');
        prDetail.appendChild(warn);
      }

      if (!preview.clean) getChoices = renderConflicts(preview.conflicts, prDetail);

      if (pr.state !== 'merged' && pr.state !== 'closed') {
        var actions = document.createElement('div');
        actions.className = 'pr-actions';

        var approveBtn = document.createElement('button');
        approveBtn.className = 'btn';
        approveBtn.textContent = '承認する';
        hint(approveBtn, 'act:approve');

        // 押せるのに失敗する状態を作らない
        if (currentUser && String(pr.author) === currentUser) {
          approveBtn.disabled = true;
          approveBtn.title = '自分が出した依頼は自分で承認できません';
        }

        approveBtn.addEventListener('click', function () {
          approveBtn.disabled = true;
          call('apiPrReview', [pr.number, 'approve', ''],
            function () { showPrDetail(pr); },
            failEnable(approveBtn));
        });

        var mergeBtn = document.createElement('button');
        mergeBtn.className = 'btn btn-primary';
        mergeBtn.textContent = branchLabel(pr.targetBranch) + 'に反映する';

        if (preview.problems && preview.problems.length) {
          mergeBtn.disabled = true;
          mergeBtn.title = '反映できない内容が含まれています';
        } else if (preview.approvals < 1) {
          mergeBtn.disabled = true;
          // 承認したはずの人に「承認が必要」とだけ出すと首をかしげる
          mergeBtn.title = preview.staleApprovals
            ? '承認のあとに中身が変わっています。もう一度承認してもらってください'
            : '反映には1件以上の承認が必要です';
        }

        // 文書が無くコードの証跡だけなら、書き戻すものが無い。それでも
        // 「読んで進めてよいと決めた」記録は残す
        var docCount = (preview.files || []).length;
        if (!docCount && preview.patchCount) {
          mergeBtn.textContent = '承認を記録する';
        }

        mergeBtn.addEventListener('click', function () {
          var says = docCount
            ? OFFICIAL + 'の文書をこの内容で書き換えます。取り消せません。'
            : '読んで確かめたことを記録します。書き換える文書はありません。';

          // 押したら入っていると思わせない。ここを書かないと
          // 「承認したのに入っていない」になる
          if (preview.patchCount) {
            says += ' コードの変更は反映されません (手元の git で進めてください)。';
          }

          openConfirmStrip(
            prDetail,
            says,
            docCount ? '反映する' : '記録する',
            function () {
              mergeBtn.disabled = true;
              // 見比べたときの指紋を添える。進んでいたら断られる
              call('apiPrMerge', [pr.number, getChoices(), preview.previewSha || ''], function () {
                celebrateProgress('merge', '#' + pr.number + ' を' + OFFICIAL + 'に反映しました');
                loadPulls();
                loadOverview();
              }, failEnable(mergeBtn, '反映できませんでした: '));
            }
          );
        });

        // 取り下げる道。出したあとに思い直せないと、誰も見ない依頼が
        // 開いたまま残り、左の帯の件数が減らない
        var offBtn = document.createElement('button');
        offBtn.className = 'btn';
        offBtn.textContent = '取り下げる';
        hint(offBtn, 'act:pr-close');

        // 押せるのに失敗する状態を作らない。誰が取り下げられるかは
        // サーバが決めている
        if (!pr.canClose) {
          offBtn.disabled = true;
          offBtn.title = '出した本人か、このアプリの管理者だけが取り下げられます';
        }

        offBtn.addEventListener('click', function () {
          openConfirmStrip(
            prDetail,
            '#' + pr.number + ' を取り下げます。' +
            '改訂版そのものは残るので、直した中身は消えません。' +
            'また出したくなったら、改めて依頼できます。',
            '取り下げる',
            function () {
              offBtn.disabled = true;
              call('apiPrClose', [pr.number], function () {
                showSnack('#' + pr.number + ' を取り下げました', { kind: 'ok' });
                loadPulls();
                loadOverview();
              }, failEnable(offBtn, '取り下げられませんでした: '));
            }
          );
        });

        actions.appendChild(approveBtn);
        actions.appendChild(offBtn);
        actions.appendChild(mergeBtn);
        prDetail.appendChild(actions);
      }

      var prTabs = document.createElement('div');
      prTabs.className = 'pr-tabs';
      var prBody = document.createElement('div');

      var views = {
        conversation: function () { renderConversation(pr, prBody); },
        commits: function () { renderPrCommits(pr, prBody); },
        files: function () { renderPrDiffs(preview, prBody); },
        patches: function () { renderPrPatches(pr, prBody); },
        work: function () { renderPrWork(pr, prBody); },
      };

      var tabNames = [
        ['conversation', 'やりとり'], ['commits', '変更の記録'], ['files', '差分'],
      ];
      // 証跡が無い依頼に見出しだけ出すと、空の頁を開かせることになる
      if (preview.patchCount) tabNames.push(['patches', 'コードの変更']);
      // 頼みごとは証跡が無くても出す。「差分を出して」は証跡を作る前に頼む
      tabNames.push(['work', '手元への頼みごと']);

      tabNames.forEach(function (t) {
          var b = document.createElement('button');
          b.className = 'pr-tab';
          b.textContent = t[1];
          b.setAttribute('aria-current', String(t[0] === 'conversation'));
          b.addEventListener('click', function () {
            var all = prTabs.querySelectorAll('.pr-tab');
            for (var i = 0; i < all.length; i++) {
              all[i].setAttribute('aria-current', String(all[i] === b));
            }
            prBody.textContent = '';
            views[t[0]]();
          });
          prTabs.appendChild(b);
        });

      prDetail.appendChild(prTabs);
      prDetail.appendChild(prBody);
      views.conversation();
    }, function (err) {
      if (!still()) return;
      failInto(prDetail)(err);
    });
  }

  // ===== やること =====

  /**
   * やることの見え方を切り替える。
   *
   * 対象は同じで、見せ方だけが違う。GitHub の Projects と同じく、
   * 1つの行き先に複数のビューを持たせる。
   *
   * @param {string} view 'list' | 'board' | 'gantt'
   */
  /**
   * ラベルを小さな札にして並べる。
   *
   * @param {string} labels カンマ区切り
   * @returns {HTMLElement|null}
   */
  /**
   * タグの色を返す。一覧に無いものは既定の色。
   *
   * @param {string} name
   * @returns {string}
   */
  function tagColorOf(name) {
    for (var i = 0; i < tags.length; i++) {
      if (String(tags[i].name) === String(name)) return tags[i].color || 'ink';
    }
    return 'ink';
  }

  /**
   * 「#タグ」の形で書かれた文からタグを取り出す。
   * src/core/Tag.gs の tagParse と同じもの。
   *
   * @param {string} text
   * @returns {string[]}
   */
  function tagParse(text) {
    var re = /#([^\s#,]+)/g;
    var src = String(text || '');
    var seen = {};
    var out = [];
    var m;

    while ((m = re.exec(src)) !== null) {
      if (seen[m[1]]) continue;
      seen[m[1]] = true;
      out.push(m[1]);
    }
    return out;
  }

  /**
   * タグを書く欄を作る。
   *
   * 「#」に続けて書き、空白で区切る。カンマ区切りだと、書いている途中で
   * 今いくつ書いたのかが読み取れない。「#」なら1つ書くたびに形が見える。
   *
   * 「#」を打つと、これまでに使ったタグから候補を出す。自由に書かせると
   * 「会議」「打合せ」「打ち合わせ」が並んで数えられなくなる。
   *
   * @param {string} initial カンマ区切り
   * @returns {{el: HTMLElement, value: function(): string}}
   */
  function makeTagPicker(initial) {
    var wrap = document.createElement('div');
    wrap.className = 'tag-picker';

    var label = document.createElement('label');
    label.className = 'tag-label';
    label.textContent = 'タグ (「#」で書きます。例: #会議 #調査)';
    hint(label, 'field:tags');

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'tag-input';
    input.placeholder = '#';
    input.value = String(initial || '').split(',')
      .map(function (x) { return x.replace(/^\s+|\s+$/g, ''); })
      .filter(function (x) { return !!x; })
      .map(function (x) { return '#' + x; })
      .join(' ');
    if (input.value) input.value += ' ';

    label.appendChild(input);
    wrap.appendChild(label);

    var box = document.createElement('div');
    box.className = 'mention-picker tag-suggest';
    box.hidden = true;
    wrap.appendChild(box);

    var preview = document.createElement('div');
    preview.className = 'tag-chosen';
    wrap.appendChild(preview);

    function close() {
      box.hidden = true;
      box.textContent = '';
    }

    function draw() {
      preview.textContent = '';
      var names = tagParse(input.value);

      if (!names.length) {
        var none = document.createElement('span');
        none.className = 'row-meta';
        none.textContent = 'まだ付いていません';
        preview.appendChild(none);
        return;
      }

      names.forEach(function (name) {
        var pill = document.createElement('span');
        pill.className = 'label-pill tag-' + tagColorOf(name);
        pill.textContent = name;
        preview.appendChild(pill);
      });
    }

    function pick(name, from) {
      var before = input.value.substring(0, from);
      var after = input.value.substring(input.selectionStart);

      input.value = before + '#' + name + ' ' + after;
      input.focus();
      input.selectionStart = input.selectionEnd = (before + '#' + name + ' ').length;
      close();
      draw();
    }

    input.addEventListener('input', function () {
      draw();

      var upto = input.value.substring(0, input.selectionStart);
      var m = /#([^\s#,]*)$/.exec(upto);
      if (!m) return close();

      var want = m[1].toLowerCase();
      var used = tagParse(input.value);
      var hits = tags.filter(function (tag) {
        if (used.indexOf(tag.name) >= 0 && tag.name.toLowerCase() !== want) {
          return false;
        }
        return !want || String(tag.name).toLowerCase().indexOf(want) >= 0;
      }).slice(0, 8);

      if (!hits.length) return close();

      box.textContent = '';
      hits.forEach(function (tag) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mention-option';

        var pill = document.createElement('span');
        pill.className = 'label-pill tag-' + (tag.color || 'ink');
        pill.textContent = tag.name;
        btn.appendChild(pill);

        if (tag.builtin) {
          var note = document.createElement('span');
          note.className = 'row-meta';
          note.textContent = 'よく使うもの';
          btn.appendChild(note);
        }

        btn.addEventListener('click', function () { pick(tag.name, m.index); });
        box.appendChild(btn);
      });
      box.hidden = false;
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !box.hidden) {
        e.stopPropagation();
        close();
      }
    });

    input.addEventListener('blur', function () {
      // 候補を押すより先に閉じてしまわないよう、一拍おく
      window.setTimeout(close, 150);
    });

    draw();
    return { el: wrap, value: function () { return tagParse(input.value).join(','); } };
  }

  function makeLabels(labels) {
    var list = String(labels || '').split(',')
      .map(function (x) { return x.replace(/^\s+|\s+$/g, ''); })
      .filter(function (x) { return !!x; });

    if (!list.length) return null;

    var wrap = document.createElement('span');
    wrap.className = 'labels';

    list.forEach(function (name) {
      var pill = document.createElement('span');
      pill.className = 'label-pill tag-' + tagColorOf(name);
      pill.textContent = name;
      wrap.appendChild(pill);
    });
    return wrap;
  }

  /**
   * 担当者のしるし。頭文字を丸で示す。
   *
   * @param {string} email
   * @returns {HTMLElement}
   */
  /**
   * 画面に出す名前を返す。
   *
   * メールアドレスは目で追いにくく、長い並びの中では全部同じに見える。
   * 登録された名前があればそれを、無ければアドレスの手前を使う。
   *
   * @param {string} email
   * @returns {string}
   */
  function personName(email) {
    var who = String(email || '');
    if (!who) return '';

    return peopleNames[who] || who.split('@')[0];
  }

  /**
   * 名前を主に、アドレスを従にした札を作る。
   *
   * @param {string} email
   * @param {string} [extra] 名前の後ろに添える言葉
   * @returns {DocumentFragment}
   */
  function makePersonLabel(email, extra) {
    var frag = document.createDocumentFragment();
    var who = String(email || '');

    var name = document.createElement('span');
    name.className = 'person-name';
    name.textContent = personName(who) || '担当なし';
    frag.appendChild(name);

    if (who) {
      var addr = document.createElement('span');
      addr.className = 'person-mail';
      addr.textContent = who;
      frag.appendChild(addr);
    }

    if (extra) frag.appendChild(document.createTextNode(extra));
    return frag;
  }

  /**
   * 担当者の顔を並べる。
   *
   * ひとつの仕事を2人で持つことがある。重ねて置き、多いときは残りを
   * 数で示す。
   *
   * @param {string[]|string} people
   * @returns {HTMLElement}
   */
  function makeAvatars(people) {
    var list = Array.isArray(people)
      ? people
      : String(people || '').split(',')
        .map(function (x) { return x.replace(/^\s+|\s+$/g, ''); })
        .filter(function (x) { return !!x; });

    if (!list.length) return makeAvatar('');

    var wrap = document.createElement('span');
    wrap.className = 'avatars';

    list.slice(0, 3).forEach(function (who) { wrap.appendChild(makeAvatar(who)); });

    if (list.length > 3) {
      var more = document.createElement('span');
      more.className = 'avatar more';
      more.textContent = '+' + (list.length - 3);
      attachHint(more, list.slice(3).map(personName).join(' / '));
      wrap.appendChild(more);
    }
    return wrap;
  }

  function makeAvatar(email) {
    var who = String(email || '');
    var name = personName(who);

    var el = document.createElement('span');
    el.className = 'avatar' + (who ? '' : ' none');
    el.textContent = name ? name.charAt(0).toUpperCase() : '?';

    var label = who ? (name + ' (' + who + ')') : '担当なし';
    el.setAttribute('aria-label', label);
    attachHint(el, label);
    return el;
  }

  /**
   * @param {string} view
   * @param {boolean} [quiet] 読み込まない (このあと switchTab が読む)
   * @param {{noSave: boolean}} [opts] noSave: 次に開いたときの見え方として覚えない。
   *   探した結果から置き場へ移ったときに使う。覚えると、以後ずっと置き場で開く。
   *   keepOverdue: 期限切れだけの絞りを残す (改善のヒントから開いたとき)。人が見え方を
   *   切り替えたら外す。残すと、何で絞られているのか分からないまま件数が減って見える
   */
  function setIssueView(view, quiet, opts) {
    issueView = view;
    // 工程表とほかの見え方とで、「?」の行き先が違う
    if (currentTab === 'issues') syncGuideLink();
    if (!(opts && opts.keepOverdue)) setOverdueOnly(false);

    Object.keys(viewBtns).forEach(function (k) {
      viewBtns[k].setAttribute('aria-pressed', String(k === view));
    });

    issueListEl.hidden = view !== 'list';
    boardEl.hidden = view !== 'board';
    ganttEl.hidden = view !== 'gantt';
    tallyEl.hidden = view !== 'tally';
    trashListEl.hidden = view !== 'trash';

    // 捨てたものと集計は、絞り込みや束ね方の対象外
    var plain = view === 'trash' || view === 'tally';
    issueFilterEl.parentNode.hidden = plain;
    issueGroupSel.parentNode.hidden = plain;
    mineBtn.hidden = view === 'trash';
    // 集計と捨てたものには絞りが効かないので出さない
    overdueOnlyBtn.hidden = !overdueOnly || plain;

    document.getElementById('tally-unit-box').hidden = view !== 'tally';
    document.getElementById('gantt-zoom').hidden = view !== 'gantt';
    document.getElementById('gantt-today').hidden = view !== 'gantt';
    // 開いたら今日を見せる。描き直しのたびに送ると、人が送った位置を奪う
    if (view === 'gantt') ganttToToday = true;
    document.getElementById('tally-basis-box').hidden = view !== 'tally';
    document.getElementById('tally-who-box').hidden =
      view !== 'tally' || !tallyScope.isManager;

    if (!(opts && opts.noSave)) {
      try {
        window.localStorage.setItem('issueView', view);
      } catch (e) { /* 保存できなくても切り替えは効く */ }
    }

    if (!quiet) reloadIssueView();
  }

  function reloadIssueView() {
    if (issueView === 'tally') loadTally();
    else if (issueView === 'trash') loadTrash();
    else if (issueView === 'board') loadBoard();
    else if (issueView === 'gantt') loadGantt();
    else loadIssues();
  }

  /**
   * 絞り込みの文字で残すかどうかを決める。
   *
   * 題名・担当・ラベル・番号のどれかに含まれていれば残す。
   *
   * @param {object} issue
   * @returns {boolean}
   */
  /**
   * その人が担当かを見る。
   *
   * @param {object} issue
   * @param {string} who
   * @returns {boolean}
   */
  function hasAssignee(issue, who) {
    var list = issue.assignees ||
      String(issue.assignee || '').split(',')
        .map(function (x) { return x.replace(/^\s+|\s+$/g, ''); });

    return list.indexOf(String(who)) >= 0;
  }

  function matchesFilter(issue) {
    if (mineOnly && !hasAssignee(issue, currentUser)) return false;
    if (overdueOnly && !isOverdueIssue(issue, tokyoToday(new Date()))) return false;

    var q = String(issueFilterEl.value || '').toLowerCase().replace(/^\s+|\s+$/g, '');
    if (!q) return true;

    var hay = ['#' + issue.number, issue.title, issue.assignee, issue.labels]
      .concat(docNamesOf(issue))
      .join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  /**
   * やることに紐づく文書の名前を返す。
   *
   * 人は文書の名前で探すので、番号ではなく名前を絞り込みの対象にする。
   *
   * @param {object} issue
   * @returns {string[]}
   */
  function docNamesOf(issue) {
    var ids = String(issue.linkedFileIds || '').split(',');
    var out = [];

    for (var i = 0; i < ids.length; i++) {
      if (!ids[i]) continue;
      for (var j = 0; j < allFiles.length; j++) {
        if (allFiles[j].fileId !== ids[i]) continue;
        var parts = splitPath(allFiles[j].path);
        if (parts.branch === 'main') out.push(parts.path);
      }
    }
    return out;
  }

  /**
   * 東京の今日 'YYYY-MM-DD'。東京は夏時間が無いので9時間足すだけでよい (homeDateText と同じ)。
   *
   * @param {Date} now
   * @returns {string}
   */
  function tokyoToday(now) {
    return new Date(now.getTime() + 9 * 3600000).toISOString().substring(0, 10);
  }

  /**
   * 期限切れか。今日が期限のものはまだ切れていない (サーバの homeAdvice_ と同じ)。
   *
   * @param {object} issue
   * @param {string} today 'YYYY-MM-DD'
   * @returns {boolean}
   */
  function isOverdueIssue(issue, today) {
    var due = String(issue.dueDate || '').substring(0, 10);
