  // ===== 工程表 =====

  /**
   * 期限つきのやることを時系列の棒で並べる。
   *
   * 配置の計算は src/core/Gantt.js の純関数と同じものをここに写している。
   * google.script.run の往復を増やさないための意図的な重複であり、
   * 片方だけ直すと表示と実体がずれる。
   *
   * @param {object[]} issues
   * @param {Date} today
   * @returns {object}
   */
  /** 目盛りの末尾に足す余白の日数。src/core/Gantt.js と同じ値 */
  var GANTT_TAIL_DAYS = 14;

  /**
   * 予定工数 (人日) を棒の日数に直す。src/core/Gantt.js と同じもの。
   *
   * @param {number|string} planned
   * @returns {number}
   */
  function ganttDaysForEffort(planned) {
    var n = Number(planned);
    if (!n || isNaN(n) || n <= 0) return 1;

    return Math.max(1, Math.round(n));
  }

  /**
   * 予定工数と棒の長さが食い違っているかを見る。
   *
   * @param {number|string} planned
   * @param {number} days
   * @returns {boolean}
   */
  function ganttEffortDiffers(planned, days) {
    return ganttDaysForEffort(planned) !== Math.max(1, Number(days) || 1);
  }

  function ganttLayout(issues, today) {
    var DAY = 24 * 60 * 60 * 1000;

    function startOfDay(value) {
      if (value === null || value === undefined || value === '') return null;
      // src/core/Gantt.js の ganttStartOfDay と同じ。'YYYY-MM-DD' はその土地の日
      var ymd = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value));
      if (ymd) return new Date(Number(ymd[1]), Number(ymd[2]) - 1, Number(ymd[3])).getTime();
      var d = new Date(value);
      if (isNaN(d.getTime())) return null;
      return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    }

    var now = startOfDay(today || new Date());
    var rows = [];
    var from = null;
    var to = null;

    (issues || []).forEach(function (issue) {
      // 開始日を入れていればそれを使う。無ければ作った日を仮の起点にする
      var planned = startOfDay(issue.startDate);
      var start = planned !== null ? planned : startOfDay(issue.createdAt);
      var due = startOfDay(issue.dueDate);
      if (start === null) return;

      var end = (due === null) ? start : Math.max(due, start);
      if (from === null || start < from) from = start;
      if (to === null || end > to) to = end;

      rows.push({
        number: Number(issue.number), title: issue.title, state: issue.state,
        assignee: issue.assignee, hasDue: due !== null,
        hasStart: planned !== null,
        planned: issue.plannedHours, parent: issue.parent,
        overdue: due !== null && String(issue.state) === 'open' && due < now,
        _start: start, _end: end,
      });
    });

    if (!rows.length) return { from: now, to: now, days: 1, todayOffset: 0, rows: [] };

    if (now < from) from = now;
    if (now > to) to = now;

    // 末尾に余白の日を足す。目盛りが最後の期限で終わっていると、棒を
    // 掴んで伸ばそうとしても伸ばす先の列が無く、縮められるだけになる
    to += GANTT_TAIL_DAYS * DAY;

    rows.forEach(function (r) {
      r.offset = Math.round((r._start - from) / DAY);
      r.span = Math.round((r._end - r._start) / DAY) + 1;
      delete r._start;
      delete r._end;
    });

    return {
      from: from, to: to,
      days: Math.round((to - from) / DAY) + 1,
      todayOffset: Math.round((now - from) / DAY),
      rows: rows,
    };
  }

  /**
   * 月ごとの幅を返す。src/core/Gantt.js と同じもの。
   *
   * @param {number} from
   * @param {number} days
   * @returns {Array<{label:string, span:number}>}
   */
  function ganttMonths(from, days) {
    var DAY = 24 * 60 * 60 * 1000;
    var out = [];

    for (var i = 0; i < days; i++) {
      var d = new Date(from + i * DAY);
      var year = d.getFullYear();
      var month = d.getMonth() + 1;
      var last = out.length ? out[out.length - 1] : null;

      if (last && last.year === year && last.month === month) {
        last.span++;
        continue;
      }
      out.push({ year: year, month: month, span: 1, label: year + '年' + month + '月' });
    }
    return out;
  }

  /**
   * 列の位置を日付に直す。src/core/Gantt.js と同じもの。
   *
   * @param {number} from
   * @param {number} offset
   * @returns {string} YYYY-MM-DD
   */
  function ganttDateAt(from, offset) {
    var d = new Date(from + offset * 24 * 60 * 60 * 1000);
    var m = String(d.getMonth() + 1);
    var day = String(d.getDate());
    return d.getFullYear() + '-' +
      (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
  }

  /**
   * やることを束ねる。src/core/Grouping.js と同じもの。
   *
   * @param {object[]} issues
   * @param {string} by
   * @returns {Array<{key:string, label:string, issues:object[]}>}
   */
  function groupIssues(issues, by) {
    var names = {};
    allFiles.forEach(function (f) {
      if (splitPath(f.path).branch === 'main') names[f.fileId] = f.path;
    });

    var order = [];
    var buckets = Object.create(null);  // '__proto__' のような名前も、ただの鍵として持つ

    function put(key, label, issue) {
      // 'constructor' のような名前が Object の持ち物と重なる (src/core/Grouping.js と同じ)
      if (!Object.prototype.hasOwnProperty.call(buckets, key)) {
        buckets[key] = { key: key, label: label, issues: [] };
        order.push(key);
      }
      buckets[key].issues.push(issue);
    }

    (issues || []).forEach(function (issue) {
      if (by === 'none') { put('all', 'すべて', issue); return; }

      if (by === 'assignee') {
        // 2人で持つ仕事は、両方の束に出す。片方にしか出さないと、
        // もう片方の人には自分の仕事が見えなくなる
        var who = issue.assignees ||
          String(issue.assignee || '').split(',')
            .map(function (x) { return x.replace(/^\s+|\s+$/g, ''); })
            .filter(function (x) { return !!x; });

        if (!who.length) {
          put('(未割当)', '担当なし', issue);
          return;
        }
        who.forEach(function (one) { put(one, personName(one), issue); });
        return;
      }

      if (by === 'state') {
        var open = String(issue.state) === 'open';
        put(open ? 'open' : 'closed', open ? '未完了' : '完了', issue);
        return;
      }

      if (by === 'sprint') {
        // 未定の鍵は空 ('(未定)' という名前のスプリントと混ざらない)
        var sprint = String(issue.sprint || '');
        put(sprint, sprint || termIn('{sprint}未定'), issue);
        return;
      }

      if (by === 'label') {
        var added = false;
        String(issue.labels || '').split(',').forEach(function (raw) {
          var label = raw.replace(/^\s+|\s+$/g, '');
          if (!label) return;
          put(label, label, issue);
          added = true;
        });
        if (!added) put('(ラベルなし)', 'ラベルなし', issue);
        return;
      }

      var linked = false;
      String(issue.linkedFileIds || '').split(',').forEach(function (raw) {
        var id = raw.replace(/^\s+|\s+$/g, '');
        if (!id) return;
        put(id, names[id] || id, issue);
        linked = true;
      });
      if (!linked) put('(未紐付け)', '文書に紐づいていない', issue);
    });

    // スプリントは名前の順に並べ、未定は最後に置く (src/core/Grouping.js と同じ)
    if (by === 'sprint') {
      order.sort(function (a, b) {
        if (a === b) return 0;
        if (a === '') return 1;
        if (b === '') return -1;
        return a < b ? -1 : 1;
      });
    }
    return order.map(function (k) { return buckets[k]; });
  }

  /**
   * 棒を掴んで日付を変える。
   *
   * 端を掴めば片側だけ、真ん中を掴めば全体が動く。放したときに保存する。
   * 数字を打ち込むより、期間を見ながら決めるほうが早い。
   *
   * @param {HTMLElement} bar
   * @param {object} row ganttLayout の行
   * @param {object} g ganttLayout の結果
   * @param {number} colWidth 1日の幅
   */
  function makeBarDraggable(bar, row, g, colWidth, hostEl) {
    var mode = null;
    var startX = 0;
    var origin = { offset: row.offset, span: row.span };

    function apply(offset, span) {
      bar.style.gridColumn = (offset + 1) + ' / span ' + Math.max(1, span);
    }

    bar.addEventListener('pointerdown', function (e) {
      var rect = bar.getBoundingClientRect();
      // 月の細かさでは棒が数 px しかない。端の幅を棒に合わせて狭めないと、
      // どこを掴んでも端になり全体を動かせない
      var edge = Math.min(10, rect.width / 4);

      if (e.clientX - rect.left <= edge) mode = 'start';
      else if (rect.right - e.clientX <= edge) mode = 'end';
      else mode = 'move';

      startX = e.clientX;
      origin = { offset: row.offset, span: row.span };
      bar.setPointerCapture(e.pointerId);
      bar.classList.add('dragging');
      e.preventDefault();
      e.stopPropagation();
    });

    bar.addEventListener('pointermove', function (e) {
      if (!mode) {
        // 掴める場所を形で示す
        var rect = bar.getBoundingClientRect();
        var edge = Math.min(10, rect.width / 4);
        var near = e.clientX - rect.left <= edge || rect.right - e.clientX <= edge;
        bar.style.cursor = near ? 'ew-resize' : 'grab';
        return;
      }

      // 1日の幅は細かさで変わる。描いたときの幅で日に直す。
      // 3px 未満は手のぶれとして動かさない (月の細かさでは 2px で半日を超え、1日ずれる)
      var dx = e.clientX - startX;
      var moved = Math.abs(dx) < 3 ? 0 : Math.round(dx / colWidth);

      if (mode === 'move') {
        row.offset = Math.max(0, origin.offset + moved);
        row.span = origin.span;
      } else if (mode === 'end') {
        row.span = Math.max(1, origin.span + moved);
      } else {
        var offset = Math.min(origin.offset + origin.span - 1,
          Math.max(0, origin.offset + moved));
        row.span = origin.span + (origin.offset - offset);
        row.offset = offset;
      }
      apply(row.offset, row.span);
    });

    bar.addEventListener('pointerup', function (e) {
      if (!mode) return;

      var was = mode;
      mode = null;
      bar.classList.remove('dragging');
      bar.releasePointerCapture(e.pointerId);

      // 動かさずに離したなら、押したのだと解して中身を開く
      if (row.offset === origin.offset && row.span === origin.span) {
        if (was === 'move') openIssueByNumber(row.number, hostEl);
        return;
      }

      var patch = { dueDate: ganttDateAt(g.from, row.offset + row.span - 1) };
      if (was !== 'end') patch.startDate = ganttDateAt(g.from, row.offset);

      // 棒の長さは予定工数そのもの。片方だけ変わると数え直しができない。
      // 半日きざみで入れた値は、丸めて同じなら書き換えない
      if (ganttEffortDiffers(row.planned, row.span)) patch.plannedHours = row.span;

      google.script.run
        .withSuccessHandler(function () {
          showSnack('#' + row.number + ' の期間を ' +
            ganttDateAt(g.from, row.offset) + ' 〜 ' + patch.dueDate + ' にしました' +
            (patch.plannedHours ? ' (予定 ' + patch.plannedHours + '人日)' : ''),
            { kind: 'ok' });
          loadGantt();
        })
        .withFailureHandler(function (err) {
          showSnack(err.message, { kind: 'ng' });
          loadGantt();
        })
        .apiIssueUpdate(row.number, patch);
    });
  }

  /**
   * 工程表を今日が見える位置まで横に送る。今日の線を、名前の欄を除いた
   * 見える幅の左から 1/3 に置く。真ん中より左に寄せるのは、これからの
   * 予定のほうを多く見せるため
   */
  function ganttScrollToToday() {
    var chart = ganttEl.querySelector('.gantt');
    if (!chart || !ganttShown) {
      // 描き直しを待っている (骨組みしか無い)。届いて描いたときに送る
      ganttToToday = true;
      return;
    }
    // 隠れている器は幅が 0 で送れない。印を残し、見えてから描いたときに送る
    if (!ganttEl.clientWidth) return;
    ganttToToday = false;

    var nameW = parseFloat(getComputedStyle(chart).getPropertyValue('--gantt-name-w')) || 220;
    var head = chart.querySelector('.gantt-head');
    var gap = (head && parseFloat(getComputedStyle(head).columnGap)) || 0;
    var pad = parseFloat(getComputedStyle(ganttEl).paddingLeft) || 0;
    var view = ganttEl.clientWidth - nameW - gap;
    var col = ganttShown.col;

    ganttEl.scrollLeft = Math.max(0,
      Math.round(pad + ganttShown.today * col + col / 2 - view / 3));
    ganttSyncResizer();
  }

  /**
   * 掴み手を名前の欄の右に合わせる。名前の欄は左に貼り付いているが、掴み手は
   * 工程表と一緒に横へ流れるので、貼り付いたぶんだけ送り返す
   */
  function ganttSyncResizer() {
    var chart = ganttEl.querySelector('.gantt');
    var name = chart && chart.querySelector('.gantt-head .gantt-name');
    if (!name || !ganttResizer) return;

    var shift = Math.round(name.getBoundingClientRect().left - chart.getBoundingClientRect().left);
    ganttResizer.style.transform = shift ? 'translateX(' + shift + 'px)' : '';
  }

  /**
   * 日の見出しの字。週では月曜だけ、月では出さない (月の見出しが残る)。
   * 細い列に毎日の字を詰めると重なって読めない
   *
   * @param {Date} day
   * @returns {string}
   */
  function ganttDayLabel(day) {
    if (ganttZoom === 'month') return '';
    if (ganttZoom === 'week' && day.getDay() !== 1) return '';
    return String(day.getDate());
  }

  /**
   * 今日を左から 1/3 に置けるよう、前後に余白の日を足す。今日が目盛りの端に
   * あると、送れる幅が足りず端に張り付いたままになる。
   * ganttLayout (サーバと画面の両方にある) は変えず、描く側で起点をずらす。
   * 棒の位置と日付への直し (ganttDateAt) は同じ g を使うので食い違わない
   *
   * @param {object} g ganttLayout の結果 (書き換える)
   * @param {number} col 1日の幅
   */
  function ganttPadForToday(g, col) {
    var DAY = 24 * 60 * 60 * 1000;
    var nameW = parseFloat(getComputedStyle(ganttEl).getPropertyValue('--gantt-name-w')) || 220;
    var view = ganttEl.clientWidth - nameW;
    if (view <= 0) return;  // 隠れていて測れない。見えてから描き直したときに足す

    var lead = Math.max(0, Math.ceil((view / 3 - col / 2) / col) - g.todayOffset);
    var tail = Math.max(0, Math.ceil(view * 2 / 3 / col) - (g.days - g.todayOffset));

    g.from -= lead * DAY;
    g.to += tail * DAY;
    g.days += lead + tail;
    g.todayOffset += lead;
    g.rows.forEach(function (r) { r.offset += lead; });
  }

  function loadGantt() {
    // 遅れて届いた古い返事で、新しい描画を上書きしない
    var still = latest('gantt');
    // 描き直しでは、人が送った位置を保つ (中身を消すと 0 に戻る)
    var keepScroll = ganttEl.scrollLeft;
    showSkeleton(ganttEl, 'gantt', 5);
    ganttShown = null;  // 骨組みの間は送れる工程表が無い (「今日」は届いてから送る)
    // 待つ間に人が送ったら、その位置を奪わない
    var waitingScroll = ganttEl.scrollLeft;

    call('apiIssueList', [''], function (list) {
      if (!still()) return;  // もっと新しい読み込みがある
      if (ganttEl.scrollLeft !== waitingScroll) keepScroll = ganttEl.scrollLeft;

      var issues = list || [];
      ganttEl.textContent = '';
      ganttShown = null;

      lastIssues = issues;
      issues = issues.filter(matchesFilter);

      var g = ganttLayout(issues, new Date());
      issueCountEl.textContent = g.rows.length + ' / ' + issues.length + '件';

      if (!g.rows.length) {
        ganttEl.appendChild(makeBlankState(
          'やることがありません',
          '期限を入れたやることが、ここに時系列の棒で並びます。',
          { label: 'やることを作る', onClick: createIssue }
        ));
        return;
      }

      var COL = GANTT_ZOOMS[ganttZoom] || GANTT_ZOOMS.day;
      ganttPadForToday(g, COL);
      var chart = document.createElement('div');
      chart.className = 'gantt';
      chart.dataset.zoom = ganttZoom;
      chart.style.setProperty('--gantt-days', String(g.days));
      chart.style.setProperty('--gantt-col', COL + 'px');

      // 目盛りの週の区切りを、先頭の日から月曜までのずれで合わせる
      var firstDay = new Date(g.from).getDay();
      chart.style.setProperty('--week-offset', String((firstDay + 6) % 7));

      // 上段に月、下段に日を出す。日だけでは何月か分からない
      var monthHead = document.createElement('div');
      monthHead.className = 'gantt-head';

      var monthName = document.createElement('div');
      monthName.className = 'gantt-name';
      monthHead.appendChild(monthName);

      var monthScale = document.createElement('div');
      monthScale.className = 'gantt-scale';

      ganttMonths(g.from, g.days).forEach(function (m) {
        var cell = document.createElement('div');
        cell.className = 'gantt-month';
        cell.style.gridColumn = 'span ' + m.span;
        cell.textContent = m.label;
        monthScale.appendChild(cell);
      });
      monthHead.appendChild(monthScale);
      chart.appendChild(monthHead);

      var head = document.createElement('div');
      head.className = 'gantt-head';

      var headName = document.createElement('div');
      headName.className = 'gantt-name';
      headName.textContent = 'やること';
      head.appendChild(headName);

      var scale = document.createElement('div');
      scale.className = 'gantt-scale';

      for (var d = 0; d < g.days; d++) {
        var day = new Date(g.from + d * 24 * 60 * 60 * 1000);
        var weekend = day.getDay() === 0 || day.getDay() === 6;

        var cell = document.createElement('div');
        cell.className = 'gantt-day' +
          (d === g.todayOffset ? ' today' : '') + (weekend ? ' weekend' : '');
        cell.textContent = ganttDayLabel(day);
        cell.title = day.toLocaleDateString('ja-JP');
        scale.appendChild(cell);
      }
      head.appendChild(scale);
      chart.appendChild(head);

      /*
       * 目盛りと今日の線は、行ごとではなく1枚の下敷きに描く。
       * 行ごとに描くと行間で途切れ、日付を縦にたどれない。
       */
      var rows = document.createElement('div');
      rows.className = 'gantt-rows';

      var grid = document.createElement('div');
      grid.className = 'gantt-grid';
      rows.appendChild(grid);

      if (g.todayOffset >= 0 && g.todayOffset < g.days) {
        var todayLine = document.createElement('div');
        todayLine.className = 'gantt-today';
        todayLine.style.left = 'calc(var(--gantt-col) * ' + g.todayOffset + ')';
        grid.appendChild(todayLine);
      }

      // 行を束ねて見出しを付ける
      var byNumber = {};
      g.rows.forEach(function (r) { byNumber[r.number] = r; });

      groupIssues(issues, issueGroupSel.value).forEach(function (group) {
        var shown = group.issues
          .map(function (i) { return byNumber[i.number]; })
          .filter(function (r) { return !!r; });

        if (!shown.length) return;
        rows.appendChild(makeGroupHead(group.label, shown.length, group.key));
        if (collapsed[group.key]) return;

        shown.forEach(function (r) {
          var row = document.createElement('div');
          row.className = 'gantt-row';
          row.dataset.number = r.number;

          var name = document.createElement('button');
          name.className = 'gantt-name';

          // 親の下にあることを、字下げでも示す
          var depth = depthOf(r.number);
          if (depth) {
            row.classList.add('nested');
            name.style.paddingLeft = (depth * 14 + 8) + 'px';
          }

          name.appendChild(makeAvatars(r.assignee));

          var who = document.createElement('span');
          who.className = 'gantt-title';
          who.textContent = '#' + r.number + ' ' + r.title;
          name.appendChild(who);

          var rel = makeRelationChips(r.number);
          if (rel.childNodes.length) name.appendChild(rel);
          // 名前は3行で切れることがあるので、全文も添える
          name.title = who.textContent + '\n' + (r.assignee || '担当なし');
          name.addEventListener('click', function () {
            openIssueByNumber(r.number, row);
          });
          row.appendChild(name);

          var track = document.createElement('div');
          track.className = 'gantt-track';

          var bar = document.createElement('button');
          bar.className = 'gantt-bar' +
            (String(r.state) === 'closed' ? ' done' : '') +
            (r.overdue ? ' overdue' : '') +
            (r.hasDue ? '' : ' nodue');
          bar.style.gridColumn = (r.offset + 1) + ' / span ' + r.span;
          bar.appendChild(makeAvatars(r.assignee));

          var days = document.createElement('span');
          days.className = 'gantt-days';
          days.textContent = r.span + '人日';
          bar.appendChild(days);
          bar.title = '#' + r.number + ' ' + r.title +
            (r.hasDue ? '' : ' (期限なし)') + (r.overdue ? ' · 期限切れ' : '') +
            ' — 押すと中身を開きます。端を掴むと期限、真ん中を掴むと全体を動かせます';
          track.appendChild(bar);
          makeBarDraggable(bar, r, g, COL, row);

          row.appendChild(track);
          rows.appendChild(row);
        });
      });

      chart.appendChild(rows);

      // 掴み手は1つを使い回す。描くたびに作ると、聞き手が window に積もる
      if (ganttResizer) chart.appendChild(ganttResizer);
      ganttEl.appendChild(chart);

      ganttShown = { today: g.todayOffset, col: COL };
      if (ganttToToday) {
        ganttScrollToToday();
      } else {
        ganttEl.scrollLeft = keepScroll;
        ganttSyncResizer();
      }
    }, function (err) {
      if (still()) failInto(ganttEl)(err);
    });
  }

  /**
   * 細かさを変える。日の幅が変わると今の位置は意味を失うので、今日へ送り直す
   *
   * @param {string} zoom 'day' | 'week' | 'month'
   */
  function setGanttZoom(zoom) {
    if (!Object.prototype.hasOwnProperty.call(GANTT_ZOOMS, zoom)) return;
    ganttZoom = zoom;
    try {
      window.localStorage.setItem('ganttZoom', zoom);
    } catch (e) { /* 覚えられなくても切り替わる */ }
    markGanttZoom();
    ganttToToday = true;
    loadGantt();
  }

  function markGanttZoom() {
    document.querySelectorAll('#gantt-zoom [data-zoom]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.zoom === ganttZoom));
    });
  }


  // ===== 工数の集計 =====

  var TALLY_UNITS = [
    ['week', '週ごと'], ['month', '月ごと'], ['quarter', '四半期ごと'],
    ['half', '半期ごと'], ['year', '年度ごと'],
  ];
  var TALLY_BASES = [
    ['due', '期限で数える'], ['closed', '完了日で数える'], ['start', '開始日で数える'],
  ];

  /**
   * 選択肢を詰める。
   *
   * @param {HTMLSelectElement} sel
   * @param {Array<Array<string>>} pairs
   */
  function fillSelect(sel, pairs, chosen) {
    if (sel.options.length) return;

    pairs.forEach(function (pair) {
      var opt = document.createElement('option');
      opt.value = pair[0];
      opt.textContent = pair[1];
      sel.appendChild(opt);
    });
    if (chosen) sel.value = chosen;
  }

  /**
   * 数を人日として出す。
   *
   * @param {number} n
   * @returns {string}
   */
  function daysText(n) {
    var v = Math.round((Number(n) || 0) * 100) / 100;
    return String(v);
  }

  /**
   * 差の出し方。超えていれば赤、下回っていれば緑。
   *
   * @param {number} diff
   * @returns {HTMLElement}
   */
  function makeDiffCell(diff) {
    var el = document.createElement('span');
    var v = Math.round((Number(diff) || 0) * 100) / 100;

    el.className = 'tally-diff' + (v > 0 ? ' over' : (v < 0 ? ' under' : ''));
    el.textContent = (v > 0 ? '+' : '') + v;
    return el;
  }

  /**
   * 集計を描く。
   *
   * 予定と実績を1件ずつ見ているうちは傾向が分からない。区切りごとに
   * 足し上げ、累計も並べる。
   */
  function loadTally() {
    // 既定は月ごと。週は細かすぎ、四半期は粗すぎて傾向が見えにくい
    fillSelect(tallyUnitSel, TALLY_UNITS, 'month');
    fillSelect(tallyBasisSel, TALLY_BASES, 'due');
    fillTallyWho();

    // 区切りや対象を続けて選び直したとき、前の選び方の集計で上書きしない
    var still = latest('tally');
    showSkeleton(tallyEl, 'list', 3);

    call('apiTallyEffort', [tallyUnitSel.value, tallyBasisSel.value, tallyWhoSel.value], function (result) {
      if (!still()) return;
      var res = result || { periods: [], people: [], total: {}, hidden: 0 };
      tallyEl.textContent = '';
      issueCountEl.textContent = 'チーム全体 ' + res.total.count + '件 / 予定 ' +
        daysText(res.total.planned) + '人日 · 実績 ' +
        daysText(res.total.actual) + '人日';

      if (!res.periods.length) {
        tallyEl.appendChild(makeBlankState(
          '集計できるやることがありません',
          '予定工数か実績工数を入れて、数える日 (期限・完了日・開始日) を' +
          '埋めたものが集まります。'
        ));
        return;
      }

      // 誰に何が見えるかを先に書く。見えている範囲が分からないと、見張られて
      // いるように感じて工数を入れなくなる (透明で控えめな記録ほど受け入れられる)
      var scopeNote = document.createElement('div');
      scopeNote.className = 'tally-visibility row-meta';
      scopeNote.textContent = '見える範囲: チーム全体の合計は誰でも見られます。人ごとの内訳は本人と、' +
        'その人の上長として登録されている人だけが見られます。順位は作っていません。';
      tallyEl.appendChild(scopeNote);
      tallyEl.appendChild(makeTallySummary(res));
      tallyEl.appendChild(makeTallyTable(res));
      tallyEl.appendChild(makePeopleTable(res));

      if (res.hidden) {
        var scope = document.createElement('div');
        scope.className = 'tally-note row-meta';
        scope.textContent = '人ごとの内訳に出るのは自分' +
          (tallyScope.isManager ? 'と配下の人' : '') +
          'のぶんだけです。ほかの' + res.hidden +
          '件は全体の合計にだけ入っています。';
        tallyEl.appendChild(scope);
      }

      if (res.skipped) {
        var note = document.createElement('div');
        note.className = 'tally-note tally-skipped row-meta';
        note.textContent = res.skipped + '件は、数える日が空のため入っていません。' +
          '「数え方」を変えると入ることがあります。';
        tallyEl.appendChild(note);
      }
    }, still.only(failInto(tallyEl)));
  }

  /**
   * 誰の内訳を見るかの選択肢を詰める。
   *
   * 見てよい人が自分だけなら、選ばせる意味がない。
   */
  function fillTallyWho() {
    if (tallyWhoSel.options.length) return;

    var pairs = [['', '見られる人ぜんぶ']];
    (tallyScope.canSee || []).forEach(function (who) {
      pairs.push([who, who === tallyScope.me
        ? '自分 (' + personName(who) + ')' : personName(who)]);
    });

    fillSelect(tallyWhoSel, pairs, '');
  }

  /**
   * 全体の合計。まず結論を出す。
   *
   * @param {object} res
   * @returns {HTMLElement}
   */
  function makeTallySummary(res) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-summary';

    [['予定', daysText(res.total.planned) + '人日'],
     ['実績', daysText(res.total.actual) + '人日'],
     ['差', null],
     ['件数', res.total.count + '件']].forEach(function (pair) {
      var box = document.createElement('div');
      box.className = 'tally-card';

      var label = document.createElement('div');
      label.className = 'row-meta';
      label.textContent = pair[0];
      box.appendChild(label);

      var value = document.createElement('div');
      value.className = 'tally-value';

      if (pair[1] === null) value.appendChild(makeDiffCell(res.total.diff));
      else value.textContent = pair[1];

      box.appendChild(value);
      wrap.appendChild(box);
    });
    return wrap;
  }

  /**
   * 区切りごとの表。累計も並べる。
   *
   * @param {object} res
   * @returns {HTMLElement}
   */
  function makeTallyTable(res) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-block';

    var head = document.createElement('h3');
    head.textContent = '区切りごと (チーム全体)';
    wrap.appendChild(head);

    var scroll = document.createElement('div');
    scroll.className = 'tally-scroll';

    var table = document.createElement('table');
    table.className = 'tally-table';

    var thead = document.createElement('thead');
    var hr = document.createElement('tr');
    ['区切り', '予定', '実績', '差', '累計予定', '累計実績', '件数']
      .forEach(function (name) {
        var th = document.createElement('th');
        th.textContent = name;
        hr.appendChild(th);
      });
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    res.periods.forEach(function (p) {
      var tr = document.createElement('tr');

      var name = document.createElement('th');
      name.scope = 'row';
      name.textContent = p.label;
      tr.appendChild(name);

      [daysText(p.sum.planned), daysText(p.sum.actual), null,
       daysText(p.cumulative.planned), daysText(p.cumulative.actual),
       String(p.sum.count)].forEach(function (text) {
        var td = document.createElement('td');
        if (text === null) td.appendChild(makeDiffCell(p.sum.diff));
        else td.textContent = text;
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    scroll.appendChild(table);
    wrap.appendChild(scroll);
    return wrap;
  }

  /**
   * 人ごとの表。区切りを横に並べる。
   *
   * @param {object} res
   * @returns {HTMLElement}
   */
  function makePeopleTable(res) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-block';

    var head = document.createElement('h3');
    head.textContent = '人ごと';
    hint(head, 'tally:people');
    wrap.appendChild(head);

    var scroll = document.createElement('div');
    scroll.className = 'tally-scroll';

    var table = document.createElement('table');
    table.className = 'tally-table';

    var thead = document.createElement('thead');
    var hr = document.createElement('tr');

    var corner = document.createElement('th');
    corner.textContent = '担当者';
    hr.appendChild(corner);

    res.periods.forEach(function (p) {
      var th = document.createElement('th');
      th.textContent = p.label;
      hr.appendChild(th);
    });

    var last = document.createElement('th');
    last.textContent = '合計';
    hr.appendChild(last);

    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    res.people.forEach(function (person) {
      var tr = document.createElement('tr');

      var name = document.createElement('th');
      name.scope = 'row';
      name.className = 'tally-who';
      var isNone = person.who === '(担当なし)';
      name.appendChild(makeAvatar(isNone ? '' : person.who));
      name.appendChild(isNone
        ? document.createTextNode('担当なし') : makePersonLabel(person.who));
      tr.appendChild(name);

      res.periods.forEach(function (p) {
        var cell = p.byPerson[person.who];
        var td = document.createElement('td');

        if (!cell) {
          td.className = 'tally-empty';
          td.textContent = '—';
        } else {
          td.appendChild(document.createTextNode(
            daysText(cell.planned) + ' / ' + daysText(cell.actual)));
          td.appendChild(makeDiffCell(cell.actual - cell.planned));
        }
        tr.appendChild(td);
      });

      var totalCell = document.createElement('td');
      totalCell.appendChild(document.createTextNode(
        daysText(person.total.planned) + ' / ' + daysText(person.total.actual)));
      totalCell.appendChild(makeDiffCell(person.total.diff));
      tr.appendChild(totalCell);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    scroll.appendChild(table);
    wrap.appendChild(scroll);

    var note = document.createElement('div');
    note.className = 'tally-note row-meta';
    note.textContent = 'それぞれ「予定 / 実績」と、その差です (人日)。' +
      '担当者が複数いる仕事は、頭数で割って数えています。';
    wrap.appendChild(note);
    return wrap;
  }

  // ===== 進捗ボード =====

  var COLUMNS = [
    ['Backlog', 'これから'],
    ['In Progress', '作業中'],
    ['In Review', '確認中'],
    ['Done', '完了'],
  ];

  function loadBoard() {
    // カードを動かすたびに取り直すので、先に頼んだぶんの返事で新しい板を描き直さない
    var still = latest('board');
    showSkeleton(boardEl, 'board');

    // 絞り込みに使うため、やることの中身も持っておく
    if (!lastIssues.length) {
      call('apiIssueList', [''],
        still.only(function (list) { lastIssues = list || []; }),
        failQuiet('知らせなくてよい'));
    }

    call('apiProjectBoard', [], function (result) {
      if (!still()) return;
      // 描くときに列を絞り込むので、写しを控える (言葉の表し方が変わったら写しから描き直す)
      lastBoard = JSON.stringify(result || {});
      renderBoard(result);
    }, still.only(failInto(boardEl)));
  }

  /** 最後に届いた apiProjectBoard の返り (JSON の字)。まだ無ければ '' */
  var lastBoard = '';

  /**
   * 進捗ボードを描く。
   *
   * @param {object} result apiProjectBoard の返り (中を書き換える)
   */
  function renderBoard(result) {
    var board = result || {};
    COLUMNS.forEach(function (c) { board[c[0]] = board[c[0]] || []; });
    boardEl.textContent = '';

    // 絞り込む前の列の長さ。末尾に足す位置は、見えている枚数ではなくこちらで数える
    var fullLen = {};
    COLUMNS.forEach(function (c) { fullLen[c[0]] = board[c[0]].length; });

    // 絞り込みは番号で当てる。カードは中身を全部持っていない
    var keep = null;
    if (String(issueFilterEl.value || '')) {
      keep = {};
      (lastIssues || []).filter(matchesFilter).forEach(function (i) {
        keep[i.number] = true;
      });
      COLUMNS.forEach(function (c) {
        board[c[0]] = board[c[0]].filter(function (card) {
          return keep[card.issueNumber];
        });
      });
    }

    var total = 0;
    COLUMNS.forEach(function (c) { total += board[c[0]].length; });
    issueCountEl.textContent = total + '枚';

    if (total === 0) {
      boardEl.appendChild(makeBlankState(
        'カードがありません',
        'カードは「やること」です。作ると「これから」に並び、' +
        '改訂版や確認依頼に応じて自動で右に動きます。列の「＋」からも足せます。',
        { label: 'やることを作る', onClick: createIssue }
      ));
      // 空でも列は描く。列の「＋」から足せないと、最初の1枚の入口が減る
    }

    COLUMNS.forEach(function (pair) {
      var column = pair[0];

      var col = document.createElement('div');
      col.className = 'board-column';

      var head = document.createElement('h3');
      head.textContent = pair[1] + ' (' + board[column].length + ')';
      // 0 のときは出さない。ポイントを使っていない列に「0pt」が並ぶと、ただの雑音になる
      if (scrumOn() && scrumPointsSum(board[column])) {
        var colPoints = makePill(pointsLabel(scrumPointsSum(board[column])), 'chip group-points');
        colPoints.setAttribute('aria-label', termIn('{points}の合計 ') + scrumPointsSum(board[column]));
        head.appendChild(document.createTextNode(' '));
        head.appendChild(colPoints);
      }
      hint(head, 'board:' + column);

      // 列ごとに、その場でやることを足す。題名だけ打てばその列に入る
      var addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'icon-btn board-add';
      addBtn.appendChild(makeIcon('plus'));
      addBtn.setAttribute('aria-label', pair[1] + ' にやることを足す');
      addBtn.title = pair[1] + ' にやることを足す';
      addBtn.addEventListener('click', function () { openBoardComposer(col, column, pair[1], fullLen[column]); });
      var headRow = document.createElement('div');
      headRow.className = 'board-column-head';
      headRow.appendChild(head);
      headRow.appendChild(addBtn);
      col.appendChild(headRow);

      col.addEventListener('dragover', function (e) {
        e.preventDefault();
        col.classList.add('drop-target');
        // どこに入るかを線で見せる。入る前に分かれば、落とし直さずに済む
        showDropIndicator(col, boardDropIndex(col, e.clientY));
      });
      col.addEventListener('dragleave', function (e) {
        if (e.relatedTarget && col.contains(e.relatedTarget)) return;
        col.classList.remove('drop-target');
        clearDropIndicator();
      });
      col.addEventListener('drop', function (e) {
        e.preventDefault();
        col.classList.remove('drop-target');
        var index = boardDropIndex(col, e.clientY);
        clearDropIndicator();

        var issueNumber = Number(e.dataTransfer.getData('text/plain'));
        if (!issueNumber) return;

        // 落とした位置に入れる (以前は列の末尾にしか入らなかった)。絞り込んで
        // いるときは見えている枚数と保存されている並びが食い違うので、
        // 保存されている並びの位置に直してから送る
        call('apiProjectMove', [issueNumber, column, boardSavedIndex(col, index, column, issueNumber, fullLen)],
          function () { loadBoard(); });
      });

      board[column].forEach(function (card) {
        var el = document.createElement('div');
        el.className = 'board-card';
        el.draggable = true;

        var num = document.createElement('span');
        num.className = 'card-number';
        num.textContent = '#' + card.issueNumber;
        el.appendChild(num);

        var title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = card.title;
        el.appendChild(title);

        el.dataset.number = card.issueNumber;
        el.dataset.order = card.order;
        el.dataset.column = column;

        var rel = makeRelationChips(card.issueNumber);
        if (rel.childNodes.length) {
          var relBox = document.createElement('div');
          relBox.className = 'card-rel';
          relBox.appendChild(rel);
          el.appendChild(relBox);
        }

        var cardScrum = makeScrumChips(card);
        if (cardScrum) el.appendChild(cardScrum);

        var labelEls = makeLabels(card.labels);
        if (labelEls) el.appendChild(labelEls);
        applyRot(el, card);

        el.addEventListener('dragstart', function (e) {
          e.dataTransfer.setData('text/plain', String(card.issueNumber));
          // 掴んだカードは位置の数え方から外す (自分の前後に落としても動かない)
          el.classList.add('dragging');
        });
        el.addEventListener('dragend', function () {
          el.classList.remove('dragging');
          clearDropIndicator();
        });

        // 掴んで動かすだけでなく、押して中身を直せるようにする
        el.addEventListener('click', function () {
          openIssueByNumber(card.issueNumber, el);
        });
        el.tabIndex = 0;
        el.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          openIssueByNumber(card.issueNumber, el);
        });

        var foot = document.createElement('div');
        foot.className = 'card-foot';

        var when = document.createElement('span');
        when.className = 'row-meta';
        if (card.dueDate) {
          // 字は札と並べて折り返すので、包んで1つの塊にする
          var due = document.createElement('span');
          due.textContent = '期限 ' + String(card.dueDate).substring(0, 10);
          when.appendChild(due);
        }

        var cardPri = makePriorityChip(card);
        if (cardPri) when.appendChild(cardPri);

        var cardStale = makeStaleBadge(card);
        if (cardStale) when.appendChild(cardStale);
        foot.appendChild(when);
        foot.appendChild(makeAvatars(card.assignees || card.assignee));

        // 一覧と同じく、カードからも捨てられるようにする。
        // 板だけ捨てられないと、捨てるために一覧へ移る手間が要る
        foot.appendChild(makeArchiveButton(
          { number: card.issueNumber, title: card.title }, panelIssues));

        el.appendChild(foot);

        col.appendChild(el);
      });

      boardEl.appendChild(col);
    });
  }

  /**
   * 列の中で、その高さに落としたら何番目に入るか。掴んでいるカードは数えない。
   *
   * @param {HTMLElement} col
   * @param {number} y 画面の縦の位置
   * @returns {number}
   */
  function boardDropIndex(col, y) {
    var cards = [].slice.call(col.querySelectorAll('.board-card:not(.dragging)'));
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) return i;
    }
    return cards.length;
  }

  /**
   * 見えている中での位置を、保存されている並びの位置に直す。
   *
   * 絞り込んでいると見えないカードがあるので、見えている何番目かをそのまま送ると
   * ずれる。落とした先のカードの保存されている番号を使い、末尾なら絞り込む前の
   * 長さを使う。同じ列の中で後ろへ動かすときは、サーバが先に自分を抜くぶん1つ詰める。
   *
   * @param {HTMLElement} col
   * @param {number} index 見えている中での位置
   * @param {string} column
   * @param {number} issueNumber 動かすカード
   * @param {Object<string, number>} fullLen 絞り込む前の列の長さ
   * @returns {number}
   */
  function boardSavedIndex(col, index, column, issueNumber, fullLen) {
    var cards = [].slice.call(col.querySelectorAll('.board-card:not(.dragging)'));
    var dragged = document.querySelector('.board-card[data-number="' + issueNumber + '"]');
    var fromSame = dragged && dragged.dataset.column === column;
    var fromOrder = dragged ? Number(dragged.dataset.order) : -1;
    if (index < cards.length) {
      var target = Number(cards[index].dataset.order);
      return fromSame && fromOrder < target ? target - 1 : target;
    }
    var len = fullLen[column] || 0;
    return fromSame ? len - 1 : len;
  }

  /** 落とす位置の線。1本だけ出す */
  var dropIndicator = document.createElement('div');
  dropIndicator.className = 'drop-indicator';
  dropIndicator.setAttribute('aria-hidden', 'true');

  function showDropIndicator(col, index) {
    var cards = [].slice.call(col.querySelectorAll('.board-card:not(.dragging)'));
    var before = cards[index] || null;
    if (before) col.insertBefore(dropIndicator, before);
    else col.appendChild(dropIndicator);
  }

  function clearDropIndicator() {
    if (dropIndicator.parentNode) dropIndicator.parentNode.removeChild(dropIndicator);
  }

  /**
   * 列の中で、題名だけ打ってやることを足す欄。
   *
   * 右の入力欄を開くまでもない思い付きを、その場で書き留められるようにする。
   * 担当や期限は、足したあとにカードを開いて直す。Enter で足し、Esc でやめる。
   *
   * @param {HTMLElement} col
   * @param {string} column 列の名前 (Backlog など)
   * @param {string} label 列の見出し
   * @param {number} at 列の末尾の位置
   */
  function openBoardComposer(col, column, label, at) {
    var open = col.querySelector('.board-composer');
    if (open) { open.querySelector('input').focus(); return; }

    var form = document.createElement('form');
    form.className = 'board-composer';
    var input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'やることの題名';
    input.setAttribute('aria-label', label + ' に足すやることの題名');
    form.appendChild(input);

    var actions = document.createElement('div');
    actions.className = 'board-composer-actions';
    var cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'btn';
    cancel.textContent = 'やめる';
    var add = document.createElement('button');
    add.type = 'submit';
    add.className = 'btn btn-primary';
    add.textContent = '足す';
    add.disabled = true;
    actions.appendChild(cancel);
    actions.appendChild(add);
    form.appendChild(actions);

    function close() { form.remove(); }
    input.addEventListener('input', function () {
      add.disabled = !input.value.replace(/^\s+|\s+$/g, '');
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
    });
    cancel.addEventListener('click', close);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var title = input.value.replace(/^\s+|\s+$/g, '');
      if (!title) return;
      add.disabled = true;
      call('apiIssueCreate', [title, '', [], '', {}], function (made) {
        function done() {
          showSnack('#' + made.number + ' を ' + label + ' に足しました', { kind: 'ok' });
          loadBoard();
        }
        // 作ると「これから」に入る。ほかの列で足したなら、その列の末尾へ移す
        if (column === 'Backlog' || !made) done();
        else call('apiProjectMove', [made.number, column, at], done, function (err) {
          // 作れてはいる。押せないまま残すと、もう一度作られて2つ並ぶ。閉じて板を描き直す
          close();
          showSnack('#' + made.number + ' は作りましたが、' + label + ' へ移せませんでした (これから に入っています): ' +
            err.message, { kind: 'ng' });
          loadBoard();
        });
      }, failEnable(add, '足せませんでした: '));
    });

    col.insertBefore(form, col.querySelector('.board-column-head').nextSibling);
    input.focus();
  }

  // ===== 前進を見せる (意欲づけ) =====
  //
  // 文献 (docs/superpowers/plans/2026-10-07-motivation.md) に沿う。小さな前進を
  // 日々実感できることがいちばん効く。点数や人ごとの順位は配らない (予告された
  // 報酬は内発的動機を下げ、職場のランキングは晒しと受け取られる)。見せるのは
  // チームの前進と、本人にだけ見える最初の一歩。どれも自分で止められる。

  var homeCardsEl = document.getElementById('home-cards');

  /**
   * 前進の知らせを出すか (本人が決める)。この端末のこのブラウザに覚える。
   * 覚えられないブラウザでも、開いているあいだは止めたことを守る (見た目だけ
   * 変わって知らせが出続けると、止めたのに止まらない)。
   */
  var progressNotesMemory = null;
  function progressNotesOn() {
    if (progressNotesMemory !== null) return progressNotesMemory;
    try { return window.localStorage.getItem('progressNotes') !== 'off'; } catch (e) { return true; }
  }

  /**
   * 終えたとき・反映したときに、何が起きたかを添えて知らせる。
   *
   * 完了では、先に印だけの帯を出し、apiCloseFeedback の返事で「小分けの残り」
   * 「◯週間越し」「大きいもの」「今週チームで何件目か」のどれか1つに差し替える
   * (closeFeedbackText)。ポイントとレベルはオンのときだけ添える。反映では、今週
   * チームで何件を正式版にしたかを添える。人と比べる物差しにはしない。
   *
   * ホームのカードの描き直しは、ホームを開いているときだけ (reloadHomeIfShown)。
   *
   * @param {string} kind 'close' | 'merge'
   * @param {string} text 基本の知らせ
   * @param {number} [number] 完了にしたやること。あれば apiCloseFeedback で添えを求める
   */
  function celebrateProgress(kind, text, number) {
    if (!progressNotesOn()) {
      showSnack(text, { kind: 'ok' });
      reloadHomeIfShown();
      return;
    }
    if (kind === 'close' && number) {
      // 先に印だけの帯を出す。返事を待つあいだも、終えたことはすぐ伝わる
      var firstBar = showSnack(text, { kind: 'ok', mark: {} });
      call('apiCloseFeedback', [number], function (fb) {
        // 帯を差し替えないときも、ホームのあなたの番からは外す
        reloadHomeIfShown();
        // 返事を待つあいだに止められていたら、素の帯のまま
        if (!progressNotesOn() || !fb) return;
        // 閉じられたか、別の帯に替わっていたら、新しいほうを上書きしない
        if (document.getElementById('snackbar') !== firstBar) return;
        var opts = { kind: 'ok', mark: {} };
        if (fb.parent && (fb.kind === 'parentStep' || fb.kind === 'parentDone')) {
          opts.mark = { done: fb.parent.done, total: fb.parent.total };
        }
        if (fb.kind === 'parentDone') {
          opts.action = { label: '#' + fb.parent.number + ' も完了にする', run: function () {
            call('apiIssueClose', [fb.parent.number], function () {
              celebrateProgress('close', '#' + fb.parent.number + ' を完了にしました', fb.parent.number);
              refreshIssueViews();
            });
          } };
        }
        showSnack(closeFeedbackText(text, fb), opts);
        // 帯に出したときだけ「見せた」と伝える。捨てた返事のぶんは次の完了でまた知らせる
        if (fb.levelUp) {
          call('apiGameLevelSeen', [fb.levelUp], null,
            failQuiet('覚えられなくても、次の完了でもう一度知らせるだけ'));
        }
      }, function (err) {
        failQuiet('前進の知らせが出なくても、終えたことは伝わっている')(err);
        reloadHomeIfShown();
      });
      return;
    }
    call('apiProgress', [], function (p) {
      // 返事を待つあいだに止められていたら、素の知らせにする
      if (!progressNotesOn()) {
        showSnack(text, { kind: 'ok' });
        return;
      }
      var more = '';
      if (p && kind === 'merge' && p.weekMerged) more = '。今週チームで ' + p.weekMerged + ' 件を正式版にしました';
      showSnack(text + more, { kind: 'ok' });
      reloadHomeIfShown();
    }, function () {
      // 前進が数えられなくても、終えたこと自体は伝える
      showSnack(text, { kind: 'ok' });
    });
  }

  /**
   * ホームを開いているときだけ、カードとあなたの番を描き直す。ほかの画面で完了に
   * するたびに api を呼ぶことになる。ホームへ戻ったときは loadHome が描き直す。
   * あなたの番も取り直す (取り直さないと、片づけたものが残って見える)。
   */
  function reloadHomeIfShown() {
    if (panelHome.hidden) return;
    loadHomeCards();
    loadHomeSummary();
  }

  /**
   * ポイントを見せる形にする。小数は1桁まで (割り算の端数を 0.9000000000000004 と出さない)。
   *
   * @param {number} x
   * @returns {number}
   */
  function pointWords(x) {
    return Math.round(Number(x || 0) * 10) / 10;
  }

  /**
   * 日数を「3週間」「10日」の言い方にする。
   *
   * @param {number} days
   * @returns {string}
   */
  function spanWords(days) {
    return days >= 14 && days % 7 < 4 ? Math.round(days / 7) + '週間' : days + '日';
  }

  /**
   * 完了したときの帯の文。apiCloseFeedback の返りから組む。
   *
   * @param {string} base 「#3 を完了にしました」
   * @param {object} fb
   * @returns {string}
   */
  function closeFeedbackText(base, fb) {
    var more = '';
    if (fb.kind === 'parentDone') {
      more = '。#' + fb.parent.number + ' ' + fb.parent.title + ' の小分けが全部終わりました';
    } else if (fb.kind === 'parentStep') {
      more = '。#' + fb.parent.number + ' ' + fb.parent.title + ' はあと ' +
        (fb.parent.total - fb.parent.done) + ' つ';
    } else if (fb.kind === 'longAwaited') {
      more = '。' + spanWords(fb.days) + '越しのものが片づきました';
    } else if (fb.kind === 'heavy') {
      more = '。大きいものが1つ終わりました';
    } else if (fb.weekClosed) {
      more = '。今週チームで ' + fb.weekClosed + ' 件目です';
      if (fb.goal && fb.monthClosed === fb.goal) more += '。今月の目標に届きました';
    }
    if (fb.points) more += ' (+' + pointWords(fb.points) + ')';
    if (fb.levelUp) more += '。レベル ' + fb.levelUp + ' になりました';
    return base + more;
  }

  /** 自分まわりに置く、前進の知らせの切り替え */
  function makeProgressToggle() {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'progress-toggle';
    btn.className = 'btn toggle-btn';
    btn.textContent = '前進の知らせを出す';
    setToggle(btn, progressNotesOn());
    attachHint(btn, '完了や反映のときに「今週チームで何件目か」を添えます。ホームのチームの前進とはじめの5歩もここで出し入れします。' +
      'この端末のこのブラウザにだけ覚えます');
    btn.addEventListener('click', function () {
      var on = !progressNotesOn();
      // 覚えられたらブラウザの値に従う (別のタブで切り替えても揃う)。覚えられない
      // ブラウザでだけ、開いているあいだのメモで守る
      try {
        window.localStorage.setItem('progressNotes', on ? 'on' : 'off');
        progressNotesMemory = null;
      } catch (e) {
        progressNotesMemory = on;
      }
      setToggle(btn, on);
      loadHomeCards();
    });
    return btn;
  }

  // 別のタブで切り替えたら、このタブのカードも揃える
  window.addEventListener('storage', function (e) {
    if (e.key === 'progressNotes') loadHomeCards();
  });

  /** ホームの「チームの前進」と「はじめの5歩」 */
  function loadHomeCards() {
    if (!homeCardsEl) return;
    if (!progressNotesOn()) {
      homeCardsEl.textContent = '';
      homeLine.today = null;
      renderHomeLine();
      return;
    }
    // 前進が取れなければ描かない。ほかの4つは、どれが取れなくても空で補って描く
    // (任意のカード1枚のために、ホーム全体を消さない)
    call('apiProgress', [], function (p) {
      var got = {};
      var names = [
        ['apiMyMilestones', 'steps', [], 'はじめの5歩が出なくても使える'],
        ['apiMyToday', 'today', [], '今日の一覧が出なくても使える'],
        ['apiGameState', 'game', { enabled: false }, 'ポイントが出なくても使える'],
        ['apiGameTop', 'top', [], '週の上位が出なくても使える'],
        // 取れなかったときは null のまま渡す。控えのひな形は使わず、今の形 (✅今日) で写す
        ['apiReportParts', 'report', null, '日報の形が取れなくても今の形で写せる']
      ];
      var left = names.length;
      names.forEach(function (n) {
        function done(v) {
          got[n[1]] = v || n[2];
          left -= 1;
          if (left > 0) return;
          // 返事を待つあいだに止められていたら描かない
          if (!progressNotesOn()) return;
          renderHomeCards(p || {}, got.steps, got.today, got.game, got.top, got.report);
        }
        var quiet = failQuiet(n[3]);
        call(n[0], [], done, function (err) { quiet(err); done(null); });
      });
    }, function (err) {
      failQuiet('前進が出なくても使える')(err);
      homeLine.today = null;
      renderHomeLine();
    });
  }

  function renderHomeCards(p, steps, today, game, top, report) {
    homeCardsLast = [p, steps, today, game, top, report];
    homeCardsEl.textContent = '';
    // カードはそれぞれ見出しを持つ。まとめの見出しは置かない (同じ形の見出しが重なる)
    homeCardsEl.appendChild(makeTodayCard(today || [], report || null));
    homeLine.today = todayItemsOf(today || [], report || null).length;
    renderHomeLine();
    // 設定が届くまでは描かない (隠した人に一瞬出て、見たレベルまで覚えてしまう)
    var g = prefsSettled && homeCardOn('game') ? makeGameCard(game || {}, top || []) : null;
    if (g) {
      homeCardsEl.appendChild(g);
      // 見せたレベルを覚える。覚えないと、次の完了で同じレベルに「なりました」と言う
      if (game.level > 0) {
        call('apiGameLevelSeen', [game.level], null,
          failQuiet('覚えられなくても、次の完了で一度多く知らせるだけ'));
      }
    }
    if (homeCardOn('team')) homeCardsEl.appendChild(makeTeamProgressCard(p));
    var first = makeFirstStepsCard(steps);
    if (first) homeCardsEl.appendChild(first);
  }

  /**
   * 自分のレベルと、今週の上位3人。オフなら出さない。
   *
   * **上位にいない人に自分の順位を見せない** (「◯位」が下位の印になる)。
   * 自分の今週の点だけを見せる。
   *
   * @param {object} game apiGameState
   * @param {Array} top apiGameTop
   * @returns {HTMLElement|null}
   */
  function makeGameCard(game, top) {
    if (!game.enabled) return null;
    var card = document.createElement('section');
    card.className = 'home-card game-card';
    card.setAttribute('aria-label', 'ポイントとレベル');
    card.appendChild(homeHead('ポイントとレベル'));

    var level = document.createElement('div');
    level.className = 'game-level';
    level.textContent = 'レベル ' + game.level + ' ・ 今週 ' + pointWords(game.week) + ' ・ 次のレベルまで ' +
      pointWords(Math.max(game.nextAt - game.total, 0));
    card.appendChild(level);

    // いまのレベルの中での進み具合を描く。合計 / 次の境目にすると、レベル2で
    // 16/30 = 53% と出て、あと少しに見える (実際は 15 から 30 のうち 1)
    var from = Number(game.levelFrom || 0);
    var span = game.nextAt - from;
    var bar = document.createElement('div');
    bar.className = 'game-level-bar';
    bar.setAttribute('role', 'progressbar');
    bar.setAttribute('aria-label', '次のレベルまでの進み具合');
    bar.setAttribute('aria-valuemin', String(from));
    bar.setAttribute('aria-valuemax', String(game.nextAt));
    bar.setAttribute('aria-valuenow', String(pointWords(Math.max(game.total, from))));
    var fill = document.createElement('span');
    fill.style.width = (span > 0
      ? Math.min(100, Math.max(0, Math.round((game.total - from) / span * 100))) : 0) + '%';
    bar.appendChild(fill);
    card.appendChild(bar);

    if (top.length) {
      var title = document.createElement('div');
      title.className = 'row-meta';
      title.textContent = '今週の上位 (参加している人だけ)';
      card.appendChild(title);
      var list = document.createElement('ol');
      list.className = 'game-top';
      top.forEach(function (r) {
        var li = document.createElement('li');
        if (r.me) li.className = 'is-me';
        li.textContent = r.rank + '. ' + r.name + ' ' + pointWords(r.points);
        list.appendChild(li);
      });
      card.appendChild(list);
    }

    var team = makeGameTeam(game.team);
    if (team) card.appendChild(team);
    var badges = makeGameBadges(game.badges);
    if (badges) card.appendChild(badges);

    var note = document.createElement('p');
    note.className = 'row-meta game-note';
    note.textContent = '片づけたものの重さと、ほかの人の確認依頼への返事で付きます。人事の評価には使いません。' +
      '月曜にゼロから数え直します';
    card.appendChild(note);
    return card;
  }

  /**
   * 先週のチームの合計を、先々週の合計と比べて棒で見せる。**名前は出さない。**
   * 終わった週だけを使う (今週の合計は動くので、読むたびの差で1人の増えた分が見える)。
   * サーバは、見る人のほかに2人いない週を null で返す (引き算でその人の数が見える)。
   * 先週が null なら欄ごと出さず、先々週が null なら先週の合計だけ出して棒は出さない。
   *
   * @param {{lastWeek: (number|null), weekBefore: (number|null)}|null|undefined} team
   * @returns {HTMLElement|null}
   */
  function makeGameTeam(team) {
    function has(v) { return v !== null && v !== undefined && v !== ''; }
    if (!team || !has(team.lastWeek)) return null;
    var week = Number(team.lastWeek) || 0;
    var hasBefore = has(team.weekBefore);
    var before = hasBefore ? (Number(team.weekBefore) || 0) : 0;
    var box = document.createElement('div');
    box.className = 'game-team';
    var head = document.createElement('div');
    head.className = 'row-meta';
    head.textContent = '先週のチーム ' + pointWords(week) + (hasBefore ? ' ・ 先々週 ' + pointWords(before) : '');
    box.appendChild(head);
    if (!hasBefore) return box;

    var bar = document.createElement('div');
    bar.className = 'game-level-bar game-team-bar';
    bar.setAttribute('role', 'progressbar');
    bar.setAttribute('aria-label', '先々週の合計に比べた先週の合計');
    // 先々週が0なら割らない。先週に1つでもあれば満ちたとし、aria も 1/1 にそろえる
    var max = before > 0 ? pointWords(before) : 1;
    var now = before > 0 ? pointWords(Math.min(week, before)) : (week > 0 ? 1 : 0);
    bar.setAttribute('aria-valuemin', 0);
    bar.setAttribute('aria-valuemax', max);
    bar.setAttribute('aria-valuenow', now);
    var fill = document.createElement('span');
    var ratio = before > 0 ? week / before : now;
    fill.style.width = Math.min(100, Math.max(0, Math.round(ratio * 100))) + '%';
    bar.appendChild(fill);
    box.appendChild(bar);
    return box;
  }

  /**
   * 本人の称号。得たものは得た日を添え、まだのものは薄く「あと N 件」と出す (次の目標が見える)。
   *
   * @param {Array<{key: string, label: string, done: boolean, at: string, left: number}>} badges
   * @returns {HTMLElement|null}
   */
  function makeGameBadges(badges) {
    if (!badges || !badges.length) return null;
    var list = document.createElement('ul');
    list.className = 'game-badges';
    list.setAttribute('aria-label', '称号');
    badges.forEach(function (b) {
      var li = document.createElement('li');
      if (b.done) {
        li.className = 'is-done';
        var m = /^\d{4}-(\d{2})-(\d{2})$/.exec(String(b.at || ''));
        li.textContent = b.label + (m ? ' (' + Number(m[1]) + '/' + Number(m[2]) + ')' : '');
      } else {
        li.textContent = b.label + ' ・ あと ' + Number(b.left || 0) + ' 件';
      }
      list.appendChild(li);
    });
    return list;
  }

  /**
   * 自分まわりに置く、週の上位に参加するかの切り替え。既定は不参加。
   *
   * @param {object} state apiGameState
   * @returns {HTMLElement}
   */
  function makeGameJoinToggle(state) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'game-join-toggle';
    btn.className = 'btn toggle-btn';
    btn.textContent = '週の上位に参加する';
    setToggle(btn, !!state.playing);
    btn.addEventListener('click', function () {
      btn.disabled = true;
      var want = btn.getAttribute('aria-checked') !== 'true';
      setToggle(btn, want);
      call('apiGameJoin', [want], function (res) {
        btn.disabled = false;
        // 空の返事ではオフに倒さない。押したとおりに見せておく
        setToggle(btn, res ? !!res.playing : want);
        reloadHomeIfShown();
      }, function (err) {
        setToggle(btn, !want);
        failEnable(btn, '切り替えられませんでした: ')(err);
      });
    });
    return btn;
  }

  /**
   * 日報の「✅今日」の節の形にする。
   *
   * @param {Array<{kind: string, number: number, title: string}>} items
   * @returns {string}
   */
  function todayReportText(items) {
    return ['✅今日'].concat(items.map(function (x) {
      return x.kind === 'pull'
        ? '- 確認依頼 #' + x.number + ' ' + x.title + ' を' + OFFICIAL + 'に反映'
        : '- #' + x.number + ' ' + x.title;
    })).join('\n');
  }

  /** 日報のひな形の控え。**本体はサーバの REPORT_TEMPLATES()**。取れなかったときだけ使う */
  var REPORT_FALLBACK = [
    { key: 'three', name: '3節', body: '✅今日やったこと\n{今日}\n\n📅明日やること\n{明日}\n\n⛔️困っていること\n{困りごと}' },
    { key: 'today', name: '今日だけ', body: '✅今日\n{今日}' },
    { key: 'plain', name: '見出し無し', body: '{今日}' },
  ];

  /**
   * 箇条を1行ずつ `- ` で並べる。無ければ `- 特になし`。
   *
   * @param {Array} items
   * @param {function(object): string} fmt
   * @returns {string}
   */
  function reportLines(items, fmt) {
    return items && items.length ? items.map(fmt).join('\n') : '- 特になし';
  }

  /**
   * 日報の形に中身を当てはめる。**知らない差し込みはそのまま残す** (消すと書いたものが黙って消える)。
   *
   * @param {string} template
   * @param {{today: object[], tomorrow: object[], troubles: object[], date: string, name: string}} parts
   * @returns {string}
   */
  function reportFill(template, parts) {
    var map = {
      '今日': reportLines(parts.today, function (x) {
        return x.kind === 'pull'
          ? '- 確認依頼 #' + x.number + ' ' + x.title + ' を' + OFFICIAL + 'に反映'
          : '- #' + x.number + ' ' + x.title;
      }),
      '明日': reportLines(parts.tomorrow, function (x) {
        return '- #' + x.number + ' ' + x.title +
          (x.due ? ' (期限 ' + Number(x.due.substring(5, 7)) + '/' + Number(x.due.substring(8, 10)) + ')' : '');
      }),
      '困りごと': reportLines(parts.troubles, function (x) { return '- ' + x.title; }),
      '日付': parts.date || '',
      '名前': parts.name || '',
    };
    return String(template).replace(/\{(今日|明日|困りごと|日付|名前)\}/g, function (m, k) { return map[k]; });
  }

  /**
   * いま選んでいる形の本文。自分の形が空なら 3節。
   *
   * @param {{templates: object[], kind: string, custom: string}} report
   * @returns {string}
   */
  function reportTemplateOf(report) {
    if (report.kind === 'custom' && report.custom) return report.custom;
    var list = report.templates && report.templates.length ? report.templates : REPORT_FALLBACK;
    var hit = list.filter(function (t) { return t.key === report.kind; })[0];
    return (hit || list[0]).body;
  }

  /**
   * 今日片づけたものとして並べる一覧。日報の中身が取れたらそちら (並べたものと
   * 写すものを揃える)、取れなければ apiMyToday。上の1行の数もここから数える。
   *
   * @param {Array} items apiMyToday
   * @param {?object} report apiReportParts
   * @returns {Array}
   */
  function todayItemsOf(items, report) {
    return report && report.parts && Array.isArray(report.parts.today) ? report.parts.today : items;
  }

  /**
   * 今日片づけたもの。**本人にだけ見える。** 件数は大きく出さず、題名を並べる
   * (件数を追わせると簡単なものから手を付ける)。
   *
   * 「日報にコピー」は件数に関わらず出す (3節は明日と困りごとだけでも使う)。
   * 日報の中身が取れなかったとき (`report` が null) は、今の形 (✅今日) で写す。
   * 中身が取れたときは、並べるのも `report.parts.today` から (並べたものと写すものを揃える)。
   *
   * @param {Array<{kind: string, number: number, title: string}>} items
   * @param {?{parts: object, templates: object[], kind: string, custom: string}} report apiReportParts
   * @returns {HTMLElement}
   */
  function makeTodayCard(items, report) {
    items = todayItemsOf(items, report);
    var card = document.createElement('section');
    card.className = 'home-card my-today';
    card.setAttribute('aria-label', '今日片づけたもの');
    card.appendChild(homeHead('今日片づけたもの', [privatePill()]));

    if (!items.length) {
      var none = document.createElement('p');
      none.className = 'my-today-none';
      none.textContent = '今日はこれから。片づけたものがここに並びます';
      card.appendChild(none);
    } else {
      var list = document.createElement('ul');
      list.className = 'my-today-list';
      items.forEach(function (x) {
        var li = document.createElement('li');
        li.textContent = (x.kind === 'pull' ? '確認依頼 #' : '#') + x.number + ' ' + x.title;
        list.appendChild(li);
      });
      card.appendChild(list);
    }

    var actions = document.createElement('div');
    actions.className = 'my-today-actions';
    card.appendChild(actions);

    var copy = document.createElement('button');
    copy.type = 'button';
    copy.className = 'btn';
    copy.textContent = '日報にコピー';
    actions.appendChild(copy);

    var pick = null;
    if (report) {
      // 選んだ形と自分の形はこのカードの中で書き換える。返事そのものは触らない
      report = { parts: report.parts || {}, templates: report.templates || [],
        kind: String(report.kind || ''), custom: String(report.custom || '') };
      var choices = (report.templates && report.templates.length ? report.templates : REPORT_FALLBACK)
        .map(function (t) { return [t.key, t.name]; })
        .concat([['custom', '自分の形']]);
      pick = document.createElement('select');
      pick.className = 'report-kind';
      pick.setAttribute('aria-label', '日報の形');
      choices.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c[0];
        opt.textContent = c[1];
        pick.appendChild(opt);
      });
      // 写すのと同じ形を見せる。知らない形と、空の自分の形は 3節 で写るので 3節 を選んでおく
      var known = choices.some(function (c) { return c[0] === report.kind; });
      if (!known || (report.kind === 'custom' && !report.custom)) report.kind = choices[0][0];
      pick.value = report.kind;

      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'btn';
      edit.textContent = '自分の形を直す';
      edit.addEventListener('click', function () { openReportCustomForm(report, pick, edit); });

      pick.addEventListener('change', function () {
        // まだ書いていない自分の形を選んだら、書く欄を開く。選んだだけにすると、
        // 欄は「自分の形」なのに 3節 で写る
        if (pick.value === 'custom' && !report.custom) {
          pick.value = report.kind;
          openReportCustomForm(report, pick, edit);
          return;
        }
        report.kind = pick.value;
        call('apiSetReportKind', [pick.value], null, failSnack('日報の形を覚えられませんでした: '));
      });
      actions.appendChild(pick);
      actions.appendChild(edit);
    }

    copy.addEventListener('click', function () {
      var text = report ? reportFill(reportTemplateOf(report), report.parts) : todayReportText(items);
      // 埋め込みの枠では写せないことがある。そのときは選んで写せる欄を出す
      function fallback() {
        var area = card.querySelector('textarea') || document.createElement('textarea');
        area.readOnly = true;
        area.className = 'my-today-copy';
        area.value = text;
        area.setAttribute('aria-label', '日報に貼る文');
        if (!area.parentNode) card.appendChild(area);
        area.select();
      }
      var clip = window.navigator.clipboard;
      if (!clip || !clip.writeText) { fallback(); return; }
      clip.writeText(text).then(function () {
        showSnack('日報の形で写しました', { kind: 'ok' });
      }, fallback);
    });
    return card;
  }

  /**
   * 自分の形を書く欄。書くたびに、今日の中身を当てはめた見本を下に出す。
   * 保存すると「自分の形」を選んだことにする (書いたのに使われないと迷う)。
   * 選んだことはサーバが同じ1回で覚える (2回に分けると、2回目だけ落ちたとき食い違う)。
   *
   * @param {object} report apiReportParts (書き換える)
   * @param {HTMLSelectElement} pick 形を選ぶ欄
   * @param {HTMLElement} btn 開いたボタン
   */
  function openReportCustomForm(report, pick, btn) {
    var form = openInlineForm('日報の形', [{
      name: 'body',
      label: '形 (使える差し込み: {今日} {明日} {困りごと} {日付} {名前})',
      multiline: true,
      value: report.custom || reportTemplateOf(report),
      note: '2000字まで。知らない {…} はそのまま残ります',
    }], '保存する', function (v) {
      var body = String(v.body || '');
      if (body.length > 2000) {
        showSnack('日報の形は2000字までです (いま ' + body.length + ' 字)', { kind: 'ng' });
        return;
      }
      call('apiSetReportCustom', [body], function (res) {
        report.custom = body;
        // 空の形は選ばれない。自分の形を選んだまま空にしたら先頭の形 (3節) に戻す
        // (サーバも同じ1回でそう覚える)。戻さないと、欄は「自分の形」なのに 3節 で写る
        if (body) report.kind = (res && res.kind) || 'custom';
        else if (report.kind === 'custom') report.kind = pick.options[0].value;
        pick.value = report.kind;
      }, failSnack('日報の形を保存できませんでした: '));
    }, btn);

    var area = form.querySelector('textarea');
    var head = document.createElement('div');
    head.className = 'row-meta';
    head.textContent = '見本 (今日の中身で)';
    var preview = document.createElement('pre');
    preview.className = 'report-preview';
    function show() {
      preview.textContent = reportFill(area.value, report.parts);
      // 送る前に止める。送ってから断ると、欄はもう閉じていて書いたものが消える
      setFieldMessage(area, area.value.length > 2000
        ? '2000字までです (いま ' + area.value.length + ' 字)' : '', 'error');
    }
    area.addEventListener('input', show);
    show();
    var actions = form.querySelector('.inline-form-actions');
    form.insertBefore(head, actions);
    form.insertBefore(preview, actions);
  }

  /**
   * チームの前進。今週の数と、今月の目標までの進み具合。人ごとには出さない。
   *
   * @param {object} p apiProgress の返り
   * @returns {HTMLElement}
   */
  function makeTeamProgressCard(p) {
    var card = document.createElement('section');
    card.className = 'home-card team-progress';
    card.setAttribute('aria-label', 'チームの前進');
    card.appendChild(homeHead('チームの前進'));

    var line = document.createElement('div');
    line.className = 'team-progress-line';
    // 0 件のときに「0 件」と並べると責めているように読める。これからだと伝える
    line.textContent = (p.weekClosed || p.weekMerged)
      ? '今週 ' + (p.weekClosed || 0) + ' 件のやることを終え、' + (p.weekMerged || 0) + ' 件を正式版にしました'
      : '今週はこれからです。終えたやることや正式版にした文書が、ここで数えられます';
    card.appendChild(line);

    if (p.goal) {
      var done = p.monthClosed || 0;
      var pct = Math.min(100, Math.round(done * 100 / p.goal));
      var goal = document.createElement('div');
      goal.className = 'team-goal';
      var label = document.createElement('span');
      label.className = 'row-meta';
      label.textContent = '今月の目標 ' + done + ' / ' + p.goal + ' 件';
      goal.appendChild(label);
      if (done >= p.goal) goal.appendChild(makePill('届きました', 'state state-open', 'check'));
      var bar = document.createElement('div');
      bar.className = 'scrum-progress';
      bar.setAttribute('role', 'progressbar');
      bar.setAttribute('aria-valuemin', '0');
      bar.setAttribute('aria-valuemax', String(p.goal));
      bar.setAttribute('aria-valuenow', String(done));
      bar.setAttribute('aria-label', '今月の目標までの進み具合');
      var fill = document.createElement('span');
      fill.style.width = pct + '%';
      bar.appendChild(fill);
      goal.appendChild(bar);
      card.appendChild(goal);
    }

    if (p.canEditGoal) {
      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'btn team-goal-edit';
      edit.textContent = p.goal ? '目標を直す' : '今月の目標を決める';
      attachHint(edit, 'チームで毎月終えたいやることの件数です。人ごとには割り振りません');
      edit.addEventListener('click', function () {
        openInlineForm('チームの毎月の目標', [
          { name: 'goal', label: '毎月終えたいやることの件数', value: p.goal || '',

        ], '決める', function (v) {

            showSnack('チームの目標を決めました', { kind: 'ok' });

      card.appendChild(edit);

    return card;

  /**
   * はじめの5歩。本人にだけ見える。全部できたら出さない。閉じたら覚える。
   *
   * 数を集めさせる印にはしない (予告された報酬は内発的動機を下げる)。できたことに
   * ✓ を付け、次の一歩の入口を出すだけにする。
   *
   * @param {object[]} steps apiMyMilestones の返り
   * @returns {HTMLElement|null}
   */
  function makeFirstStepsCard(steps) {
    if (!steps.length || steps.every(function (s) { return s.done; })) return null;
    try { if (window.localStorage.getItem('firstStepsHidden') === '1') return null; } catch (e) { /* 覚えていなければ出す */ }

    var card = document.createElement('section');
    card.className = 'home-card first-steps';
    card.setAttribute('aria-label', 'はじめの5歩');

    var doneCount = steps.filter(function (s) { return s.done; }).length;
    var hide = document.createElement('button');
    hide.type = 'button';
    hide.className = 'side-close';
    hide.textContent = '×';
    hide.setAttribute('aria-label', 'はじめの5歩を閉じる');
    hide.addEventListener('click', function () {
      try { window.localStorage.setItem('firstStepsHidden', '1'); } catch (e) { /* 覚えられなくても今は閉じる */ }
      card.remove();
    });
    card.appendChild(homeHead('はじめの5歩 (' + doneCount + ' / ' + steps.length + ')', [privatePill(), hide]));

    var list = document.createElement('ol');
    list.className = 'first-steps-list';
    var nextShown = false;
    steps.forEach(function (step, i) {
      var li = document.createElement('li');
      li.className = 'first-step' + (step.done ? ' is-done' : '');
      var mark = document.createElement('span');
      mark.className = 'scrum-cycle-num';
      mark.setAttribute('aria-hidden', 'true');
      mark.textContent = step.done ? '✓' : String(i + 1);
      li.appendChild(mark);
      var body = document.createElement('span');
      body.className = 'first-step-body';
      var title = document.createElement('strong');
      title.textContent = (step.done ? '済み: ' : '') + step.label;
      body.appendChild(title);
      // 次の一歩だけ、やり方と入口を出す (全部並べると、どれからやるか迷う)
      if (!step.done && !nextShown) {
        nextShown = true;
        li.classList.add('is-next');
        var hint = document.createElement('span');
        hint.className = 'row-meta';
        hint.textContent = step.hint;
        body.appendChild(hint);
        var go = document.createElement('button');
        go.type = 'button';
        go.className = 'btn';
        go.textContent = 'やってみる';
        go.addEventListener('click', function () { switchTab(step.tab); });
        body.appendChild(go);
      }
      li.appendChild(body);
      list.appendChild(li);
    });
    card.appendChild(list);
    return card;
  }

  // ===== キーボード =====
  //
  // よく使う操作は、マウスに手を伸ばさずにできるようにする。字を打っている
  // ところ (入力欄) では効かせない。何が使えるかは「?」で出す。

  var SHORTCUTS = [
    ['Ctrl+K / ⌘K', '文書・やること・確認依頼を探す'],
    ['/', '絞り込みの欄に移る (やることの一覧・ボード)'],
    ['N', 'やることを作る'],
    ['?', 'キーボードで使える操作を出す'],
    ['Esc', '右の欄や小窓を閉じる'],
  ];

  /** キーボードで使える操作の一覧を、右の欄に出す */
  function openShortcutHelp() {
    var box = openSideView('キーボードで使える操作', null);
    var list = document.createElement('dl');
    list.className = 'shortcut-list';
    SHORTCUTS.forEach(function (pair) {
      var dt = document.createElement('dt');
      var kbd = document.createElement('kbd');
      kbd.textContent = pair[0];
      dt.appendChild(kbd);
      list.appendChild(dt);
      var dd = document.createElement('dd');
      dd.textContent = pair[1];
      list.appendChild(dd);
    });
    box.appendChild(list);
  }

  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    var typing = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
    if (typing) return;

    if (e.key === '?') {
      e.preventDefault();
      openShortcutHelp();
    } else if (e.key === '/') {
      e.preventDefault();
      if (panelIssues.hidden) switchTab('issues');
      issueFilterEl.focus();
    } else if (e.key === 'n' || e.key === 'N') {
      e.preventDefault();
      createIssue();
    }
  });

  /** 使い方の絞り込みを外から当てる。loadHelp が組むまでは何もしない */
  var guideFilterApply = function () {};

  /**
   * 使い方を開き、その節へ送る。「?」と探す (Ctrl+K) から呼ぶ。
   *
   * 絞り込みが残っていると開いた節が隠れていることがあるので、外してから送る。
   * 開いた節は数える (スクロールで通り過ぎたものとは違い、読みに来たもの)。
   *
   * @param {string} id GUIDE の id
   */
  function openGuideAt(id) {
    var section = GUIDE.filter(function (g) { return g.id === id; })[0];
    if (!section) { switchTab('help'); return; }
    switchTab('help');
    guideFilterApply('');
    var h = document.getElementById('guide-sec-' + id);
    if (h && h.scrollIntoView) h.scrollIntoView({ block: 'start', behavior: 'smooth' });
    // 読み上げも開いた節から始める。送るのは上で済ませたので、ここでは動かさない
    if (h) h.focus({ preventScroll: true });
    usageCount('view', 'guide-' + id);
  }

  function loadHelp() {
    if (guideEl.dataset.ready) return;

    /*
     * 目次は本文の右に置く。本文は 760px で止まるので、その右は空いている。
     *
     * 左の帯に出していたときは、道具そのものの行き先と混ざって何の目次か
     * 分からず、開くたびに左の並びが動いていた。
     */
    var toc = guideTocEl;
    toc.textContent = '';

    var tocHead = document.createElement('h2');
    tocHead.textContent = 'この頁の中身';
    toc.appendChild(tocHead);

    // 操作は読み物より先に置く。底に置くと、困ったときにしか開かれない
    // 場所に埋もれる
    var top = document.createElement('div');
    top.className = 'guide-foot guide-top';
    makeMeActions().forEach(function (el) { top.appendChild(el); });
    guideEl.appendChild(top);

    // 絞り込みは本文の上に置く。長い頁を送って探させない
    var filterBox = document.createElement('label');
    filterBox.className = 'filter-box guide-filter';
    var filterInput = document.createElement('input');
    filterInput.id = 'guide-filter';
    filterInput.type = 'search';
    filterInput.placeholder = '使い方の中を絞る';
    filterInput.setAttribute('aria-label', '使い方の節を絞り込む');
    filterBox.appendChild(filterInput);
    guideEl.insertBefore(filterBox, top);

    var empty = document.createElement('p');
    empty.className = 'row-meta guide-empty';
    empty.id = 'guide-empty';
    empty.setAttribute('role', 'status');
    empty.textContent = '見つかりません。言葉を変えてみてください';
    empty.hidden = true;
    guideEl.appendChild(empty);

    // 節ごとに 見出し・図・箇条書き と目次の項をまとめて持つ。絞り込みで一緒に隠す
    var guideSections = [];

    /**
     * 目次の項を作る。
     *
     * href の飛び先にはしない。この画面は枠の中で動いているため、
     * 場所が変わると外側の頁ごと動くことがある。押して寄せる
     *
     * @param {object} section GUIDE の1節
     * @param {HTMLElement} target 寄せたい見出し
     * @returns {HTMLElement}
     */
    function addToc(section, target) {
      var btn = document.createElement('button');
      btn.className = 'guide-toc-item';
      btn.dataset.guide = section.id;
      btn.textContent = section.title;
      btn.addEventListener('click', function () {
        target.scrollIntoView({ block: 'start', behavior: 'smooth' });
        // 目次から送った節は「読まれた」と数える。送って通り過ぎたものは数えない
        usageCount('view', 'guide-' + section.id);
      });
      toc.appendChild(btn);
      return btn;
    }

    // 節ごとに、その話の図を先に置く。字だけの説明は読まれない。
    // 全部の節に置いてあるのは、図だけ見て帰れるようにするため。
    // キーは見出しと一字一句同じにする (違うとその節だけ図が消える)
    var figures = {
      'このアプリについて': FLOW_DIAGRAM,
      '言葉の意味': VOCAB_DIAGRAM,
      '基本の流れ': STEPS_DIAGRAM,
      'ホームの見方': HOME_DIAGRAM,
      '文書と工程表の見え方': VIEW_DIAGRAM,
      'はじめての設定 (最初の一人だけ)': SETUP_DIAGRAM,
      '手元から動かす (Claude / Codex)': QUEUE_DIAGRAM,
      'つまずきやすい点': CONFLICT_DIAGRAM,
      '期間で進める (使う人だけ)': SCRUM_DIAGRAM,
      '改善のヒント': ADVICE_DIAGRAM,
      '使われ方の見方': USAGE_DIAGRAM,
      '設定でできること': SETTINGS_DIAGRAM,
    };

    GUIDE.forEach(function (section) {
      var parts = [];
      var h = document.createElement('h2');
      // 画面の部品 (guide-filter / guide-link など) とぶつけないよう、見出しは guide-sec- で始める。
      // 数える場所の名前 (guide-<id>) とも分ける。見出しを押しても数えない (usageTargetOf)
      h.id = 'guide-sec-' + section.id;
      h.dataset.guideHead = section.id;
      h.tabIndex = -1;
      var text = document.createElement('span');
      text.className = 'guide-head-text';
      text.textContent = section.title;
      h.appendChild(text);
      // 管理者向けの節も隠さない。誰に頼めばよいかが分かるように
      if (section.admin) {
        var pill = makePill('管理者', 'chip');
        pill.title = 'このアプリの管理者がする操作です';
        h.appendChild(pill);
      }
      guideEl.appendChild(h);
      parts.push(h);
      var tocBtn = addToc(section, h);

      if (figures[section.title]) {
        var fig = makeDiagram(figures[section.title]);
        guideEl.appendChild(fig);
        parts.push(fig);
      }

      var ul = document.createElement('ul');
      section.lines.forEach(function (line) {
        var li = document.createElement('li');
        // {key} を含む行は、言葉の表し方が変わったら applyTerms が埋め直す
        li.textContent = termIn(line);
        if (line.indexOf('{') >= 0) li.setAttribute('data-term', line);
        ul.appendChild(li);
      });
      guideEl.appendChild(ul);
      parts.push(ul);

      guideSections.push({
        id: section.id, head: h, parts: parts, toc: tocBtn,
        // 両方の言葉で引けるようにする。表し方を変えても、人がどちらの言葉で探しても見つかる
        text: searchNormalize(section.title + '\n' + termFill(section.lines.join('\n'), 'plain') +
          '\n' + termFill(section.lines.join('\n'), 'scrum')),
      });
    });

    // 絞り込みで1件になった節。打ち足しても同じ節なら数え直さない
    var filterOne = '';

    /** 打った字を見出しと行に含む節だけを出す。目次も同じく絞る */
    function applyGuideFilter() {
      var words = searchNormalize(filterInput.value).split(/\s+/).filter(Boolean);
      var shown = [];
      guideSections.forEach(function (sec) {
        var hit = words.every(function (w) { return sec.text.indexOf(w) >= 0; });
        sec.parts.forEach(function (el) { el.hidden = !hit; });
        sec.toc.hidden = !hit;
        if (hit) shown.push(sec);
      });
      empty.hidden = shown.length > 0;

      var one = words.length && shown.length === 1 ? shown[0].id : '';
      if (one && one !== filterOne) usageCount('view', 'guide-' + one);
      filterOne = one;
      markToc();
    }
    filterInput.addEventListener('input', applyGuideFilter);
    guideFilterApply = function (value) {
      filterInput.value = value;
      applyGuideFilter();
    };

    var foot = document.createElement('div');
    foot.className = 'guide-foot';

    var who = document.createElement('span');
    who.className = 'row-meta';
    who.id = 'whoami';
    foot.appendChild(who);
    guideEl.appendChild(foot);

    /**
     * いま読んでいる節を目次の側で示す。
     *
     * どこを読んでいるのか分からないまま長い頁を送ると、戻る先を
     * 見失う。色だけでなく aria-current でも示す。絞り込みで隠れた節は
     * 数えない (隠れた見出しの位置は 0 になり、先頭を指してしまう)
     */
    function markToc() {
      var line = guideEl.scrollTop + 80;
      var shown = guideSections.filter(function (sec) { return !sec.head.hidden; });
      var at = shown.length ? shown[0] : null;

      shown.forEach(function (sec) {
        if (sec.head.offsetTop <= line) at = sec;
      });
      guideSections.forEach(function (sec) {
        sec.toc.setAttribute('aria-current', String(sec === at));
      });
    }

    guideEl.addEventListener('scroll', markToc);
    markToc();

    guideEl.dataset.ready = '1';

    google.script.run
      .withSuccessHandler(function (info) {
        currentUser = info.activeUser;
        who.textContent = info.activeUser
          ? 'このアプリはあなたを ' + personName(info.activeUser) +
            ' (' + info.activeUser + ') として認識しています'
          : '警告: 利用者を特定できていません。この状態では記録に名前が残りません';
      })
      .withFailureHandler(function () { who.textContent = ''; })
      .apiWhoAmI();
  }

  // ===== 不具合を伝える =====

  var REPORT_KINDS = [
    ['bug', 'うまく動かない'],
    ['request', 'こうしてほしい (機能の要望)'],
    ['question', '使い方が分からない'],
    ['other', 'その他'],
  ];

  /**
   * 種類ごとの尋ね方。
   *
   * 不具合と要望では、聞くべきことが違う。「何をしましたか」は要望には
   * 答えようがなく、白紙のまま送られる。
   */
  var REPORT_ASKS = {
    bug: {
      summary: ['ひとことで言うと', '例: 工程表の棒が伸ばせない'],
      steps: ['何をしましたか', '例:\n1. やること → 工程表 を開く\n2. 棒の右端を掴む\n3. 右に引く'],

    },
    request: {
      summary: ['ひとことで言うと', '例: 期限が近いやることを先に出したい'],
      steps: ['いま何に困っていますか', '例: 一覧が番号順なので、急ぎのものを探すのに毎回スクロールしている'],
      actual: ['どうなるとよいですか', '例: 期限の近い順に並べ替えられるとよい'],
      expected: ['他に思いつくやり方があれば', '例: 期限が3日以内のものだけを出す絞り込みでもよい'],
    },
    question: {
