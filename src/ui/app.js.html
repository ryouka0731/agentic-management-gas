  function reportError(text) {

      bar.className = 'fatal-error';

  function fileUrlOf(type, fileId) {
    if (!fileId) return '';
    var base = {
      doc: 'https://docs.google.com/document/d/',
      sheet: 'https://docs.google.com/spreadsheets/d/',
      slide: 'https://docs.google.com/presentation/d/',
    }[String(type)];
    if (!base) return 'https://drive.google.com/file/d/' + fileId + '/view';
    return base + fileId + '/edit';
  }

  function diffPairs(ops) {
    var out = [];
    var dels = [];
    var ins = [];

    function flush() {
      var n = Math.max(dels.length, ins.length);
      for (var i = 0; i < n; i++) {
        var left = i < dels.length ? dels[i] : null;
        var right = i < ins.length ? ins[i] : null;
        var type = (left !== null && right !== null)
          ? 'change' : (left !== null ? 'delete' : 'insert');
        out.push({ left: left, right: right, type: type });
      }
      dels = [];
      ins = [];
    }

    for (var i = 0; i < (ops || []).length; i++) {
      var op = ops[i];
      if (op.type === 'delete') { dels.push(op.line); continue; }
      if (op.type === 'insert') { ins.push(op.line); continue; }
      flush();
      out.push({ left: op.line, right: op.line, type: 'equal' });
    }
    flush();
    return out;
  }

    var m = /^branches\/([^\/]+)\/([\s\S]*)$/.exec(String(path || ''));
    return m
      ? { branch: m[1], path: m[2] }
      : { branch: 'main', path: String(path || '') };
  }

  /**
   * 補足を付ける。言葉は HINTS から引く。
   *
   * @param {HTMLElement} el
   * @param {string} key
   * @returns {HTMLElement} el
   */
  function hint(el, key) {
    return attachHint(el, HINTS[key] || '');
  }

  /**
   * 絞り込みの入り切りを、見て分かる形にする。
   *
   * ただのボタンだと、押したのか絞り込んでいるのかが区別できない。
   * つまみのある切り替えにして、いまどちらなのかを形で示す。
   *
   * @param {HTMLElement} btn
   * @param {boolean} on
   */
  function setToggle(btn, on) {
    btn.setAttribute('role', 'switch');
    btn.setAttribute('aria-checked', String(on));
    btn.classList.toggle('on', on);

    if (!btn.querySelector('.switch-track')) {
      var track = document.createElement('span');
      track.className = 'switch-track';
      track.setAttribute('aria-hidden', 'true');

      var knob = document.createElement('span');
      knob.className = 'switch-knob';
      track.appendChild(knob);

      btn.insertBefore(track, btn.firstChild);
      btn.classList.add('switch');
    }
  }

  /**
   * 押す前に、何が起きるかを補足する。
   *
   * ボタンの名前だけでは足りないものがある。触れたときと、キーボードで
   * 進んで焦点が当たったときの両方で出す。読み上げにも届くよう、
   * 見えない控えを置いて aria-describedby で結ぶ。
   *
   * @param {HTMLElement} el
   * @param {string} text
   * @returns {HTMLElement} el
   */
  function attachHint(el, text) {
    if (!el || !text) return el;

    el.classList.add('has-hint');
    el.setAttribute('data-hint', text);

    // 名前が無いものには、いま持っている吹き出しを名前にしてから外す。
    // ブラウザ既定の吹き出しと二重に出ると、遅れて出るほうが邪魔になる
    if (!el.getAttribute('aria-label') && el.title) {
      el.setAttribute('aria-label', el.title);
    }
    el.removeAttribute('title');

    var id = 'hint-' + (++hintSeq);
    var note = document.createElement('span');
    note.id = id;
    note.className = 'sr-only';
    note.textContent = text;

    el.setAttribute('aria-describedby', id);

    // 控えは1か所にまとめて置く。隣に差し込むと、並びで組んでいる
    // ところ (列見出しなど) の形が変わってしまう
    hintNotes().appendChild(note);

    return el;
  }

  /** いま補足を出している相手 */
  var hintHost = null;

  /**
   * その位置にある、補足を持つ要素を返す。
   *
   * 要素ごとに出入りを見ると、押した拍子に一覧が描き直されたときに
   * 「離れた」が来ず、吹き出しが出たまま残る。画面全体で位置を見る。
   *
   * @param {EventTarget} target
   * @returns {HTMLElement|null}
   */
  function hintHostOf(target) {
    var el = target;

    while (el && el !== document) {
      if (el.classList && el.classList.contains('has-hint')) return el;
      el = el.parentNode;
    }
    return null;
  }

  /**
   * 触れている相手に合わせて出し入れする。
   *
   * @param {EventTarget} target
   */
  function trackHint(target) {
    var host = hintHostOf(target);

    if (!host) return hideHint();
    if (host === hintHost) return;

    showHint(host);
  }

  /**
   * 補足の吹き出し。1つだけ作って使い回す。
   *
   * @returns {HTMLElement}
   */
  function hintBubble() {
    var el = document.getElementById('hint-bubble');
    if (el) return el;

    el = document.createElement('div');
    el.id = 'hint-bubble';
    el.className = 'hint-bubble';
    el.hidden = true;
    // 触れられると、その下の要素に触れられなくなる
    el.setAttribute('aria-hidden', 'true');

    document.body.appendChild(el);
    return el;
  }

  /**
   * 補足を出す。
   *
   * 器の中に描くと、幅の狭いペインや巻き取る器 (overflow) に切り取られ、
   * 下に埋もれる。器の外に1つだけ置き、窓を基準に位置を決める。
   *
   * @param {HTMLElement} el
   */
  function showHint(el) {
    var text = el.getAttribute('data-hint');
    if (!text) return;

    var box = hintBubble();
    hintHost = el;
    box.textContent = text;
    box.hidden = false;

    // いったん左上に置いてから測る。前の位置のままだと大きさが変わらない
    box.style.left = '0';
    box.style.top = '0';

    var rect = el.getBoundingClientRect();
    var size = box.getBoundingClientRect();
    var gap = 8;
    var edge = 8;

    var left = rect.left;
    if (left + size.width > window.innerWidth - edge) {
      left = window.innerWidth - edge - size.width;
    }

    var top = rect.bottom + gap;
    if (top + size.height > window.innerHeight - edge) {
      top = rect.top - gap - size.height;
    }

    // 窓の外には置かない。押した要素が端に半分隠れていることがある
    left = Math.max(edge, left);
    top = Math.max(edge, top);

    box.style.left = Math.round(left) + 'px';
    box.style.top = Math.round(top) + 'px';
  }

  /**
   * 補足をしまう。
   */
  function hideHint() {
    hintHost = null;

    var box = document.getElementById('hint-bubble');
    if (!box || box.hidden) return;

    box.hidden = true;
    box.textContent = '';
  }

  /**
   * 読み上げ用の控えの置き場。無ければ作る。
   *
   * @returns {HTMLElement}
   */
  function hintNotes() {
    var box = document.getElementById('hint-notes');
    if (box) return box;

    box = document.createElement('div');
    box.id = 'hint-notes';
    box.className = 'sr-only';
    document.body.appendChild(box);
    return box;
  }

  /**
   * 名前の印を作る。

   * 番頭が守る帳面と、そこに挟んだ栞。帳面は版が積み重なることを、
   * 栞は「いまどこを見ているか」を表す。
   *
   * 画像は置かない。読み込みを1つ増やさずに済み、明るい地でも暗い地でも
   * 字と同じ色で出せる。
   *
   * @returns {SVGElement}
   */
  function makeLogo() {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');

    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('class', 'brand-mark');
    svg.setAttribute('aria-hidden', 'true');

    /**
     * @param {string} d
     * @param {string} [cls]
     */
    function path(d, cls) {
      var el = document.createElementNS(ns, 'path');
      el.setAttribute('d', d);
      if (cls) el.setAttribute('class', cls);
      svg.appendChild(el);
      return el;
    }

    // 帳面。背に沿って綴じ、下に重なった版をのぞかせる
    path('M6 3h11a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z');
    path('M7.5 3v16');
    path('M6 21h12');

    // 栞。いまどこを見ているか
    path('M12.5 3v6l2-1.6L16.5 9V3', 'brand-mark-fill');
    return svg;
  }

  /**

   */
  function fillBrand() {
    var host = document.getElementById('brand');
    host.textContent = '';

    // 印と名前は横に並べ、何をする道具かは下に一行で置く。名前の横に
    // 足すと、260px の帯では名前が潰れる
    var row = document.createElement('span');
    row.className = 'brand-row';
    row.appendChild(makeLogo());

    var words = document.createElement('span');
    words.className = 'brand-words';

    var name = document.createElement('span');
    name.className = 'brand-name';
    name.textContent = 'SoftBanto';
    words.appendChild(name);

    var sub = document.createElement('span');
    sub.className = 'brand-sub';
    sub.textContent = 'そふと番頭';
    words.appendChild(sub);

    row.appendChild(words);
    host.appendChild(row);

    var tag = document.createElement('span');
    tag.className = 'brand-tag';
    tag.textContent = 'AIで文書とタスクを管理するシステム';
    host.appendChild(tag);

    attachHint(host,
      '文書の版を残し、確認を経て反映する道具です。通称は「番頭」です');

    fillWorkspace(host);
  }

  /**
   * いまどのワークスペースを見ているかを出す。
   *
   * 同じ道具を複数のワークスペースに置くと、画面だけでは見分けが付かず、
   * 別のところの文書を直してしまう。置き場所の名前がいちばん見分けに効く。
   *
   * 場所が分かるまでは何も出さない。空の器を先に置くと、名前が届いた
   * ときに左上の段がずれる。
   *
   * @param {HTMLElement} host
   */
  function fillWorkspace(host) {
    call('apiWorkspace', [], function (place) {
      if (!place || !place.name) return;

      var el = document.createElement(place.url ? 'a' : 'span');
      el.className = 'brand-place';

      if (place.url) {
        el.href = place.url;
        el.target = '_blank';
        el.rel = 'noopener';
      }
      el.appendChild(makeIcon('folder'));

      var name = document.createElement('span');
      name.className = 'brand-place-name';
      name.textContent = place.name;
      el.appendChild(name);

      attachHint(el, place.path
        ? 'この道具が見ているのは ' + place.path + ' です'
        : 'この道具が見ている置き場所です');
      host.appendChild(el);
    }, failQuiet('分からなくても操作はできる'));
  }

  /**
   * 優先度の選択肢。
   *
   * サーバの `ISSUE_PRIORITIES()` が本体である。取れなかったときのために
   * 同じ並びを持っているが、**足すときはサーバ側を直す。** ここだけ足すと、
   * 選べるのに保存できない選択肢になる。
   */
  var priorities = [['high', '高'], ['normal', 'ふつう'], ['low', '低']];

  /**
   * 優先度の見せる字を返す。
   *
   * @param {string} value
   * @returns {string}
   */
  function priorityLabel(value) {
    for (var i = 0; i < priorities.length; i++) {
      if (priorities[i][0] === String(value)) return priorities[i][1];
    }
    return '';
  }

  /**
   * 優先度の印を作る。
   *
   * 「ふつう」には出さない。ほとんどがふつうなので、全件に付けると
   * 印が地になって、高いものが目に入らなくなる。
   *
   * @param {object} issue
   * @returns {HTMLElement|null}
   */
  function makePriorityChip(issue) {
    var want = String(issue.priority || 'normal');
    if (want === 'normal') return null;

    // 色だけでは気づけない人がいるので字でも示す
    return makePill('優先度' + priorityLabel(want),
      'chip chip-pri chip-pri-' + want);
  }

  /**
   * 小さな札を作る。
   *
   * 「動きなし」「文書改訂」「優先度高」「対応中」のような短い印は、どれも
   * 同じ形でなければ並んだときに高さが揃わない。**形は CSS の共通の規則が
   * 決め、組み立てはここに寄せる。**
   *
   * 以前は17か所がそれぞれ span を作ってクラスを当てていて、7種類が
   * 別々の字の大きさと余白を持っていた。
   *
   * @param {string} text 出す字
   * @param {string} [kind] 色の種類 ('chip' / 'state state-open' など)
   * @param {string} [icon] 添える印の名
   * @returns {HTMLElement}
   */
  function makePill(text, kind, icon) {
    var el = document.createElement('span');
    el.className = kind || 'chip';

    if (icon) el.appendChild(makeIcon(icon));
    // 他人が書いた題名やタグが入るので、字としてだけ置く
    el.appendChild(document.createTextNode(String(text)));
    return el;
  }

  var diagramSeq = 0;

  /**
   * 説明の図を描く。
   *
   * 字だけの説明は読まれない。読まずに尋ねられるくらいなら、目に入る
   * 形で置いたほうが早い。
   *
   * 図を描く道具 (Mermaid など) は足さない。読み込みが1つ増えるうえ、
   * この画面は外から何も取ってこない作りにしてある。地の色に合わせる
   * のも、その場で描いたほうが確実。
   *
   * 語彙:
   *   lanes  背景の帯。主語（正式版/改訂版、できる/できない）を囲む
   *   arrows 線。soft で戻り、dash で補い、bare で先を付けない
   *   boxes  角丸の箱。label は改行可、sub は下に小さく
   *   dots   線の上の点。記録のような「その時点」を表す
   *   notes  自由な字。木の形や但し書きに使う。mono で等幅
   *
   * 帯 → 線 → 箱 → 点 → 字 の順に重ねる。あとのものが上に乗る。
   *
   * @param {object} spec {title, desc, width, height, lanes, arrows, boxes,
   *   dots, notes, caption}
   * @returns {HTMLElement}
   */
  function makeDiagram(spec) {
    var ns = 'http://www.w3.org/2000/svg';
    var wrap = document.createElement('figure');
    wrap.className = 'diagram';

    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + spec.width + ' ' + spec.height);
    svg.setAttribute('role', 'img');

    var title = document.createElementNS(ns, 'title');
    title.textContent = spec.title;
    svg.appendChild(title);

    var desc = document.createElementNS(ns, 'desc');
    desc.textContent = spec.desc;
    svg.appendChild(desc);

    // 矢印の先。同じ頁に2つ並ぶので、名前を分ける
    var mark = 'arrow-' + (++diagramSeq);
    var defs = document.createElementNS(ns, 'defs');

    ['', 'soft'].forEach(function (tone) {
      var marker = document.createElementNS(ns, 'marker');
      marker.setAttribute('id', mark + (tone ? '-' + tone : ''));
      marker.setAttribute('viewBox', '0 0 8 8');
      marker.setAttribute('refX', '7');
      marker.setAttribute('refY', '4');
      marker.setAttribute('markerWidth', '6');
      marker.setAttribute('markerHeight', '6');
      marker.setAttribute('orient', 'auto-start-reverse');

      var head = document.createElementNS(ns, 'path');
      head.setAttribute('d', 'M0 0l8 4-8 4z');
      head.setAttribute('class', 'diagram-head' + (tone ? ' ' + tone : ''));
      marker.appendChild(head);

      defs.appendChild(marker);
    });
    svg.appendChild(defs);

    /**
     * @param {string} name
     * @param {object} attrs
     * @returns {SVGElement}
     */
    function add(name, attrs) {
      var el = document.createElementNS(ns, name);

      for (var key in attrs) {
        if (Object.prototype.hasOwnProperty.call(attrs, key)) {
          el.setAttribute(key, attrs[key]);
        }
      }
      svg.appendChild(el);
      return el;
    }

    // 帯は主語を囲むもの。いちばん下に敷く
    (spec.lanes || []).forEach(function (lane) {
      add('rect', {
        x: lane.x, y: lane.y, width: lane.w, height: lane.h, rx: 8,
        class: 'diagram-lane' + (lane.tone ? ' ' + lane.tone : ''),
      });

      if (!lane.label) return;

      var tag = add('text', {
        x: lane.x + 12, y: lane.y + 18,
        class: 'diagram-lane-text' + (lane.tone ? ' ' + lane.tone : ''),
      });
      tag.textContent = lane.label;
    });

    (spec.arrows || []).forEach(function (arrow) {
      var line = add('path', {
        d: arrow.d,
        class: 'diagram-arrow' + (arrow.soft ? ' soft' : '') +
          (arrow.dash ? ' dash' : ''),
      });

      // 帯の底や時間の流れを表す線には先を付けない。先が2つ並ぶと
      // どちらへ向かっているのか読めなくなる
      if (!arrow.bare) {
        line.setAttribute(
          'marker-end', 'url(#' + mark + (arrow.soft ? '-soft' : '') + ')');
      }

      if (!arrow.label) return;

      var text = add('text', {
        x: arrow.lx, y: arrow.ly, class: 'diagram-label',
        'text-anchor': 'middle',
      });
      text.textContent = arrow.label;
    });

    (spec.boxes || []).forEach(function (box) {
      add('rect', {
        x: box.x, y: box.y, width: box.w, height: box.h, rx: 8,
        class: 'diagram-box' + (box.tone ? ' ' + box.tone : ''),
      });

      // 下に小さい字を足すぶん、見出しは上へ寄せる
      var mid = box.y + box.h / 2 + (box.sub ? -8 : 0);
      var lines = box.label.split('\n');
      lines.forEach(function (line, at) {
        var text = add('text', {
          x: box.x + box.w / 2,
          y: mid + (at - (lines.length - 1) / 2) * 15 + 5,
          class: 'diagram-text' + (box.tone ? ' ' + box.tone : ''),
          'text-anchor': 'middle',
        });
        text.textContent = line;
      });

      if (!box.sub) return;

      var sub = add('text', {
        x: box.x + box.w / 2, y: box.y + box.h - 9,
        class: 'diagram-sub', 'text-anchor': 'middle',
      });
      sub.textContent = box.sub;
    });

    // 点は「その時点」。記録が並んでいく様子を線の上に置く
    (spec.dots || []).forEach(function (dot) {
      add('circle', {
        cx: dot.cx, cy: dot.cy, r: dot.r || 7,
        class: 'diagram-dot' + (dot.tone ? ' ' + dot.tone : ''),
      });

      if (!dot.label) return;

      var text = add('text', {
        x: dot.cx, y: dot.cy + (dot.below ? 24 : -15),
        class: 'diagram-label', 'text-anchor': 'middle',
      });
      text.textContent = dot.label;
    });

    (spec.notes || []).forEach(function (note) {
      var text = add('text', {
        x: note.x, y: note.y,
        class: 'diagram-note' + (note.mono ? ' mono' : '') +
          (note.tone ? ' ' + note.tone : ''),
        'text-anchor': note.anchor || 'start',
      });
      text.textContent = note.text;
    });

    wrap.appendChild(svg);

    if (spec.caption) {
      var cap = document.createElement('figcaption');
      cap.className = 'row-meta';
      cap.textContent = spec.caption;
      wrap.appendChild(cap);
    }
    return wrap;
  }

  var THEME_ORDER = ['system', 'light', 'dark'];
  var themeMode = 'system';

  function readTheme() {
    try {
      var saved = window.localStorage.getItem('theme');
      if (THEME_ORDER.indexOf(saved) >= 0) return saved;
    } catch (e) { /* 保存できない環境では既定に従う */ }
    return 'system';
  }

  function writeTheme(mode) {
    try {
      window.localStorage.setItem('theme', mode);
    } catch (e) { /* 保存できなくても表示は切り替える */ }
  }

  function applyTheme(mode) {
    themeMode = mode;

    if (mode === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);

    var label = { system: '端末の設定に従う', light: '明るい', dark: '暗い' }[mode];
    var icon = { system: 'monitor', light: 'sun', dark: 'moon' }[mode];

    themeBtn.textContent = '';
    themeBtn.appendChild(makeIcon(icon));
    themeBtn.title = '画面の明るさ: ' + label + ' (押すと切り替え)';
    themeBtn.setAttribute('aria-label', themeBtn.title);
  }

  function cycleTheme() {
    var next = THEME_ORDER[(THEME_ORDER.indexOf(themeMode) + 1) % THEME_ORDER.length];
    applyTheme(next);
    writeTheme(next);

    // 本文は iframe の中にあり、外側のテーマ変更が届かない。描き直す
    if (current.fileId && !panelContent.hidden) openDoc(current.fileId, current.docPath);
  }

  // ===== ペインの幅 =====

  /**
   * 境界を掴んで左ペインの幅を変えられるようにする。
   *
   * 掴む操作だけを用意すると、キーボードだけの利用者が幅を変えられない。
   */
  /**
   * 境界を掴んで幅を変えられるようにする。
   *
   * 掴む操作だけを用意すると、キーボードだけの利用者が幅を変えられない。
   *
   * @param {HTMLElement} handle 境界の要素
   * @param {string} cssVar 幅を入れるCSS変数
   * @param {string} key 覚えておくときの名前
   * @param {function(PointerEvent): number} measure 掴んだ位置から幅を出す
   * @param {{min:number, max:number}} limit
   */
  function makeResizable(handle, cssVar, key, measure, limit) {
    var dragging = false;

    function forget() {
      document.documentElement.style.removeProperty(cssVar);
      try {
        window.localStorage.removeItem(key);
      } catch (e) { /* 消せなくても既定には戻る */ }
    }

    function set(px) {
      var w = Math.min(limit.max, Math.max(limit.min, Math.round(px)));
      document.documentElement.style.setProperty(cssVar, w + 'px');
      return w;
    }

    function save(px) {
      try {
        window.localStorage.setItem(key, String(px));
      } catch (e) { /* 覚えられなくても操作はできる */ }
    }

    try {
      var saved = Number(window.localStorage.getItem(key));
      if (saved) set(saved);
    } catch (e) { /* 既定のままでよい */ }

    /**
     * 掴むのをやめる。
     *
     * 離した合図は1つに頼れない。枠の外で離すと pointerup が届かず、
     * 掴んだまま張り付いて、その後は触れるだけで幅が動いてしまう。
     * 取り消し (pointercancel) と捕捉の喪失でも必ず外す
     *
     * @param {PointerEvent} e
     */
    function stop(e) {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');

      try {
        handle.releasePointerCapture(e.pointerId);
      } catch (err) { /* 既に外れていることがある */ }

      if (typeof e.clientX === 'number') save(set(measure(e)));
    }

    handle.addEventListener('pointerdown', function (e) {
      // 右クリックや副ボタンでは掴まない
      if (e.button > 0 || e.isPrimary === false) return;

      dragging = true;
      handle.classList.add('dragging');

      try {
        handle.setPointerCapture(e.pointerId);
      } catch (err) { /* 捕捉できなくても window 側で拾う */ }

      e.preventDefault();
    });

    handle.addEventListener('pointermove', function (e) {
      if (dragging) set(measure(e));
    });

    handle.addEventListener('pointerup', stop);
    handle.addEventListener('pointercancel', stop);
    handle.addEventListener('lostpointercapture', function () {
      dragging = false;
      handle.classList.remove('dragging');
    });

    // 枠の外で離されたときの受け皿
    window.addEventListener('pointerup', stop);

    // 二度押しで元の幅に戻す。行き過ぎたときに戻す手立てが要る
    handle.addEventListener('dblclick', function () {
      forget();
      showSnack('幅を元に戻しました');
    });

    handle.addEventListener('keydown', function (e) {
      var now = parseInt(
        getComputedStyle(document.documentElement).getPropertyValue(cssVar), 10
      ) || limit.min;

      if (e.key === 'ArrowLeft') save(set(now - 16));
      else if (e.key === 'ArrowRight') save(set(now + 16));
      else if (e.key === 'Home') forget();
      else return;

      e.preventDefault();
    });
  }

  var snackTimer = null;

  /**
   * バナー通知を出す。
   *
   * alert はモーダルで操作を止め、取り消しの手段も与えない。
   *
   * @param {string} text
   * @param {{kind?: string, undo?: function, ms?: number}} [opts]
   */
  function showSnack(text, opts) {
    var options = opts || {};

    var old = document.getElementById('snackbar');
    if (old) old.remove();
    if (snackTimer) window.clearTimeout(snackTimer);

    var bar = document.createElement('div');
    bar.id = 'snackbar';
    bar.className = 'snackbar' + (options.kind ? ' ' + options.kind : '');
    bar.setAttribute('role', 'status');
    bar.setAttribute('aria-live', 'polite');

    var span = document.createElement('span');
    span.className = 'snackbar-text';
    span.textContent = text;
    bar.appendChild(span);

    if (options.undo) {
      var undoBtn = document.createElement('button');
      undoBtn.type = 'button';
      undoBtn.textContent = '取り消す';
      undoBtn.addEventListener('click', function () {
        bar.remove();
        options.undo();
      });
      bar.appendChild(undoBtn);
    }

    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.textContent = '閉じる';
    closeBtn.addEventListener('click', function () { bar.remove(); });
    bar.appendChild(closeBtn);

    document.body.appendChild(bar);

    var ms = options.ms || (options.undo ? 10000 : 5000);
    snackTimer = window.setTimeout(function () { bar.remove(); }, ms);
  }

  // ===== サーバを呼ぶ =====

  /**
   * サーバの api 関数を呼ぶ。
   *
   * `google.script.run` は、**失敗ハンドラを付け忘れると失敗が完全に黙る**
   * 作りになっている。呼ぶたびに書いていると、いつか1つ書き忘れ、その画面
   * だけが「押しても何も起きない」になる。ここを通せば既定で知らせが出る。
   *
   * 以前は同じ形が86か所に写されていて、そのうち失敗の見せ方は6通りしか
   * なかった。見せ方は下の `fail*` に寄せてある。
   *
   * 引数を配列で渡すのは、`google.script.run` が「名前を呼び出す」形だから
   * である。`run[name].apply` で渡す。
   *
   * @param {string} name api 関数の名前
   * @param {Array} args その引数
   * @param {function} [onOk] 返ってきたときにすること
   * @param {function} [onFail] 省略すると、短い帯で知らせる
   */
  function call(name, args, onOk, onFail) {
    var run = google.script.run
      .withSuccessHandler(onOk || function () {})
      .withFailureHandler(onFail || failSnack());

    run[name].apply(run, args || []);
  }

  /**
   * 失敗を短い帯で知らせる。これが既定である。
   *
   * 前置きを添えると「何が」できなかったのかが伝わる。サーバからの文だけ
   * では、押した操作と結び付かないことがある。
   *
   * @param {string} [prefix] 例 '記録できませんでした: '
   * @returns {function}
   */
  function failSnack(prefix) {
    return function (err) {
      showSnack(String(prefix || '') + err.message, { kind: 'ng' });
    };
  }

  /**
   * 失敗を器の中に出す。
   *
   * 一覧そのものが出てこないときは、帯より器に出したほうが「ここが
   * 出ていない」と分かる。帯は数秒で消えるため、後から見た人に伝わらない。
   *
   * @param {HTMLElement} el
   * @returns {function}
   */
  function failInto(el) {
    return function (err) {
      el.textContent = 'エラー: ' + err.message;
    };
  }

  /**
   * 押せるように戻してから知らせる。
   *
   * 押した間は押せなくしてあるので、戻さないと**二度と押せなくなる**。
   * 失敗したのに押し直せない、がいちばん困る。
   *
   * @param {HTMLElement} btn
   * @param {string} [prefix]
   * @returns {function}
   */
  function failEnable(btn, prefix) {
    return function (err) {
      btn.disabled = false;
      showSnack(String(prefix || '') + err.message, { kind: 'ng' });
    };
  }

  /**
   * 知らせずに済ませる。
   *
   * 出なくても操作は続けられるもの (候補の一覧、既定値の取得など) に限る。
   * **なぜ黙るのかを必ず書く。** 書けないなら、黙ってよい理由がない。
   *
   * 画面には出さないが、追えるようにはしておく。以前は空の関数だったため、
   * 失敗したことがどこにも残らなかった。
   *
   * @param {string} why 黙ってよい理由
   * @returns {function}
   */
  function failQuiet(why) {
    return function (err) {
      if (window.console && window.console.warn) {
        window.console.warn(String(why) + ': ' + (err && err.message));
      }
    };
  }

  /**
   * 画面内に入力フォームを開く。prompt の置き換え。
   *
   * @param {HTMLElement} host
   * @param {Array<{name:string, label:string, multiline?:boolean, required?:boolean,
 *   choices?: Array<Array<string>>}>} fields
   * @param {string} submitLabel
   * @param {function(Object<string,string>): void} onSubmit
   * @param {HTMLElement} [sourceEl] この入力が対象としている要素
   * @returns {HTMLElement} 差し込んだフォーム
   */
  /** いま編集している対象の要素。印を付け外しするために覚えておく */
  var sideSource = null;

  /**
   * どれを編集しているのかを画面上で示す。
   *
   * 右に入力が出ても、一覧のどの行に対するものかが分からないと、
   * 直したつもりの対象を取り違える。
   *
   * @param {HTMLElement|null} el
   */
  function setSideSource(el) {
    if (sideSource) sideSource.classList.remove('editing');

    // 要素でないものが渡ることがある。印を付けられないだけで、
    // 入力そのものは開けたほうがよい
    sideSource = (el && el.classList) ? el : null;
    if (sideSource) sideSource.classList.add('editing');
  }

  /**
   * 右のペインを開くか閉じる。
   *
   * 掴み手 (resizer) はペインと同時に出し入れする。**片方だけ触ると、
   * 閉じているのに分け目の線だけが宙に残る。** 以前は3か所で
   * `sidePanel.hidden` を直に触っていたので、ここに寄せた。
   *
   * @param {boolean} open
   */
  function setSideOpen(open) {
    sidePanel.hidden = !open;
    sideResizer.hidden = !open;
  }

  /**
   * 右のパネルを閉じる。
   */
  function closeSide() {
    setSideOpen(false);
    sideBody.textContent = '';
    sideTitle.textContent = '';
    setSideEdit(null);
    setSideSource(null);
  }

  /**
   * 見出しの脇に「直す」を出す。
   *
   * 読むために開いたのに書き換えの形で出てくると、触っただけで中身が
   * 変わりそうで怖い。読む形を先に見せ、直すのは押してから。
   *
   * @param {function|null} onEdit
   */
  function setSideEdit(onEdit) {
    sideEditBtn.textContent = '';
    sideEditBtn.hidden = !onEdit;
    if (!onEdit) return;

    sideEditBtn.appendChild(makeIcon('pencil'));
    sideEditBtn.setAttribute('aria-label', '直す');
    attachHint(sideEditBtn, '書き換えられる形にします');

    sideEditBtn.onclick = onEdit;
  }

  /**
   * 右のパネルに入力フォームを開く。
   *
   * 一覧の上に差し込むと、書いている間に一覧が押し下げられ、何に対する
   * 入力なのかが見えなくなる。右に出せば対象を見ながら書ける。
   *
   * @param {string} title 何の入力かを示す見出し
   * @param {Array<{name:string, label:string, multiline?:boolean, required?:boolean,
 *   choices?: Array<Array<string>>}>} fields
   * @param {string} submitLabel
   * @param {function(Object<string,string>): void} onSubmit
   * @returns {HTMLElement} 差し込んだフォーム
   */
  function openInlineForm(title, fields, submitLabel, onSubmit, sourceEl) {
    setSideEdit(null);
    setSideSource(sourceEl);
    sideBody.textContent = '';
    sideTitle.textContent = title;
    setSideOpen(true);

    var form = document.createElement('form');
    form.className = 'inline-form';

    var inputs = {};
    fields.forEach(function (f) {
      var label = document.createElement('label');
      label.textContent = f.label;

      // 決まったものから選ばせたい欄は選択肢にする。自由に書かせると
      // 表記が割れて数えられなくなる
      var input;
      if (f.choices) {
        input = document.createElement('select');
        f.choices.forEach(function (pair) {
          var opt = document.createElement('option');
          opt.value = pair[0];
          opt.textContent = pair[1];
          input.appendChild(opt);
        });
      } else {
        input = document.createElement(f.multiline ? 'textarea' : 'input');
        if (!f.multiline) input.type = 'text';
      }

      if (f.required) input.required = true;
      // 初期値は名前で入れる。位置で数えて入れると、欄を1つ足すたびに
      // 後ろが全部ずれる
      if (f.value !== undefined && f.value !== null) input.value = String(f.value);
      label.appendChild(input);

      inputs[f.name] = input;
      form.appendChild(label);
    });

    var actions = document.createElement('div');
    actions.className = 'inline-form-actions';

    var submit = document.createElement('button');
    submit.type = 'submit';
    submit.className = 'btn btn-primary';
    submit.textContent = submitLabel;
    actions.appendChild(submit);

    var cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'btn';
    cancel.textContent = 'やめる';
    cancel.addEventListener('click', closeSide);
    actions.appendChild(cancel);

    form.appendChild(actions);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var values = {};
      var missing = false;

      fields.forEach(function (f) {
        values[f.name] = inputs[f.name].value;
        if (f.required && !values[f.name]) missing = true;
      });

      if (missing) {
        showSnack('必須の項目が空です', { kind: 'ng' });
        return;
      }
      closeSide();
      onSubmit(values);
    });

    // 閉じ道を必ず用意する
    form.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeSide();
    });

    sideBody.appendChild(form);
    inputs[fields[0].name].focus();
    return form;
  }

  /**
   * その場で確認を取る帯を出す。confirm の置き換え。
   *
   * @param {HTMLElement} host
   * @param {string} text
   * @param {string} label
   * @param {function} onConfirm
   */
  function openConfirmStrip(host, text, label, onConfirm) {
    var existing = host.querySelector('.confirm-strip');
    if (existing) existing.remove();

    var strip = document.createElement('div');
    strip.className = 'confirm-strip';
    strip.setAttribute('role', 'alert');

    var span = document.createElement('span');
    span.textContent = text;
    strip.appendChild(span);

    var ok = document.createElement('button');
    ok.className = 'btn btn-primary';
    ok.textContent = label;
    ok.addEventListener('click', function () {
      strip.remove();
      onConfirm();
    });
    strip.appendChild(ok);

    var no = document.createElement('button');
    no.className = 'btn';
    no.textContent = 'やめる';
    no.addEventListener('click', function () { strip.remove(); });
    strip.appendChild(no);

    host.insertBefore(strip, host.firstChild);
    ok.focus();
  }

  /**
   * 空の状態を作る。「何も無い」ではなく次の一手を示す。
   *
   * @param {string} title
   * @param {string} hint
   * @param {{label:string, onClick:function}} [action]
   * @returns {HTMLElement}
   */
  function makeBlankState(title, hint, action) {
    var wrap = document.createElement('div');
    wrap.className = 'blank-state';
    wrap.appendChild(makeIcon('inbox'));

    var strong = document.createElement('strong');
    strong.textContent = title;
    wrap.appendChild(strong);

    var p = document.createElement('div');
    p.textContent = hint;
    wrap.appendChild(p);

    if (action) {
      var btn = document.createElement('button');
      btn.className = 'btn btn-primary';
      btn.textContent = action.label;
      // 押した本人を渡す。そのまま繋ぐと第1引数が Event になり、
      // 対象の要素として受け取った側で classList を触って落ちる
      btn.addEventListener('click', function () { action.onClick(btn); });
      wrap.appendChild(btn);
    }
    return wrap;
  }

  /**
   * 元のファイルへのリンクを作る。
   *
   * @param {string} type
   * @param {string} fileId
   * @returns {HTMLElement}
   */
  function makeFileLink(type, fileId) {
    var a = document.createElement('a');
    a.className = 'file-link';
    a.href = fileUrlOf(type, fileId);
    a.target = '_blank';
    a.rel = 'noopener';
    a.appendChild(makeIcon('external-link'));
    a.title = '元のファイルを開く';
    a.setAttribute('aria-label', '元のファイルを開く');
    return a;
  }

  // ===== 読み込み中の骨組み =====

  /**
   * これから出る形を先に見せる。
   *
   * 「読み込み中…」の文字より、出来上がりの形を見せたほうが待ち時間が
   * 短く感じられ、中身が入ったときに位置もずれない。
   *
   * @param {HTMLElement} container
   * @param {string} kind 'list' | 'graph' | 'doc' | 'board' | 'block'
   * @param {number} [count]
   */
  function showSkeleton(container, kind, count) {
    container.textContent = '';
    var n = count || 4;

    /**
     * 骨組みの棒を作る。
     *
     * @param {string} width CSSの幅
     * @param {number} [height]
     * @returns {HTMLElement}
     */
    function bar(width, height) {
      var el = document.createElement('div');
      el.className = 'skeleton';
      el.style.width = width;
      el.style.height = (height || 12) + 'px';
      return el;
    }

    function lines(a, b) {
      var wrap = document.createElement('div');
      wrap.className = 'row-main sk-lines';
      wrap.appendChild(bar(a));
      if (b) wrap.appendChild(bar(b, 10));
      return wrap;
    }

    if (kind === 'board') {
      // 器そのものが板なので、中にもう1枚板を作らない。作ると4列の中の
      // 1列に4列を押し込むことになり、右が見切れる (実際に踏んだ)
      for (var c = 0; c < 4; c++) {
        var col = document.createElement('div');
        col.className = 'board-column';
        col.appendChild(bar('40%', 12));

        for (var k = 0; k < 2; k++) {
          var card = document.createElement('div');
          card.className = 'board-card';
          card.appendChild(bar('80%'));
          card.appendChild(bar('45%', 10));
          col.appendChild(card);
        }
        container.appendChild(col);
      }
      return;
    }

    if (kind === 'gantt') {
      var chart = document.createElement('div');
      chart.className = 'gantt';

      for (var r = 0; r < n; r++) {
        var row = document.createElement('div');
        row.className = 'gantt-row';

        var name = document.createElement('div');
        name.className = 'gantt-name';
        name.appendChild(bar((60 + (r % 3) * 12) + '%'));
        row.appendChild(name);

        var track = document.createElement('div');
        track.className = 'gantt-track';

        var barEl = document.createElement('div');
        barEl.className = 'skeleton';
        barEl.style.height = '24px';
        barEl.style.borderRadius = '999px';
        barEl.style.gridColumn = (1 + r * 2) + ' / span ' + (3 + (r % 4));
        track.appendChild(barEl);

        row.appendChild(track);
        chart.appendChild(row);
      }
      container.appendChild(chart);
      return;
    }

    if (kind === 'graph') {
      for (var gi = 0; gi < n; gi++) {
        var grow = document.createElement('div');
        grow.className = 'graph-row';

        var cell = document.createElement('div');
        cell.className = 'graph-cell';
        var dot = document.createElement('div');
        dot.className = 'skeleton';
        dot.style.cssText = 'width:10px;height:10px;border-radius:50%;margin:17px auto;';
        cell.appendChild(dot);
        grow.appendChild(cell);

        var desc = document.createElement('div');
        desc.className = 'graph-col-desc';
        desc.appendChild(bar((50 + (gi % 3) * 15) + '%'));
        grow.appendChild(desc);

        var date = document.createElement('div');
        date.className = 'graph-col-date';
        date.appendChild(bar('80%', 10));
        grow.appendChild(date);

        var author = document.createElement('div');
        author.className = 'graph-col-author';
        author.appendChild(bar('70%', 10));
        grow.appendChild(author);

        var sha = document.createElement('div');
        sha.className = 'graph-col-sha';
        sha.appendChild(bar('90%', 10));
        grow.appendChild(sha);

        container.appendChild(grow);
      }
      return;
    }

    if (kind === 'doc') {
      for (var d = 0; d < n; d++) {
        var card = document.createElement('div');
        card.className = 'doc-card';

        var open = document.createElement('div');
        open.className = 'doc-open';

        var icon = document.createElement('div');
        icon.className = 'skeleton';
        icon.style.cssText = 'width:16px;height:16px;flex:0 0 16px;';
        open.appendChild(icon);
        open.appendChild(bar((30 + d * 10) + '%', 14));

        card.appendChild(open);
        container.appendChild(card);
      }
      return;
    }

    if (kind === 'block') {
      var block = document.createElement('div');
      block.className = 'skeleton';
      block.style.cssText = 'height:120px;margin:' +
        'var(--sp-4);border-radius:var(--radius);';
      container.appendChild(block);
      return;
    }

    // 一覧。row-item と同じ骨組みで作るので、実物と位置がずれない
    for (var i = 0; i < n; i++) {
      var item = document.createElement('div');
      item.className = 'row-item';

      var openEl = document.createElement('div');
      openEl.className = 'row-open';

      var ic = document.createElement('div');
      ic.className = 'skeleton';
      ic.style.cssText = 'width:16px;height:16px;flex:0 0 16px;';
      openEl.appendChild(ic);
      openEl.appendChild(lines((45 + (i % 3) * 15) + '%', '25%'));

      item.appendChild(openEl);
      container.appendChild(item);
    }
  }

  // ===== 本文の描画 =====

  /**
   * 連続する <li> を対応する ul/ol でラップする。
   *
   * @param {string} html
   * @returns {string}
   */
  function wrapLists(html) {
    var lines = String(html || '').split('\n');
    var out = [];
    var open = null;

    lines.forEach(function (line) {
      var m = /^<li data-list="(ul|ol)" data-depth="(\d+)">/.exec(line);
      if (!m) {
        if (open) { out.push('</' + open + '>'); open = null; }
        out.push(line);
        return;
      }
      if (open !== m[1]) {
        if (open) out.push('</' + open + '>');
        out.push('<' + m[1] + '>');
        open = m[1];
      }
      out.push(line);
    });

    if (open) out.push('</' + open + '>');
    return out.join('\n');
  }

  /**
   * 現在のテーマのトークンを読む。
   *
   * 本文は iframe の中に描くため、外側のCSS変数が届かない。
   * 描画のたびに実際の値を読んで流し込む。
   *
   * @returns {Object<string,string>}
   */
  function themeColors() {
    var style = getComputedStyle(document.documentElement);
    var names = ['--ink', '--ink-2', '--bg', '--bg-2', '--line', '--accent'];
    var out = {};

    names.forEach(function (n) {
      out[n] = String(style.getPropertyValue(n) || '').trim();
    });
    return out;
  }

  function renderIntoViewer(bodyHtml) {
    var c = themeColors();

    var css =
      'body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",' +
      '"Noto Sans JP",sans-serif;line-height:1.9;' +
      'color:' + c['--ink'] + ';background:' + c['--bg'] + ';' +
      'padding:32px 48px;max-width:820px;margin:0 auto;}' +
      'h1{font-size:24px;margin:1.6em 0 .6em;}' +
      'h2{font-size:20px;margin:1.6em 0 .6em;}' +
      'h3{font-size:17px;margin:1.4em 0 .5em;}' +
      'a{color:' + c['--accent'] + ';}' +
      'table{border-collapse:collapse;margin:1em 0;width:100%;}' +
      'td{border:1px solid ' + c['--line'] + ';padding:6px 10px;}' +
      'li{margin:.3em 0;}' +
      'img{max-width:100%;}' +
      'table[data-sheet]{width:auto;font-size:13px;}' +
      'table[data-sheet] td{white-space:nowrap;}' +
      'table[data-sheet]::before{content:attr(data-sheet);display:block;' +
      'font-size:11px;color:' + c['--ink-2'] + ';margin-bottom:4px;}' +
      'td[data-formula]{background:' + c['--bg-2'] + ';color:' + c['--ink-2'] + ';}' +
      'section[data-slide]{border-top:2px solid ' + c['--line'] + ';margin-top:24px;' +
      'padding-top:6px;font-size:11px;color:' + c['--ink-2'] + ';}' +
      'section[data-slide]::before{content:"スライド " attr(data-slide);}';

    viewer.srcdoc =
      '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">' +
      '<style>' + css + '</style></head><body>' + wrapLists(bodyHtml) + '</body></html>';
  }

  // ===== 差分 =====

  /**
   * 差分を左右2列で描画する。
   *
   * 片側しか無い行にも空のセルを置いて、左右の行がずれないようにする。
   *
   * @param {object[]} ops
   * @param {HTMLElement} container
   * @param {boolean} skipEqual
   */
  function renderDiffInto(ops, container, skipEqual) {
    var pairs = diffPairs(ops || []);
    var shown = [];

    for (var i = 0; i < pairs.length; i++) {
      if (skipEqual && pairs[i].type === 'equal') continue;
      shown.push(pairs[i]);
    }

    if (!shown.length) {
      var p = document.createElement('p');
      p.className = 'diff-empty';
      p.textContent = '差分はありません';
      container.appendChild(p);
      return;
    }

    // 片側にしか中身が無いなら1列で見せる。空の列に横幅の半分を
    // 使うより、本文を広く見せたほうが読める
    var hasLeft = shown.some(function (p) { return p.left !== null; });
    var hasRight = shown.some(function (p) { return p.right !== null; });
    var single = !hasLeft || !hasRight;

    var table = document.createElement('div');
    table.className = 'diff-split' + (single ? ' single' : '');

    shown.forEach(function (pair) {
      var row = document.createElement('div');
      row.className = 'diff-row';

      if (single) {
        var only = hasLeft ? pair.left : pair.right;
        var kind = pair.type === 'equal' ? '' : (hasLeft ? 'del' : 'ins');
        row.appendChild(diffCell(only, kind));
      } else {
        row.appendChild(diffCell(pair.left, pair.type === 'equal' ? '' : 'del'));
        row.appendChild(diffCell(pair.right, pair.type === 'equal' ? '' : 'ins'));
      }
      table.appendChild(row);
    });
    container.appendChild(table);
  }

  /**
   * 正規化HTMLの1行を、人が読める形に直す。
   *
   * src/core/Normalize.js の describeLine と同じもの。タグのまま見せると
   * 何が変わったのかを読むのに知識が要る。
   *
   * @param {string} line
   * @returns {{kind:string, text:string}}
   */
  function describeLine(line) {
    var raw = String(line == null ? '' : line);

    function strip(html) {
      var el = document.createElement('div');
      el.innerHTML = '';
      // タグを外し、実体参照は textarea を通さず自前で戻す
      var text = String(html).replace(/<[^>]*>/g, '');
      return text
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
        .replace(/&amp;/g, '&');
    }

    var mh = /^<h([1-6])>([\s\S]*)<\/h\1>$/.exec(raw);
    if (mh) return { kind: '見出し' + mh[1], text: strip(mh[2]) };

    var mp = /^<p>([\s\S]*)<\/p>$/.exec(raw);
    if (mp) return { kind: '段落', text: strip(mp[1]) };

    var ml = /^<li data-list="(ul|ol)" data-depth="(\d+)">([\s\S]*)<\/li>$/.exec(raw);
    if (ml) {
      return {
        kind: (ml[1] === 'ol' ? '番号' : '箇条') + '書き',
        text: new Array(Number(ml[2]) + 1).join('  ') + strip(ml[3]),
      };
    }

    var mi = /^<img data-sha="([^"]*)" alt="([^"]*)">$/.exec(raw);
    if (mi) return { kind: '画像', text: strip(mi[2]) || '(説明なし)' };

    var ms = /^<table data-sheet="([^"]*)">$/.exec(raw);
    if (ms) return { kind: 'シート', text: strip(ms[1]) };

    var msl = /^<section data-slide="(\d+)">$/.exec(raw);
    if (msl) return { kind: 'スライド', text: msl[1] + '枚目' };

    if (raw === '<table>') return { kind: '表', text: '開始' };
    if (raw === '</table>') return { kind: '表', text: '終わり' };

    if (raw.indexOf('<tr>') === 0) {
      var cells = [];
      var re = /<td(?: data-formula="[^"]*")?>([\s\S]*?)<\/td>/g;
      var m;
      while ((m = re.exec(raw)) !== null) cells.push(strip(m[1]));
      return { kind: '行', text: cells.join(' | ') };
    }

    return { kind: '', text: strip(raw) };
  }

  function diffCell(text, kind) {
    var cell = document.createElement('div');
    cell.className = 'diff-cell' +
      (text === null ? ' empty' : (kind ? ' ' + kind : ''));

    if (text === null) return cell;

    var d = describeLine(text);
    if (d.kind) {
      var tag = document.createElement('span');
      tag.className = 'diff-kind';
      tag.textContent = d.kind;
      cell.appendChild(tag);
    }

    var body = document.createElement('span');
    body.className = 'diff-text';
    body.textContent = d.text;
    body.title = text;
    cell.appendChild(body);

    return cell;
  }

  // ===== 画面の切り替え =====

  var DOC_TABS = { content: 1, history: 1, drafts: 1 };

  /**
   * 画面を切り替える。
   *
   * タブは開いている文書のビューなので、文書を選んでいないときは出さない。
   *
   * @param {string} name
   */
  function switchTab(name) {
    if (DOC_TABS[name] && !current.fileId) name = 'docs';
    currentTab = name;

    // 文書のビューを見ているときは、左の「文書」を現在地にする。
    // どこにいるのか分からなくなるため
    var navName = DOC_TABS[name] ? 'docs' : name;

    var targets = document.querySelectorAll('[data-tab]');
    for (var i = 0; i < targets.length; i++) {
      var el = targets[i];
      var isTab = el.classList.contains('tab');
      el.setAttribute('aria-current',
        String(el.dataset.tab === (isTab ? name : navName)));
    }

    // 履歴から離れるときは広げた差分を畳む。畳まないと画面を覆い続ける
    if (name !== 'history' && diffPane.classList.contains('full')) setDiffFull(false);

    panelDocs.hidden = name !== 'docs';
    panelContent.hidden = name !== 'content';
    panelHistory.hidden = name !== 'history';
    panelDrafts.hidden = name !== 'drafts';
    panelBranches.hidden = name !== 'branches';
    panelPulls.hidden = name !== 'pulls';
    panelIssues.hidden = name !== 'issues';
    panelHelp.hidden = name !== 'help';
    panelReport.hidden = name !== 'report';
    panelUsage.hidden = name !== 'usage';

    tabsEl.hidden = !current.fileId || !DOC_TABS[name];
    updateCrumbs();
    closeSide();

    usageCount('view', name);

    if (name === 'docs') loadDocs();
    else if (name === 'history') loadHistory();
    else if (name === 'drafts') loadDrafts();
    else if (name === 'branches') loadBranches();
    else if (name === 'pulls') loadPulls();
    else if (name === 'issues') reloadIssueView();
    else if (name === 'help') loadHelp();
    else if (name === 'report') loadReports();
    else if (name === 'usage') loadUsage();
  }

  /**
   * 現在の位置を出す。文書を開いているときだけ戻り道を見せる。
   */
  function updateCrumbs() {
    var inDoc = !!current.fileId && !!DOC_TABS[currentTab];

    crumbBack.hidden = !inDoc;
    crumbSep.hidden = !inDoc;
    branchSwitch.hidden = !inDoc;
    openLink.hidden = !inDoc;

    if (!inDoc) {
      var names = {
        docs: '文書', branches: '改訂中の版', pulls: '確認依頼',
        issues: 'やること', board: '進捗ボード', help: '使い方',
      };
      titleEl.textContent = names[currentTab] || '文書';
      branchChip.hidden = true;
      dirtyBadge.hidden = true;
      commitBtn.hidden = true;
      stashBtn.hidden = true;
      return;
    }
    titleEl.textContent = current.docPath || '';
  }

  // ===== 文書の一覧 (ホーム) =====

  function loadFiles(then) {
    call('apiListFiles', [], function (list) {
      allFiles = list || [];
      if (then) then();
    }, failInto(docListEl));
  }

  /**
   * 正式版の文書だけを並べる。改訂版は文書に従属するため一覧に混ぜない。
   */
  function renderDocs() {
    docListEl.textContent = '';

    var docs = allFiles.filter(function (f) {
      return splitPath(f.path).branch === 'main';
    });

    if (!docs.length) {
      docListEl.appendChild(makeBlankState(
        '管理している文書がありません',
        'Google ドライブで、この道具の「main」フォルダに文書を入れてから、' +
        '「文書を登録する」を押してください。',
        { label: '文書を登録する', onClick: addDocs }
      ));
      return;
    }

    docs.forEach(function (f) {
      var drafts = allFiles.filter(function (o) {
        return splitPath(o.path).branch !== 'main' &&
               splitPath(o.path).path === f.path;
      });

      var card = document.createElement('div');
      card.className = 'doc-card';

      var open = document.createElement('button');
      open.className = 'doc-open';

      var head = document.createElement('div');
      head.className = 'doc-head';
      head.appendChild(makeIcon('file-text'));

      var name = document.createElement('span');
      name.className = 'doc-name';
      name.textContent = f.path;
      head.appendChild(name);
      open.appendChild(head);

      var meta = document.createElement('div');
      meta.className = 'doc-meta';

      meta.appendChild(makePill(
        { doc: '文書', sheet: '表', slide: 'スライド' }[f.type] || f.type));

      if (drafts.length) {
        meta.appendChild(makePill(
          '改訂中 ' + drafts.length + '件', 'chip chip-accent'));
      }
      open.appendChild(meta);

      open.addEventListener('click', function () { openDoc(f.fileId, f.path); });
      card.appendChild(open);
      card.appendChild(makeFileLink(f.type, f.fileId));
      card.appendChild(makeUnregisterButton(f, drafts.length));

      docListEl.appendChild(card);
    });
  }

  /**
   * 管理から外す入口を作る。
   *
   * 間違って登録したものを戻す道が無く、台帳を手で直すしかなかった。
   *
   * ゴミ箱の印は使わない。**文書そのものを消すと読まれる。** 消えるのは
   * 台帳の1行だけなので、集まりから抜く印 (minus-circle) にしてある。
   * 帯の文でも「文書そのものは消えません」と言い切る。
   *
   * 改訂版が残っているものは押させない。サーバも断るが、押せてから
   * 断られるより、押せないほうが理由が伝わる。
   *
   * @param {object} f files 行
   * @param {number} draftCount その文書の改訂版の数
   * @returns {HTMLElement}
   */
  function makeUnregisterButton(f, draftCount) {
    var off = document.createElement('button');
    off.className = 'card-off';
    off.appendChild(makeIcon('minus-circle'));
    // 印だけなので、読み上げと吹き出しに名前を持たせる
    off.setAttribute('aria-label', f.path + ' を管理から外す');

    if (draftCount) {
      off.disabled = true;
      attachHint(off,
        '改訂版が' + draftCount + '件あります。先にそれらを捨ててください');
      return off;
    }
    hint(off, 'act:unregister');

    off.addEventListener('click', function (e) {
      e.stopPropagation();
      openConfirmStrip(docListEl,
        '「' + f.path + '」を管理から外します。' +
        'Drive の文書そのものは消えません。これまでの記録も残り、' +
        '登録し直せば履歴もそのまま戻ります。',
        '管理から外す',
        function () {
          call('apiUnregisterFile', [f.fileId], function () {
            showSnack('「' + f.path + '」を管理から外しました', { kind: 'ok' });
            loadFiles(renderDocs);
            loadOverview();
          });
        });
    });
    return off;
  }

  function loadDocs() {
    if (!allFiles.length) {
      showSkeleton(docListEl, 'doc', 3);
      loadFiles(renderDocs);
    } else {
      renderDocs();
    }
    loadOverview();
  }

  /**
   * 関係の流れに実数を入れる。
   *
   * 何がいくつあるかが見えないと、次に何をすればよいか分からない。
   */
  function loadOverview() {
    call('apiOverview', [], function (result) {
      var o = result || { openIssues: 0, branches: 0, openPrs: 0, docs: 0 };
      document.getElementById('flow-issues').textContent = o.openIssues;
      document.getElementById('flow-branches').textContent = o.branches;
      document.getElementById('flow-prs').textContent = o.openPrs;
      document.getElementById('flow-docs').textContent = o.docs;

      setCount('count-drafts', o.branches);
      setCount('count-requests', o.openPrs);
      setCount('count-todos', o.openIssues);
    }, failQuiet('数が出なくても操作はできる'));
  }

  function setCount(id, n) {
    var el = document.getElementById(id);
    el.textContent = n;
    el.hidden = !n;
  }

  // ===== 文書を開く =====

  /**
   * 文書を開く。版の選択肢もここで作る。
   *
   * @param {string} fileId 開く版の fileId
   * @param {string} docPath 正式版の論理パス
   */
  function openDoc(fileId, docPath) {
    var doc = allFiles.filter(function (f) {
      return splitPath(f.path).branch === 'main' && f.path === docPath;
    })[0];

    current.docPath = docPath;
    current.docFileId = doc ? doc.fileId : fileId;
    current.fileId = fileId;

    titleEl.textContent = docPath;
    renderVersionSelect();

    call('apiGetFileHtml', [fileId], function (res) {
      openLink.href = res.url;
      renderIntoViewer(res.html);
      loadLinkedIssues(fileId);
      setDocMode('view');
      refreshStatus();
      switchTab('content');
    }, failSnack('開けませんでした: '));
  }

  /**
   * この文書が持つ版を選択肢にする。正式版を先頭に置く。
   */
  function renderVersionSelect() {
    branchSelect.textContent = '';

    var versions = allFiles.filter(function (f) {
      return splitPath(f.path).path === current.docPath;
    });

    versions.sort(function (a, b) {
      return splitPath(a.path).branch === 'main' ? -1 : 1;
    });

    versions.forEach(function (f) {
      var branch = splitPath(f.path).branch;
      var opt = document.createElement('option');
      opt.value = f.fileId;
      opt.textContent = branchLabel(branch);
      if (f.fileId === current.fileId) opt.selected = true;
      branchSelect.appendChild(opt);
    });
  }

  function refreshStatus() {
    call('apiFileStatus', [current.fileId], function (st) {
      current.headSha = st.headSha;
      current.branch = st.branch;

      branchChip.textContent = branchLabel(st.branch);
      branchChip.hidden = false;
      dirtyBadge.hidden = !st.dirty;

      var isOfficial = st.branch === 'main';
      commitBtn.hidden = isOfficial || !st.dirty;
      stashBtn.hidden = !isOfficial || !st.dirty;
    }, failQuiet('状態表示の失敗は致命的ではない'));
  }

  // ===== 本文: 読む / 直す =====

  /**
   * 本文の見せ方を切り替える。
   *
   * 「直す」は文書に対する動作であってビューではないため、タブにしない。
   *
   * @param {string} mode 'view' | 'edit'
   */
  function setDocMode(mode) {
    var editing = mode === 'edit';

    modeViewBtn.setAttribute('aria-pressed', String(!editing));
    modeEditBtn.setAttribute('aria-pressed', String(editing));

    viewer.hidden = editing;
    if (!editing) showEditorSkeleton(false);
    editorEl.hidden = !editing;
    editSaveBtn.hidden = !editing;

    if (editing) loadEditor();
    else editHint.textContent = '';
  }

  /**
   * 編集欄の骨組みを出し入れする。
   *
   * @param {boolean} on
   */
  function showEditorSkeleton(on) {
    var existing = document.getElementById('editor-skeleton');
    if (existing) existing.remove();

    editorEl.hidden = on;
    if (!on) return;

    var wrap = document.createElement('div');
    wrap.id = 'editor-skeleton';
    wrap.style.flex = '1';
    showSkeleton(wrap, 'list', 6);
    editorEl.parentNode.appendChild(wrap);
  }

  function loadEditor() {
    if (!current.fileId) return;

    editorEl.value = '';
    editorEl.disabled = true;
    editSaveBtn.disabled = true;
    showEditorSkeleton(true);

    google.script.run
      .withSuccessHandler(function (res) {
        showEditorSkeleton(false);
        editorEl.value = res.markdown;
        // 保存のときに添える。開いたあとで Docs で直された分を上書きしないため
        editorBaseSha = res.baseSha || '';
        editorEl.disabled = !res.editable;
        editSaveBtn.disabled = !res.editable;
        editHint.textContent = res.editable
          ? '保存しても記録はされません。記録は上の「変更を記録」から'
          : OFFICIAL + 'は直接なおせません。改訂版を作って直してください';
      })
      .withFailureHandler(function (err) {
        showEditorSkeleton(false);
        editorEl.value = '';
        editHint.textContent = 'エラー: ' + err.message;
      })
      .apiGetMarkdown(current.fileId);
  }

  function saveEditor() {
    editSaveBtn.disabled = true;
    editHint.textContent = '保存中…';

    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.baseSha) editorBaseSha = res.baseSha;
        editSaveBtn.disabled = false;
        editHint.textContent = '保存しました';
        refreshStatus();
      })
      .withFailureHandler(function (err) {
        editSaveBtn.disabled = false;
        editHint.textContent = '';
        showSnack(err.message, { kind: 'ng' });
      })
      .apiSaveMarkdown(current.fileId, editorEl.value, editorBaseSha);
  }

  function doCommit() {
    openInlineForm(
      '変更を記録する',
      [{ name: 'message', label: 'この変更をひとことで', required: true }],
      '記録する',
      function (v) {
        commitBtn.disabled = true;
        call('apiCommit', [current.fileId, v.message, current.headSha], function () {
          commitBtn.disabled = false;
          showSnack('変更を記録しました', { kind: 'ok' });
          refreshStatus();
          loadOverview();
        }, failEnable(commitBtn, '記録できませんでした: '));
      }
    );
  }

  function stashMainDrift() {
    openConfirmStrip(
      panelContent,
      OFFICIAL + 'を直接なおした分を、退避用の記録として残します。',
      '退避する',
      doStash
    );
  }

  function doStash() {
    stashBtn.disabled = true;
    call('apiStashMainDrift', [current.fileId], function () {
      stashBtn.disabled = false;
      showSnack('直接編集を退避しました', { kind: 'ok' });
      refreshStatus();
    }, failEnable(stashBtn));
  }

  function loadLinkedIssues(fileId) {
    linkedIssuesEl.textContent = '';
    linkedIssuesEl.hidden = true;

    call('apiIssuesForFile', [fileId], function (list) {
      var issues = list || [];
      if (!issues.length) return;
      issues.forEach(function (issue) {
        var chip = document.createElement('span');
        chip.className = 'linked-issue';
        chip.textContent = 'やること #' + issue.number + ' ' + issue.title;
        linkedIssuesEl.appendChild(chip);
      });
      linkedIssuesEl.hidden = false;
    }, failQuiet('知らせなくてよい'));
  }

  // ===== 改訂の履歴 =====

  /**
   * 変更の記録の系統を描く。
   *
   * 版ごとに縦の列を持ち、分かれた地点まで線を通す。線が無いと、
   * どの記録がどの版のものか読めない。
   *
   * @param {object} row
   * @param {number} laneCount
   * @returns {SVGElement}
   */
  function makeGraphCell(row, laneCount) {
    var ns = 'http://www.w3.org/2000/svg';
    var step = 14;
    var height = 44;
    var width = Math.max(1, laneCount) * step + 6;

    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'graph-cell');
    svg.setAttribute('width', String(width));
    svg.setAttribute('height', String(height));
    svg.setAttribute('aria-hidden', 'true');

    function x(lane) { return lane * step + step / 2 + 2; }

    row.activeLanes.forEach(function (lane) {
      var line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', String(x(lane)));
      line.setAttribute('x2', String(x(lane)));
      line.setAttribute('y1', '0');
      line.setAttribute('y2', String(height));
      line.setAttribute('class', 'graph-line lane-' + (lane % 4));
      svg.appendChild(line);
    });

    // 合流してくる枝を、上の縁からこの行の点まで寄せる。
    // 線の色は寄ってくる枝のもの。真上の縦線と続いて見える
    (row.forkFrom || []).forEach(function (lane) {
      var from = x(lane);
      var to = x(row.lane);
      var mid = height / 2;

      var path = document.createElementNS(ns, 'path');
      path.setAttribute('d',
        'M' + from + ' 0' +
        ' C' + from + ' ' + (mid * 0.8) + ' ' + from + ' ' + mid + ' ' + to + ' ' + mid);
      path.setAttribute('class', 'graph-line lane-' + (lane % 4));
      path.setAttribute('fill', 'none');
      svg.appendChild(path);
    });

    var dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', String(x(row.lane)));
    dot.setAttribute('cy', String(height / 2));
    dot.setAttribute('r', row.merge ? '5' : '4');
    dot.setAttribute('class',
      'graph-dot lane-' + (row.lane % 4) + (row.merge ? ' merge' : ''));
    svg.appendChild(dot);

    return svg;
  }

  /**
   * 差分を画面いっぱいに広げる / 元に戻す。
   *
   * 長い条文は横も縦も足りない。読むあいだだけ履歴の一覧を退かせる。
   *
   * @param {boolean} on
   */
  function setDiffFull(on) {
    diffPane.classList.toggle('full', on);
    diffExpandBtn.setAttribute('aria-pressed', String(on));

    diffExpandBtn.textContent = '';
    diffExpandBtn.appendChild(makeIcon(on ? 'shrink' : 'expand'));
    diffExpandBtn.title = on ? '元の大きさに戻す (Esc)' : '画面いっぱいに広げる';
    diffExpandBtn.setAttribute('aria-label', diffExpandBtn.title);
  }

  function loadHistory() {
    if (!current.fileId) return;

    showSkeleton(historyList, 'graph', 6);
    diffView.textContent = '';

    call('apiCommitGraph', [current.fileId], function (result) {
      var graph = result || { rows: [], laneCount: 1 };
      historyList.textContent = '';

      if (!graph.rows.length) {
        historyList.appendChild(makeBlankState(
          'まだ記録がありません',
          '本文を直して「変更を記録」を押すと、ここに残ります。'
        ));
        return;
      }

      // 系統の列幅を見出しと行で揃える。ずれると読み手が列を追えない
      var laneWidth = Math.max(1, graph.laneCount) * 14 + 6;
      document.getElementById('graph-pane')
        .style.setProperty('--graph-w', laneWidth + 'px');

      var headOf = {};
      graph.rows.forEach(function (c) {
        if (!headOf[c.branch]) headOf[c.branch] = c.sha;
      });

      graph.rows.forEach(function (c) {
        var btn = document.createElement('button');
        btn.className = 'commit-item graph-row';
        btn.appendChild(makeGraphCell(c, graph.laneCount));

        var desc = document.createElement('div');
        desc.className = 'graph-col-desc';

        if (headOf[c.branch] === c.sha) {
          var label = document.createElement('span');
          label.className = 'branch-label lane-' + (c.lane % 4);
          label.appendChild(makeIcon('git-branch'));
          label.appendChild(document.createTextNode(branchLabel(c.branch)));
          desc.appendChild(label);
        }

        var msg = document.createElement('span');
        msg.className = 'commit-message';
        msg.textContent = c.message;
        desc.appendChild(msg);
        btn.appendChild(desc);

        var date = document.createElement('span');
        date.className = 'graph-col-date';
        date.textContent = new Date(c.timestamp).toLocaleString('ja-JP', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
        });
        btn.appendChild(date);

        var author = document.createElement('span');
        author.className = 'graph-col-author';
        author.textContent = personName(c.author);
        btn.appendChild(author);

        var sha = document.createElement('span');
        sha.className = 'graph-col-sha';
        sha.textContent = String(c.sha).substring(0, 7);
        btn.appendChild(sha);

        btn.addEventListener('click', function () {
          var items = historyList.querySelectorAll('.commit-item');
          for (var i = 0; i < items.length; i++) {
            items[i].setAttribute('aria-current', String(items[i] === btn));
          }
          // 狭めて列を畳んでいても、選んだ記録の素性はここで読める
          diffCaption.textContent = [
            c.message,
            date.textContent,
            String(c.author).replace(/@.*$/, ''),
            String(c.sha).substring(0, 7),
          ].join(' · ');

          showSkeleton(diffView, 'block');
          call('apiCommitDiff', [c.diffFrom || c.parentSha || '', c.sha], function (ops) {
            diffView.textContent = '';
            renderDiffInto(ops || [], diffView, false);
          }, failInto(diffView));
        });

        historyList.appendChild(btn);
      });

      historyList.firstChild.click();
    }, failInto(historyList));
  }

  // ===== この文書の改訂版 =====

  function loadDrafts() {
    draftListEl.textContent = '';

    var drafts = allFiles.filter(function (f) {
      var s = splitPath(f.path);
      return s.branch !== 'main' && s.path === current.docPath;
    });

    if (!drafts.length) {
      draftListEl.appendChild(makeBlankState(
        'この文書の改訂版はありません',
        OFFICIAL + 'をコピーして改訂版を作ると、正式版に影響を与えずに直せます。',
        { label: 'この文書の改訂版を作る', onClick: createDraft }
      ));
      return;
    }

    drafts.forEach(function (f) {
      var branch = splitPath(f.path).branch;

      var row = document.createElement('div');
      row.className = 'row-item';

      var open = document.createElement('button');
      open.className = 'row-open';
      open.appendChild(makeIcon('git-branch'));

      var title = document.createElement('span');
      title.className = 'row-title';
      title.textContent = branch;
      open.appendChild(title);

      open.addEventListener('click', function () {
        openDoc(f.fileId, current.docPath);
      });
      row.appendChild(open);
      row.appendChild(makeFileLink(f.type, f.fileId));

      draftListEl.appendChild(row);
    });
  }

  function createDraft() {
    if (!current.docFileId) {
      showSnack('先に文書を選んでください', { kind: 'ng' });
      return;
    }

    openInlineForm(
      'この文書の改訂版を作る',
      [{ name: 'name', label: '改訂版の名前 (例: 第7条の見直し)。/ と \\ は使えません', required: true }],
      '作る',
      function (v) {
        call('apiBranchCreate', [v.name, current.docFileId], function () {
          showSnack('改訂版「' + v.name + '」を作りました', { kind: 'ok' });
          loadFiles(function () {
            loadDrafts();
            renderVersionSelect();
          });
          loadOverview();
        }, failSnack('作れませんでした: '));
      }
    );
  }

  // ===== 改訂中の版 (横断) =====

  function loadBranches() {
    showSkeleton(branchListEl, 'list', 3);

    call('apiBranchList', [], function (list) {
      var branches = list || [];
      branchListEl.textContent = '';

      var drafts = branches.filter(function (b) { return b.name !== 'main'; });
      if (!drafts.length) {
        branchListEl.appendChild(makeBlankState(
          '改訂中の版はありません',
          '文書を開いて「この文書の改訂版」から作れます。'
        ));
        return;
      }

      drafts.forEach(function (b) {
        var row = document.createElement('div');
        row.className = 'row-item';

        var main = document.createElement('div');
        main.className = 'row-main';

        var title = document.createElement('div');
        title.className = 'row-title';
        title.textContent = b.name;
        main.appendChild(title);

        var files = allFiles.filter(function (f) {
          return splitPath(f.path).branch === b.name;
        });

        var meta = document.createElement('div');
        meta.className = 'row-meta';
        var names = files.map(function (f) { return splitPath(f.path).path; });

        meta.textContent = personName(b.createdBy) +
          (b.state === 'merged' ? ' · 反映済み' : ' · 改訂中') +
          // 1件目の名前だけだと、2件目があることが分からない
          (names.length ? ' · ' + names.join('、') : '');
        main.appendChild(meta);

        // 版そのものを押して中身に入れるようにする。
        // 一覧に並んでいて押せないものは、押せると思って押される
        var open = document.createElement('button');
        open.className = 'row-open';
        open.appendChild(makeIcon('git-branch'));
        open.appendChild(main);
        open.disabled = !files.length;
        open.title = files.length
          ? '「' + b.name + '」の本文を開く'
          : 'この版に文書がありません';
        open.addEventListener('click', function () {
          if (!files.length) return;
          openDoc(files[0].fileId, splitPath(files[0].path).path);
        });
        row.appendChild(open);

        if (b.state !== 'merged') {
          // 1つの改訂で規程と細則の両方を直したい、というのが現実にある。
          // 別々の改訂版に分けると確認依頼も別々になり、片方だけ反映されうる
          var addBtn = document.createElement('button');
          addBtn.className = 'btn';
          addBtn.textContent = '文書を足す';
          hint(addBtn, 'act:branch-add');
          addBtn.addEventListener('click', function () { addToBranch(b.name); });
          row.appendChild(addBtn);

          var prBtn = document.createElement('button');
          prBtn.className = 'btn btn-primary';
          prBtn.textContent = '確認を依頼する';
          prBtn.addEventListener('click', function () { createRequest(b.name); });
          row.appendChild(prBtn);
        }

        var del = document.createElement('button');
        del.className = 'btn btn-danger';
        del.appendChild(makeIcon('trash'));
        // アイコンだけなので、読み上げと吹き出しに名前を持たせる
        del.title = '改訂版「' + b.name + '」を捨てる';
        del.setAttribute('aria-label', del.title);
        del.addEventListener('click', function () {
          openConfirmStrip(panelBranches,
            '改訂版「' + b.name + '」を捨てます。中の変更は元に戻せません。',
            '捨てる',
            function () {
              call('apiBranchDelete', [b.name], function () {
                showSnack('改訂版を捨てました', { kind: 'ok' });
                loadFiles(loadBranches);
                loadOverview();
              });
            });
        });
        row.appendChild(del);

        branchListEl.appendChild(row);
      });
    }, failInto(branchListEl));
  }

  /**
   * 改訂版の変更を、正式版に反映してよいか尋ねる。
   *
   * @param {string} branchName
   */
  /**
   * 既にある改訂版に、もう1つ文書を足す。
   *
   * 足せるものだけを選ばせる。入っているものを選べてしまうと、押してから
   * 断られる。**候補はサーバに出させる。** 画面で組むと、足せない理由
   * (Slides は反映できない等) を2か所に書くことになる。
   *
   * @param {string} branchName
   */
  function addToBranch(branchName) {
    call('apiBranchAddable', [branchName], function (list) {
      var docs = list || [];

      if (!docs.length) {
        showSnack('足せる文書がありません', { kind: 'ng' });
        return;
      }

      var choices = docs.map(function (d) { return [d.fileId, d.path]; });

      openInlineForm(
        '「' + branchName + '」に文書を足す',
        [{ name: 'fileId', label: 'どの文書を足すか', choices: choices }],
        '足す',
        function (v) {
          call('apiBranchAddFile', [branchName, v.fileId], function (res) {
            showSnack(splitPath(res.path).path + ' を足しました', { kind: 'ok' });
            loadFiles(loadBranches);
          }, failSnack('足せませんでした: '));
        }
      );
    }, failSnack('候補を取れませんでした: '));
  }

  /**
   * 確認依頼の差分を、文書ごとに出す。
   *
   * 1つの依頼に複数の文書が入るので、**どれの差分なのかを言わずに並べると
   * 読めない。** 1件だけのときは見出しを出さない (自明なので邪魔になる)。
   *
   * @param {object} preview apiPrPreview の返り
   * @param {HTMLElement} host
   */
  function renderPrDiffs(preview, host) {
    var files = preview.files || [];

    if (files.length < 2) {
      renderDiffInto(preview.ops, host, true);
      return;
    }
    host.textContent = '';

    files.forEach(function (one) {
      var head = document.createElement('div');
      head.className = 'diff-file-head';

      var name = document.createElement('span');
      name.className = 'diff-file-name';
      name.textContent = one.path;
      head.appendChild(name);

      // 食い違いがある文書は先に分かるようにする
      if (!one.clean) {
        head.appendChild(makePill(
          '同じ場所が両方で変わっています', 'chip chip-pri-high'));
      }
      host.appendChild(head);

      var box = document.createElement('div');
      host.appendChild(box);
      renderDiffInto(one.ops, box, true);
    });
  }

  /**
   * コードの変更 (unified diff) を描く。
   *
   * 文書の差分の描き方は使い回さない。あちらは HTML の行を「見出し2」の
   * ように読み替えて見せるもので、コードには当てはまらない。**コードは
   * 書いたとおりの字で見せる。** 1バイト違えば別物なのが前提なので、
   * 整形して見せると読み手が判断を誤る。
   *
   * @param {string} text
   * @param {HTMLElement} host
   */
  function renderPatch(text, host) {
    var lines = String(text || '').split('\n');
    var box = document.createElement('div');
    box.className = 'patch';

    lines.forEach(function (line) {
      var row = document.createElement('div');
      var head = line.charAt(0);
      var kind = 'ctx';

      if (line.indexOf('@@') === 0) kind = 'hunk';
      else if (line.indexOf('+++') === 0 || line.indexOf('---') === 0) kind = 'file';
      else if (head === '+') kind = 'add';
      else if (head === '-') kind = 'del';

      row.className = 'patch-line patch-' + kind;
      // 他人が書いたコードを出すので、字としてだけ置く
      row.textContent = line === '' ? ' ' : line;
      box.appendChild(row);
    });
    host.appendChild(box);
  }

  /**
   * 確認依頼に添えられたコードの変更を出す。
   *
   * **この道具はコードを反映しない。** 読んで決めるためのものなので、
   * そう書いてある断りを必ず添える。書いていないと「承認したのに入って
   * いない」になる。
   *
   * @param {object} pr
   * @param {HTMLElement} host
   */
  function renderPrPatches(pr, host) {
    host.textContent = '';

    var note = document.createElement('div');
    note.className = 'side-note';
    note.textContent = 'コードの変更は、この道具では反映されません。' +
      '読んで確かめるためのもので、実際に入れるのは手元の git です。';
    host.appendChild(note);

    call('apiPrPatches', [pr.number], function (list) {
      var rows = list || [];

      if (!rows.length) {
        host.appendChild(makeBlankState(
          'コードの変更はありません',
          '手元から「agent patch <確認依頼の番号> <ファイル>」で添えられます。'
        ));
        return;
      }

      rows.forEach(function (one) {
        var head = document.createElement('div');
        head.className = 'diff-file-head';

        var name = document.createElement('span');
        name.className = 'diff-file-name mono';
        name.textContent = one.path;
        head.appendChild(name);

        head.appendChild(makePill(
          '+' + one.added + ' −' + one.removed, 'patch-stat'));

        var who = document.createElement('span');
        who.className = 'row-meta';
        who.textContent = personName(one.by) +
          (one.at ? ' · ' + String(one.at).substring(0, 10) : '');
        head.appendChild(who);

        host.appendChild(head);
        renderPatch(one.text, host);
      });
    }, failInto(host));
  }

   * この道具から手元へ向かう経路は Drive の同期だけで、**押すのではなく
   * 取りに来る形**である。まだ取られていないものは「待っています」と出す。
   * 「送りました」と書くと、すぐ動くと思われる。
   *
   * @param {object} pr
   * @param {HTMLElement} host

  function renderPrWork(pr, host) {

      });

      if (!mine.length) {

      mine.forEach(function (w) {

        title.className = 'row-title';

  /**
   * 手元に頼む入口を作る。
   *
   * 頼めることはサーバに出させる (`apiOutboxVerbs`)。画面に写すと、動詞を
   * 足したときに「選べるのに置けない」ものが出る。
   *
   * @param {object} pr
   * @param {HTMLElement} host 頼んだあとに描き直す器
   * @returns {HTMLElement}
   */
  function makeAskButton(pr, host) {
    var btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '手元に頼む';
    hint(btn, 'act:ask-work');

    btn.addEventListener('click', function () {
      call('apiOutboxVerbs', [], function (list) {
        var verbs = (list || []).filter(function (v) {
          // 取り込みは承認したときに自動で置かれる。手で二重に頼ませない
          return v[0] !== 'merge';

        if (!verbs.length) {

        }

        openInlineForm(
          '手元に頼む: 確認依頼 #' + pr.number,

          ],
          '頼む',
          function (v) {
            call('apiOutboxAdd',
              [v.verb, { branch: pr.sourceBranch, against: pr.targetBranch },
                { prNumber: pr.number, note: v.note }],
              function () {
                showSnack('頼みごとを置きました', { kind: 'ok' });
                renderPrWork(pr, host);
