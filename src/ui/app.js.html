   */
  function reportError(text) {
    var bar = document.getElementById('fatal-error');

    if (!bar) {

      bar.id = 'fatal-error';
      bar.className = 'fatal-error';
      bar.setAttribute('role', 'alert');

  }

  var latestAsked = Object.create(null);

   * @returns {function(): boolean} still。.only(fn) は still() のときだけ fn を呼ぶ

  function latest(key) {
    latestAsked[key] = (latestAsked[key] || 0) + 1;
    return latestSoFar(key);
  }

  /**

  function latestSoFar(key) {
    var mine = latestAsked[key] || 0;
    function still() { return (latestAsked[key] || 0) === mine; }
    still.only = function (fn) {
      return function () {
        if (still()) return fn.apply(this, arguments);
      };
    };
    return still;
  }

  function fileUrlOf(type, fileId) {
    if (!fileId) return '';
    var base = {
      doc: 'https://docs.google.com/document/d/',
      sheet: 'https://docs.google.com/spreadsheets/d/',
      slide: 'https://docs.google.com/presentation/d/',
    }[String(type)];

    return base + fileId + '/edit';
  }

  function diffPairs(ops) {
    var out = [];
    var dels = [];
    var ins = [];

    function flush() {
      var n = Math.max(dels.length, ins.length);
      for (var i = 0; i < n; i++) {
        var left = i < dels.length ? dels[i] : null;
        var right = i < ins.length ? ins[i] : null;
        var type = (left !== null && right !== null)
          ? 'change' : (left !== null ? 'delete' : 'insert');
        out.push({ left: left, right: right, type: type });
      }
      dels = [];
      ins = [];
    }

    for (var i = 0; i < (ops || []).length; i++) {
      var op = ops[i];
      if (op.type === 'delete') { dels.push(op.line); continue; }
      if (op.type === 'insert') { ins.push(op.line); continue; }
      flush();
      out.push({ left: op.line, right: op.line, type: 'equal' });
    }
    flush();
    return out;
  }

      : { branch: 'main', path: String(path || '') };
  }

   */
  function hint(el, key) {
    // 言葉の表し方が変わったら applyTerms が key から引き直す
    if (el && HINTS[key]) el.setAttribute('data-hint-key', key);
    return attachHint(el, termIn(HINTS[key] || ''));
  }

  /**
   * 絞り込みの入り切りを、見て分かる形にする。
   *
   * ただのボタンだと、押したのか絞り込んでいるのかが区別できない。
   * つまみのある切り替えにして、いまどちらなのかを形で示す。
   *
   * @param {HTMLElement} btn
   * @param {boolean} on
   */
  function setToggle(btn, on) {
    btn.setAttribute('role', 'switch');
    btn.setAttribute('aria-checked', String(on));
    btn.classList.toggle('on', on);

    if (!btn.querySelector('.switch-track')) {
      var track = document.createElement('span');
      track.className = 'switch-track';
      track.setAttribute('aria-hidden', 'true');

      var knob = document.createElement('span');
      knob.className = 'switch-knob';
      track.appendChild(knob);

      btn.insertBefore(track, btn.firstChild);
      btn.classList.add('switch');
    }
  }

  /**
   * 押す前に、何が起きるかを補足する。

   * 見えない控えを置いて aria-describedby で結ぶ。
   *
   * @param {HTMLElement} el
   * @param {string} text
   * @returns {HTMLElement} el
   */
  function attachHint(el, text) {
    if (!el || !text) return el;

    el.classList.add('has-hint');
    el.setAttribute('data-hint', text);

    // 名前が無いものには、いま持っている吹き出しを名前にしてから外す。
    // ブラウザ既定の吹き出しと二重に出ると、遅れて出るほうが邪魔になる
    if (!el.getAttribute('aria-label') && el.title) {
      el.setAttribute('aria-label', el.title);

    el.removeAttribute('title');

    var note = document.createElement('span');
    note.id = id;
    note.className = 'sr-only';
    note.textContent = text;

    el.setAttribute('aria-describedby', id);

    // 控えは1か所にまとめて置く。隣に差し込むと、並びで組んでいる

   *
   * @param {HTMLElement} el
   * @param {string} text
   */
  function setHintText(el, text) {
    if (!el || !text) return;
    if (!el.classList.contains('has-hint')) {
      attachHint(el, text);
      return;
    }
    el.setAttribute('data-hint', text);
    var note = document.getElementById(el.getAttribute('aria-describedby'));
    if (note) note.textContent = text;

  var hintHost = null;

  /**
   * その位置にある、補足を持つ要素を返す。
   *
   * 要素ごとに出入りを見ると、押した拍子に一覧が描き直されたときに
   * 「離れた」が来ず、吹き出しが出たまま残る。画面全体で位置を見る。
   *
   * @param {EventTarget} target
   * @returns {HTMLElement|null}
   */
  function hintHostOf(target) {
    var el = target;

    while (el && el !== document) {
      if (el.classList && el.classList.contains('has-hint')) return el;
      el = el.parentNode;
    }
    return null;
  }

  /**
   * 触れている相手に合わせて出し入れする。
   *
   * @param {EventTarget} target
   */
  function trackHint(target) {
    var host = hintHostOf(target);

    if (!host) return hideHint();
    if (host === hintHost) return;

    showHint(host);
  }

  /**
   * 補足の吹き出し。1つだけ作って使い回す。
   *
   * @returns {HTMLElement}
   */
  function hintBubble() {
    var el = document.getElementById('hint-bubble');
    if (el) return el;

    el = document.createElement('div');
    el.id = 'hint-bubble';
    el.className = 'hint-bubble';
    el.hidden = true;
    // 触れられると、その下の要素に触れられなくなる
    el.setAttribute('aria-hidden', 'true');

    document.body.appendChild(el);
    return el;
  }

  /**
   * 補足を出す。
   *
   * 器の中に描くと、幅の狭いペインや巻き取る器 (overflow) に切り取られ、
   * 下に埋もれる。器の外に1つだけ置き、窓を基準に位置を決める。
   *
   * @param {HTMLElement} el
   */
  function showHint(el) {
    var text = el.getAttribute('data-hint');
    if (!text) return;

    var box = hintBubble();
    hintHost = el;
    box.textContent = text;
    box.hidden = false;

    // いったん左上に置いてから測る。前の位置のままだと大きさが変わらない
    box.style.left = '0';
    box.style.top = '0';

    var rect = el.getBoundingClientRect();
    var size = box.getBoundingClientRect();
    var gap = 8;
    var edge = 8;

    var left = rect.left;
    if (left + size.width > window.innerWidth - edge) {
      left = window.innerWidth - edge - size.width;
    }

    var top = rect.bottom + gap;
    if (top + size.height > window.innerHeight - edge) {
      top = rect.top - gap - size.height;
    }

    // 窓の外には置かない。押した要素が端に半分隠れていることがある
    left = Math.max(edge, left);
    top = Math.max(edge, top);

    box.style.left = Math.round(left) + 'px';
    box.style.top = Math.round(top) + 'px';
  }

  /**
   * 補足をしまう。
   */
  function hideHint() {
    hintHost = null;

    var box = document.getElementById('hint-bubble');
    if (!box || box.hidden) return;

    box.hidden = true;
    box.textContent = '';
  }

    return box;
  }

  function priorityLabel(value) {

  function makePriorityChip(issue) {

    if (want === 'normal') return null;

   * 決め、組み立てはここに寄せる。**
   *

   * 別々の字の大きさと余白を持っていた。
   *
   * @param {string} text 出す字

   * @param {string} [icon] 添える印の名
   * @returns {HTMLElement}

  /**

   *

   * 形で置いたほうが早い。
   *
   * 図を描く道具 (Mermaid など) は足さない。読み込みが1つ増えるうえ、

   *   lanes  背景の帯。主語（正式版/改訂版、できる/できない）を囲む

      if (raw.indexOf('{') >= 0) el.setAttribute('data-term', raw);

    wrap.className = 'diagram';

    svg.setAttribute('viewBox', '0 0 ' + spec.width + ' ' + spec.height);
    svg.setAttribute('role', 'img');

    var title = document.createElementNS(ns, 'title');
    say(title, spec.title);
    svg.appendChild(title);

    var desc = document.createElementNS(ns, 'desc');
    say(desc, spec.desc);
    svg.appendChild(desc);

    // 矢印の先。同じ頁に2つ並ぶので、名前を分ける
    var mark = 'arrow-' + (++diagramSeq);
    var defs = document.createElementNS(ns, 'defs');

    ['', 'soft'].forEach(function (tone) {
      var marker = document.createElementNS(ns, 'marker');
      marker.setAttribute('id', mark + (tone ? '-' + tone : ''));
      marker.setAttribute('viewBox', '0 0 8 8');
      marker.setAttribute('refX', '7');
      marker.setAttribute('refY', '4');
      marker.setAttribute('markerWidth', '6');
      marker.setAttribute('markerHeight', '6');
      marker.setAttribute('orient', 'auto-start-reverse');

      var head = document.createElementNS(ns, 'path');
      head.setAttribute('d', 'M0 0l8 4-8 4z');
      head.setAttribute('class', 'diagram-head' + (tone ? ' ' + tone : ''));
      marker.appendChild(head);

      defs.appendChild(marker);
    });
    svg.appendChild(defs);

    /**
     * @param {string} name
     * @param {object} attrs
     * @returns {SVGElement}
     */
    function add(name, attrs) {
      var el = document.createElementNS(ns, name);

      for (var key in attrs) {
        if (Object.prototype.hasOwnProperty.call(attrs, key)) {
          el.setAttribute(key, attrs[key]);
        }
      }
      svg.appendChild(el);
      return el;
    }

    // 帯は主語を囲むもの。いちばん下に敷く
    (spec.lanes || []).forEach(function (lane) {
      add('rect', {
        x: lane.x, y: lane.y, width: lane.w, height: lane.h, rx: 8,
        class: 'diagram-lane' + (lane.tone ? ' ' + lane.tone : ''),
      });

      if (!lane.label) return;

      var tag = add('text', {
        x: lane.x + 12, y: lane.y + 18,
        class: 'diagram-lane-text' + (lane.tone ? ' ' + lane.tone : ''),
      });
      say(tag, lane.label);
    });

    (spec.arrows || []).forEach(function (arrow) {
      var line = add('path', {
        d: arrow.d,
        class: 'diagram-arrow' + (arrow.soft ? ' soft' : '') +
          (arrow.dash ? ' dash' : ''),
      });

      // 帯の底や時間の流れを表す線には先を付けない。先が2つ並ぶと
      // どちらへ向かっているのか読めなくなる
      if (!arrow.bare) {
        line.setAttribute(
          'marker-end', 'url(#' + mark + (arrow.soft ? '-soft' : '') + ')');
      }

      if (!arrow.label) return;

      var text = add('text', {
        x: arrow.lx, y: arrow.ly, class: 'diagram-label',
        'text-anchor': 'middle',
      });
      say(text, arrow.label);
    });

    (spec.boxes || []).forEach(function (box) {
      add('rect', {
        x: box.x, y: box.y, width: box.w, height: box.h, rx: 8,
        class: 'diagram-box' + (box.tone ? ' ' + box.tone : ''),
      });

      // 下に小さい字を足すぶん、見出しは上へ寄せる
      var mid = box.y + box.h / 2 + (box.sub ? -8 : 0);
      var lines = box.label.split('\n');
      lines.forEach(function (line, at) {
        var text = add('text', {
          x: box.x + box.w / 2,
          y: mid + (at - (lines.length - 1) / 2) * 15 + 5,
          class: 'diagram-text' + (box.tone ? ' ' + box.tone : ''),
          'text-anchor': 'middle',
        });
        say(text, line);
      });

      if (!box.sub) return;

      var sub = add('text', {
        x: box.x + box.w / 2, y: box.y + box.h - 9,
        class: 'diagram-sub', 'text-anchor': 'middle',
      });
      say(sub, box.sub);
    });

    // 点は「その時点」。記録が並んでいく様子を線の上に置く
    (spec.dots || []).forEach(function (dot) {
      add('circle', {
        cx: dot.cx, cy: dot.cy, r: dot.r || 7,
        class: 'diagram-dot' + (dot.tone ? ' ' + dot.tone : ''),
      });

      if (!dot.label) return;

      var text = add('text', {
        x: dot.cx, y: dot.cy + (dot.below ? 24 : -15),
        class: 'diagram-label', 'text-anchor': 'middle',
      });
      say(text, dot.label);
    });

    (spec.notes || []).forEach(function (note) {
      var text = add('text', {
        x: note.x, y: note.y,
        class: 'diagram-note' + (note.mono ? ' mono' : '') +
          (note.tone ? ' ' + note.tone : ''),
        'text-anchor': note.anchor || 'start',
      });
      say(text, note.text);
    });

    wrap.appendChild(svg);

    if (spec.caption) {
      var cap = document.createElement('figcaption');
      cap.className = 'row-meta';
      say(cap, spec.caption);
      wrap.appendChild(cap);
    }
    return wrap;
  }

  function readTheme() {

  // ===== ペインの幅 =====

  /**
   * 境界を掴んで左ペインの幅を変えられるようにする。
   *
   * 掴む操作だけを用意すると、キーボードだけの利用者が幅を変えられない。
   */
  /**
   * 境界を掴んで幅を変えられるようにする。
   *
   * 掴む操作だけを用意すると、キーボードだけの利用者が幅を変えられない。
   *
   * @param {HTMLElement} handle 境界の要素
   * @param {string} cssVar 幅を入れるCSS変数
   * @param {string} key 覚えておくときの名前
   * @param {function(PointerEvent): number} measure 掴んだ位置から幅を出す
   * @param {{min:number, max:number}} limit
   */
  function makeResizable(handle, cssVar, key, measure, limit) {
    var dragging = false;

    /**
     * いまの幅 (px)。既定が割合 (46% など) のペインは字のままでは px にならない
     * ので、隣のペインを測る。測れない (隠れている) ときは null
     */
    function current() {
      var raw = String(
        getComputedStyle(document.documentElement).getPropertyValue(cssVar)
      ).replace(/^\s+|\s+$/g, '');
      if (/^\d+(\.\d+)?px$/.test(raw)) return parseInt(raw, 10);

      var pane = handle.previousElementSibling;
      var w = pane ? Math.round(pane.getBoundingClientRect().width) : 0;
      return w > 0 ? w : null;
    }

    /*
     * 読み上げにも今の幅を伝える。separator は値を持てる役割で、値が無いと
     * 「動かせる境界」とだけ読まれ、どこまで動いたのかが分からない
     */
    function announce(px) {
      if (px === null) handle.removeAttribute('aria-valuenow');
      else handle.setAttribute('aria-valuenow', String(px));
    }

    function forget() {
      document.documentElement.style.removeProperty(cssVar);
      try {
        window.localStorage.removeItem(key);
      } catch (e) { /* 消せなくても既定には戻る */ }
      announce(current());
    }

    function set(px) {
      var w = Math.min(limit.max, Math.max(limit.min, Math.round(px)));
      document.documentElement.style.setProperty(cssVar, w + 'px');
      announce(w);
      return w;
    }

    function save(px) {
      try {
        window.localStorage.setItem(key, String(px));
      } catch (e) { /* 覚えられなくても操作はできる */ }
    }

    handle.setAttribute('aria-valuemin', String(limit.min));
    handle.setAttribute('aria-valuemax', String(limit.max));
    announce(current());

    // 起動時に隠れていたペインは測れず値を持たない。触れた時に測り直す
    handle.addEventListener('focus', function () { announce(current()); });

    try {
      var saved = Number(window.localStorage.getItem(key));
      if (saved) set(saved);
    } catch (e) { /* 既定のままでよい */ }

    /**
     * 掴むのをやめる。
     *
     * 離した合図は1つに頼れない。枠の外で離すと pointerup が届かず、
     * 掴んだまま張り付いて、その後は触れるだけで幅が動いてしまう。
     * 取り消し (pointercancel) と捕捉の喪失でも必ず外す
     *
     * @param {PointerEvent} e
     */
    function stop(e) {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');

      try {
        handle.releasePointerCapture(e.pointerId);
      } catch (err) { /* 既に外れていることがある */ }

      if (typeof e.clientX === 'number') save(set(measure(e)));
    }

    handle.addEventListener('pointerdown', function (e) {
      // 右クリックや副ボタンでは掴まない
      if (e.button > 0 || e.isPrimary === false) return;

      dragging = true;
      handle.classList.add('dragging');

      try {
        handle.setPointerCapture(e.pointerId);
      } catch (err) { /* 捕捉できなくても window 側で拾う */ }

      e.preventDefault();
    });

    handle.addEventListener('pointermove', function (e) {
      if (dragging) set(measure(e));
    });

    handle.addEventListener('pointerup', stop);
    handle.addEventListener('pointercancel', stop);
    handle.addEventListener('lostpointercapture', function () {
      dragging = false;
      handle.classList.remove('dragging');
    });

    // 枠の外で離されたときの受け皿
    window.addEventListener('pointerup', stop);

    // 二度押しで元の幅に戻す。行き過ぎたときに戻す手立てが要る
    handle.addEventListener('dblclick', function () {
      forget();
      showSnack('幅を元に戻しました');
    });

    handle.addEventListener('keydown', function (e) {
      var now = current();
      if (now === null) now = limit.min;

      if (e.key === 'ArrowLeft') save(set(now - 16));
      else if (e.key === 'ArrowRight') save(set(now + 16));
      else if (e.key === 'Home') forget();
      else return;

      e.preventDefault();
    });
  }

  // ===== モードレスな通知と入力 =====

  var snackTimer = null;

  /**
   * バナー通知を出す。
   *
   * alert はモーダルで操作を止め、取り消しの手段も与えない。
   *
   * @param {string} text
   * @param {{kind?: string, undo?: function, ms?: number}} [opts]
   * @returns {HTMLElement} 出した帯。遅れて届く返事が、まだ同じ帯か確かめるのに使う
   */
  function showSnack(text, opts) {
    var options = opts || {};

    var old = document.getElementById('snackbar');
    if (old) old.remove();
    if (snackTimer) window.clearTimeout(snackTimer);

    var bar = document.createElement('div');
    bar.id = 'snackbar';
    bar.className = 'snackbar' + (options.kind ? ' ' + options.kind : '');
    bar.setAttribute('role', 'status');
    bar.setAttribute('aria-live', 'polite');

    var span = document.createElement('span');
    span.className = 'snackbar-text';
    span.textContent = text;
    bar.appendChild(span);

    // 終えたことを、印1つで返す。派手にすると動機がかえって下がる (Kao ら 2024)
    if (options.mark) bar.insertBefore(makeSnackMark(options.mark), span);

    if (options.action) {
      var actBtn = document.createElement('button');
      actBtn.type = 'button';
      actBtn.textContent = options.action.label;
      actBtn.addEventListener('click', function () {
        bar.remove();
        options.action.run();
      });
      bar.appendChild(actBtn);
    }

    if (options.undo) {
      var undoBtn = document.createElement('button');
      undoBtn.type = 'button';
      undoBtn.textContent = '取り消す';
      undoBtn.addEventListener('click', function () {
        bar.remove();
        options.undo();
      });
      bar.appendChild(undoBtn);
    }

    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.textContent = '閉じる';
    closeBtn.addEventListener('click', function () { bar.remove(); });
    bar.appendChild(closeBtn);

    document.body.appendChild(bar);

    // 押す間が要るものは長めに出す
    var ms = options.ms || (options.undo || options.action ? 10000 : 5000);
    snackTimer = window.setTimeout(function () { bar.remove(); }, ms);
    return bar;
  }

  /**
   * 帯の左の印。チェックの線を描き、進み具合があれば細い棒を出す。
   *
   * @param {{done?: number, total?: number}} mark
   * @returns {HTMLElement}
   */
  function makeSnackMark(mark) {
    var box = document.createElement('span');
    box.className = 'snack-mark';
    box.setAttribute('aria-hidden', mark.total ? 'false' : 'true');

    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('class', 'snack-check');
    var path = document.createElementNS(ns, 'path');
    path.setAttribute('d', 'M5 12l5 5L19 7');
    svg.appendChild(path);
    box.appendChild(svg);

    if (mark.total) {
      var track = document.createElement('span');
      track.className = 'snack-progress';
      track.setAttribute('role', 'progressbar');
      track.setAttribute('aria-label', '小分けの進み具合');
      track.setAttribute('aria-valuemin', '0');
      track.setAttribute('aria-valuemax', String(mark.total));
      track.setAttribute('aria-valuenow', String(mark.done));
      var fill = document.createElement('span');
      fill.className = 'snack-progress-fill';
      // 前の値から1段伸びる。動きを減らす設定では CSS が transition を止める
      fill.style.width = Math.round(Math.max(mark.done - 1, 0) / mark.total * 100) + '%';
      track.appendChild(fill);
      box.appendChild(track);
      // 2つ先の描画で伸ばす。1つ先だと、始めの幅が描かれる前に終わりの幅へ
      // 置き換わり、transition が走らずに飛ぶ
      window.requestAnimationFrame(function () {
        window.requestAnimationFrame(function () {
          fill.style.width = Math.round(mark.done / mark.total * 100) + '%';
        });
      });
    }
    return box;
  }

  // ===== サーバを呼ぶ =====

  /**
   * サーバの api 関数を呼ぶ。
   *
   * `google.script.run` は、**失敗ハンドラを付け忘れると失敗が完全に黙る**
   * 作りになっている。呼ぶたびに書いていると、いつか1つ書き忘れ、その画面
   * だけが「押しても何も起きない」になる。ここを通せば既定で知らせが出る。
   *
   * 以前は同じ形が86か所に写されていて、そのうち失敗の見せ方は6通りしか
   * なかった。見せ方は下の `fail*` に寄せてある。
   *
   * 引数を配列で渡すのは、`google.script.run` が「名前を呼び出す」形だから
   * である。`run[name].apply` で渡す。
   *
   * @param {string} name api 関数の名前
   * @param {Array} args その引数
   * @param {function} [onOk] 返ってきたときにすること
   * @param {function} [onFail] 省略すると、短い帯で知らせる
   */
  function call(name, args, onOk, onFail) {
    // 入力欄から送ったものなら、失敗したときに書いたまま開き直す
    var draft = formDraftForCall;
    formDraftForCall = null;

    var failed = onFail || failSnack();
    var ok = onOk || function () {};
    var run = google.script.run
      .withSuccessHandler(function (res) {
        if (searchIndexChangedBy(name)) searchIndexStale();
        ok(res);
      })
      .withFailureHandler(function (err) {
        failed(err);
        if (draft) reopenDraft(draft);
      });

    run[name].apply(run, args || []);
  }

  /**
   * この api が成功すると、横断検索の一覧が古くなるか。
   *
   * 一覧は60秒取り直さない。そのあいだに閉じた・戻した・捨てた・反映したものを
   * 前の状態のまま開きに行くと、別の道へ進む (済んだ報告を「未解決だけ」の
   * 一覧で探して見つからない、など)。**成功した呼び出しの名前だけで決める。**
   * 呼ぶ場所ごとに書くと、書き忘れた操作だけが古いまま残る。
   *
   * 一覧に出るのは題名・番号・状態・あるかないかだけなので、それを作る・消す・
   * 直す・状態を動かす動詞で終わる名前を数える。読むだけのもの
   * (apiIssueList / apiSearchIndex / apiHomeSummary / …List / …Get /
   * …Preview / …State など) はどれにも当たらない。余分に当たっても
   * 取り直すだけで、害は無い。**書き込みの api を足したら、ここに当たるかを
   * 確かめる。** call() を通らない呼び出しには効かないので、一覧に出るものを
   * 動かす呼び出しは call() で書く。
   *
   * 動詞の形に当たらないのに一覧を動かすものは、名前を1つずつ並べる。
   * スクラムの切り替え (障害物が出る・消える)、ToDo の取り込み (やることが
   * 完了になる)、承認・差し戻し (確認依頼の状態が動く)、1件の登録、
   * 確認依頼の一覧 (元の文書が消えた依頼をその場で取り下げる)。
   *
   * @param {string} name api 関数の名前
   * @returns {boolean}
   */
  function searchIndexChangedBy(name) {
    var n = String(name || '');
    return /^api.*(Create|CreateBranch|Update|Close|Reopen|Archive|Restore|Purge|Merge|Delete|Resolve|RegisterFiles|UnregisterFile|AddFile|Move)$/.test(n) ||
      /^(apiSetScrumEnabled|apiTasksSync|apiPrReview|apiRegisterFile|apiPrList)$/.test(n);
  }

  /**
   * 入力欄から送った直後の、いちばん初めの call() に渡す控え。
   *
   * 入力欄はサーバの返事を待たずに閉じる。失敗すると (混み合っているとき
   * など) 書いた本文ごと消え、最初から書き直すことになっていた。送った内容を
   * 控えておき、失敗したら書いたまま開き直す。成功すれば控えは捨てる。
   */
  var formDraftForCall = null;

  /**
   * 控えた入力欄を、書いた内容のまま開き直す。
   *
   * @param {object} draft openInlineForm が控えたもの
   */
  function reopenDraft(draft) {
    var fields = draft.fields.map(function (f) {
      var copy = {};
      Object.keys(f).forEach(function (k) { copy[k] = f[k]; });
      copy.value = draft.values[f.name];
      return copy;
    });
    openInlineForm(draft.title, fields, draft.submitLabel, draft.onSubmit, draft.sourceEl);
  }

  /**
   * 失敗を短い帯で知らせる。これが既定である。
   *
   * 前置きを添えると「何が」できなかったのかが伝わる。サーバからの文だけ
   * では、押した操作と結び付かないことがある。
   *
   * @param {string} [prefix] 例 '記録できませんでした: '
   * @returns {function}
   */
  function failSnack(prefix) {
    return function (err) {
      showSnack(String(prefix || '') + err.message, { kind: 'ng' });
    };
  }

  /**
   * 失敗を器の中に出す。
   *
   * 一覧そのものが出てこないときは、帯より器に出したほうが「ここが
   * 出ていない」と分かる。帯は数秒で消えるため、後から見た人に伝わらない。
   *
   * @param {HTMLElement} el
   * @returns {function}
   */
  function failInto(el) {
    return function (err) {
      el.textContent = 'エラー: ' + err.message;
    };
  }

  /**
   * 押せるように戻してから知らせる。
   *
   * 押した間は押せなくしてあるので、戻さないと**二度と押せなくなる**。
   * 失敗したのに押し直せない、がいちばん困る。
   *
   * @param {HTMLElement} btn
   * @param {string} [prefix]
   * @returns {function}
   */
  function failEnable(btn, prefix) {
    return function (err) {
      btn.disabled = false;
      showSnack(String(prefix || '') + err.message, { kind: 'ng' });
    };
  }

  /**
   * 知らせずに済ませる。
   *
   * 出なくても操作は続けられるもの (候補の一覧、既定値の取得など) に限る。
   * **なぜ黙るのかを必ず書く。** 書けないなら、黙ってよい理由がない。
   *
   * 画面には出さないが、追えるようにはしておく。以前は空の関数だったため、
   * 失敗したことがどこにも残らなかった。
   *
   * @param {string} why 黙ってよい理由
   * @returns {function}
   */
  function failQuiet(why) {
    return function (err) {
      if (window.console && window.console.warn) {
        window.console.warn(String(why) + ': ' + (err && err.message));
      }
    };
  }

  /**
   * 画面内に入力フォームを開く。prompt の置き換え。
   *

 *   choices?: Array<Array<string>>}>} fields
   * @param {string} submitLabel
   * @param {function(Object<string,string>): void} onSubmit
   * @param {HTMLElement} [sourceEl] この入力が対象としている要素
   * @returns {HTMLElement} 差し込んだフォーム

  /** いま編集している対象の要素。印を付け外しするために覚えておく */
  var sideSource = null;

  /**
   * どれを編集しているのかを画面上で示す。
   *
   * 右に入力が出ても、一覧のどの行に対するものかが分からないと、
   * 直したつもりの対象を取り違える。
   *
   * @param {HTMLElement|null} el
   */
  function setSideSource(el) {
    if (sideSource) sideSource.classList.remove('editing');

    // 要素でないものが渡ることがある。印を付けられないだけで、
    // 入力そのものは開けたほうがよい
    sideSource = (el && el.classList) ? el : null;
    if (sideSource) sideSource.classList.add('editing');
  }

  /**
   * 右のペインを開くか閉じる。
   *
   * 掴み手 (resizer) はペインと同時に出し入れする。**片方だけ触ると、
   * 閉じているのに分け目の線だけが宙に残る。** 以前は3か所で
   * `sidePanel.hidden` を直に触っていたので、ここに寄せた。
   *
   * @param {boolean} open
   */
  function setSideOpen(open) {
    // 全画面では右のペインが隠れている。開くなら抜ける (開いたのに見えない)
    if (open && document.body.classList.contains('doc-full')) setDocFull(false);
    sidePanel.hidden = !open;
    sideResizer.hidden = !open;
    // 開け閉めのたびに進める。返事を待つあいだに人が右を触ったかを、
    // 返事のハンドラが見分けるため (impedimentMayReopen)
    sideGeneration++;
  }

  /** 右のペインを開け閉めした回数 */
  var sideGeneration = 0;

  /**
   * 右に読む形で開いているもの ({kind: 'issue' | 'impediment', number})。入力欄や別のものを
   * 開いたら null。見出しの字では比べない (言葉の表し方で字が変わる)
   */
  var sideShowing = null;

  /**
   * 右のパネルを閉じる。
   */
  function closeSide() {
    setSideOpen(false);
    sideBody.textContent = '';
    sideShowing = null;
    termText(sideTitle, '');
    setSideEdit(null);
    setSideSource(null);
  }

  /**
   * 見出しの脇に「直す」を出す。
   *
   * 読むために開いたのに書き換えの形で出てくると、触っただけで中身が
   * 変わりそうで怖い。読む形を先に見せ、直すのは押してから。
   *
   * @param {function|null} onEdit
   */
  function setSideEdit(onEdit) {
    sideEditBtn.textContent = '';
    sideEditBtn.hidden = !onEdit;
    if (!onEdit) return;

    sideEditBtn.appendChild(makeIcon('pencil'));
    sideEditBtn.setAttribute('aria-label', '直す');
    attachHint(sideEditBtn, '書き換えられる形にします');

    sideEditBtn.onclick = onEdit;
  }

  /**
   * 右のパネルに入力フォームを開く。
   *
   * 一覧の上に差し込むと、書いている間に一覧が押し下げられ、何に対する
   * 入力なのかが見えなくなる。右に出せば対象を見ながら書ける。
   *
   * @param {string} title 何の入力かを示す見出し
   * @param {Array<{name:string, label:string, multiline?:boolean, required?:boolean,
 *   choices?: Array<Array<string>>}>} fields
   * @param {string} submitLabel
   * @param {function(Object<string,string>): void} onSubmit
   * @returns {HTMLElement} 差し込んだフォーム
   */
  function openInlineForm(title, fields, submitLabel, onSubmit, sourceEl) {
    setSideEdit(null);
    setSideSource(sourceEl);
    sideBody.textContent = '';
    sideShowing = null;
    termText(sideTitle, title);
    setSideOpen(true);

    var form = document.createElement('form');
    form.className = 'inline-form';

    var inputs = {};
    fields.forEach(function (f) {
      var label = document.createElement('label');
      // ラベルの字と印は1行に並べる。印を欄の上に別の行で置くと、欄の幅に
      // 引き伸ばされて札に見えない
      var head = document.createElement('span');
      head.className = 'field-label';
      head.textContent = f.label;
      label.appendChild(head);

      // 決まったものから選ばせたい欄は選択肢にする。自由に書かせると
      // 表記が割れて数えられなくなる
      var input;
      if (f.choices) {
        input = document.createElement('select');
        f.choices.forEach(function (pair) {
          var opt = document.createElement('option');
          opt.value = pair[0];
          opt.textContent = pair[1];
          input.appendChild(opt);
        });
      } else {
        input = document.createElement(f.multiline ? 'textarea' : 'input');
        // 日付は打たせずに選ばせる (date)。字で打つと形が割れる
        if (!f.multiline) input.type = f.type || 'text';
      }
      // 呼ぶ側が欄を名前で引けるようにする (補完や入力時の確かめに使う)
      input.name = f.name;

      if (f.required) {
        input.required = true;
        // 必須は字で示す。赤い枠や * だけでは、何のことか伝わらない
        head.appendChild(makePill('必須', 'chip field-required'));
      }
      // 書き方の見本。入れたら消えるので、決まりは note に書く
      if (f.placeholder && !f.choices) input.placeholder = f.placeholder;
      // 初期値は名前で入れる。位置で数えて入れると、欄を1つ足すたびに
      // 後ろが全部ずれる
      if (f.value !== undefined && f.value !== null) input.value = String(f.value);
      label.appendChild(input);

      // 決まり (字数・使えない字・あとから変えられないこと) は入れる前に見せる
      if (f.note) {
        var note = document.createElement('span');
        note.className = 'row-meta field-note';
        note.id = 'field-note-' + (++hintSeq);
        note.textContent = f.note;
        input.setAttribute('aria-describedby', note.id);
        label.appendChild(note);
      }

      inputs[f.name] = input;
      form.appendChild(label);
    });

    var actions = document.createElement('div');
    actions.className = 'inline-form-actions';

    var submit = document.createElement('button');
    submit.type = 'submit';
    submit.className = 'btn btn-primary';
    submit.textContent = submitLabel;
    actions.appendChild(submit);

    var cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'btn';
    cancel.textContent = 'やめる';
    cancel.addEventListener('click', closeSide);
    actions.appendChild(cancel);

    form.appendChild(actions);

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      // 入力時の確かめで止めているものがあれば送らない。理由は欄のすぐ下に出ている
      var blocking = form.querySelector('.field-error:not([hidden])');
      if (blocking) {
        showSnack('入力を直してください: ' + blocking.textContent, { kind: 'ng' });
        var bad = blocking.parentNode.querySelector('input, select, textarea');
        if (bad) bad.focus();
        return;
      }

      var values = {};
      var missing = false;

      fields.forEach(function (f) {
        values[f.name] = inputs[f.name].value;
        if (f.required && !values[f.name]) missing = true;
      });

      if (missing) {
        showSnack('必須の項目が空です', { kind: 'ng' });
        return;
      }
      closeSide();

      // 送ったものを控える。ここから呼ぶ call() が失敗したら書いたまま開き直す
      formDraftForCall = {
        title: title, fields: fields, submitLabel: submitLabel,
        onSubmit: onSubmit, sourceEl: sourceEl, values: values,
      };
      try {
        onSubmit(values);
      } finally {
        formDraftForCall = null;
      }
    });

    // 閉じ道を必ず用意する
    form.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeSide();
    });

    sideBody.appendChild(form);
    inputs[fields[0].name].focus();
    return form;
  }

  /**
   * 入力欄のすぐ下に、エラーか注意を出す (空なら消す)。
   *
   * エラーは送るのを止め、注意は止めない。色だけに頼らず、頭に「エラー:」
   * 「注意:」を付ける。エラーは読み上げにもすぐ届くよう role="alert" にする。
   *
   * @param {HTMLElement} input
   * @param {string} text
   * @param {string} [kind] 'error' (既定) | 'warn'
   */
  function setFieldMessage(input, text, kind) {
    var label = input.parentNode;
    var msg = label.querySelector('.field-msg');
    if (!msg) {
      msg = document.createElement('span');
      msg.id = 'field-msg-' + (++hintSeq);
      label.appendChild(msg);
      var described = input.getAttribute('aria-describedby');
      input.setAttribute('aria-describedby', (described ? described + ' ' : '') + msg.id);
    }
    var isError = (kind || 'error') === 'error';
    msg.className = 'field-msg ' + (isError ? 'field-error' : 'field-warn');
    msg.setAttribute('role', isError ? 'alert' : 'status');
    msg.textContent = text ? (isError ? 'エラー: ' : '注意: ') + text : '';
    msg.hidden = !text;
    input.setAttribute('aria-invalid', String(!!text && isError));

    // 送るボタンは、止めているエラーがある間は押せなくする
    var form = input.form;
    var submit = form && form.querySelector('button[type="submit"]');
    if (submit) submit.disabled = !!form.querySelector('.field-error:not([hidden])');
  }

  /**
   * その場で確認を取る帯を出す。confirm の置き換え。
   *
   * @param {HTMLElement} host
   * @param {string} text
   * @param {string} label
   * @param {function} onConfirm
   */
  function openConfirmStrip(host, text, label, onConfirm) {
    var existing = host.querySelector('.confirm-strip');
    if (existing) existing.remove();

    var strip = document.createElement('div');
    strip.className = 'confirm-strip';
    strip.setAttribute('role', 'alert');

    var span = document.createElement('span');
    span.textContent = text;
    strip.appendChild(span);

    var ok = document.createElement('button');
    ok.className = 'btn btn-primary';
    ok.textContent = label;
    ok.addEventListener('click', function () {
      strip.remove();
      onConfirm();
    });
    strip.appendChild(ok);

    var no = document.createElement('button');
    no.className = 'btn';
    no.textContent = 'やめる';
    no.addEventListener('click', function () { strip.remove(); });
    strip.appendChild(no);

    host.insertBefore(strip, host.firstChild);
    ok.focus();
  }

  /**
   * 空の状態を作る。「何も無い」ではなく次の一手を示す。
   *
   * @param {string} title
   * @param {string} hint
   * @param {{label:string, onClick:function}} [action]
   * @returns {HTMLElement}
   */
  function makeBlankState(title, hint, action) {
    var wrap = document.createElement('div');
    wrap.className = 'blank-state';
    wrap.appendChild(makeIcon('inbox'));

    var strong = document.createElement('strong');
    strong.textContent = title;
    wrap.appendChild(strong);

    var p = document.createElement('div');
    p.textContent = hint;
    wrap.appendChild(p);

    if (action) {
      var btn = document.createElement('button');
      btn.className = 'btn btn-primary';
      btn.textContent = action.label;
      // 押した本人を渡す。そのまま繋ぐと第1引数が Event になり、
      // 対象の要素として受け取った側で classList を触って落ちる
      btn.addEventListener('click', function () { action.onClick(btn); });
      wrap.appendChild(btn);
    }
    return wrap;
  }

  /**
   * 日時を東京の暦日 'YYYY-MM-DD' にする。サーバの scrumDayOf_ と同じ答えを返す
   * (test/ui-parity.test.js)。
   *
   * サーバからは ISO の字 (UTC) で届く。先頭10字をそのまま切ると、朝0〜9時の
   * ものが前の日に見える。'YYYY-MM-DD' だけの字は暦日なのでそのまま返し、
   * 暦に無い日 ('2026-02-30') は読めないものとして空にする。
   *
   * @param {*} v
   * @returns {string} 読めなければ ''
   */
  function tokyoDay(v) {
    var s = String(v == null ? '' : v);
    var day = /^(\d{4}-\d{2}-\d{2})$/.exec(s);
    if (day) {
      var d = new Date(day[1] + 'T00:00:00Z');
      return !isNaN(d.getTime()) && d.toISOString().substring(0, 10) === day[1] ? day[1] : '';
    }
    var t = Date.parse(s);
    if (!s || isNaN(t)) return '';
    return new Date(t + 9 * 3600 * 1000).toISOString().substring(0, 10);
  }

  /**
   * 日時を東京の 'YYYY-MM-DD HH:MM' にする。読めなければ元の字を返す。
   *
   * @param {*} v
   * @returns {string}
   */
  function tokyoTime(v) {
    var t = Date.parse(String(v == null ? '' : v));
    if (isNaN(t)) return String(v == null ? '' : v);
    return new Date(t + 9 * 3600 * 1000).toISOString().substring(0, 16).replace('T', ' ');
  }

  /**
   * 元のファイルへのリンクを作る。
   *
   * @param {string} type
   * @param {string} fileId
   * @returns {HTMLElement}
   */
  function makeFileLink(type, fileId) {
    var a = document.createElement('a');
    a.className = 'file-link';
    a.href = fileUrlOf(type, fileId);
    a.target = '_blank';
    a.rel = 'noopener';
    a.appendChild(makeIcon('external-link'));
    a.title = '元のファイルを開く';
    a.setAttribute('aria-label', '元のファイルを開く');
    return a;
  }

  // ===== 読み込み中の骨組み =====

  /**
   * これから出る形を先に見せる。
   *
   * 「読み込み中…」の文字より、出来上がりの形を見せたほうが待ち時間が
   * 短く感じられ、中身が入ったときに位置もずれない。
   *
   * @param {HTMLElement} container
   * @param {string} kind 'list' | 'graph' | 'doc' | 'board' | 'block'
   * @param {number} [count]
   */
  function showSkeleton(container, kind, count) {
    container.textContent = '';
    var n = count || 4;

    /**
     * 骨組みの棒を作る。
     *
     * @param {string} width CSSの幅
     * @param {number} [height]
     * @returns {HTMLElement}
     */
    function bar(width, height) {
      var el = document.createElement('div');
      el.className = 'skeleton';
      el.style.width = width;
      el.style.height = (height || 12) + 'px';
      return el;
    }

    function lines(a, b) {
      var wrap = document.createElement('div');
      wrap.className = 'row-main sk-lines';
      wrap.appendChild(bar(a));
      if (b) wrap.appendChild(bar(b, 10));
      return wrap;
    }

    if (kind === 'board') {
      // 器そのものが板なので、中にもう1枚板を作らない。作ると4列の中の
      // 1列に4列を押し込むことになり、右が見切れる (実際に踏んだ)
      for (var c = 0; c < 4; c++) {
        var col = document.createElement('div');
        col.className = 'board-column';
        col.appendChild(bar('40%', 12));

        for (var k = 0; k < 2; k++) {
          var card = document.createElement('div');
          card.className = 'board-card';
          card.appendChild(bar('80%'));
          card.appendChild(bar('45%', 10));
          col.appendChild(card);
        }
        container.appendChild(col);
      }
      return;
    }

    if (kind === 'gantt') {
      var chart = document.createElement('div');
      chart.className = 'gantt';

      for (var r = 0; r < n; r++) {
        var row = document.createElement('div');
        row.className = 'gantt-row';

        var name = document.createElement('div');
        name.className = 'gantt-name';
        name.appendChild(bar((60 + (r % 3) * 12) + '%'));
        row.appendChild(name);

        var track = document.createElement('div');
        track.className = 'gantt-track';

        var barEl = document.createElement('div');
        barEl.className = 'skeleton';
        barEl.style.height = '24px';
        barEl.style.borderRadius = '999px';
        barEl.style.gridColumn = (1 + r * 2) + ' / span ' + (3 + (r % 4));
        track.appendChild(barEl);

        row.appendChild(track);
        chart.appendChild(row);
      }
      container.appendChild(chart);
      return;
    }

    if (kind === 'graph') {
      for (var gi = 0; gi < n; gi++) {
        var grow = document.createElement('div');
        grow.className = 'graph-row';

        var cell = document.createElement('div');
        cell.className = 'graph-cell';
        var dot = document.createElement('div');
        dot.className = 'skeleton';
        dot.style.cssText = 'width:10px;height:10px;border-radius:50%;margin:17px auto;';
        cell.appendChild(dot);
        grow.appendChild(cell);

        var desc = document.createElement('div');
        desc.className = 'graph-col-desc';
        desc.appendChild(bar((50 + (gi % 3) * 15) + '%'));
        grow.appendChild(desc);

        var date = document.createElement('div');
        date.className = 'graph-col-date';
        date.appendChild(bar('80%', 10));
        grow.appendChild(date);

        var author = document.createElement('div');
        author.className = 'graph-col-author';
        author.appendChild(bar('70%', 10));
        grow.appendChild(author);

        var sha = document.createElement('div');
        sha.className = 'graph-col-sha';
        sha.appendChild(bar('90%', 10));
        grow.appendChild(sha);

        container.appendChild(grow);
      }
      return;
    }

    if (kind === 'doc') {
      for (var d = 0; d < n; d++) {
        var card = document.createElement('div');
        card.className = 'doc-card';

        var open = document.createElement('div');
        open.className = 'doc-open';

        var icon = document.createElement('div');
        icon.className = 'skeleton';
        icon.style.cssText = 'width:16px;height:16px;flex:0 0 16px;';
        open.appendChild(icon);
        open.appendChild(bar((30 + d * 10) + '%', 14));

        card.appendChild(open);
        container.appendChild(card);
      }
      return;
    }

    if (kind === 'block') {
      var block = document.createElement('div');
      block.className = 'skeleton';
      block.style.cssText = 'height:120px;margin:' +
        'var(--sp-4);border-radius:var(--radius);';
      container.appendChild(block);
      return;
    }

    // 一覧。row-item と同じ骨組みで作るので、実物と位置がずれない
    for (var i = 0; i < n; i++) {
      var item = document.createElement('div');
      item.className = 'row-item';

      var openEl = document.createElement('div');
      openEl.className = 'row-open';

      var ic = document.createElement('div');
      ic.className = 'skeleton';
      ic.style.cssText = 'width:16px;height:16px;flex:0 0 16px;';
      openEl.appendChild(ic);
      openEl.appendChild(lines((45 + (i % 3) * 15) + '%', '25%'));

      item.appendChild(openEl);
      container.appendChild(item);
    }
  }

  // ===== 本文の描画 =====

  /**
   * 連続する <li> を対応する ul/ol でラップする。
   *
   * @param {string} html
   * @returns {string}
   */
  function wrapLists(html) {
    var lines = String(html || '').split('\n');
    var out = [];
    var open = null;

    lines.forEach(function (line) {
      var m = /^<li data-list="(ul|ol)" data-depth="(\d+)">/.exec(line);
      if (!m) {
        if (open) { out.push('</' + open + '>'); open = null; }
        out.push(line);
        return;
      }
      if (open !== m[1]) {
        if (open) out.push('</' + open + '>');
        out.push('<' + m[1] + '>');
        open = m[1];
      }
      out.push(line);
    });

    if (open) out.push('</' + open + '>');
    return out.join('\n');
  }

  /**
   * 現在のテーマのトークンを読む。
   *
   * 本文は iframe の中に描くため、外側のCSS変数が届かない。
   * 描画のたびに実際の値を読んで流し込む。
   *
   * @returns {Object<string,string>}
   */
  function themeColors() {
    var style = getComputedStyle(document.documentElement);
    var names = ['--ink', '--ink-2', '--bg', '--bg-2', '--line', '--accent'];
    var out = {};

    names.forEach(function (n) {
      out[n] = String(style.getPropertyValue(n) || '').trim();
    });
    return out;
  }

  function renderIntoViewer(bodyHtml) {
    var c = themeColors();

    var css =
      'body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",' +
      '"Noto Sans JP",sans-serif;line-height:1.9;' +
      'color:' + c['--ink'] + ';background:' + c['--bg'] + ';' +
      'padding:32px 48px;max-width:820px;margin:0 auto;}' +
      'h1{font-size:24px;margin:1.6em 0 .6em;}' +
      'h2{font-size:20px;margin:1.6em 0 .6em;}' +
      'h3{font-size:17px;margin:1.4em 0 .5em;}' +
      'a{color:' + c['--accent'] + ';}' +
      'table{border-collapse:collapse;margin:1em 0;width:100%;}' +
      'td{border:1px solid ' + c['--line'] + ';padding:6px 10px;}' +
      'li{margin:.3em 0;}' +
      'img{max-width:100%;}' +
      'table[data-sheet]{width:auto;font-size:13px;}' +
      'table[data-sheet] td{white-space:nowrap;}' +
      'table[data-sheet]::before{content:attr(data-sheet);display:block;' +
      'font-size:11px;color:' + c['--ink-2'] + ';margin-bottom:4px;}' +
      'td[data-formula]{background:' + c['--bg-2'] + ';color:' + c['--ink-2'] + ';}' +
      'section[data-slide]{border-top:2px solid ' + c['--line'] + ';margin-top:24px;' +
      'padding-top:6px;font-size:11px;color:' + c['--ink-2'] + ';}' +
      'section[data-slide]::before{content:"スライド " attr(data-slide);}';

    viewer.srcdoc =
      '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">' +
      '<style>' + css + '</style></head><body>' + wrapLists(bodyHtml) + '</body></html>';
  }

  // ===== 差分 =====

  /**
   * 差分を左右2列で描画する。
   *
   * 片側しか無い行にも空のセルを置いて、左右の行がずれないようにする。
   *
   * @param {object[]} ops
   * @param {HTMLElement} container
   * @param {boolean} skipEqual
   */
  function renderDiffInto(ops, container, skipEqual) {
    var pairs = diffPairs(ops || []);
    var shown = [];

    for (var i = 0; i < pairs.length; i++) {
      if (skipEqual && pairs[i].type === 'equal') continue;
      shown.push(pairs[i]);
    }

    if (!shown.length) {
      var p = document.createElement('p');
      p.className = 'diff-empty';
      p.textContent = '差分はありません';
      container.appendChild(p);
      return;
    }

    // 片側にしか中身が無いなら1列で見せる。空の列に横幅の半分を
    // 使うより、本文を広く見せたほうが読める
    var hasLeft = shown.some(function (p) { return p.left !== null; });
    var hasRight = shown.some(function (p) { return p.right !== null; });
    var single = !hasLeft || !hasRight;

    var table = document.createElement('div');
    table.className = 'diff-split' + (single ? ' single' : '');

    shown.forEach(function (pair) {
      var row = document.createElement('div');
      row.className = 'diff-row';

      if (single) {
        var only = hasLeft ? pair.left : pair.right;
        var kind = pair.type === 'equal' ? '' : (hasLeft ? 'del' : 'ins');
        row.appendChild(diffCell(only, kind));
      } else {
        row.appendChild(diffCell(pair.left, pair.type === 'equal' ? '' : 'del'));
        row.appendChild(diffCell(pair.right, pair.type === 'equal' ? '' : 'ins'));
      }
      table.appendChild(row);
    });
    container.appendChild(table);
  }

  /**
   * 正規化HTMLの1行を、人が読める形に直す。
   *
   * src/core/Normalize.js の describeLine と同じもの。タグのまま見せると
   * 何が変わったのかを読むのに知識が要る。
   *
   * @param {string} line
   * @returns {{kind:string, text:string}}
   */
  function describeLine(line) {
    var raw = String(line == null ? '' : line);

    function strip(html) {
      var el = document.createElement('div');
      el.innerHTML = '';
      // タグを外し、実体参照は textarea を通さず自前で戻す
      var text = String(html).replace(/<[^>]*>/g, '');
      return text
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
        .replace(/&amp;/g, '&');
    }

    var mh = /^<h([1-6])>([\s\S]*)<\/h\1>$/.exec(raw);
    if (mh) return { kind: '見出し' + mh[1], text: strip(mh[2]) };

    var mp = /^<p>([\s\S]*)<\/p>$/.exec(raw);
    if (mp) return { kind: '段落', text: strip(mp[1]) };

    var ml = /^<li data-list="(ul|ol)" data-depth="(\d+)">([\s\S]*)<\/li>$/.exec(raw);
    if (ml) {
      return {
        kind: (ml[1] === 'ol' ? '番号' : '箇条') + '書き',
        text: new Array(Number(ml[2]) + 1).join('  ') + strip(ml[3]),
      };
    }

    var mi = /^<img data-sha="([^"]*)" alt="([^"]*)">$/.exec(raw);
    if (mi) return { kind: '画像', text: strip(mi[2]) || '(説明なし)' };

    var ms = /^<table data-sheet="([^"]*)">$/.exec(raw);
    if (ms) return { kind: 'シート', text: strip(ms[1]) };

    var msl = /^<section data-slide="(\d+)">$/.exec(raw);
    if (msl) return { kind: 'スライド', text: msl[1] + '枚目' };

    if (raw === '<table>') return { kind: '表', text: '開始' };
    if (raw === '</table>') return { kind: '表', text: '終わり' };

    if (raw.indexOf('<tr>') === 0) {
      var cells = [];
      var re = /<td(?: data-formula="[^"]*")?>([\s\S]*?)<\/td>/g;
      var m;
      while ((m = re.exec(raw)) !== null) cells.push(strip(m[1]));
      return { kind: '行', text: cells.join(' | ') };
    }

    return { kind: '', text: strip(raw) };
  }

  function diffCell(text, kind) {
    var cell = document.createElement('div');
    cell.className = 'diff-cell' +
      (text === null ? ' empty' : (kind ? ' ' + kind : ''));

    if (text === null) return cell;

    var d = describeLine(text);
    if (d.kind) {
      var tag = document.createElement('span');
      tag.className = 'diff-kind';
      tag.textContent = d.kind;
      cell.appendChild(tag);
    }

    var body = document.createElement('span');
    body.className = 'diff-text';
    body.textContent = d.text;
    body.title = text;
    cell.appendChild(body);

    return cell;
  }

  // ===== 画面の切り替え =====

  var DOC_TABS = { content: 1, history: 1, drafts: 1 };

  /**
   * 画面を切り替える。
   *
   * タブは開いている文書のビューなので、文書を選んでいないときは出さない。
   *
   * @param {string} name
   * @param {{pr: number}} [opts] 確認依頼の画面で、先頭の代わりに開く依頼の番号
   */
  function switchTab(name, opts) {
    navCount++;
    if (DOC_TABS[name] && !current.fileId) name = 'docs';
    currentTab = name;

    // 文書のビューを見ているときは、左の「文書」を現在地にする。
    // どこにいるのか分からなくなるため
    var navName = DOC_TABS[name] ? 'docs' : name;

    var targets = document.querySelectorAll('[data-tab]');
    for (var i = 0; i < targets.length; i++) {
      var el = targets[i];
      var isTab = el.classList.contains('tab');
      el.setAttribute('aria-current',
        String(el.dataset.tab === (isTab ? name : navName)));
    }

    // 履歴から離れるときは広げた差分を畳む。畳まないと画面を覆い続ける
    if (name !== 'history' && diffPane.classList.contains('full')) setDiffFull(false);
    // 文書の全画面も、どこかへ移ったら抜ける。左も上も隠れたまま別の画面が出る
    if (document.body.classList.contains('doc-full')) setDocFull(false);

    panelHome.hidden = name !== 'home';
    panelDocs.hidden = name !== 'docs';
    panelContent.hidden = name !== 'content';
    panelHistory.hidden = name !== 'history';
    panelDrafts.hidden = name !== 'drafts';
    panelBranches.hidden = name !== 'branches';
    panelPulls.hidden = name !== 'pulls';
    panelIssues.hidden = name !== 'issues';
    panelHelp.hidden = name !== 'help';
    panelReport.hidden = name !== 'report';
    panelUsage.hidden = name !== 'usage';
    panelSettings.hidden = name !== 'settings';
    panelSprint.hidden = name !== 'sprint';
    panelImpediments.hidden = name !== 'impediments';

    tabsEl.hidden = !current.fileId || !DOC_TABS[name];
    updateCrumbs();
    closeSide();
    syncMobileNav(navName);

    usageCount('view', name);

    if (name === 'home') loadHome();
    else if (name === 'docs') loadDocs();
    else if (name === 'history') loadHistory();
    else if (name === 'drafts') loadDrafts();
    else if (name === 'branches') loadBranches();
    else if (name === 'pulls') loadPulls(opts && opts.pr);
    else if (name === 'issues') {
      // 起動時に工程表を覚えていると、隠れたまま一度描かれる。開いたこの時に今日へ送る
      if (issueView === 'gantt') ganttToToday = true;
      reloadIssueView();
    }
    else if (name === 'help') loadHelp();
    else if (name === 'report') loadReports();
    else if (name === 'usage') loadUsage();
    else if (name === 'settings') loadSettingsPanel();
    else if (name === 'sprint') loadSprint();
    else if (name === 'impediments') loadImpediments();
  }

  /**
   * 現在の位置を出す。文書を開いているときだけ戻り道を見せる。
   */
  function updateCrumbs() {
    var inDoc = !!current.fileId && !!DOC_TABS[currentTab];
    syncDocViewBtns();
    syncGuideLink();

    crumbBack.hidden = !inDoc;
    crumbSep.hidden = !inDoc;
    branchSwitch.hidden = !inDoc;
    openLink.hidden = !inDoc;

    if (!inDoc) {
      var names = {
        home: 'ホーム', docs: '文書', branches: '改訂中の版', pulls: '確認依頼',
        issues: 'やること', board: '進捗ボード', help: '使い方',
        settings: '設定', sprint: termOf('sprint'), impediments: termOf('impediment'),
        usage: '使われ方', report: '要望・不具合',
      };
      titleEl.textContent = names[currentTab] || '文書';
      branchChip.hidden = true;
      dirtyBadge.hidden = true;
      commitBtn.hidden = true;
      stashBtn.hidden = true;
      return;
    }
    titleEl.textContent = current.docPath || '';
  }

  /**
   * 画面ごとの使い方の節。無い画面では「?」を出さない。
   *
   * @param {string} tab
   * @returns {string} GUIDE の id
   */
  function guideIdOf(tab) {
    if (tab === 'issues') return issueView === 'gantt' ? 'view' : 'pitfalls';
    return {
      home: 'home', docs: 'flow', content: 'view', pulls: 'flow',
      usage: 'usage', settings: 'settings',
    }[tab] || '';

  /** 見出しの横の「?」を、いまの画面の節へ向ける */
  function syncGuideLink() {
    var id = guideIdOf(currentTab);
    var section = GUIDE.filter(function (g) { return g.id === id; })[0];
    guideLinkBtn.hidden = !section;
    if (!section) return;
    guideLinkBtn.dataset.guide = id;
    // 字は「?」だけなので、何の使い方を開くのかを読み上げと手がかりで言う
    guideLinkBtn.setAttribute('aria-label', '使い方の「' + section.title + '」を開く');
    guideLinkBtn.title = '使い方: ' + section.title;
  }

  guideLinkBtn.addEventListener('click', function () {
    if (guideLinkBtn.dataset.guide) openGuideAt(guideLinkBtn.dataset.guide);
  });

  // ===== 文書の一覧 =====

  /**
   * @param {function} [then]
   * @param {function} [onFail] 省くと文書の一覧の欄に出す
   */
  function loadFiles(then, onFail) {
    call('apiListFiles', [], function (list) {
      allFiles = list || [];
      if (then) then();
    }, onFail || failInto(docListEl));
  }

  /**
   * 正式版の文書だけを並べる。改訂版は文書に従属するため一覧に混ぜない。
   */
  function renderDocs() {
    docListEl.textContent = '';

    var docs = allFiles.filter(function (f) {
      return splitPath(f.path).branch === 'main';
    });

    if (!docs.length) {
      docListEl.appendChild(makeBlankState(
        '管理している文書がありません',
        'Google ドライブで、この道具の「main」フォルダに文書を入れてから、' +
        '「文書を登録する」を押してください。',
        { label: '文書を登録する', onClick: addDocs }
      ));
      return;
    }

    docs.forEach(function (f) {
      var drafts = allFiles.filter(function (o) {
        return splitPath(o.path).branch !== 'main' &&
               splitPath(o.path).path === f.path;
      });

      var card = document.createElement('div');
      card.className = 'doc-card';

      var open = document.createElement('button');
      open.className = 'doc-open';

      var head = document.createElement('div');
      head.className = 'doc-head';
      head.appendChild(makeIcon('file-text'));

      var name = document.createElement('span');
      name.className = 'doc-name';
      name.textContent = f.path;
      head.appendChild(name);
      open.appendChild(head);

      var meta = document.createElement('div');
      meta.className = 'doc-meta';

      meta.appendChild(makePill(
        { doc: '文書', sheet: '表', slide: 'スライド' }[f.type] || f.type));

      if (drafts.length) {
        meta.appendChild(makePill(
          '改訂中 ' + drafts.length + '件', 'chip chip-accent'));
      }
      open.appendChild(meta);

      open.addEventListener('click', function () { openDoc(f.fileId, f.path); });
      card.appendChild(open);
      card.appendChild(makeFileLink(f.type, f.fileId));
      card.appendChild(makeUnregisterButton(f, drafts.length));

      docListEl.appendChild(card);
    });
  }

  /**
   * 管理から外す入口を作る。
   *
   * 間違って登録したものを戻す道が無く、台帳を手で直すしかなかった。
   *
   * ゴミ箱の印は使わない。**文書そのものを消すと読まれる。** 消えるのは
   * 台帳の1行だけなので、集まりから抜く印 (minus-circle) にしてある。
   * 帯の文でも「文書そのものは消えません」と言い切る。
   *
   * 改訂版が残っているものは押させない。サーバも断るが、押せてから
   * 断られるより、押せないほうが理由が伝わる。
   *
   * @param {object} f files 行
   * @param {number} draftCount その文書の改訂版の数
   * @returns {HTMLElement}
   */
  function makeUnregisterButton(f, draftCount) {
    var off = document.createElement('button');
    off.className = 'card-off';
    off.appendChild(makeIcon('minus-circle'));
    // 印だけなので、読み上げと吹き出しに名前を持たせる
    off.setAttribute('aria-label', f.path + ' を管理から外す');

    if (draftCount) {
      off.disabled = true;
      attachHint(off,
        '改訂版が' + draftCount + '件あります。先にそれらを捨ててください');
      return off;
    }
    hint(off, 'act:unregister');

    off.addEventListener('click', function (e) {
      e.stopPropagation();
      openConfirmStrip(docListEl,
        '「' + f.path + '」を管理から外します。' +
        'Drive の文書そのものは消えません。これまでの記録も残り、' +
        '登録し直せば履歴もそのまま戻ります。',
        '管理から外す',
        function () {
          call('apiUnregisterFile', [f.fileId], function () {
            showSnack('「' + f.path + '」を管理から外しました', { kind: 'ok' });
            loadFiles(renderDocs);
            loadOverview();
          });
        });
    });
    return off;
  }

  function loadDocs() {
    if (!allFiles.length) {
      showSkeleton(docListEl, 'doc', 3);
      loadFiles(renderDocs);
    } else {
      renderDocs();
    }
  }

  var homeTurnEl = document.getElementById('home-turn');
  var homeActivityEl = document.getElementById('home-activity');
  var homeRecentEl = document.getElementById('home-recent');
  var homeSummaryEl = document.getElementById('home-summary');
  var homeAdviceEl = document.getElementById('home-advice');

  /**
   * 上の1行に出す数。届いていないもの (null) は出さない ("undefined" と出さない)。
   * turn はあなたの番の合計、today は今日片づけたものの数
   */
  var homeLine = { turn: null, today: null };

  /**
   * ホーム。各区画を並べて呼び、1つが取れなくてもほかは出す。
   * あなたの番・草・最近の動きは、返事を描く前にまだホームを開いているかを見る
   * (前の返事で別の画面の上に描かない)。全体の数は左の数字も兼ねるので、
   * 開いていなくても入れる。
   */
  function loadHome() {
    applyHomeCards();
    homeLine = { turn: null, today: null };
    renderHomeLine();
    loadOverview();
    loadHomeCards();
    loadHomeSummary();
    call('apiHomeActivity', [], function (act) {
      if (panelHome.hidden) return;
      fillBlock(homeActivityEl, makeActivityBlock(act || { weeks: [], meTotal: 0 }));
    }, function (err) {
      if (panelHome.hidden) return;
      fillBlock(homeActivityEl, homeFailBlock('アクティビティ', err));
    });
  }

  /** あなたの番と最近の動き。ホームから何かを片づけたあとにも取り直す */
  function loadHomeSummary() {
    call('apiHomeSummary', [], function (s) {
      if (panelHome.hidden) return;
      s = s || {};
      var turn = s.myTurn || {};
      fillBlock(homeTurnEl, makeTurnBlock(turn));
      fillBlock(homeRecentEl, makeRecentBlock(s.recent || []));
      renderAdvice(s.advice || []);
      homeLine.turn = ['reviews', 'returned', 'due'].reduce(function (n, k) {
        return n + (Number(turn[k] && turn[k].total) || 0);
      }, 0);
      renderHomeLine();
    }, function (err) {
      if (panelHome.hidden) return;
      fillBlock(homeTurnEl, homeFailBlock('あなたの番', err));
      fillBlock(homeRecentEl, homeFailBlock('最近の動き', err));
      // 改善のヒントは無くても困らない。取れなかったことは出さずに隠す
      homeAdviceEl.textContent = '';
      homeLine.turn = null;
      renderHomeLine();
    });
  }

  // ===== 改善のヒント =====

  /**
   * ISO の週 ('2026-W42')。「今週は出さない」を週ごとに覚えるため。東京の暦日で数える。
   *
   * @param {Date} now
   * @returns {string}
   */
  function adviceWeek(now) {
    var t = new Date(now.getTime() + 9 * 3600000);
    var d = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()));
    // その週の木曜が属する年の週
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    var year = d.getUTCFullYear();
    var week = Math.ceil(((d.getTime() - Date.UTC(year, 0, 1)) / 86400000 + 1) / 7);
    return year + '-W' + (week < 10 ? '0' : '') + week;
  }

  /**
   * 隠した助言 {id: 週}。端末にだけ覚える。読めなければ何も隠していないことにする。
   *
   * @returns {object}
   */
  function adviceHiddenRead() {
    try {
      var v = JSON.parse(window.localStorage.getItem('adviceHidden') || '{}');
      return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
    } catch (e) {
      return {};
    }
  }

  /**
   * その助言を今週は出さない。前の週の覚え書きはついでに捨てる。
   *
   * @param {string} id
   */
  function adviceHide(id) {
    var week = adviceWeek(new Date());
    var all = adviceHiddenRead();
    var keep = {};
    Object.keys(all).forEach(function (k) { if (all[k] === week) keep[k] = week; });
    keep[id] = week;
    try {
      window.localStorage.setItem('adviceHidden', JSON.stringify(keep));
    } catch (e) { /* 覚えられなくても、この画面では消える */ }
  }

  /** 最後に届いた助言。隠したあと描き直すために持つ */
  var adviceLast = [];

  /**
   * 改善のヒントのカード。今週隠したものは出さず、残りが無ければカードごと出さない。
   *
   * @param {Array} list apiHomeSummary の advice
   */
  function renderAdvice(list) {
    adviceLast = list || [];
    homeAdviceEl.textContent = '';
    var week = adviceWeek(new Date());
    var hidden = adviceHiddenRead();
    var shown = adviceLast.filter(function (a) { return hidden[a.id] !== week; });
    if (!shown.length) return;

    homeAdviceEl.appendChild(homeHead('改善のヒント', [privatePill()]));
    shown.forEach(function (a) {
      var item = document.createElement('div');
      item.className = 'advice-item';
      item.dataset.advice = a.id;

      var title = document.createElement('p');
      title.className = 'advice-title';
      title.textContent = a.title;
      item.appendChild(title);

      var why = document.createElement('p');
      why.className = 'advice-why';
      why.textContent = a.why;
      item.appendChild(why);

      var tip = document.createElement('p');
      tip.className = 'advice-tip';
      tip.textContent = a.tip;
      item.appendChild(tip);

      var actions = document.createElement('div');
      actions.className = 'advice-actions';
      var go = document.createElement('button');
      go.type = 'button';
      go.className = 'btn btn-primary';
      go.textContent = (a.action && a.action.label) || '開く';
      go.addEventListener('click', function () { adviceGo(a.action || {}); });
      actions.appendChild(go);

      var hide = document.createElement('button');
      hide.type = 'button';
      hide.className = 'btn advice-hide';
      hide.textContent = '今週は出さない';
      hide.addEventListener('click', function () {
        adviceHide(a.id);
        renderAdvice(adviceLast);
      });
      actions.appendChild(hide);
      item.appendChild(actions);

      homeAdviceEl.appendChild(item);
    });
  }

  /**
   * 助言のボタンの行き先。kind はサーバの ADVICE_RULES() の action.kind と揃える。
   *
   * @param {{kind: string, arg: string}} action
   */
  function adviceGo(action) {
    var kind = String(action.kind || '');
    var arg = String(action.arg || '');
    if (kind === 'pulls') {
      switchTab('pulls', Number(arg) ? { pr: Number(arg) } : undefined);
      return;
    }
    if (kind === 'report') {
      switchTab('report');
      return;
    }
    var views = { 'issues-overdue': 'list', 'issues-filter': 'list', board: 'board', gantt: 'gantt' };
    if (!views[kind]) return;

    setOverdueOnly(kind === 'issues-overdue');
    // 期限切れと工程表は自分の担当のこと。繰り返しは自分が作っただけのものも数えるので外す
    if (kind === 'issues-overdue' || kind === 'gantt') mineOnly = true;
    if (kind === 'issues-filter') mineOnly = false;
    setToggle(mineBtn, mineOnly);
    issueFilterEl.value = kind === 'issues-filter' ? arg : '';
    // ヒントから開いた見え方は、次に開いたときの見え方として覚えない
    setIssueView(views[kind], true, { noSave: true, keepOverdue: true });
    switchTab('issues');
  }

  /**
   * 今日の日付 (東京)。端末の時計から求める。東京は夏時間が無いので9時間足すだけでよい。
   *
   * @param {Date} now
   * @returns {string} 「10月14日 (水)」
   */
  function homeDateText(now) {
    var t = new Date(now.getTime() + 9 * 3600000);
    return (t.getUTCMonth() + 1) + '月' + t.getUTCDate() + '日 (' + '日月火水木金土'.charAt(t.getUTCDay()) + ')';
  }

  /** 上の1行。日付・あなたの番・今日片づけた。届いていない数は出さない */
  function renderHomeLine() {
    if (!homeSummaryEl) return;
    homeSummaryEl.textContent = '';
    var date = document.createElement('strong');
    date.textContent = homeDateText(new Date());
    homeSummaryEl.appendChild(date);
    var parts = [];
    if (homeLine.turn !== null) parts.push('あなたの番 ' + homeLine.turn + '件');
    if (homeLine.today !== null) parts.push('今日片づけた ' + homeLine.today + '件');
    if (parts.length) {
      var rest = document.createElement('span');
      rest.textContent = parts.join(' ・ ');
      homeSummaryEl.appendChild(rest);
    }
  }

  function fillBlock(host, el) {
    host.textContent = '';
    host.appendChild(el);
  }

  /**
   * 区画の見出しの行。題は左、数や切り替えは右。**見出しの形はここだけで決める**
   * (区画ごとに見出しを作ると、字の大きさや余白が少しずつずれる)。
   *
   * @param {string} text
   * @param {Array<?HTMLElement>} [right] 右に置くもの
   * @returns {HTMLElement}
   */
  function homeHead(text, right) {
    var row = document.createElement('div');
    row.className = 'home-head';
    var h = document.createElement('h2');
    h.className = 'home-section-head';
    h.textContent = text;
    row.appendChild(h);
    (right || []).forEach(function (el) { if (el) row.appendChild(el); });
    return row;
  }

  /** 本人にだけ見える区画の札。区画ごとに「あなたにだけ見えます」と書き並べない */
  function privatePill() {
    var pill = makePill('自分だけ', 'chip chip-accent');
    pill.title = 'あなたにだけ見えます';
    return pill;
  }

  /**
   * 取れなかった区画。**見出しは残す** (消すと、何が出ていないのか分からない)。
   *
   * @param {string} title
   * @param {Error} err
   * @returns {HTMLElement}
   */
  function homeFailBlock(title, err) {
    var box = document.createElement('div');
    box.appendChild(homeHead(title));
    var p = document.createElement('p');
    p.className = 'home-empty';
    p.textContent = '出せませんでした: ' + String(err && err.message || '');
    box.appendChild(p);
    return box;
  }

  /**
   * 区画の中の1行。押すと開く。題名は1行で切り、右に札や時刻を置く。
   *
   * @param {string} title
   * @param {string} extraClass
   * @returns {HTMLButtonElement}
   */
  function homeRow(title, extraClass) {
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'home-row' + (extraClass ? ' ' + extraClass : '');
    var t = document.createElement('span');
    t.className = 'home-row-title';
    t.textContent = title;
    row.appendChild(t);
    return row;
  }

  // ===== 横断検索 =====

  /**
   * 比べるための形にそろえる。全角半角・大文字小文字・カタカナとひらがなの違いを消す。
   * **1字ずつ置き換えるので、字の数は変わらない (NFKC で変わる字を除く)。**
   *
   * @param {string} s
   * @returns {string}
   */
  function searchNormalize(s) {
    return String(s || '').normalize('NFKC').toLowerCase()
      .replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); });
  }

  /**
   * 1件の段。0 番号がぴったり / 1 先頭が合う / 2 途中が合う / -1 合わない。
   *
   * @param {object} item
   * @param {string[]} words 正規化済みの語
   * @returns {number}
   */
  function searchRank(item, words) {
    var title = searchNormalize(item.title);
    var num = words.length === 1 ? words[0].replace(/^#/, '') : '';
    if (num && /^\d+$/.test(num) && Number(num) === Number(item.number) && item.number) return 0;
    for (var i = 0; i < words.length; i++) {
      if (title.indexOf(words[i]) < 0) return -1;
    }
    return title.indexOf(words[0]) === 0 ? 1 : 2;
  }

  /**
   * 候補を種類ごとに並べる。種類ごとに5件・全体で20件まで。
   *
   * 枠は先に、合った種類どうしで分ける (20 ÷ 種類の数、切り捨て。切り上げると
   * 6種類で 4×6=24 になり、最後の種類がまた0件になる)。前から5件ずつ
   * 取ると、種類が5つ以上合ったとき後ろの種類が1件も出ない。余った枠は種類の
   * 並び順に、5件まで足す。
   *
   * @param {object[]} index apiSearchIndex
   * @param {string} query
   * @returns {Array<{kind: string, items: object[]}>}
   */
  function searchFilter(index, query) {
    var words = searchNormalize(query).split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    // 同じ段の中の並び。種類ごとに持つ (確認依頼は取り下げを反映済みより後ろに)
    var stateOrder = {
      issue: { open: 0, closed: 1 },
      pull: { open: 0, approved: 0, merged: 1, closed: 2 },
      inquiry: { open: 0, done: 1 },
      impediment: { open: 0, resolved: 1 },
    };

    var groups = {};
    (index || []).forEach(function (item) {
      var rank = searchRank(item, words);
      if (rank < 0) return;
      // 合った場所 (題名の字の位置)。正規化で字数が変わる字があれば印を付けない
      var hit = null;
      var norm = searchNormalize(item.title);
      if (norm.length === String(item.title).length) {
        var at = norm.indexOf(words[0]);
        if (at >= 0) hit = [at, at + words[0].length];
      }
      (groups[item.kind] = groups[item.kind] || []).push(Object.assign({}, item, { rank: rank, hit: hit }));
    });

    var TOTAL = 20;
    var PER_KIND = 5;
    // 候補に出す種類の並び (ここだけが定義)
    var kinds = ['doc', 'issue', 'pull', 'branch', 'inquiry', 'impediment'].filter(function (kind) {
      return groups[kind];
    });
    if (!kinds.length) return [];
    kinds.forEach(function (kind) {
      groups[kind].sort(function (a, b) {
        return a.rank - b.rank ||
          (a.archived ? 1 : 0) - (b.archived ? 1 : 0) ||
          ((stateOrder[kind] || {})[a.state] || 0) - ((stateOrder[kind] || {})[b.state] || 0) ||
          b.number - a.number;
      });
    });

    // 先に公平に分け、余りを並び順に足す
    var share = Math.max(1, Math.floor(TOTAL / kinds.length));
    var left = TOTAL;
    var count = {};
    kinds.forEach(function (kind) {
      var n = Math.min(groups[kind].length, share, PER_KIND, left);
      count[kind] = n;
      left -= n;
    });
    kinds.forEach(function (kind) {
      var more = Math.min(groups[kind].length, PER_KIND, count[kind] + left) - count[kind];
      if (more > 0) { count[kind] += more; left -= more; }
    });

    var out = [];
    kinds.forEach(function (kind) {
      if (count[kind] > 0) out.push({ kind: kind, items: groups[kind].slice(0, count[kind]) });
    });
    return out;
  }

  // ===== 横断検索 (ヘッダーの欄) =====

  var searchBox = document.getElementById('search-box');
  var searchInput = document.getElementById('search-input');
  var searchResults = document.getElementById('search-results');
  var searchIndexRows = null;
  var searchIndexAt = 0;
  var searchActive = -1;
  var searchLoading = false;
  var searchError = '';
  // 候補の全体の枠。searchFilter の TOTAL と同じ数 (あちらは手元の道具の写しなので触らない)
  var SEARCH_TOTAL = 20;
  var SEARCH_LABELS = { doc: '文書', issue: 'やること', pull: '確認依頼', branch: '改訂中の版', inquiry: '報告', impediment: '{impediment}', guide: '使い方' };

  /**
   * 使い方の節を見出しで探す。サーバの一覧には無いので、ここで足す。
   *
   * **searchFilter には混ぜない。** あれは手元の道具 (kit/track/local.mjs) と同じ答えを
   * 返す写しで、種類を足すと両方を直して道具を配り直すことになる。並べ方は同じ
   * searchRank で決め、種類の並びの最後に5件まで足す。全体の枠 (SEARCH_TOTAL) は
   * 超えない (余った枠だけを使う)。
   *
   * @param {string} query
   * @param {number} room 残っている枠
   * @returns {?{kind: string, items: object[]}}
   */
  function guideSearchGroup(query, room) {
    var words = searchNormalize(query).split(/\s+/).filter(Boolean);
    if (!words.length || room <= 0) return null;
    var items = [];
    GUIDE.forEach(function (g, at) {
      var item = { kind: 'guide', key: g.id, number: 0, title: g.title, state: '', archived: false };
      var rank = searchRank(item, words);
      if (rank < 0) return;
      var hit = null;
      var norm = searchNormalize(g.title);
      if (norm.length === g.title.length) {
        var pos = norm.indexOf(words[0]);
        if (pos >= 0) hit = [pos, pos + words[0].length];
      }
      items.push(Object.assign(item, { rank: rank, hit: hit, at: at }));
    });
    if (!items.length) return null;
    items.sort(function (a, b) { return a.rank - b.rank || a.at - b.at; });
    return { kind: 'guide', items: items.slice(0, Math.min(5, room)) };
  }
  /**
   * 状態の札。**それぞれの一覧と同じ言葉にする。** 違う言葉だと、開いた先で同じものだと分からない。
   * 確認依頼は stateLabel に寄せる (一覧と同じ関数)。
   */
  function searchStateLabel(item) {
    if (item.archived) return '置き場';
    if (item.kind === 'pull') return stateLabel(item.state);
    return ({
      issue: { open: '対応中', closed: '完了' },
      inquiry: { open: '未解決', done: '解決' },
      impediment: { open: '未解決', resolved: '解決済み' },
    }[item.kind] || {})[item.state] || '';
  }

  // Mac では ⌘K、ほかは Ctrl+K と案内する
  var searchMac = /Mac|iPhone|iPad/.test(window.navigator.platform || '');
  searchInput.placeholder = '探す (' + (searchMac ? '⌘K' : 'Ctrl+K') + ')';
  document.getElementById('search-open').appendChild(makeIcon('search'));

  /**
   * 一覧を取る。60秒以内に取ったものがあれば取り直さない。
   * **返事で画面を切り替えない。** 届いたとき欄が開いていれば今の字で絞り直す。
   */
  function loadSearchIndex() {
    if (searchIndexRows && Date.now() - searchIndexAt < 60000) return;
    if (searchLoading) return;
    searchLoading = true;
    var still = latest('searchIndex');
    // 取りに行ってから返事までのあいだに一覧が古くなったら、届いたものは使うが
    // 「取ったばかり」とは扱わない
    var fresh = latestSoFar('searchIndexStale');
    call('apiSearchIndex', [], function (rows) {
      searchLoading = false;
      if (!still()) return;
      searchIndexRows = rows || [];
      // 待つあいだに一覧を動かす操作があった。中身はその前のものなので、次に欄へ入ったとき取り直す
      searchIndexAt = fresh() ? Date.now() : 0;
      searchError = '';
      if (document.activeElement === searchInput || searchBox.classList.contains('is-open')) renderSearch();
    }, function (err) {
      searchLoading = false;
      if (!still()) return;
      searchError = '探せませんでした: ' + ((err && err.message) || err);
      if (document.activeElement !== searchInput && !searchBox.classList.contains('is-open')) return;
      if (searchInput.value.replace(/\s+/g, '')) showSearchMessage(searchError);
    });
  }

  /**
   * 一覧を古いことにする。次に欄へ入ったとき取り直す。
   * **呼ぶのは call() だけ** (searchIndexChangedBy が決める)。60秒待たないと
   * 出てこないと、作ったはずのものが探せず、閉じたものを前の状態で開きに行く。
   */
  function searchIndexStale() {
    searchIndexAt = 0;
    latest('searchIndexStale');
  }

  /** 候補だけを畳む。狭い画面で開いた欄はそのまま */
  function hideSearchResults() {
    searchResults.hidden = true;
    searchResults.textContent = '';
    searchInput.setAttribute('aria-expanded', 'false');
    searchInput.removeAttribute('aria-activedescendant');
    searchActive = -1;
  }

  /** 候補を畳み、狭い画面で開いた欄も閉じる */
  function closeSearch() {
    hideSearchResults();
    searchBox.classList.remove('is-open');
  }

  function showSearchMessage(text) {
    searchResults.textContent = '';
    searchActive = -1;
    searchInput.removeAttribute('aria-activedescendant');
    var p = document.createElement('p');
    p.className = 'search-empty row-meta';
    p.textContent = text;
    searchResults.appendChild(p);
    searchResults.hidden = false;
    searchInput.setAttribute('aria-expanded', 'true');
  }

  /** 題名を字のまま並べ、合った部分だけ mark で囲む */
  function searchTitle(item) {
    var span = document.createElement('span');
    span.className = 'search-title';
    var t = String(item.title);
    if (!item.hit) { span.textContent = t; return span; }
    span.appendChild(document.createTextNode(t.substring(0, item.hit[0])));
    var mark = document.createElement('mark');
    mark.textContent = t.substring(item.hit[0], item.hit[1]);
    span.appendChild(mark);
    span.appendChild(document.createTextNode(t.substring(item.hit[1])));
    return span;
  }

  function renderSearch() {
    var q = searchInput.value;
    if (!q.replace(/\s+/g, '')) { hideSearchResults(); return; }
    // 一覧がまだ無いとき (取りに行っている・取れなかった) も、使い方の節は手元にあるので出す。
    // 取れなかったときは、打ち直しても知らせを消さない (次に欄へ入ったとき取り直す)
    var pending = searchIndexRows ? '' : (searchLoading || !searchError ? '探しています…' : searchError);
    var groups = pending ? [] : searchFilter(searchIndexRows, q);
    var used = groups.reduce(function (sum, g) { return sum + g.items.length; }, 0);
    var guideGroup = guideSearchGroup(q, SEARCH_TOTAL - used);
    if (guideGroup) groups = groups.concat([guideGroup]);
    if (!groups.length) { showSearchMessage(pending || '見つかりませんでした'); return; }

    searchResults.textContent = '';
    searchActive = -1;
    searchInput.removeAttribute('aria-activedescendant');
    if (pending) {
      var wait = document.createElement('p');
      wait.className = 'search-empty row-meta';
      wait.textContent = pending;
      searchResults.appendChild(wait);
    }
    var n = 0;
    groups.forEach(function (g) {
      var head = document.createElement('div');
      head.className = 'search-group-head row-meta';
      head.setAttribute('role', 'presentation');
      head.textContent = termIn(SEARCH_LABELS[g.kind]);
      searchResults.appendChild(head);
      g.items.forEach(function (item) {
        var row = document.createElement('div');
        row.className = 'search-row';
        row.id = 'search-opt-' + (n++);
        row.setAttribute('role', 'option');
        row.setAttribute('aria-selected', 'false');
        row.dataset.kind = item.kind;
        if (item.number) {
          var num = document.createElement('span');
          num.className = 'search-num row-meta';
          num.textContent = '#' + item.number;
          row.appendChild(num);
        }
        row.appendChild(searchTitle(item));
        var label = searchStateLabel(item);
        if (label) row.appendChild(makePill(label));
        row.addEventListener('click', function () { openSearchItem(item); });
        searchResults.appendChild(row);
      });
    });
    searchResults.hidden = false;
    searchInput.setAttribute('aria-expanded', 'true');
  }

  function moveSearch(step) {
    var rows = searchResults.querySelectorAll('.search-row');
    if (!rows.length) return;
    searchActive = Math.max(0, Math.min(rows.length - 1, searchActive + step));
    for (var i = 0; i < rows.length; i++) rows[i].setAttribute('aria-selected', String(i === searchActive));
    searchInput.setAttribute('aria-activedescendant', rows[searchActive].id);
    if (rows[searchActive].scrollIntoView) rows[searchActive].scrollIntoView({ block: 'nearest' });
  }

  /** 選んだものを開く。開いたら欄を空にして閉じる */
  function openSearchItem(item) {
    searchInput.value = '';
    closeSearch();
    searchInput.blur();
    if (item.kind === 'doc') openDocById(item.key, item.title);
    else if (item.kind === 'issue' && item.archived) {
      // 捨てたものは一覧に出ない (apiIssueList は置き場を返さない)。置き場を開いてその行を指す
      trashFocus = item.number;
      setIssueView('trash', true, { noSave: true });
      switchTab('issues');
    }
    else if (item.kind === 'issue') openIssueByNumber(item.number);
    else if (item.kind === 'pull') switchTab('pulls', { pr: item.number });
    else if (item.kind === 'branch') switchTab('branches');
    else if (item.kind === 'inquiry') {
      // 絞り込みが残っていたり「未解決だけ」で済んだものが外れていたりすると、別の報告が開く
      reportFilterEl.value = '';
      if (reportOpenOnly && item.state === 'done') {
        reportOpenOnly = false;
        setToggle(reportOpenBtn, reportOpenOnly);
      }
      reportShown = item.number;
      switchTab('report');
    }
    else if (item.kind === 'impediment') switchTab('impediments');
    else if (item.kind === 'guide') openGuideAt(item.key);
  }

  // 一覧の中 (見出し・送りのつまみ・行) を押しても欄から抜けない。抜けると blur で閉じる
  searchResults.addEventListener('mousedown', function (e) { e.preventDefault(); });

  // 狭い画面で開いた欄は、外側を押すと閉じる (広い画面は blur で閉じる)
  document.addEventListener('pointerdown', function (e) {
    if (!searchBox.classList.contains('is-open')) return;
    if (searchBox.contains(e.target)) return;
    closeSearch();
  });

  searchInput.addEventListener('focus', function () {
    loadSearchIndex();
    // 字を残したまま戻ってきたら、打ち直さなくても候補を出す
    if (searchInput.value.replace(/\s+/g, '')) renderSearch();
  });
  searchInput.addEventListener('input', renderSearch);
  searchInput.addEventListener('blur', function () {
    // 候補を押したときは mousedown で blur を止めてある
    if (!searchBox.classList.contains('is-open')) closeSearch();
  });
  searchInput.addEventListener('keydown', function (e) {
    // かな漢字の変換中は何もしない。変換を決める Enter で候補が開き、Esc で欄が
    // 閉じてしまう (Chrome は isComposing、Safari は確定直後に keyCode 229 で届く)
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSearch(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSearch(-1); }
    else if (e.key === 'Enter') {
      var rows = searchResults.querySelectorAll('.search-row');
      var pick = rows[searchActive >= 0 ? searchActive : 0];
      if (pick) { e.preventDefault(); pick.click(); }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      closeSearch();
      searchInput.blur();
    } else if (e.key === 'Tab') {
      // 狭い画面で開いた欄は blur では閉じない。Tab で次へ移るときは閉じる (移動は止めない)
      closeSearch();
    }
  });

  document.getElementById('search-open').addEventListener('click', function () {
    searchBox.classList.add('is-open');
    searchInput.focus();
    loadSearchIndex();
  });
  document.getElementById('search-close').addEventListener('click', function () {
    searchInput.value = '';
    closeSearch();
  });

  // Ctrl+K / ⌘K でどこからでも欄へ (入力欄の中でも効く)
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      // 全画面では探す欄が隠れている。抜けてから欄へ
      if (document.body.classList.contains('doc-full')) setDocFull(false);
      if (window.matchMedia && window.matchMedia('(max-width: 767px)').matches) searchBox.classList.add('is-open');
      searchInput.focus();
      loadSearchIndex();
    }
  });

  /**
   * 何分前・何時間前。1週間を超えたら月/日で出す。
   *
   * @param {string} iso
   * @returns {string}
   */
  function relativeTime(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return '';
    var min = Math.floor((Date.now() - t) / 60000);
    if (min < 1) return 'いま';
    if (min < 60) return min + '分前';
    var hours = Math.floor(min / 60);
    if (hours < 24) return hours + '時間前';
    var days = Math.floor(hours / 24);
    if (days < 7) return days + '日前';
    var d = new Date(t);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  /** あなたの番。種類ごとに5件まで、見出しに総数。押すとそのものを開く */
  function makeTurnBlock(turn) {
    var box = document.createElement('div');
    box.appendChild(homeHead('あなたの番'));
    var groups = [
      ['reviews', '確かめてほしい', 'pulls'],
      ['returned', '戻ってきた', 'pulls'],
      ['due', '期限が近い', 'issues'],
    ];
    var any = false;
    groups.forEach(function (g) {
      var part = turn[g[0]] || { items: [], total: 0 };
      var items = part.items || [];
      if (!items.length) return;
      any = true;
      var sec = document.createElement('div');
      sec.className = 'home-turn-group';
      var name = document.createElement('h3');
      name.className = 'home-sub';
      name.appendChild(document.createTextNode(g[1]));
      name.appendChild(makePill(String(part.total || items.length)));
      sec.appendChild(name);
      items.forEach(function (it) {
        var row = homeRow((g[2] === 'pulls' ? '確認依頼 #' : '#') + it.number + ' ' + it.title, 'home-turn-row');
        if (g[0] === 'due') {
          row.dataset.issue = String(it.number);
          var due = String(it.due || '');
          if (it.overdue) row.appendChild(makePill('期限切れ', 'chip chip-pri-high'));
          else if (due) row.appendChild(makePill('期限 ' + Number(due.substring(5, 7)) + '/' + Number(due.substring(8, 10))));
