  // ===== 状態 =====

  /**
   * 開いている文書。fileId は「いま画面に出している版」を指す。
   * docFileId は正式版の fileId で、版を切り替えても変わらない。
   */
  var current = {
    fileId: null, docFileId: null, docPath: null,
    headSha: null, branch: 'main',

  var allFiles = [];
  var currentUser = '';
  var currentTab = 'docs';

  /** 業務での呼び方。画面には Git の用語を出さない */
  var OFFICIAL = '正式版';

  // ===== サーバ側と同じ純関数 =====
  // src/core/FileUrl.js と src/core/Diff.js の diffPairs を写している。
  // google.script.run の往復を増やさないための意図的な重複であり、
  // 片方だけ直すと表示と実体がずれるため、変更時は必ず両方を直すこと。

  function fileUrlOf(type, fileId) {
    if (!fileId) return '';
    var base = {
      doc: 'https://docs.google.com/document/d/',
      sheet: 'https://docs.google.com/spreadsheets/d/',
      slide: 'https://docs.google.com/presentation/d/',
    }[String(type)];
    if (!base) return 'https://drive.google.com/file/d/' + fileId + '/view';
    return base + fileId + '/edit';
  }

  function diffPairs(ops) {
    var out = [];
    var dels = [];
    var ins = [];

    function flush() {
      var n = Math.max(dels.length, ins.length);
      for (var i = 0; i < n; i++) {
        var left = i < dels.length ? dels[i] : null;
        var right = i < ins.length ? ins[i] : null;
        var type = (left !== null && right !== null)
          ? 'change' : (left !== null ? 'delete' : 'insert');
        out.push({ left: left, right: right, type: type });
      }
      dels = [];
      ins = [];
    }

    for (var i = 0; i < (ops || []).length; i++) {
      var op = ops[i];
      if (op.type === 'delete') { dels.push(op.line); continue; }
      if (op.type === 'insert') { ins.push(op.line); continue; }
      flush();
      out.push({ left: op.line, right: op.line, type: 'equal' });
    }
    flush();
    return out;
  }

  /**
   * 論理パスを版の名前と表示用パスに分ける。
   *
   * @param {string} path
   * @returns {{branch:string, path:string}}
   */
  function splitPath(path) {
    var m = /^branches\/([^\/]+)\/([\s\S]*)$/.exec(String(path || ''));
    return m
      ? { branch: m[1], path: m[2] }
      : { branch: 'main', path: String(path || '') };
  }

  /** @param {string} name @returns {string} 画面に出す版の名前 */
  function branchLabel(name) {
    return name === 'main' ? OFFICIAL : name;
  }

  // ===== アイコン =====

  /**
   * SVGアイコンを作る。
   *
   * 絵文字は環境によって字形が変わり、色や太さを揃えられないため使わない。
   *
   * @param {string} name
   * @returns {SVGElement}
   */
  function makeIcon(name) {
    var paths = {
      'external-link': ['M15 3h6v6', 'M10 14L21 3', 'M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6'],
      plus: ['M12 5v14', 'M5 12h14'],
      inbox: ['M22 12h-6l-2 3h-4l-2-3H2', 'M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z'],
      'file-text': ['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z', 'M14 2v6h6', 'M8 13h8', 'M8 17h5'],
      pencil: ['M12 20h9', 'M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z'],
      'git-commit': ['M12 3v6', 'M12 15v6'],
      'git-branch': ['M6 3v12', 'M18 9a3 3 0 1 0-6 0 3 3 0 0 0 6 0z', 'M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', 'M15 9a9 9 0 0 1-9 9'],
      'git-pull-request': ['M18 6v9', 'M6 9v12', 'M13 6h3a2 2 0 0 1 2 2v1'],
      'circle-dot': ['M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z', 'M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z'],
      columns: ['M4 4h16v16H4z', 'M9 4v16', 'M15 4v16'],
      'help-circle': ['M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z', 'M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3', 'M12 17h.01'],
      save: ['M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z', 'M17 21v-8H7v8', 'M7 3v5h8'],
      archive: ['M21 8v13H3V8', 'M1 3h22v5H1z', 'M10 12h4'],
      check: ['M20 6L9 17l-5-5'],
      back: ['M19 12H5', 'M12 19l-7-7 7-7'],
      sun: ['M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z', 'M12 1v2', 'M12 21v2', 'M4.2 4.2l1.4 1.4', 'M18.4 18.4l1.4 1.4', 'M1 12h2', 'M21 12h2', 'M4.2 19.8l1.4-1.4', 'M18.4 5.6l1.4-1.4'],
      moon: ['M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z'],
      monitor: ['M20 3H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1z', 'M8 21h8', 'M12 17v4'],
      calendar: ['M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z', 'M16 2v4', 'M8 2v4', 'M3 10h18'],
      user: ['M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2', 'M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'],
    };

    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('class', 'icon');
    svg.setAttribute('aria-hidden', 'true');

    (paths[name] || []).forEach(function (d) {
      var path = document.createElementNS(ns, 'path');
      path.setAttribute('d', d);
      svg.appendChild(path);
    });
    return svg;
  }

  var TAB_ICONS = {
    docs: 'file-text',
    content: 'file-text',
    history: 'git-commit',
    drafts: 'git-branch',
    branches: 'git-branch',
    pulls: 'git-pull-request',
    issues: 'circle-dot',
    board: 'columns',
    gantt: 'calendar',
    help: 'help-circle',
  };

  // ===== テーマ =====

  var THEME_ORDER = ['system', 'light', 'dark'];
  var themeMode = 'system';

  function readTheme() {
    try {
      var saved = window.localStorage.getItem('theme');
      if (THEME_ORDER.indexOf(saved) >= 0) return saved;
    } catch (e) { /* 保存できない環境では既定に従う */ }
    return 'system';
  }

  function writeTheme(mode) {
    try {
      window.localStorage.setItem('theme', mode);
    } catch (e) { /* 保存できなくても表示は切り替える */ }
  }

  function applyTheme(mode) {
    themeMode = mode;

    if (mode === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);

    var label = { system: '端末の設定に従う', light: '明るい', dark: '暗い' }[mode];
    var icon = { system: 'monitor', light: 'sun', dark: 'moon' }[mode];

    themeBtn.textContent = '';
    themeBtn.appendChild(makeIcon(icon));
    themeBtn.title = '画面の明るさ: ' + label + ' (押すと切り替え)';
    themeBtn.setAttribute('aria-label', themeBtn.title);
  }

  function cycleTheme() {
    var next = THEME_ORDER[(THEME_ORDER.indexOf(themeMode) + 1) % THEME_ORDER.length];
    applyTheme(next);
    writeTheme(next);

    // 本文は iframe の中にあり、外側のテーマ変更が届かない。描き直す
    if (current.fileId && !panelContent.hidden) openDoc(current.fileId, current.docPath);
  }

  // ===== ペインの幅 =====

  var SIDEBAR_MIN = 180;
  var SIDEBAR_MAX = 560;

  function setSidebarWidth(px) {
    var w = Math.min(SIDEBAR_MAX, Math.max(SIDEBAR_MIN, Math.round(px)));
    document.documentElement.style.setProperty('--sidebar-w', w + 'px');
    return w;
  }

  function saveSidebarWidth(px) {
    try {
      window.localStorage.setItem('sidebarWidth', String(px));
    } catch (e) { /* 保存できなくても操作はできる */ }
  }

  function restoreSidebarWidth() {
    try {
      var saved = Number(window.localStorage.getItem('sidebarWidth'));
      if (saved) setSidebarWidth(saved);
    } catch (e) { /* 既定幅のままでよい */ }
  }

  /**
   * 境界を掴んで左ペインの幅を変えられるようにする。
   *
   * 掴む操作だけを用意すると、キーボードだけの利用者が幅を変えられない。
   */
  function initResizer() {
    var dragging = false;

    resizer.addEventListener('pointerdown', function (e) {
      dragging = true;
      resizer.classList.add('dragging');
      resizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    resizer.addEventListener('pointermove', function (e) {
      if (dragging) setSidebarWidth(e.clientX);
    });

    resizer.addEventListener('pointerup', function (e) {
      if (!dragging) return;
      dragging = false;
      resizer.classList.remove('dragging');
      resizer.releasePointerCapture(e.pointerId);
      saveSidebarWidth(setSidebarWidth(e.clientX));
    });

    resizer.addEventListener('keydown', function (e) {
      var now = parseInt(
        getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w'), 10
      ) || 260;

      if (e.key === 'ArrowLeft') saveSidebarWidth(setSidebarWidth(now - 16));
      else if (e.key === 'ArrowRight') saveSidebarWidth(setSidebarWidth(now + 16));
      else return;

      e.preventDefault();
    });
  }

  // ===== モードレスな通知と入力 =====

  var snackTimer = null;

  /**
   * バナー通知を出す。
   *
   * alert はモーダルで操作を止め、取り消しの手段も与えない。
   *
   * @param {string} text
   * @param {{kind?: string, undo?: function, ms?: number}} [opts]
   */
  function showSnack(text, opts) {
    var options = opts || {};

    var old = document.getElementById('snackbar');
    if (old) old.remove();
    if (snackTimer) window.clearTimeout(snackTimer);

    var bar = document.createElement('div');
    bar.id = 'snackbar';
    bar.className = 'snackbar' + (options.kind ? ' ' + options.kind : '');
    bar.setAttribute('role', 'status');
    bar.setAttribute('aria-live', 'polite');

    var span = document.createElement('span');
    span.className = 'snackbar-text';
    span.textContent = text;
    bar.appendChild(span);

    if (options.undo) {
      var undoBtn = document.createElement('button');
      undoBtn.type = 'button';
      undoBtn.textContent = '取り消す';
      undoBtn.addEventListener('click', function () {
        bar.remove();
        options.undo();
      });
      bar.appendChild(undoBtn);
    }

    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.textContent = '閉じる';
    closeBtn.addEventListener('click', function () { bar.remove(); });
    bar.appendChild(closeBtn);

    document.body.appendChild(bar);

    var ms = options.ms || (options.undo ? 10000 : 5000);
    snackTimer = window.setTimeout(function () { bar.remove(); }, ms);
  }

  /**
   * 画面内に入力フォームを開く。prompt の置き換え。
   *
   * @param {HTMLElement} host
   * @param {Array<{name:string, label:string, multiline?:boolean, required?:boolean}>} fields
   * @param {string} submitLabel
   * @param {function(Object<string,string>): void} onSubmit
   * @returns {HTMLElement} 差し込んだフォーム
   */
  function openInlineForm(host, fields, submitLabel, onSubmit) {
    var existing = host.querySelector('.inline-form');
    if (existing) existing.remove();

    var form = document.createElement('form');
    form.className = 'inline-form';

    var inputs = {};
    fields.forEach(function (f) {
      var label = document.createElement('label');
      label.textContent = f.label;

      var input = document.createElement(f.multiline ? 'textarea' : 'input');
      if (!f.multiline) input.type = 'text';
      if (f.required) input.required = true;
      label.appendChild(input);

      inputs[f.name] = input;
      form.appendChild(label);
    });

    var actions = document.createElement('div');
    actions.className = 'inline-form-actions';

    var submit = document.createElement('button');
    submit.type = 'submit';
    submit.className = 'btn btn-primary';
    submit.textContent = submitLabel;
    actions.appendChild(submit);

    var cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'btn';
    cancel.textContent = 'やめる';
    cancel.addEventListener('click', function () { form.remove(); });
    actions.appendChild(cancel);

    form.appendChild(actions);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var values = {};
      var missing = false;

      fields.forEach(function (f) {
        values[f.name] = inputs[f.name].value;
        if (f.required && !values[f.name]) missing = true;
      });

      if (missing) {
        showSnack('必須の項目が空です', { kind: 'ng' });
        return;
      }
      form.remove();
      onSubmit(values);
    });

    // 閉じ道を必ず用意する
    form.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') form.remove();
    });

    host.insertBefore(form, host.firstChild);
    inputs[fields[0].name].focus();
    return form;
  }

  /**
   * その場で確認を取る帯を出す。confirm の置き換え。
   *
   * @param {HTMLElement} host
   * @param {string} text
   * @param {string} label
   * @param {function} onConfirm
   */
  function openConfirmStrip(host, text, label, onConfirm) {
    var existing = host.querySelector('.confirm-strip');
    if (existing) existing.remove();

    var strip = document.createElement('div');
    strip.className = 'confirm-strip';
    strip.setAttribute('role', 'alert');

    var span = document.createElement('span');
    span.textContent = text;
    strip.appendChild(span);

    var ok = document.createElement('button');
    ok.className = 'btn btn-primary';
    ok.textContent = label;
    ok.addEventListener('click', function () {
      strip.remove();
      onConfirm();
    });
    strip.appendChild(ok);

    var no = document.createElement('button');
    no.className = 'btn';
    no.textContent = 'やめる';
    no.addEventListener('click', function () { strip.remove(); });
    strip.appendChild(no);

    host.insertBefore(strip, host.firstChild);
    ok.focus();
  }

  /**
   * 空の状態を作る。「何も無い」ではなく次の一手を示す。
   *
   * @param {string} title
   * @param {string} hint
   * @param {{label:string, onClick:function}} [action]
   * @returns {HTMLElement}
   */
  function makeBlankState(title, hint, action) {
    var wrap = document.createElement('div');
    wrap.className = 'blank-state';
    wrap.appendChild(makeIcon('inbox'));

    var strong = document.createElement('strong');
    strong.textContent = title;
    wrap.appendChild(strong);

    var p = document.createElement('div');
    p.textContent = hint;
    wrap.appendChild(p);

    if (action) {
      var btn = document.createElement('button');
      btn.className = 'btn btn-primary';
      btn.textContent = action.label;
      btn.addEventListener('click', action.onClick);
      wrap.appendChild(btn);
    }
    return wrap;
  }

  /**
   * 元のファイルへのリンクを作る。
   *
   * @param {string} type
   * @param {string} fileId
   * @returns {HTMLElement}
   */
  function makeFileLink(type, fileId) {
    var a = document.createElement('a');
    a.className = 'file-link';
    a.href = fileUrlOf(type, fileId);
    a.target = '_blank';
    a.rel = 'noopener';
    a.appendChild(makeIcon('external-link'));
    a.title = '元のファイルを開く';
    a.setAttribute('aria-label', '元のファイルを開く');
    return a;
  }

  // ===== 読み込み中の骨組み =====

  /**
   * これから出る形を先に見せる。
   *
   * 「読み込み中…」の文字より、出来上がりの形を見せたほうが待ち時間が
   * 短く感じられ、中身が入ったときに位置もずれない。
   *
   * @param {HTMLElement} container
   * @param {string} kind 'list' | 'graph' | 'doc' | 'board' | 'block'
   * @param {number} [count]
   */
  function showSkeleton(container, kind, count) {
    container.textContent = '';
    var n = count || 4;

    if (kind === 'board') {
      var board = document.createElement('div');
      board.className = 'sk-board';

      for (var c = 0; c < 4; c++) {
        var col = document.createElement('div');
        col.className = 'sk-col';
        for (var k = 0; k < 2; k++) {
          var card = document.createElement('div');
          card.className = 'skeleton sk-card';
          col.appendChild(card);
        }
        board.appendChild(col);
      }
      container.appendChild(board);
      return;
    }

    if (kind === 'block') {
      var block = document.createElement('div');
      block.className = 'skeleton sk-block';
      container.appendChild(block);
      return;
    }

    for (var i = 0; i < n; i++) {
      var row = document.createElement('div');
      row.className = 'sk-row';

      if (kind === 'graph' || kind === 'doc') {
        var dot = document.createElement('div');
        dot.className = 'skeleton sk-dot';
        row.appendChild(dot);
      }

      var lines = document.createElement('div');
      lines.className = 'sk-lines';

      var main = document.createElement('div');
      main.className = 'skeleton sk-line' + (i % 2 ? ' mid' : '');
      lines.appendChild(main);

      if (kind !== 'doc') {
        var sub = document.createElement('div');
        sub.className = 'skeleton sk-line short';
        lines.appendChild(sub);
      }
      row.appendChild(lines);

      if (kind === 'graph' || kind === 'list') {
        var chip = document.createElement('div');
        chip.className = 'skeleton sk-chip';
        row.appendChild(chip);
      }

      container.appendChild(row);
    }
  }

  // ===== 本文の描画 =====

  /**
   * 連続する <li> を対応する ul/ol でラップする。
   *
   * @param {string} html
   * @returns {string}
   */
  function wrapLists(html) {
    var lines = String(html || '').split('\n');
    var out = [];
    var open = null;

    lines.forEach(function (line) {
      var m = /^<li data-list="(ul|ol)" data-depth="(\d+)">/.exec(line);
      if (!m) {
        if (open) { out.push('</' + open + '>'); open = null; }
        out.push(line);
        return;
      }
      if (open !== m[1]) {
        if (open) out.push('</' + open + '>');
        out.push('<' + m[1] + '>');
        open = m[1];
      }
      out.push(line);
    });

    if (open) out.push('</' + open + '>');
    return out.join('\n');
  }

  /**
   * 現在のテーマのトークンを読む。
   *
   * 本文は iframe の中に描くため、外側のCSS変数が届かない。
   * 描画のたびに実際の値を読んで流し込む。
   *
   * @returns {Object<string,string>}
   */
  function themeColors() {
    var style = getComputedStyle(document.documentElement);
    var names = ['--ink', '--ink-2', '--bg', '--bg-2', '--line', '--accent'];
    var out = {};

    names.forEach(function (n) {
      out[n] = String(style.getPropertyValue(n) || '').trim();
    });
    return out;
  }

  function renderIntoViewer(bodyHtml) {
    var c = themeColors();

    var css =
      'body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",' +
      '"Noto Sans JP",sans-serif;line-height:1.9;' +
      'color:' + c['--ink'] + ';background:' + c['--bg'] + ';' +
      'padding:32px 48px;max-width:820px;margin:0 auto;}' +
      'h1{font-size:24px;margin:1.6em 0 .6em;}' +
      'h2{font-size:20px;margin:1.6em 0 .6em;}' +
      'h3{font-size:17px;margin:1.4em 0 .5em;}' +
      'a{color:' + c['--accent'] + ';}' +
      'table{border-collapse:collapse;margin:1em 0;width:100%;}' +
      'td{border:1px solid ' + c['--line'] + ';padding:6px 10px;}' +
      'li{margin:.3em 0;}' +
      'img{max-width:100%;}' +
      'table[data-sheet]{width:auto;font-size:13px;}' +
      'table[data-sheet] td{white-space:nowrap;}' +
      'table[data-sheet]::before{content:attr(data-sheet);display:block;' +
      'font-size:11px;color:' + c['--ink-2'] + ';margin-bottom:4px;}' +
      'td[data-formula]{background:' + c['--bg-2'] + ';color:' + c['--ink-2'] + ';}' +
      'section[data-slide]{border-top:2px solid ' + c['--line'] + ';margin-top:24px;' +
      'padding-top:6px;font-size:11px;color:' + c['--ink-2'] + ';}' +
      'section[data-slide]::before{content:"スライド " attr(data-slide);}';

    viewer.srcdoc =
      '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">' +
      '<style>' + css + '</style></head><body>' + wrapLists(bodyHtml) + '</body></html>';
  }

  // ===== 差分 =====

  /**
   * 差分を左右2列で描画する。
   *
   * 片側しか無い行にも空のセルを置いて、左右の行がずれないようにする。
   *
   * @param {object[]} ops
   * @param {HTMLElement} container
   * @param {boolean} skipEqual
   */
  function renderDiffInto(ops, container, skipEqual) {
    var pairs = diffPairs(ops || []);
    var shown = [];

    for (var i = 0; i < pairs.length; i++) {
      if (skipEqual && pairs[i].type === 'equal') continue;
      shown.push(pairs[i]);
    }

    if (!shown.length) {
      var p = document.createElement('p');
      p.className = 'diff-empty';
      p.textContent = '違いはありません';
      container.appendChild(p);
      return;
    }

    var table = document.createElement('div');
    table.className = 'diff-split';

    shown.forEach(function (pair) {
      var row = document.createElement('div');
      row.className = 'diff-row';
      row.appendChild(diffCell(pair.left, pair.type === 'equal' ? '' : 'del'));
      row.appendChild(diffCell(pair.right, pair.type === 'equal' ? '' : 'ins'));
      table.appendChild(row);
    });
    container.appendChild(table);
  }

  function diffCell(text, kind) {
    var cell = document.createElement('div');
    cell.className = 'diff-cell' +
      (text === null ? ' empty' : (kind ? ' ' + kind : ''));
    cell.textContent = text === null ? '' : text;
    return cell;
  }

  // ===== 画面の切り替え =====

  var DOC_TABS = { content: 1, history: 1, drafts: 1 };

  /**
   * 画面を切り替える。
   *
   * タブは開いている文書のビューなので、文書を選んでいないときは出さない。
   *
   * @param {string} name
   */
  function switchTab(name) {
    if (DOC_TABS[name] && !current.fileId) name = 'docs';
    currentTab = name;

    var targets = document.querySelectorAll('[data-tab]');
    for (var i = 0; i < targets.length; i++) {
      targets[i].setAttribute('aria-current', String(targets[i].dataset.tab === name));
    }

    panelDocs.hidden = name !== 'docs';
    panelContent.hidden = name !== 'content';
    panelHistory.hidden = name !== 'history';
    panelDrafts.hidden = name !== 'drafts';
    panelBranches.hidden = name !== 'branches';
    panelPulls.hidden = name !== 'pulls';
    panelIssues.hidden = name !== 'issues';
    panelBoard.hidden = name !== 'board';
    panelGantt.hidden = name !== 'gantt';
    panelHelp.hidden = name !== 'help';

    tabsEl.hidden = !current.fileId || !DOC_TABS[name];
    updateCrumbs();

    if (name === 'docs') loadDocs();
    else if (name === 'history') loadHistory();
    else if (name === 'drafts') loadDrafts();
    else if (name === 'branches') loadBranches();
    else if (name === 'pulls') loadPulls();
    else if (name === 'issues') loadIssues();
    else if (name === 'board') loadBoard();
    else if (name === 'gantt') loadGantt();
    else if (name === 'help') loadHelp();
  }

  /**
   * 現在の位置を出す。文書を開いているときだけ戻り道を見せる。
   */
  function updateCrumbs() {
    var inDoc = !!current.fileId && !!DOC_TABS[currentTab];

    crumbBack.hidden = !inDoc;
    crumbSep.hidden = !inDoc;
    branchSwitch.hidden = !inDoc;
    openLink.hidden = !inDoc;

    if (!inDoc) {
      var names = {
        docs: '文書', branches: '改訂中の版', pulls: '確認依頼',
        issues: 'やること', board: '進捗ボード', help: '使い方',
      };
      titleEl.textContent = names[currentTab] || '文書';
      branchChip.hidden = true;
      dirtyBadge.hidden = true;
      commitBtn.hidden = true;
      stashBtn.hidden = true;
      return;
    }
    titleEl.textContent = current.docPath || '';
  }

  // ===== 文書の一覧 (ホーム) =====

  function loadFiles(then) {
    google.script.run
      .withSuccessHandler(function (files) {
        allFiles = files;
        if (then) then();
      })
      .withFailureHandler(function (err) {
        docListEl.textContent = 'エラー: ' + err.message;
      })
      .apiListFiles();
  }

  /**
   * 正式版の文書だけを並べる。改訂版は文書に従属するため一覧に混ぜない。
   */
  function renderDocs() {
    docListEl.textContent = '';

    var docs = allFiles.filter(function (f) {
      return splitPath(f.path).branch === 'main';
    });

    if (!docs.length) {
      docListEl.appendChild(makeBlankState(
        '管理している文書がありません',
        'Google ドライブの agentic-management/main に文書を置き、' +
        'GASエディタで debugRegisterFile() を実行すると現れます。'
      ));
      return;
    }

    docs.forEach(function (f) {
      var drafts = allFiles.filter(function (o) {
        return splitPath(o.path).branch !== 'main' &&
               splitPath(o.path).path === f.path;
      });

      var row = document.createElement('div');
      row.className = 'doc-card';

      var open = document.createElement('button');
      open.className = 'doc-open';
      open.appendChild(makeIcon('file-text'));

      var name = document.createElement('span');
      name.className = 'doc-name';
      name.textContent = f.path;
      open.appendChild(name);

      if (drafts.length) {
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = '改訂中 ' + drafts.length + '件';
        open.appendChild(chip);
      }

      open.addEventListener('click', function () { openDoc(f.fileId, f.path); });
      row.appendChild(open);
      row.appendChild(makeFileLink(f.type, f.fileId));

      docListEl.appendChild(row);
    });
  }

  function loadDocs() {
    if (!allFiles.length) {
      showSkeleton(docListEl, 'doc', 3);
      loadFiles(renderDocs);
    } else {
      renderDocs();
    }
    loadOverview();
  }

  /**
   * 関係の流れに実数を入れる。
   *
   * 何がいくつあるかが見えないと、次に何をすればよいか分からない。
   */
  function loadOverview() {
    google.script.run
      .withSuccessHandler(function (o) {
        document.getElementById('flow-issues').textContent = o.openIssues;
        document.getElementById('flow-branches').textContent = o.branches;
        document.getElementById('flow-prs').textContent = o.openPrs;
        document.getElementById('flow-docs').textContent = o.docs;

        setCount('count-drafts', o.branches);
        setCount('count-requests', o.openPrs);
        setCount('count-todos', o.openIssues);
      })
      .withFailureHandler(function () { /* 数が出なくても操作はできる */ })
      .apiOverview();
  }

  function setCount(id, n) {
    var el = document.getElementById(id);
    el.textContent = n;
    el.hidden = !n;
  }

  // ===== 文書を開く =====

  /**
   * 文書を開く。版の選択肢もここで作る。
   *
   * @param {string} fileId 開く版の fileId
   * @param {string} docPath 正式版の論理パス
   */
  function openDoc(fileId, docPath) {
    var doc = allFiles.filter(function (f) {
      return splitPath(f.path).branch === 'main' && f.path === docPath;
    })[0];

    current.docPath = docPath;
    current.docFileId = doc ? doc.fileId : fileId;
    current.fileId = fileId;

    titleEl.textContent = docPath;
    renderVersionSelect();

    google.script.run
      .withSuccessHandler(function (res) {
        openLink.href = res.url;
        renderIntoViewer(res.html);
        loadLinkedIssues(fileId);
        setDocMode('view');
        refreshStatus();
        switchTab('content');
      })
      .withFailureHandler(function (err) {
        showSnack('開けませんでした: ' + err.message, { kind: 'ng' });
      })
      .apiGetFileHtml(fileId);
  }

  /**
   * この文書が持つ版を選択肢にする。正式版を先頭に置く。
   */
  function renderVersionSelect() {
    branchSelect.textContent = '';

    var versions = allFiles.filter(function (f) {
      return splitPath(f.path).path === current.docPath;
    });

    versions.sort(function (a, b) {
      return splitPath(a.path).branch === 'main' ? -1 : 1;
    });

    versions.forEach(function (f) {
      var branch = splitPath(f.path).branch;
      var opt = document.createElement('option');
      opt.value = f.fileId;
      opt.textContent = branchLabel(branch);
      if (f.fileId === current.fileId) opt.selected = true;
      branchSelect.appendChild(opt);
    });
  }

  function refreshStatus() {
    google.script.run
      .withSuccessHandler(function (st) {
        current.headSha = st.headSha;
        current.branch = st.branch;

        branchChip.textContent = branchLabel(st.branch);
        branchChip.hidden = false;
        dirtyBadge.hidden = !st.dirty;

        var isOfficial = st.branch === 'main';
        commitBtn.hidden = isOfficial || !st.dirty;
        stashBtn.hidden = !isOfficial || !st.dirty;
      })
      .withFailureHandler(function () { /* 状態表示の失敗は致命的ではない */ })
      .apiFileStatus(current.fileId);
  }

  // ===== 本文: 読む / 直す =====

  /**
   * 本文の見せ方を切り替える。
   *
   * 「直す」は文書に対する動作であってビューではないため、タブにしない。
   *
   * @param {string} mode 'view' | 'edit'
   */
  function setDocMode(mode) {
    var editing = mode === 'edit';

    modeViewBtn.setAttribute('aria-pressed', String(!editing));
    modeEditBtn.setAttribute('aria-pressed', String(editing));

    viewer.hidden = editing;
    if (!editing) showEditorSkeleton(false);
    editorEl.hidden = !editing;
    editSaveBtn.hidden = !editing;

    if (editing) loadEditor();
    else editHint.textContent = '';
  }

  /**
   * 編集欄の骨組みを出し入れする。
   *
   * @param {boolean} on
   */
  function showEditorSkeleton(on) {
    var existing = document.getElementById('editor-skeleton');
    if (existing) existing.remove();

    editorEl.hidden = on;
    if (!on) return;

    var wrap = document.createElement('div');
    wrap.id = 'editor-skeleton';
    wrap.style.flex = '1';
    showSkeleton(wrap, 'list', 6);
    editorEl.parentNode.appendChild(wrap);
  }

  function loadEditor() {
    if (!current.fileId) return;

    editorEl.value = '';
    editorEl.disabled = true;
    editSaveBtn.disabled = true;
    showEditorSkeleton(true);

    google.script.run
      .withSuccessHandler(function (res) {
        showEditorSkeleton(false);
        editorEl.value = res.markdown;
        editorEl.disabled = !res.editable;
        editSaveBtn.disabled = !res.editable;
        editHint.textContent = res.editable
          ? '保存しても記録はされません。記録は上の「変更を記録」から'
          : OFFICIAL + 'は直接なおせません。改訂版を作って直してください';
      })
      .withFailureHandler(function (err) {
        showEditorSkeleton(false);
        editorEl.value = '';
        editHint.textContent = 'エラー: ' + err.message;
      })
      .apiGetMarkdown(current.fileId);
  }

  function saveEditor() {
    editSaveBtn.disabled = true;
    editHint.textContent = '保存中…';

    google.script.run
      .withSuccessHandler(function () {
        editSaveBtn.disabled = false;
        editHint.textContent = '保存しました';
        refreshStatus();
      })
      .withFailureHandler(function (err) {
        editSaveBtn.disabled = false;
        editHint.textContent = '';
        showSnack(err.message, { kind: 'ng' });
      })
      .apiSaveMarkdown(current.fileId, editorEl.value);
  }

  function doCommit() {
    openInlineForm(
      panelContent,
      [{ name: 'message', label: 'この変更をひとことで', required: true }],
      '記録する',
      function (v) {
        commitBtn.disabled = true;
        google.script.run
          .withSuccessHandler(function () {
            commitBtn.disabled = false;
            showSnack('変更を記録しました', { kind: 'ok' });
            refreshStatus();
            loadOverview();
          })
          .withFailureHandler(function (err) {
            commitBtn.disabled = false;
            showSnack('記録できませんでした: ' + err.message, { kind: 'ng' });
          })
          .apiCommit(current.fileId, v.message, current.headSha);
      }
    );
  }

  function stashMainDrift() {
    openConfirmStrip(
      panelContent,
      OFFICIAL + 'を直接なおした分を、退避用の記録として残します。',
      '退避する',
      doStash
    );
  }

  function doStash() {
    stashBtn.disabled = true;
    google.script.run
      .withSuccessHandler(function () {
        stashBtn.disabled = false;
        showSnack('直接編集を退避しました', { kind: 'ok' });
        refreshStatus();
      })
      .withFailureHandler(function (err) {
        stashBtn.disabled = false;
        showSnack(err.message, { kind: 'ng' });
      })
      .apiStashMainDrift(current.fileId);
  }

  function loadLinkedIssues(fileId) {
    linkedIssuesEl.textContent = '';
    linkedIssuesEl.hidden = true;

    google.script.run
      .withSuccessHandler(function (issues) {
        if (!issues.length) return;
        issues.forEach(function (issue) {
          var chip = document.createElement('span');
          chip.className = 'linked-issue';
          chip.textContent = 'やること #' + issue.number + ' ' + issue.title;
          linkedIssuesEl.appendChild(chip);
        });
        linkedIssuesEl.hidden = false;
      })
      .withFailureHandler(function () {})
      .apiIssuesForFile(fileId);
  }

  // ===== 改訂の履歴 =====

  /**
   * 変更の記録の系統を描く。
   *
   * 版ごとに縦の列を持ち、分かれた地点まで線を通す。線が無いと、
   * どの記録がどの版のものか読めない。
   *
   * @param {object} row
   * @param {number} laneCount
   * @returns {SVGElement}
   */
  function makeGraphCell(row, laneCount) {
    var ns = 'http://www.w3.org/2000/svg';
    var step = 14;
    var height = 44;
    var width = Math.max(1, laneCount) * step + 6;

    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'graph-cell');
    svg.setAttribute('width', String(width));
    svg.setAttribute('height', String(height));
    svg.setAttribute('aria-hidden', 'true');

    function x(lane) { return lane * step + step / 2 + 2; }

    row.activeLanes.forEach(function (lane) {
      var line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', String(x(lane)));
      line.setAttribute('x2', String(x(lane)));
      line.setAttribute('y1', '0');
      line.setAttribute('y2', String(height));
      line.setAttribute('class', 'graph-line lane-' + (lane % 4));
      svg.appendChild(line);
    });

    if (row.fork && row.forkLane >= 0) {
      var path = document.createElementNS(ns, 'path');
      var from = x(row.lane);
      var to = x(row.forkLane);
      path.setAttribute('d',
        'M' + from + ' ' + (height / 2) +
        ' C' + from + ' ' + height + ' ' + to + ' ' + (height / 2) + ' ' + to + ' ' + height);
      path.setAttribute('class', 'graph-line lane-' + (row.lane % 4));
      path.setAttribute('fill', 'none');
      svg.appendChild(path);
    }

    var dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', String(x(row.lane)));
    dot.setAttribute('cy', String(height / 2));
    dot.setAttribute('r', row.merge ? '5' : '4');
    dot.setAttribute('class',
      'graph-dot lane-' + (row.lane % 4) + (row.merge ? ' merge' : ''));
    svg.appendChild(dot);

    return svg;
  }

  function loadHistory() {
    if (!current.fileId) return;

    showSkeleton(historyList, 'graph', 6);
    diffView.textContent = '';

    google.script.run
      .withSuccessHandler(function (graph) {
        historyList.textContent = '';

        if (!graph.rows.length) {
          historyList.appendChild(makeBlankState(
            'まだ記録がありません',
            '本文を直して「変更を記録」を押すと、ここに残ります。'
          ));
          return;
        }

        var headOf = {};
        graph.rows.forEach(function (c) {
          if (!headOf[c.branch]) headOf[c.branch] = c.sha;
        });

        graph.rows.forEach(function (c) {
          var btn = document.createElement('button');
          btn.className = 'commit-item graph-row';
          btn.appendChild(makeGraphCell(c, graph.laneCount));

          var desc = document.createElement('div');
          desc.className = 'graph-col-desc';

          if (headOf[c.branch] === c.sha) {
            var label = document.createElement('span');
            label.className = 'branch-label lane-' + (c.lane % 4);
            label.appendChild(makeIcon('git-branch'));
            label.appendChild(document.createTextNode(branchLabel(c.branch)));
            desc.appendChild(label);
          }

          var msg = document.createElement('span');
          msg.className = 'commit-message';
          msg.textContent = c.message;
          desc.appendChild(msg);
          btn.appendChild(desc);

          var date = document.createElement('span');
          date.className = 'graph-col-date';
          date.textContent = new Date(c.timestamp).toLocaleString('ja-JP', {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
          });
          btn.appendChild(date);

          var author = document.createElement('span');
          author.className = 'graph-col-author';
          author.textContent = String(c.author).replace(/@.*$/, '');
          btn.appendChild(author);

          var sha = document.createElement('span');
          sha.className = 'graph-col-sha';
          sha.textContent = String(c.sha).substring(0, 7);
          btn.appendChild(sha);

          btn.addEventListener('click', function () {
            var items = historyList.querySelectorAll('.commit-item');
            for (var i = 0; i < items.length; i++) {
              items[i].setAttribute('aria-current', String(items[i] === btn));
            }
            showSkeleton(diffView, 'block');
            google.script.run
              .withSuccessHandler(function (ops) {
                diffView.textContent = '';
                renderDiffInto(ops, diffView, false);
              })
              .withFailureHandler(function (err) {
                diffView.textContent = 'エラー: ' + err.message;
              })
              .apiCommitDiff(c.parentSha || '', c.sha);
          });

          historyList.appendChild(btn);
        });

        historyList.firstChild.click();
      })
      .withFailureHandler(function (err) {
        historyList.textContent = 'エラー: ' + err.message;
      })
      .apiCommitGraph(current.fileId);
  }

  // ===== この文書の改訂版 =====

  function loadDrafts() {
    draftListEl.textContent = '';

    var drafts = allFiles.filter(function (f) {
      var s = splitPath(f.path);
      return s.branch !== 'main' && s.path === current.docPath;
    });

    if (!drafts.length) {
      draftListEl.appendChild(makeBlankState(
        'この文書の改訂版はありません',
        OFFICIAL + 'をコピーして改訂版を作ると、正式版に影響を与えずに直せます。',
        { label: 'この文書の改訂版を作る', onClick: createDraft }
      ));
      return;
    }

    drafts.forEach(function (f) {
      var branch = splitPath(f.path).branch;

      var row = document.createElement('div');
      row.className = 'row-item';

      var open = document.createElement('button');
      open.className = 'row-open';
      open.appendChild(makeIcon('git-branch'));

      var title = document.createElement('span');
      title.className = 'row-title';
      title.textContent = branch;
      open.appendChild(title);

      open.addEventListener('click', function () {
        openDoc(f.fileId, current.docPath);
      });
      row.appendChild(open);
      row.appendChild(makeFileLink(f.type, f.fileId));

      draftListEl.appendChild(row);
    });
  }

  function createDraft() {
    if (!current.docFileId) {
      showSnack('先に文書を選んでください', { kind: 'ng' });
      return;
    }

    openInlineForm(
      panelDrafts,
      [{ name: 'name', label: '改訂版の名前 (例: 在宅勤務規定の見直し)', required: true }],
      '作る',
      function (v) {
        google.script.run
          .withSuccessHandler(function () {
            showSnack('改訂版「' + v.name + '」を作りました', { kind: 'ok' });
            loadFiles(function () {
              loadDrafts();
              renderVersionSelect();
            });
            loadOverview();
          })
          .withFailureHandler(function (err) {
            showSnack('作れませんでした: ' + err.message, { kind: 'ng' });
          })
          .apiBranchCreate(v.name, current.docFileId);
      }
    );
  }

  // ===== 改訂中の版 (横断) =====

  function loadBranches() {
    showSkeleton(branchListEl, 'list', 3);

    google.script.run
      .withSuccessHandler(function (branches) {
        branchListEl.textContent = '';

        var drafts = branches.filter(function (b) { return b.name !== 'main'; });
        if (!drafts.length) {
          branchListEl.appendChild(makeBlankState(
            '改訂中の版はありません',
            '文書を開いて「この文書の改訂版」から作れます。'
          ));
          return;
        }

        drafts.forEach(function (b) {
          var row = document.createElement('div');
          row.className = 'row-item';

          var main = document.createElement('div');
          main.className = 'row-main';

          var title = document.createElement('div');
          title.className = 'row-title';
          title.textContent = b.name;
          main.appendChild(title);

          var meta = document.createElement('div');
          meta.className = 'row-meta';
          meta.textContent = b.createdBy +
            (b.state === 'merged' ? ' · 反映済み' : ' · 改訂中');
          main.appendChild(meta);
          row.appendChild(main);

          if (b.state !== 'merged') {
            var prBtn = document.createElement('button');
            prBtn.className = 'btn btn-primary';
            prBtn.textContent = '確認を依頼する';
            prBtn.addEventListener('click', function () { createRequest(b.name); });
            row.appendChild(prBtn);
          }

          var del = document.createElement('button');
          del.className = 'btn';
          del.textContent = '捨てる';
          del.addEventListener('click', function () {
            openConfirmStrip(panelBranches,
              '改訂版「' + b.name + '」を捨てます。中の変更は元に戻せません。',
              '捨てる',
              function () {
                google.script.run
                  .withSuccessHandler(function () {
                    showSnack('改訂版を捨てました', { kind: 'ok' });
                    loadFiles(loadBranches);
                    loadOverview();
                  })
                  .withFailureHandler(function (err) {
                    showSnack(err.message, { kind: 'ng' });
                  })
                  .apiBranchDelete(b.name);
              });
          });
          row.appendChild(del);

          branchListEl.appendChild(row);
        });
      })
      .withFailureHandler(function (err) {
        branchListEl.textContent = 'エラー: ' + err.message;
      })
      .apiBranchList();
  }

  /**
   * 改訂版の変更を、正式版に反映してよいか尋ねる。
   *
   * @param {string} branchName
   */
  function createRequest(branchName) {
    var work = allFiles.filter(function (f) {
      return splitPath(f.path).branch === branchName;
    })[0];

    if (!work) {
      showSnack('対象の文書が見つかりません', { kind: 'ng' });
      return;
    }

    var docPath = splitPath(work.path).path;
    var doc = allFiles.filter(function (f) {
      return splitPath(f.path).branch === 'main' && f.path === docPath;
    })[0];

    if (!doc) {
      showSnack(OFFICIAL + 'の文書が見つかりません', { kind: 'ng' });
      return;
    }

    openInlineForm(
      panelBranches,
      [
        { name: 'title', label: '何を変えたか', required: true },
        { name: 'body', label: '補足 (任意)', multiline: true },
      ],
      '確認を依頼する',
      function (v) {
        google.script.run
          .withSuccessHandler(function () {
            showSnack('確認を依頼しました', { kind: 'ok' });
            switchTab('pulls');
            loadOverview();
          })
          .withFailureHandler(function (err) {
            showSnack('依頼できませんでした: ' + err.message, { kind: 'ng' });
          })
          .apiPrCreate(v.title, v.body, branchName, doc.fileId);
      }
    );
  }

  function bulkCommit() {
    bulkCommitBtn.disabled = true;

    google.script.run
      .withSuccessHandler(function (branches) {
        bulkCommitBtn.disabled = false;

        var drafts = branches.filter(function (b) {
          return b.name !== 'main' && b.state !== 'merged';
        });

        if (!drafts.length) {
          showSnack('改訂中の版がありません');
          return;
        }
        collectDirty(drafts.map(function (b) { return b.name; }));
      })
      .withFailureHandler(function (err) {
        bulkCommitBtn.disabled = false;
        showSnack(err.message, { kind: 'ng' });
      })
      .apiBranchList();
  }

  /**
   * 記録していない変更を集めてから、まとめて記録する。
   *
   * 対象は既定ですべて選ぶ。毎回選び直す作業は、ほとんどの場合
   * 「全部」を選ぶだけの手間にしかならない。
   *
   * @param {string[]} branchNames
   */
  function collectDirty(branchNames) {
    var pending = branchNames.length;
    var files = [];

    branchNames.forEach(function (name) {
      google.script.run
        .withSuccessHandler(function (dirty) {
          files = files.concat(dirty);
          if (--pending === 0) askBulkCommit(files);
        })
        .withFailureHandler(function () {
          if (--pending === 0) askBulkCommit(files);
        })
        .apiDirtyFiles(name);
    });
  }

  function askBulkCommit(files) {
    if (!files.length) {
      showSnack('記録していない変更はありません');
      return;
    }

    var checks = [];
    var list = document.createElement('div');
    list.className = 'bulk-list';

    files.forEach(function (f) {
      var row = document.createElement('label');
      row.className = 'bulk-row';

      var box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = true;
      box.value = f.fileId;
      checks.push(box);
      row.appendChild(box);

      var name = document.createElement('span');
      name.textContent = f.path;
      row.appendChild(name);

      list.appendChild(row);
    });

    var form = openInlineForm(
      panelBranches,
      [{ name: 'message', label: files.length + '件の変更をまとめて記録', required: true }],
      '記録する',
      function (v) {
        var ids = checks.filter(function (c) { return c.checked; })
          .map(function (c) { return c.value; });

        if (!ids.length) {
          showSnack('対象が選ばれていません', { kind: 'ng' });
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            var text = res.committed.length + '件記録しました';
            if (res.failed.length) {
              text += ' / ' + res.failed.length + '件できませんでした: ' +
                res.failed[0].path + ' ' + res.failed[0].error;
            }
            showSnack(text, { kind: res.failed.length ? 'ng' : 'ok' });
            loadOverview();
          })
          .withFailureHandler(function (err) {
            showSnack(err.message, { kind: 'ng' });
          })
          .apiCommitMany(ids, v.message);
      }
    );
    form.insertBefore(list, form.querySelector('.inline-form-actions'));
  }

  /**
   * 食い違いの解決を選ばせる。
   *
   * @param {object[]} conflicts
   * @param {HTMLElement} container
   * @returns {function(): string[]}
   */
  function renderConflicts(conflicts, container) {
    var selects = [];

    conflicts.forEach(function (c, i) {
      var block = document.createElement('div');
      block.className = 'conflict-block';

      var head = document.createElement('div');
      head.className = 'conflict-head';
      head.textContent = '同じ場所が両方で変わっています ' + (i + 1) + ' / ' + conflicts.length;
      block.appendChild(head);

      [[OFFICIAL + '側', c.ours], ['改訂版側', c.theirs]].forEach(function (pair) {
        var side = document.createElement('div');
        side.className = 'conflict-side';

        var label = document.createElement('div');
        label.className = 'conflict-label';
        label.textContent = pair[0];
        side.appendChild(label);

        if (!pair[1] || !pair[1].length) {
          var del = document.createElement('div');
          del.className = 'conflict-label';
          del.textContent = '(削除)';
          side.appendChild(del);
        } else {
          pair[1].forEach(function (line) {
            var div = document.createElement('div');
            div.className = 'diff-line';
            div.textContent = line;
            side.appendChild(div);
          });
        }
        block.appendChild(side);
      });

      var choiceWrap = document.createElement('div');
      choiceWrap.className = 'conflict-choice';

      var sel = document.createElement('select');
      [['ours', OFFICIAL + '側を残す'], ['theirs', '改訂版側を採用'],
       ['both', '両方を残す']].forEach(function (opt) {
        var o = document.createElement('option');
        o.value = opt[0];
        o.textContent = opt[1];
        sel.appendChild(o);
      });

      choiceWrap.appendChild(sel);
      block.appendChild(choiceWrap);
      selects.push(sel);

      container.appendChild(block);
    });

    return function () {
      return selects.map(function (s) { return s.value; });
    };
  }

  function renderConversation(pr, container) {
    var first = document.createElement('div');
    first.className = 'comment';

    var head = document.createElement('div');
    head.className = 'comment-head';
    head.textContent = pr.author + ' が依頼';
    first.appendChild(head);

    var body = document.createElement('div');
    body.className = 'comment-body';
    body.textContent = pr.body || '(補足なし)';
    first.appendChild(body);
    container.appendChild(first);

    google.script.run
      .withSuccessHandler(function (reviews) {
        var labels = {
          approve: '承認', request_changes: '直してほしい', comment: 'コメント',
        };

        reviews.forEach(function (r) {
          var el = document.createElement('div');
          el.className = 'comment';

          var h = document.createElement('div');
          h.className = 'comment-head';
          h.textContent = r.reviewer + ' · ' + (labels[r.state] || r.state);
          el.appendChild(h);

          if (r.body) {
            var b = document.createElement('div');
            b.className = 'comment-body';
            b.textContent = r.body;
            el.appendChild(b);
          }
          container.appendChild(el);
        });

        container.appendChild(makeCommentForm(pr));
      })
      .withFailureHandler(function (err) {
        container.textContent = 'エラー: ' + err.message;
      })
      .apiPrReviews(pr.number);
  }

  function makeCommentForm(pr) {
    var form = document.createElement('div');
    form.className = 'comment-form';

    var input = document.createElement('textarea');
    input.placeholder = 'コメントを書く';
    form.appendChild(input);

    var send = document.createElement('button');
    send.className = 'btn btn-primary';
    send.textContent = '書き込む';
    send.addEventListener('click', function () {
      if (!input.value) return;
      send.disabled = true;
      google.script.run
        .withSuccessHandler(function () { showPrDetail(pr); })
        .withFailureHandler(function (err) {
          send.disabled = false;
          showSnack(err.message, { kind: 'ng' });
        })
        .apiPrReview(pr.number, 'comment', input.value);
    });

    form.appendChild(send);
    return form;
  }

  function renderPrCommits(pr, container) {
    showSkeleton(container, 'list', 3);

    google.script.run
      .withSuccessHandler(function (commits) {
        container.textContent = '';
        if (!commits.length) {
          container.textContent = '記録はありません';
          return;
        }

        commits.forEach(function (c) {

          row.className = 'row-item';

          title.textContent = c.message;
          row.appendChild(title);

          meta.className = 'row-meta';

          container.appendChild(row);
        });
      })
      .withFailureHandler(function (err) {
        container.textContent = 'エラー: ' + err.message;
      })
      .apiPrCommits(pr.number);

  function showPrDetail(pr) {
    showSkeleton(prDetail, 'block');

    google.script.run
      .withSuccessHandler(function (preview) {
        prDetail.textContent = '';

        var head = document.createElement('div');
        head.className = 'pr-title';
        head.textContent = '#' + pr.number + ' ' + pr.title;
        prDetail.appendChild(head);

        var meta = document.createElement('div');
        meta.className = 'row-meta';
        meta.textContent =
          pr.sourceBranch + ' → ' + OFFICIAL + ' · ' + pr.author +
          ' · 承認 ' + preview.approvals + '件 · ' +
          (preview.clean ? 'そのまま反映できます' : '同じ場所が両方で変わっています');
        prDetail.appendChild(meta);

        var getChoices = function () { return []; };

        if (preview.problems && preview.problems.length) {
          var warn = document.createElement('div');
          warn.className = 'confirm-strip';
          warn.textContent = '反映できません: ' + preview.problems.join(' / ');
          prDetail.appendChild(warn);
        }

        if (!preview.clean) getChoices = renderConflicts(preview.conflicts, prDetail);

        if (pr.state !== 'merged' && pr.state !== 'closed') {
          var actions = document.createElement('div');
          actions.className = 'pr-actions';

          var approveBtn = document.createElement('button');
          approveBtn.className = 'btn';
          approveBtn.textContent = '承認する';

          // 押せるのに失敗する状態を作らない
          if (currentUser && String(pr.author) === currentUser) {
            approveBtn.disabled = true;
            approveBtn.title = '自分が出した依頼は自分で承認できません';
          }

          approveBtn.addEventListener('click', function () {
            approveBtn.disabled = true;
            google.script.run
              .withSuccessHandler(function () { showPrDetail(pr); })
              .withFailureHandler(function (err) {
                approveBtn.disabled = false;
                showSnack(err.message, { kind: 'ng' });
              })
              .apiPrReview(pr.number, 'approve', '');
          });

          var mergeBtn = document.createElement('button');
          mergeBtn.className = 'btn btn-primary';
          mergeBtn.textContent = OFFICIAL + 'に反映する';

          if (preview.problems && preview.problems.length) {
            mergeBtn.disabled = true;
            mergeBtn.title = '反映できない内容が含まれています';
          } else if (preview.approvals < 1) {
            mergeBtn.disabled = true;
            mergeBtn.title = '反映には1件以上の承認が必要です';
          }

          mergeBtn.addEventListener('click', function () {
            openConfirmStrip(
              prDetail,
              OFFICIAL + 'の文書をこの内容で書き換えます。取り消せません。',
              '反映する',
              function () {
                mergeBtn.disabled = true;
                google.script.run
                  .withSuccessHandler(function () {
                    showSnack('#' + pr.number + ' を' + OFFICIAL + 'に反映しました',
                      { kind: 'ok' });
                    loadPulls();
                    loadOverview();
                  })
                  .withFailureHandler(function (err) {
                    mergeBtn.disabled = false;
                    showSnack('反映できませんでした: ' + err.message, { kind: 'ng' });
                  })
                  .apiPrMerge(pr.number, getChoices());
              }
            );
          });

          actions.appendChild(approveBtn);
          actions.appendChild(mergeBtn);
          prDetail.appendChild(actions);
        }

        var prTabs = document.createElement('div');
        prTabs.className = 'pr-tabs';
        var prBody = document.createElement('div');

        var views = {
          conversation: function () { renderConversation(pr, prBody); },
          commits: function () { renderPrCommits(pr, prBody); },
          files: function () { renderDiffInto(preview.ops, prBody, true); },
        };

        [['conversation', 'やりとり'], ['commits', '変更の記録'], ['files', '違い']]
          .forEach(function (t) {
            var b = document.createElement('button');
            b.className = 'pr-tab';
            b.textContent = t[1];
            b.setAttribute('aria-current', String(t[0] === 'conversation'));
            b.addEventListener('click', function () {
              var all = prTabs.querySelectorAll('.pr-tab');
              for (var i = 0; i < all.length; i++) {
                all[i].setAttribute('aria-current', String(all[i] === b));
              }
              prBody.textContent = '';
              views[t[0]]();
            });
            prTabs.appendChild(b);
          });

        prDetail.appendChild(prTabs);
        prDetail.appendChild(prBody);
        views.conversation();
      })
      .withFailureHandler(function (err) {
        prDetail.textContent = 'エラー: ' + err.message;
      })
      .apiPrPreview(pr.number);
  }

  // ===== やること =====

      .withSuccessHandler(function (issues) {

          var title = document.createElement('div');

          main.appendChild(title);

          var meta = document.createElement('div');
          meta.className = 'row-meta';
          meta.textContent = (issue.state === 'open' ? '未着手・対応中' : '完了') +
            (issue.assignee ? ' · ' + issue.assignee : ' · 担当なし') +
            (issue.dueDate ? ' · 期限 ' + String(issue.dueDate).substring(0, 10) : '') +

          open.appendChild(main);

          if (issue.state === 'open' && current.docFileId) {

            branchBtn.className = 'btn btn-primary';

            branchBtn.addEventListener('click', function () {
              branchBtn.disabled = true;
              google.script.run
                .withSuccessHandler(function (b) {
                  showSnack('改訂版「' + b.name + '」を作りました', { kind: 'ok' });
                  loadFiles(function () { loadIssues(); });
                  loadOverview();
                })
                .withFailureHandler(function (err) {
                  branchBtn.disabled = false;
                  showSnack(err.message, { kind: 'ng' });
                })
                .apiIssueCreateBranch(issue.number, current.docFileId);
            });
            row.appendChild(branchBtn);
          }

          issueListEl.appendChild(row);
        });
      })
      .withFailureHandler(function (err) {
        issueListEl.textContent = 'エラー: ' + err.message;
      })

  /**
   * やることの中身を直す。
   *
   * 一覧からも工程表からも進捗ボードからも同じ画面を開く。
   * 対象が同じなら編集の場所も同じにする。
   *
   * @param {object} issue issues 行
   * @param {HTMLElement} host
   */
  function openIssueDetail(issue, host) {
    var form = openInlineForm(
      host,
      [
        { name: 'title', label: 'やること', required: true },
        { name: 'body', label: '補足', multiline: true },
        { name: 'assignee', label: '担当者 (メールアドレス)' },
        { name: 'dueDate', label: '期限 (例: 2026-09-30)' },
        { name: 'labels', label: 'ラベル (カンマ区切り)' },
      ],
      '保存する',
      function (v) {
        google.script.run
          .withSuccessHandler(function () {
            showSnack('#' + issue.number + ' を更新しました', { kind: 'ok' });
            refreshIssueViews();
          })
          .withFailureHandler(function (err) {
            showSnack(err.message, { kind: 'ng' });
          })
          .apiIssueUpdate(issue.number, {
            title: v.title, body: v.body, assignee: v.assignee,
            dueDate: v.dueDate, labels: v.labels,
          });
      }
    );

    var inputs = form.querySelectorAll('input, textarea');
    inputs[0].value = issue.title || '';
    inputs[1].value = issue.body || '';
    inputs[2].value = issue.assignee || '';
    inputs[3].value = issue.dueDate ? String(issue.dueDate).substring(0, 10) : '';
    inputs[4].value = issue.labels || '';

    inputs[3].type = 'date';
    inputs[2].setAttribute('list', 'people-list');
    attachPeopleList(form);

    var extra = document.createElement('div');
    extra.className = 'inline-form-actions';

    var mine = document.createElement('button');
    mine.type = 'button';
    mine.className = 'btn';
    mine.appendChild(makeIcon('user'));
    mine.appendChild(document.createTextNode('自分に割り当てる'));
    mine.addEventListener('click', function () { inputs[2].value = currentUser; });
    extra.appendChild(mine);

    if (String(issue.state) === 'open') {
      var done = document.createElement('button');
      done.type = 'button';
      done.className = 'btn';
      done.appendChild(makeIcon('check'));
      done.appendChild(document.createTextNode('完了にする'));
      done.addEventListener('click', function () {
        google.script.run
          .withSuccessHandler(function () {
            showSnack('#' + issue.number + ' を完了にしました', { kind: 'ok' });
            form.remove();
            refreshIssueViews();
          })
          .withFailureHandler(function (err) {
            showSnack(err.message, { kind: 'ng' });
          })
          .apiIssueClose(issue.number);
      });
      extra.appendChild(done);
    }

    form.insertBefore(extra, form.querySelector('.inline-form-actions'));
  }

  /** やることを扱う画面をまとめて描き直す */
  function refreshIssueViews() {
    if (!panelIssues.hidden) loadIssues();
    if (!panelBoard.hidden) loadBoard();
    if (!panelGantt.hidden) loadGantt();
    loadOverview();

  function createIssue() {
    openInlineForm(
      panelIssues.hidden ? panelBoard : panelIssues,
      [
        { name: 'title', label: 'やること', required: true },
        { name: 'body', label: '補足 (任意)', multiline: true },

          .withSuccessHandler(function () {

            if (panelIssues.hidden && panelBoard.hidden && panelGantt.hidden) {
              switchTab('issues');

              refreshIssueViews();

  /**
   * 番号だけ分かっているやることを開く。
   *
   * ボードのカードや工程表の棒は中身を全部持っていないため、引き直す。
   *
   * @param {number} number
   * @param {HTMLElement} host
   */
  function openIssueByNumber(number, host) {
    google.script.run
      .withSuccessHandler(function (issues) {
        var found = issues.filter(function (i) {
          return Number(i.number) === Number(number);
        })[0];

        if (!found) {
          showSnack('やること #' + number + ' が見つかりません', { kind: 'ng' });
          return;
        }
        openIssueDetail(found, host);
      })
      .withFailureHandler(function (err) { showSnack(err.message, { kind: 'ng' }); })
      .apiIssueList('');
  }

  // ===== 工程表 =====

  /**
   * 期限つきのやることを時系列の棒で並べる。
   *
   * 配置の計算は src/core/Gantt.js の純関数と同じものをここに写している。
   * google.script.run の往復を増やさないための意図的な重複であり、
   * 片方だけ直すと表示と実体がずれる。
   *
   * @param {object[]} issues
   * @param {Date} today
   * @returns {object}
   */
  function ganttLayout(issues, today) {
    var DAY = 24 * 60 * 60 * 1000;

    function startOfDay(value) {
      if (value === null || value === undefined || value === '') return null;
      var d = new Date(value);
      if (isNaN(d.getTime())) return null;
      return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    }

    var now = startOfDay(today || new Date());
    var rows = [];
    var from = null;
    var to = null;

    (issues || []).forEach(function (issue) {
      var start = startOfDay(issue.createdAt);
      var due = startOfDay(issue.dueDate);
      if (start === null) return;

      var end = (due === null) ? start : Math.max(due, start);
      if (from === null || start < from) from = start;
      if (to === null || end > to) to = end;

      rows.push({
        number: Number(issue.number), title: issue.title, state: issue.state,
        assignee: issue.assignee, hasDue: due !== null,
        overdue: due !== null && String(issue.state) === 'open' && due < now,
        _start: start, _end: end,
      });
    });

    if (!rows.length) return { from: now, to: now, days: 1, todayOffset: 0, rows: [] };

    if (now < from) from = now;
    if (now > to) to = now;

    rows.forEach(function (r) {
      r.offset = Math.round((r._start - from) / DAY);
      r.span = Math.round((r._end - r._start) / DAY) + 1;
      delete r._start;
      delete r._end;
    });

    return {
      from: from, to: to,
      days: Math.round((to - from) / DAY) + 1,
      todayOffset: Math.round((now - from) / DAY),
      rows: rows,
    };
  }

  function loadGantt() {
    showSkeleton(ganttEl, 'list', 5);

    google.script.run
      .withSuccessHandler(function (issues) {
        ganttEl.textContent = '';

        var g = ganttLayout(issues, new Date());
        if (!g.rows.length) {
          ganttEl.appendChild(makeBlankState(
            'やることがありません',
            '期限を入れたやることが、ここに時系列の棒で並びます。',
            { label: 'やることを作る', onClick: createIssue }
          ));
          return;
        }

        var COL = 26;
        var chart = document.createElement('div');
        chart.className = 'gantt';
        chart.style.setProperty('--gantt-days', String(g.days));
        chart.style.setProperty('--gantt-col', COL + 'px');

        // 日付の目盛り
        var head = document.createElement('div');
        head.className = 'gantt-head';

        var headName = document.createElement('div');
        headName.className = 'gantt-name';
        headName.textContent = 'やること';
        head.appendChild(headName);

        var scale = document.createElement('div');
        scale.className = 'gantt-scale';

        for (var d = 0; d < g.days; d++) {
          var day = new Date(g.from + d * 24 * 60 * 60 * 1000);
          var cell = document.createElement('div');
          cell.className = 'gantt-day' + (d === g.todayOffset ? ' today' : '');
          cell.textContent = day.getDate();
          cell.title = day.toLocaleDateString('ja-JP');
          scale.appendChild(cell);
        }
        head.appendChild(scale);
        chart.appendChild(head);

        g.rows.forEach(function (r) {
          var row = document.createElement('div');
          row.className = 'gantt-row';

          var name = document.createElement('button');
          name.className = 'gantt-name';
          name.textContent = '#' + r.number + ' ' + r.title;
          name.title = (r.assignee || '担当なし');
          name.addEventListener('click', function () {
            openIssueByNumber(r.number, panelGantt);
          });
          row.appendChild(name);

          var track = document.createElement('div');
          track.className = 'gantt-track';

          var bar = document.createElement('button');
          bar.className = 'gantt-bar' +
            (String(r.state) === 'closed' ? ' done' : '') +
            (r.overdue ? ' overdue' : '') +
            (r.hasDue ? '' : ' nodue');
          bar.style.gridColumn = (r.offset + 1) + ' / span ' + r.span;
          bar.textContent = r.assignee ? String(r.assignee).replace(/@.*$/, '') : '';
          bar.title = '#' + r.number + ' ' + r.title +
            (r.hasDue ? '' : ' (期限なし)') + (r.overdue ? ' · 期限切れ' : '');
          bar.addEventListener('click', function () {
            openIssueByNumber(r.number, panelGantt);
          });
          track.appendChild(bar);

          if (g.todayOffset >= 0 && g.todayOffset < g.days) {
            var line = document.createElement('div');
            line.className = 'gantt-today';
            line.style.gridColumn = (g.todayOffset + 1) + ' / span 1';
            track.appendChild(line);
          }

          row.appendChild(track);
          chart.appendChild(row);
        });

        ganttEl.appendChild(chart);
      })
      .withFailureHandler(function (err) {
        ganttEl.textContent = 'エラー: ' + err.message;
      })
      .apiIssueList('');
  }

  // ===== 進捗ボード =====

  var COLUMNS = [
    ['Backlog', 'これから'],
    ['In Progress', '作業中'],
    ['In Review', '確認中'],
    ['Done', '完了'],
  ];

  function loadBoard() {
    showSkeleton(boardEl, 'board');

    google.script.run
      .withSuccessHandler(function (board) {
        boardEl.textContent = '';

        var total = 0;
        COLUMNS.forEach(function (c) { total += board[c[0]].length; });

        if (total === 0) {
          boardEl.appendChild(makeBlankState(
            'カードがありません',
            'カードは「やること」です。作ると「これから」に並び、' +
            '改訂版や確認依頼に応じて自動で右に動きます。',
            { label: 'やることを作る', onClick: createIssue }
          ));
          return;
        }

        COLUMNS.forEach(function (pair) {
          var column = pair[0];

          var col = document.createElement('div');
          col.className = 'board-column';

          var head = document.createElement('h3');
          head.textContent = pair[1] + ' (' + board[column].length + ')';
          col.appendChild(head);

          col.addEventListener('dragover', function (e) {
            e.preventDefault();
            col.classList.add('drop-target');
          });
          col.addEventListener('dragleave', function () {
            col.classList.remove('drop-target');
          });
          col.addEventListener('drop', function (e) {
            e.preventDefault();
            col.classList.remove('drop-target');

            var issueNumber = Number(e.dataTransfer.getData('text/plain'));
            if (!issueNumber) return;

            google.script.run
              .withSuccessHandler(function () { loadBoard(); })
              .withFailureHandler(function (err) {
                showSnack(err.message, { kind: 'ng' });
              })
              .apiProjectMove(issueNumber, column, board[column].length);
          });

          board[column].forEach(function (card) {
            var el = document.createElement('div');
            el.className = 'board-card';
            el.draggable = true;
            el.textContent = '#' + card.issueNumber + ' ' + card.title;

            el.addEventListener('dragstart', function (e) {
              e.dataTransfer.setData('text/plain', String(card.issueNumber));
            });

            // 掴んで動かすだけでなく、押して中身を直せるようにする
            el.addEventListener('click', function () {
              openIssueByNumber(card.issueNumber, panelBoard);
            });
            el.tabIndex = 0;
            el.addEventListener('keydown', function (e) {
              if (e.key !== 'Enter' && e.key !== ' ') return;
              e.preventDefault();
              openIssueByNumber(card.issueNumber, panelBoard);
            });

            var meta = document.createElement('span');
            meta.className = 'row-meta';
            meta.textContent = (card.assignee || '担当なし') +
              (card.dueDate ? ' · 期限 ' + String(card.dueDate).substring(0, 10) : '');
            el.appendChild(meta);

            col.appendChild(el);
          });

          boardEl.appendChild(col);
        });
      })
      .withFailureHandler(function (err) {
        boardEl.textContent = 'エラー: ' + err.message;
      })
      .apiProjectBoard();
  }

  // ===== 使い方 =====

  var GUIDE = [
    ['このアプリについて', [
      '文書を直接なおさず、コピー（改訂版）で変更し、確認を経て正式版に反映します。',
      '誰がいつ何を変えたかがすべて残り、いつでも前の状態と見比べられます。',
    ]],
    ['言葉の意味', [
      '正式版 — いま効力を持つ版。全員が見るもの',
      '改訂版 — 直している途中の版。正式版には影響しない',
      '変更の記録 — ある時点の中身を丸ごと残したもの',
      '確認依頼 — 改訂版を正式版に反映してよいか尋ねるもの',
      'やること — 誰かがやるべき作業。文書に紐づく',
    ]],
    ['基本の流れ', [
      '1. 文書を開く',
      '2.「この文書の改訂版」で改訂版を作る',
      '3.「本文」の「直す」で書き換え、保存する',
      '4.「変更を記録」でその時点を残す',
      '5.「改訂中の版」から確認を依頼する',
      '6. 承認されたら「正式版に反映する」',
    ]],
    ['つまずきやすい点', [
      '正式版は直接なおせません。誰がいつ変えたか残らなくなるためです。改訂版を作ってください。',
      '同じ場所を両方で変えると「同じ場所が両方で変わっています」と出ます。どちらを残すか選んでから反映してください。',
      '「反映できません」と出るのは、元に戻せない要素（実体を取れない画像など）がある場合です。元のファイルで貼り直してください。',
      '色・フォント・文字サイズは記録されません。文書の意味内容を管理するためです。',
      'スライドは読むことと履歴の閲覧のみで、反映には対応していません。',
    ]],
  ];

  function loadHelp() {
    if (guideEl.dataset.ready) return;

    GUIDE.forEach(function (section) {
      var h = document.createElement('h2');
      h.textContent = section[0];
      guideEl.appendChild(h);

      var ul = document.createElement('ul');
      section[1].forEach(function (line) {
        var li = document.createElement('li');
        li.textContent = line;
        ul.appendChild(li);
      });
      guideEl.appendChild(ul);
    });

    var foot = document.createElement('div');
    foot.className = 'guide-foot';

    var who = document.createElement('span');
    who.className = 'row-meta';
    who.id = 'whoami';
    foot.appendChild(who);
    guideEl.appendChild(foot);

    guideEl.dataset.ready = '1';

    google.script.run
      .withSuccessHandler(function (info) {
        currentUser = info.activeUser;
        who.textContent = info.activeUser
          ? 'このアプリはあなたを ' + info.activeUser + ' として認識しています'
          : '警告: 利用者を特定できていません。この状態では記録に名前が残りません';
      })
      .withFailureHandler(function () { who.textContent = ''; })
      .apiWhoAmI();
  }

  // ===== 初期化 =====

  var navTargets = document.querySelectorAll('[data-tab]');
  for (var i = 0; i < navTargets.length; i++) {
    (function (btn) {
      var icon = TAB_ICONS[btn.dataset.tab];
      if (icon && btn.classList.contains('nav-item')) {
        btn.insertBefore(makeIcon(icon), btn.firstChild);
      } else if (icon && btn.classList.contains('tab')) {
        btn.insertBefore(makeIcon(icon), btn.firstChild);
      }
      btn.addEventListener('click', function () { switchTab(btn.dataset.tab); });
    })(navTargets[i]);
  }

  [[commitBtn, 'check'], [stashBtn, 'archive'], [branchCreateBtn, 'git-branch'],
   [draftCreateBtn, 'git-branch'], [bulkCommitBtn, 'check'],
   [issueCreateBtn, 'plus'], [boardCreateBtn, 'plus'], [editSaveBtn, 'save'],
   [modeEditBtn, 'pencil'], [modeViewBtn, 'file-text'], [crumbBack, 'back']]
    .forEach(function (pair) {
      if (pair[0]) pair[0].insertBefore(makeIcon(pair[1]), pair[0].firstChild);
    });

  crumbBack.addEventListener('click', function () {
    current.fileId = null;
    switchTab('docs');
  });

  branchSelect.addEventListener('change', function () {
    openDoc(branchSelect.value, current.docPath);
  });

  commitBtn.addEventListener('click', doCommit);
  stashBtn.addEventListener('click', stashMainDrift);
  editSaveBtn.addEventListener('click', saveEditor);
  modeViewBtn.addEventListener('click', function () { setDocMode('view'); });
  modeEditBtn.addEventListener('click', function () { setDocMode('edit'); });
  draftCreateBtn.addEventListener('click', createDraft);
  branchCreateBtn.addEventListener('click', function () {
    showSnack('文書を開いてから「この文書の改訂版」で作ってください');
    switchTab('docs');
  });
  bulkCommitBtn.addEventListener('click', bulkCommit);
  issueCreateBtn.addEventListener('click', createIssue);
  boardCreateBtn.addEventListener('click', createIssue);
  themeBtn.addEventListener('click', cycleTheme);

  google.script.run
    .withSuccessHandler(function (who) { currentUser = who.activeUser; })
    .withFailureHandler(function () { /* 判定できなければ従来どおり押せる */ })
    .apiWhoAmI();

  restoreSidebarWidth();
  initResizer();
  applyTheme(readTheme());

  loadFiles(function () { switchTab('docs'); });
})();
</script>
