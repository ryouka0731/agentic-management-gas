  /**
   * 絞り込みの文字で残すかどうかを決める。
   *
   * 題名・担当・ラベル・番号のどれかに含まれていれば残す。
   *
   * @param {object} issue
   * @returns {boolean}
   */
  function matchesFilter(issue) {
    if (mineOnly && String(issue.assignee || '') !== currentUser) return false;

    var q = String(issueFilterEl.value || '').toLowerCase().replace(/^\s+|\s+$/g, '');
    if (!q) return true;

    var hay = ['#' + issue.number, issue.title, issue.assignee, issue.labels]
      .concat(docNamesOf(issue))
      .join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  /**
   * やることに紐づく文書の名前を返す。
   *
   * 人は文書の名前で探すので、番号ではなく名前を絞り込みの対象にする。
   *
   * @param {object} issue
   * @returns {string[]}
   */
  function docNamesOf(issue) {
    var ids = String(issue.linkedFileIds || '').split(',');
    var out = [];

    for (var i = 0; i < ids.length; i++) {
      if (!ids[i]) continue;
      for (var j = 0; j < allFiles.length; j++) {
        if (allFiles[j].fileId !== ids[i]) continue;
        var parts = splitPath(allFiles[j].path);
        if (parts.branch === 'main') out.push(parts.path);
      }
    }
    return out;
  }

  /**
   * 動きのないやることを傷ませる。
   *
   * 色だけだと気づけない人がいるので、日数の吹き出しも付ける。
   *
   * @param {HTMLElement} el
   * @param {object} issue staleLevel / staleDays を持つもの
   */
  function applyRot(el, issue) {
    var level = Number(issue.staleLevel || 0);
    if (!level) return;

    el.classList.add('rot-' + level);
    el.dataset.stale = issue.staleDays;

    var note = ['しばらく動きがありません', 'かなり放置されています', '完全に忘れられています'];
    el.title = issue.staleDays + '日間そのまま — ' + note[level - 1];
  }

  /**
   * 動きのなさを示す札。
   *
   * @param {object} issue
   * @returns {HTMLElement|null}
   */
  function makeStaleBadge(issue) {
    if (!Number(issue.staleLevel || 0)) return null;

    var badge = document.createElement('span');
    badge.className = 'stale-badge';
    badge.appendChild(makeIcon('clock'));
    badge.appendChild(document.createTextNode(issue.staleDays + '日動きなし'));
    return badge;
  }

  /**
   * 束ねの見出し。押すと畳める。
   *
   * @param {string} key
   * @param {string} label
   * @param {number} count
   * @returns {HTMLElement}
   */
  function makeGroupHead(label, count, key) {
    var head = document.createElement('button');
    head.className = 'group-head';
    head.setAttribute('aria-expanded', String(!collapsed[key]));

    var mark = document.createElement('span');

    mark.textContent = collapsed[key] ? '▸' : '▾';
    head.appendChild(mark);

    head.appendChild(name);

  /**
   * やることを親子の木に組み直す。src/core/IssueTree.js と同じもの。
   *
   * @param {object[]} issues
   * @returns {object[]} 上から順に並べた節。depth を持つ
   */
  /**
   * その親子関係が輪になるかを調べる。
   *
   * src/core/IssueTree.js の issueWouldCycle と同じもの。自分自身や
   * 自分の子孫を親にすると木としてたどれなくなるため、作る前に断る。
   *
   * @param {number} child
   * @param {number} parent
   * @returns {boolean}
   */
  function wouldCycle(child, parent) {
    if (String(child) === String(parent)) return true;

    var byNumber = {};
    lastIssues.forEach(function (i) { byNumber[String(i.number)] = i; });

    var seen = {};
    var cur = byNumber[String(parent)];

    while (cur) {
      if (String(cur.number) === String(child)) return true;
      if (seen[String(cur.number)]) return true;
      seen[String(cur.number)] = true;
      cur = byNumber[String(cur.parent)];
    }
    return false;
  }

  /**
   * 親子を付け替える。
   *
   * @param {number} child
   * @param {number|string} parent 空なら親を外す
   */
  function setIssueParent(child, parent) {
    google.script.run
      .withSuccessHandler(function () {
        showSnack(parent
          ? '#' + child + ' を #' + parent + ' の下に移しました'
          : '#' + child + ' の親子を解除しました', { kind: 'ok' });
        reloadIssueView();
      })
      .withFailureHandler(function (err) { showSnack(err.message, { kind: 'ng' }); })
      .apiIssueUpdate(child, { parent: parent === '' ? '' : Number(parent) });
  }

  /**
   * 掴んで運べるようにする。
   *
   * 落とす先が自分の子孫だと輪になるため、その場合は受け付けない。
   * 掴む操作しか無いと使えない人が出るので、右のパネルの「親のやること」
   * でも同じことができるようにしてある。
   *
   * @param {HTMLElement} row
   * @param {object} issue
   */
  function makeIssueDraggable(row, issue) {
    row.draggable = true;

    row.addEventListener('dragstart', function (e) {
      e.dataTransfer.setData('text/plain', String(issue.number));
      e.dataTransfer.effectAllowed = 'move';
      row.classList.add('dragging');
      dropRootEl.hidden = false;
    });

    row.addEventListener('dragend', function () {
      row.classList.remove('dragging');
      dropRootEl.hidden = true;
      dropRootEl.classList.remove('over');
    });

    row.addEventListener('dragover', function (e) {
      var moving = Number(e.dataTransfer.getData('text/plain')) ||
        Number(document.querySelector('.row-item.dragging') &&
          document.querySelector('.row-item.dragging').dataset.number);

      if (!moving || wouldCycle(moving, issue.number)) return;

      e.preventDefault();
      row.classList.add('drop-into');
    });

    row.addEventListener('dragleave', function () {
      row.classList.remove('drop-into');
    });

    row.addEventListener('drop', function (e) {
      e.preventDefault();
      row.classList.remove('drop-into');

      var moving = Number(e.dataTransfer.getData('text/plain'));
      if (!moving || wouldCycle(moving, issue.number)) {
        showSnack('自分の下にあるやることを親にはできません', { kind: 'ng' });
        return;
      }
      setIssueParent(moving, issue.number);
    });
  }

  /**
   * そのやることの親を返す。
   *
   * @param {number} number
   * @returns {object|null}
   */
  function parentOf(number) {
    var me = byIssueNumber(number);
    if (!me || me.parent === '' || me.parent === null) return null;

    return byIssueNumber(me.parent);
  }

  /**
   * そのやることの子を返す。
   *
   * @param {number} number
   * @returns {object[]}
   */
  function childrenOf(number) {
    return lastIssues.filter(function (i) {
      return String(i.parent) === String(number);
    });
  }

  /**
   * 番号からやることを引く。
   *
   * @param {number} number
   * @returns {object|null}
   */
  function byIssueNumber(number) {
    for (var i = 0; i < lastIssues.length; i++) {
      if (String(lastIssues[i].number) === String(number)) return lastIssues[i];
    }
    return null;
  }

  /**
   * 親をたどった深さを返す。
   *
   * @param {number} number
   * @returns {number}
   */
  function depthOf(number) {
    var seen = {};
    var depth = 0;
    var cur = parentOf(number);

    while (cur && !seen[cur.number]) {
      seen[cur.number] = true;
      depth++;
      cur = parentOf(cur.number);
    }
    return depth;
  }

  /**
   * そのやることを、いま見ている画面の中で探して目立たせる。
   *
   * 見えないところに居るなら、代わりに中身を開く。押したのに何も
   * 起きないのがいちばん困る。
   *
   * @param {number} number
   */
  function focusIssue(number) {
    var el = document.querySelector(
      '#panel-issues [data-number="' + number + '"]');

    if (!el) {
      openIssueByNumber(number);
      return;
    }

    if (el.scrollIntoView) el.scrollIntoView({ block: 'center' });

    el.classList.remove('flash');
    // 同じところをもう一度押しても光るよう、いったん外してから付ける
    void el.offsetWidth;
    el.classList.add('flash');
    window.setTimeout(function () { el.classList.remove('flash'); }, 1200);
  }

  /**
   * 親と子への行き先を作る。
   *
   * 入れ子で並べていても、束ね方や絞り込みで離れると繋がりが見えなくなる。
   * どちらからでも一押しで行けるようにする。
   *
   * @param {number} number
   * @returns {DocumentFragment}
   */
  function makeRelationChips(number) {
    var frag = document.createDocumentFragment();
    var parent = parentOf(number);
    var kids = childrenOf(number);

    function chip(text, target, title) {
      var btn = document.createElement('button');
      btn.className = 'rel-chip';
      btn.appendChild(makeIcon('corner-down-right'));
      btn.appendChild(document.createTextNode(text));
      btn.setAttribute('aria-label', title);
      attachHint(btn, title);

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        focusIssue(target);
      });
      frag.appendChild(btn);
    }

    if (parent) {
      chip('親 #' + parent.number, parent.number,
        '親の「' + parent.title + '」に移ります');
    }
    if (kids.length) {
      chip('子 ' + kids.length, kids[0].number,
        kids.length + '件ぶら下がっています。最初の「' + kids[0].title + '」に移ります');
    }
    return frag;
  }

  function issueTreeRows(issues) {
    var byNumber = {};
    var nodes = (issues || []).map(function (row) {
      var node = {};
      for (var k in row) {
        if (Object.prototype.hasOwnProperty.call(row, k)) node[k] = row[k];
      }
      node.children = [];
      node.depth = 0;
      byNumber[String(node.number)] = node;
      return node;
    });

    function makesCycle(node, parent) {
      var seen = {};
      var cur = parent;
      while (cur) {
        if (cur === node || seen[String(cur.number)]) return true;
        seen[String(cur.number)] = true;
        cur = byNumber[String(cur.parent)];
      }
      return false;
    }

    var roots = [];
    nodes.forEach(function (node) {
      var parent = byNumber[String(node.parent)];
      if (!parent || parent === node || makesCycle(node, parent)) roots.push(node);
      else parent.children.push(node);
    });

    var out = [];
    (function walk(list, depth) {
      list.forEach(function (n) {
        n.depth = depth;
        out.push(n);
        walk(n.children, depth + 1);
      });
    })(roots, 0);

    return out;
  }

  /**
   * 子を含めた工数を足し上げる。
   *
   * @param {object} node
   * @returns {{estimate:number, planned:number, actual:number}}
   */
  function rollupEffort(node) {
    var sum = {
      estimate: Number(node.estimate) || 0,
      planned: Number(node.plannedHours) || 0,
      actual: Number(node.actualHours) || 0,
    };
    node.children.forEach(function (c) {
      var child = rollupEffort(c);
      sum.estimate += child.estimate;
      sum.planned += child.planned;
      sum.actual += child.actual;
    });
    return sum;
  }

  function loadIssues() {
    showSkeleton(issueListEl, 'list', 4);

    google.script.run
      .withSuccessHandler(function (list) {
        var issues = list || [];
        lastIssues = issues;
        issueListEl.textContent = '';

        // 件数は先に出す。0件のときだけ前の値が残っていた
        var shown = issues.filter(matchesFilter);
        issueCountEl.textContent = shown.length + ' / ' + issues.length + '件';

        if (!issues.length) {
          issueListEl.appendChild(makeBlankState(
            'やることがありません',
            '直したい文書を選んでから作ると、その文書に紐づきます。',
            { label: 'やることを作る', onClick: createIssue }
          ));
          return;
        }

        if (!shown.length) {
          issueListEl.appendChild(makeBlankState(
            '絞り込みに合うやることがありません',
            '絞り込みを消すか、別の言葉で試してください。'
          ));
          return;
        }

        groupIssues(shown, issueGroupSel.value).forEach(function (group) {
          issueListEl.appendChild(
            makeGroupHead(group.label, group.issues.length, group.key));
          if (collapsed[group.key]) return;

          // 親子は束ねの中で組む。束ね方を変えても入れ子は保たれる
          issueTreeRows(group.issues).forEach(renderIssueRow);
        });

        function renderIssueRow(issue) {
          var row = document.createElement('div');
          row.className = 'row-item';
          row.dataset.number = issue.number;
          makeIssueDraggable(row, issue);

          if (issue.depth) {
            row.classList.add('nested');
            row.style.marginLeft = (issue.depth * 24 + 16) + 'px';
          }

          var main = document.createElement('div');
          main.className = 'row-main';

          var title = document.createElement('div');
          title.className = 'row-title';
          title.textContent = '#' + issue.number + ' ' + issue.title;
          main.appendChild(title);

          var meta = document.createElement('div');
          meta.className = 'row-meta';
          meta.textContent = (issue.state === 'open' ? '対応中' : '完了') +
            (issue.dueDate ? ' · 期限 ' + String(issue.dueDate).substring(0, 10) : '');

          var effort = rollupEffort(issue);
          if (effort.planned || effort.actual || effort.estimate) {
            var hours = document.createElement('span');
            hours.className = 'effort';
            hours.appendChild(makeIcon('clock'));

            var text = [];
            if (effort.estimate) text.push('見積 ' + effort.estimate);
            if (effort.planned) text.push('予定 ' + effort.planned + '人日');
            if (effort.actual) text.push('実績 ' + effort.actual + '人日');

            hours.appendChild(document.createTextNode(text.join(' / ')));
            if (issue.children.length) hours.title = '子の分を含めた合計';
            meta.appendChild(hours);
          }

          meta.appendChild(makeRelationChips(issue.number));

          var stale = makeStaleBadge(issue);
          if (stale) meta.appendChild(stale);

          var labelEls = makeLabels(issue.labels);
          if (labelEls) meta.appendChild(labelEls);
          main.appendChild(meta);
          applyRot(row, issue);

          var open = document.createElement('button');
          open.className = 'row-open';
          open.appendChild(makeIcon('circle-dot'));
          open.appendChild(main);
          open.addEventListener('click', function () {
            openIssueDetail(issue, row);
          });
          row.appendChild(open);
          row.appendChild(makeAvatar(issue.assignee));

          var edit = document.createElement('button');
          edit.className = 'icon-btn';
          edit.appendChild(makeIcon('pencil'));
          edit.setAttribute('aria-label', '#' + issue.number + ' を直す');
          hint(edit, 'act:edit');
          edit.addEventListener('click', function () { openIssueDetail(issue, row); });
          row.appendChild(edit);

          if (issue.state === 'open') {
            var done = document.createElement('button');
            done.className = 'icon-btn ok';
            done.appendChild(makeIcon('check'));
            done.setAttribute('aria-label', '#' + issue.number + ' を完了にする');
            hint(done, 'act:done');
            done.addEventListener('click', function () {
              google.script.run
                .withSuccessHandler(function () {
                  showSnack('#' + issue.number + ' を完了にしました', { kind: 'ok' });
                  refreshIssueViews();
                })
                .withFailureHandler(function (err) {
                  showSnack(err.message, { kind: 'ng' });
                })
                .apiIssueClose(issue.number);
            });
            row.appendChild(done);
          } else {
            var back = document.createElement('button');
            back.className = 'icon-btn';
            back.appendChild(makeIcon('back'));
            back.setAttribute('aria-label', '#' + issue.number + ' の完了を取り消す');
            hint(back, 'act:reopen');
            back.addEventListener('click', function () {
              reopenIssue(issue.number);
            });
            row.appendChild(back);
          }

          row.appendChild(makeArchiveButton(issue, panelIssues));

          if (issue.state === 'open' && current.docFileId) {
            var branchBtn = document.createElement('button');
            branchBtn.className = 'btn btn-primary';
            branchBtn.textContent = 'この作業の改訂版を作る';
            branchBtn.addEventListener('click', function () {
              branchBtn.disabled = true;
              google.script.run
                .withSuccessHandler(function (b) {
                  showSnack('改訂版「' + b.name + '」を作りました', { kind: 'ok' });
                  loadFiles(function () { loadIssues(); });
                  loadOverview();
                })
                .withFailureHandler(function (err) {
                  branchBtn.disabled = false;
                  showSnack(err.message, { kind: 'ng' });
                })
                .apiIssueCreateBranch(issue.number, current.docFileId);
            });
            row.appendChild(branchBtn);
          }

          issueListEl.appendChild(row);
        }
      })
      .withFailureHandler(function (err) {
        issueListEl.textContent = 'エラー: ' + err.message;
      })
      .apiIssueList('');
  }

  /**
   * やることの中身を直す。
   *
   * 一覧からも工程表からも進捗ボードからも同じ画面を開く。
   * 対象が同じなら編集の場所も同じにする。
   *
   * @param {object} issue issues 行
   * @param {HTMLElement} [sourceEl] 一覧の行やカードなど、対象の要素
   */
  /**
   * 予定工数から期限を出す。
   *
   * 始まりの日から数えて、予定した人日ぶんの最後の日を返す。
   *
   * @param {string} startish 始まりの日 (無ければ作った日)
   * @param {number|string} planned 人日
   * @returns {string} YYYY-MM-DD。出せなければ空文字
   */
  function dueFromEffort(startish, planned) {
    var start = new Date(startish);
    if (!startish || isNaN(start.getTime())) return '';

    var days = ganttDaysForEffort(planned);
    var end = new Date(start.getFullYear(), start.getMonth(),
      start.getDate() + days - 1);

    var m = String(end.getMonth() + 1);
    var d = String(end.getDate());
    return end.getFullYear() + '-' +
      (m.length < 2 ? '0' + m : m) + '-' + (d.length < 2 ? '0' + d : d);
  }

  function openIssueDetail(issue, sourceEl) {
    var picker = null;
    var form = openInlineForm(
      'やること #' + issue.number,
      [
        { name: 'title', label: 'やること', required: true },
        { name: 'body', label: '補足', multiline: true },
        { name: 'assignee', label: '担当者 (メールアドレス)' },
        { name: 'startDate', label: '開始日 (任意)' },
        { name: 'dueDate', label: '期限 (例: 2026-09-30)' },
        { name: 'estimate', label: '見積もり (規模。数値)' },
        { name: 'plannedHours', label: '予定工数 (人日。0.5 きざみで書けます)' },
        { name: 'actualHours', label: '実績工数 (人日)' },
        { name: 'parent', label: '親のやること (番号。空なら親なし)' },
      ],
      '保存する',
      function (v) {
        var patch = {
          title: v.title, body: v.body, assignee: v.assignee,
          startDate: v.startDate, dueDate: v.dueDate,
          labels: picker ? picker.value() : (issue.labels || ''),
          estimate: v.estimate, plannedHours: v.plannedHours,
          actualHours: v.actualHours, parent: v.parent,
        };

        // 予定工数を書き換えたなら、棒の長さもそれに合わせる。
        // 片方だけ動くと、工程表と工数のどちらが本当か分からなくなる
        if (String(v.plannedHours) !== String(issue.plannedHours)) {
          var moved = dueFromEffort(v.startDate || issue.startDate ||
            issue.createdAt, v.plannedHours);
          if (moved) patch.dueDate = moved;
        }

        google.script.run
          .withSuccessHandler(function () {
            showSnack('#' + issue.number + ' を更新しました', { kind: 'ok' });
            refreshIssueViews();
          })
          .withFailureHandler(function (err) {
            showSnack(err.message, { kind: 'ng' });
          })
          .apiIssueUpdate(issue.number, patch);
      },
      sourceEl
    );

    var inputs = form.querySelectorAll('input, textarea');
    inputs[0].value = issue.title || '';
    inputs[1].value = issue.body || '';
    inputs[2].value = issue.assignee || '';
    inputs[3].value = issue.startDate ? String(issue.startDate).substring(0, 10) : '';
    inputs[4].value = issue.dueDate ? String(issue.dueDate).substring(0, 10) : '';
    inputs[5].value = issue.estimate === '' ? '' : issue.estimate;
    inputs[6].value = issue.plannedHours === '' ? '' : issue.plannedHours;
    inputs[7].value = issue.actualHours === '' ? '' : issue.actualHours;
    inputs[8].value = issue.parent === '' ? '' : issue.parent;

    inputs[3].type = 'date';
    inputs[4].type = 'date';
    inputs[5].type = 'number';
    inputs[6].type = 'number';
    inputs[7].type = 'number';
    inputs[8].type = 'number';

    // 人日は半日きざみで入れられるようにする
    hint(inputs[5].parentNode, 'field:estimate');
    hint(inputs[6].parentNode, 'field:planned');
    hint(inputs[7].parentNode, 'field:actual');
    hint(inputs[8].parentNode, 'field:parent');

    inputs[6].step = '0.5';
    inputs[7].step = '0.5';
    inputs[6].min = '0';
    inputs[7].min = '0';
    inputs[2].setAttribute('list', 'people-list');
    attachPeopleList(form);

    var picker = makeTagPicker(issue.labels || '');
    form.insertBefore(picker.el, form.querySelector('.inline-form-actions'));

    var extra = document.createElement('div');
    extra.className = 'inline-form-actions';

    var mine = document.createElement('button');
    mine.type = 'button';
    mine.className = 'btn';
    mine.appendChild(makeIcon('user'));
    mine.appendChild(document.createTextNode('自分に割り当てる'));
    mine.addEventListener('click', function () { inputs[2].value = currentUser; });
    extra.appendChild(mine);

    if (String(issue.state) === 'open') {
      var done = document.createElement('button');
      done.type = 'button';
      done.className = 'btn';
      done.appendChild(makeIcon('check'));
      done.appendChild(document.createTextNode('完了にする'));
      done.addEventListener('click', function () {
        google.script.run
          .withSuccessHandler(function () {
            showSnack('#' + issue.number + ' を完了にしました', { kind: 'ok' });
            form.remove();
            refreshIssueViews();
          })
          .withFailureHandler(function (err) {
            showSnack(err.message, { kind: 'ng' });
          })
          .apiIssueClose(issue.number);
      });
      extra.appendChild(done);
    } else {
      var back = document.createElement('button');
      back.type = 'button';
      back.className = 'btn';
      back.appendChild(makeIcon('back'));
      back.appendChild(document.createTextNode('完了を取り消す'));
      back.addEventListener('click', function () {
        form.remove();
        reopenIssue(issue.number);
      });
      extra.appendChild(back);
    }

    // 一覧・ボード・工程表のどこから開いても捨てられるようにする。
    // 確かめの帯は入力パネルの中に出す (裏に隠れると押せない)
    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'btn btn-danger';
    del.appendChild(makeIcon('trash'));
    del.title = '#' + issue.number + ' を捨てる';
    del.setAttribute('aria-label', del.title);
    del.addEventListener('click', function () {
      openConfirmStrip(sideBody,
        '#' + issue.number + '「' + issue.title + '」を捨てます。' +
        archiveKeepDays + '日のうちなら「捨てたもの」から戻せます。',
        '捨てる',
        function () {
          google.script.run
            .withSuccessHandler(function () {
              showSnack('#' + issue.number + ' を捨てました', { kind: 'ok' });
              closeSide();
              refreshIssueViews();
            })
            .withFailureHandler(function (err) {
              showSnack(err.message, { kind: 'ng' });
            })
            .apiIssueArchive(issue.number);
        });
    });
    extra.appendChild(del);

    form.insertBefore(extra, form.querySelector('.inline-form-actions'));
  }

          trashListEl.appendChild(makeBlankState(

        rows.forEach(function (issue) {

          open.appendChild(main);

          var back = document.createElement('button');
          back.className = 'btn';
          back.appendChild(makeIcon('back'));
          back.appendChild(document.createTextNode('元に戻す'));
          back.addEventListener('click', function () {
            google.script.run
              .withSuccessHandler(function () {
                showSnack('#' + issue.number + ' を戻しました', { kind: 'ok' });
                loadTrash();
                loadOverview();
              })
              .withFailureHandler(function (err) {
                showSnack(err.message, { kind: 'ng' });

              .apiIssueRestore(issue.number);

          row.appendChild(back);

          var purge = document.createElement('button');
          purge.className = 'btn btn-danger';
          purge.appendChild(makeIcon('trash'));

  // ===== 工程表 =====

  /**
   * 期限つきのやることを時系列の棒で並べる。
   *
   * 配置の計算は src/core/Gantt.js の純関数と同じものをここに写している。
   * google.script.run の往復を増やさないための意図的な重複であり、
   * 片方だけ直すと表示と実体がずれる。
   *
   * @param {object[]} issues
   * @param {Date} today
   * @returns {object}
   */
  /** 目盛りの末尾に足す余白の日数。src/core/Gantt.js と同じ値 */
  var GANTT_TAIL_DAYS = 14;

  /**
   * 予定工数 (人日) を棒の日数に直す。src/core/Gantt.js と同じもの。
   *
   * @param {number|string} planned
   * @returns {number}
   */
  function ganttDaysForEffort(planned) {
    var n = Number(planned);
    if (!n || isNaN(n) || n <= 0) return 1;

    return Math.max(1, Math.round(n));
  }

  /**
   * 予定工数と棒の長さが食い違っているかを見る。
   *
   * @param {number|string} planned
   * @param {number} days
   * @returns {boolean}
   */
  function ganttEffortDiffers(planned, days) {
    return ganttDaysForEffort(planned) !== Math.max(1, Number(days) || 1);
  }

  function ganttLayout(issues, today) {
    var DAY = 24 * 60 * 60 * 1000;

    function startOfDay(value) {
      if (value === null || value === undefined || value === '') return null;
      var d = new Date(value);
      if (isNaN(d.getTime())) return null;
      return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    }

    var now = startOfDay(today || new Date());
    var rows = [];
    var from = null;
    var to = null;

    (issues || []).forEach(function (issue) {
      // 開始日を入れていればそれを使う。無ければ作った日を仮の起点にする
      var planned = startOfDay(issue.startDate);
      var start = planned !== null ? planned : startOfDay(issue.createdAt);
      var due = startOfDay(issue.dueDate);
      if (start === null) return;

      var end = (due === null) ? start : Math.max(due, start);
      if (from === null || start < from) from = start;
      if (to === null || end > to) to = end;

      rows.push({
        number: Number(issue.number), title: issue.title, state: issue.state,
        assignee: issue.assignee, hasDue: due !== null,
        planned: issue.plannedHours, parent: issue.parent,
        overdue: due !== null && String(issue.state) === 'open' && due < now,
        _start: start, _end: end,
      });
    });

    if (!rows.length) return { from: now, to: now, days: 1, todayOffset: 0, rows: [] };

    if (now < from) from = now;
    if (now > to) to = now;

    // 末尾に余白の日を足す。目盛りが最後の期限で終わっていると、棒を
    // 掴んで伸ばそうとしても伸ばす先の列が無く、縮められるだけになる
    to += GANTT_TAIL_DAYS * DAY;

    rows.forEach(function (r) {
      r.offset = Math.round((r._start - from) / DAY);
      r.span = Math.round((r._end - r._start) / DAY) + 1;
      delete r._start;
      delete r._end;
    });

    return {
      from: from, to: to,
      days: Math.round((to - from) / DAY) + 1,
      todayOffset: Math.round((now - from) / DAY),
      rows: rows,
    };
  }

  /**
   * 月ごとの幅を返す。src/core/Gantt.js と同じもの。
   *
   * @param {number} from
   * @param {number} days
   * @returns {Array<{label:string, span:number}>}
   */
  function ganttMonths(from, days) {
    var DAY = 24 * 60 * 60 * 1000;
    var out = [];

    for (var i = 0; i < days; i++) {
      var d = new Date(from + i * DAY);
      var year = d.getFullYear();
      var month = d.getMonth() + 1;
      var last = out.length ? out[out.length - 1] : null;

      if (last && last.year === year && last.month === month) {
        last.span++;
        continue;
      }
      out.push({ year: year, month: month, span: 1, label: year + '年' + month + '月' });
    }
    return out;
  }

  /**
   * 列の位置を日付に直す。src/core/Gantt.js と同じもの。
   *
   * @param {number} from
   * @param {number} offset
   * @returns {string} YYYY-MM-DD
   */
  function ganttDateAt(from, offset) {
    var d = new Date(from + offset * 24 * 60 * 60 * 1000);
    var m = String(d.getMonth() + 1);
    var day = String(d.getDate());
    return d.getFullYear() + '-' +
      (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
  }

  /**
   * やることを束ねる。src/core/Grouping.js と同じもの。
   *
   * @param {object[]} issues
   * @param {string} by
   * @returns {Array<{key:string, label:string, issues:object[]}>}
   */
  function groupIssues(issues, by) {
    var names = {};
    allFiles.forEach(function (f) {
      if (splitPath(f.path).branch === 'main') names[f.fileId] = f.path;
    });

    var order = [];
    var buckets = {};

    function put(key, label, issue) {
      if (!buckets[key]) {
        buckets[key] = { key: key, label: label, issues: [] };
        order.push(key);
      }
      buckets[key].issues.push(issue);
    }

    (issues || []).forEach(function (issue) {
      if (by === 'none') { put('all', 'すべて', issue); return; }

      if (by === 'assignee') {
        var who = String(issue.assignee || '');
        put(who || '(未割当)', who || '担当なし', issue);
        return;
      }

      if (by === 'state') {
        var open = String(issue.state) === 'open';
        put(open ? 'open' : 'closed', open ? '未完了' : '完了', issue);
        return;
      }

      if (by === 'label') {
        var added = false;
        String(issue.labels || '').split(',').forEach(function (raw) {
          var label = raw.replace(/^\s+|\s+$/g, '');
          if (!label) return;
          put(label, label, issue);
          added = true;
        });
        if (!added) put('(ラベルなし)', 'ラベルなし', issue);
        return;
      }

      var linked = false;
      String(issue.linkedFileIds || '').split(',').forEach(function (raw) {
        var id = raw.replace(/^\s+|\s+$/g, '');
        if (!id) return;
        put(id, names[id] || id, issue);
        linked = true;
      });
      if (!linked) put('(未紐付け)', '文書に紐づいていない', issue);
    });

    return order.map(function (k) { return buckets[k]; });
  }

  /**
   * 棒を掴んで日付を変える。
   *
   * 端を掴めば片側だけ、真ん中を掴めば全体が動く。放したときに保存する。
   * 数字を打ち込むより、期間を見ながら決めるほうが早い。
   *
   * @param {HTMLElement} bar
   * @param {object} row ganttLayout の行
   * @param {object} g ganttLayout の結果
   * @param {number} colWidth 1日の幅
   */
  function makeBarDraggable(bar, row, g, colWidth, hostEl) {
    var mode = null;
    var startX = 0;
    var origin = { offset: row.offset, span: row.span };

    function apply(offset, span) {
      bar.style.gridColumn = (offset + 1) + ' / span ' + Math.max(1, span);
    }

    bar.addEventListener('pointerdown', function (e) {
      var rect = bar.getBoundingClientRect();
      var edge = 10;

      if (e.clientX - rect.left <= edge) mode = 'start';
      else if (rect.right - e.clientX <= edge) mode = 'end';
      else mode = 'move';

      startX = e.clientX;
      origin = { offset: row.offset, span: row.span };
      bar.setPointerCapture(e.pointerId);
      bar.classList.add('dragging');
      e.preventDefault();
      e.stopPropagation();
    });

    bar.addEventListener('pointermove', function (e) {
      if (!mode) {
        // 掴める場所を形で示す
        var rect = bar.getBoundingClientRect();
        var near = e.clientX - rect.left <= 10 || rect.right - e.clientX <= 10;
        bar.style.cursor = near ? 'ew-resize' : 'grab';
        return;
      }

      var moved = Math.round((e.clientX - startX) / colWidth);

      if (mode === 'move') {
        row.offset = Math.max(0, origin.offset + moved);
        row.span = origin.span;
      } else if (mode === 'end') {
        row.span = Math.max(1, origin.span + moved);
      } else {
        var offset = Math.min(origin.offset + origin.span - 1,
          Math.max(0, origin.offset + moved));
        row.span = origin.span + (origin.offset - offset);
        row.offset = offset;
      }
      apply(row.offset, row.span);
    });

    bar.addEventListener('pointerup', function (e) {
      if (!mode) return;

      var was = mode;
      mode = null;
      bar.classList.remove('dragging');
      bar.releasePointerCapture(e.pointerId);

      // 動かさずに離したなら、押したのだと解して中身を開く
      if (row.offset === origin.offset && row.span === origin.span) {
        if (was === 'move') openIssueByNumber(row.number, hostEl);
        return;
      }

      var patch = { dueDate: ganttDateAt(g.from, row.offset + row.span - 1) };
      if (was !== 'end') patch.startDate = ganttDateAt(g.from, row.offset);

      // 棒の長さは予定工数そのもの。片方だけ変わると数え直しができない。
      // 半日きざみで入れた値は、丸めて同じなら書き換えない
      if (ganttEffortDiffers(row.planned, row.span)) patch.plannedHours = row.span;

      google.script.run
        .withSuccessHandler(function () {
          showSnack('#' + row.number + ' の期間を ' +
            ganttDateAt(g.from, row.offset) + ' 〜 ' + patch.dueDate + ' にしました' +
            (patch.plannedHours ? ' (予定 ' + patch.plannedHours + '人日)' : ''),
            { kind: 'ok' });
          loadGantt();
        })
        .withFailureHandler(function (err) {
          showSnack(err.message, { kind: 'ng' });
          loadGantt();
        })
        .apiIssueUpdate(row.number, patch);
    });
  }

    google.script.run
      .withSuccessHandler(function (list) {

        ganttEl.textContent = '';

        lastIssues = issues;
        issues = issues.filter(matchesFilter);

        var g = ganttLayout(issues, new Date());
        issueCountEl.textContent = g.rows.length + ' / ' + issues.length + '件';

        if (!g.rows.length) {
          ganttEl.appendChild(makeBlankState(
            'やることがありません',

          ));
          return;
        }

        var COL = 26;
        var chart = document.createElement('div');
        chart.className = 'gantt';
        chart.style.setProperty('--gantt-days', String(g.days));
        chart.style.setProperty('--gantt-col', COL + 'px');

        // 目盛りの週の区切りを、先頭の日から月曜までのずれで合わせる
        var firstDay = new Date(g.from).getDay();
        chart.style.setProperty('--week-offset', String((firstDay + 6) % 7));

        // 上段に月、下段に日を出す。日だけでは何月か分からない
        var monthHead = document.createElement('div');
        monthHead.className = 'gantt-head';

        var monthName = document.createElement('div');
        monthName.className = 'gantt-name';
        monthHead.appendChild(monthName);

        var monthScale = document.createElement('div');
        monthScale.className = 'gantt-scale';

        ganttMonths(g.from, g.days).forEach(function (m) {
          var cell = document.createElement('div');
          cell.className = 'gantt-month';
          cell.style.gridColumn = 'span ' + m.span;
          cell.textContent = m.label;
          monthScale.appendChild(cell);
        });
        monthHead.appendChild(monthScale);
        chart.appendChild(monthHead);

        var head = document.createElement('div');
        head.className = 'gantt-head';

        var headName = document.createElement('div');
        headName.className = 'gantt-name';
        headName.textContent = 'やること';
        head.appendChild(headName);

        var scale = document.createElement('div');
        scale.className = 'gantt-scale';

        for (var d = 0; d < g.days; d++) {
          var day = new Date(g.from + d * 24 * 60 * 60 * 1000);
          var weekend = day.getDay() === 0 || day.getDay() === 6;

          var cell = document.createElement('div');
          cell.className = 'gantt-day' +
            (d === g.todayOffset ? ' today' : '') + (weekend ? ' weekend' : '');
          cell.textContent = day.getDate();
          cell.title = day.toLocaleDateString('ja-JP');
          scale.appendChild(cell);
        }
        head.appendChild(scale);
        chart.appendChild(head);

        /*
         * 目盛りと今日の線は、行ごとではなく1枚の下敷きに描く。
         * 行ごとに描くと行間で途切れ、日付を縦にたどれない。
         */
        var rows = document.createElement('div');
        rows.className = 'gantt-rows';

        var grid = document.createElement('div');
        grid.className = 'gantt-grid';
        rows.appendChild(grid);

        if (g.todayOffset >= 0 && g.todayOffset < g.days) {
          var todayLine = document.createElement('div');
          todayLine.className = 'gantt-today';
          todayLine.style.left = 'calc(var(--gantt-col) * ' + g.todayOffset + ')';
          grid.appendChild(todayLine);
        }

        // 行を束ねて見出しを付ける
        var byNumber = {};
        g.rows.forEach(function (r) { byNumber[r.number] = r; });

        groupIssues(issues, issueGroupSel.value).forEach(function (group) {
          var shown = group.issues
            .map(function (i) { return byNumber[i.number]; })
            .filter(function (r) { return !!r; });

          if (!shown.length) return;
          rows.appendChild(makeGroupHead(group.label, shown.length, group.key));
          if (collapsed[group.key]) return;

          shown.forEach(function (r) {
            var row = document.createElement('div');
            row.className = 'gantt-row';
            row.dataset.number = r.number;

            var name = document.createElement('button');
            name.className = 'gantt-name';

            // 親の下にあることを、字下げでも示す
            var depth = depthOf(r.number);
            if (depth) {
              row.classList.add('nested');
              name.style.paddingLeft = (depth * 14 + 8) + 'px';
            }

            name.appendChild(makeAvatar(r.assignee));

            var who = document.createElement('span');
            who.className = 'gantt-title';
            who.textContent = '#' + r.number + ' ' + r.title;
            name.appendChild(who);

            var rel = makeRelationChips(r.number);
            if (rel.childNodes.length) name.appendChild(rel);
            name.title = (r.assignee || '担当なし');
            name.addEventListener('click', function () {
              openIssueByNumber(r.number, row);
            });
            row.appendChild(name);

            var track = document.createElement('div');
            track.className = 'gantt-track';

            var bar = document.createElement('button');
            bar.className = 'gantt-bar' +
              (String(r.state) === 'closed' ? ' done' : '') +
              (r.overdue ? ' overdue' : '') +
              (r.hasDue ? '' : ' nodue');
            bar.style.gridColumn = (r.offset + 1) + ' / span ' + r.span;
            bar.appendChild(makeAvatar(r.assignee));

            var days = document.createElement('span');
            days.className = 'gantt-days';
            days.textContent = r.span + '人日';
            bar.appendChild(days);
            bar.title = '#' + r.number + ' ' + r.title +
              (r.hasDue ? '' : ' (期限なし)') + (r.overdue ? ' · 期限切れ' : '') +
              ' — 押すと中身を開きます。端を掴むと期限、真ん中を掴むと全体を動かせます';
            track.appendChild(bar);
            makeBarDraggable(bar, r, g, COL, row);

            row.appendChild(track);
            rows.appendChild(row);
          });
        });

        chart.appendChild(rows);
        ganttEl.appendChild(chart);
      })
      .withFailureHandler(function (err) {
        ganttEl.textContent = 'エラー: ' + err.message;
      })
      .apiIssueList('');
  }

            { label: 'やることを作る', onClick: createIssue }

          return;
        }

        COLUMNS.forEach(function (pair) {

          var col = document.createElement('div');
          col.className = 'board-column';

          var head = document.createElement('h3');
          head.textContent = pair[1] + ' (' + board[column].length + ')';
          hint(head, 'board:' + column);
          col.appendChild(head);

          col.addEventListener('dragover', function (e) {
            e.preventDefault();
            col.classList.add('drop-target');
          });
          col.addEventListener('dragleave', function () {
            col.classList.remove('drop-target');
          });
          col.addEventListener('drop', function (e) {
            e.preventDefault();
            col.classList.remove('drop-target');

            var issueNumber = Number(e.dataTransfer.getData('text/plain'));
            if (!issueNumber) return;

            google.script.run
              .withSuccessHandler(function () { loadBoard(); })
              .withFailureHandler(function (err) {
                showSnack(err.message, { kind: 'ng' });
              })
              .apiProjectMove(issueNumber, column, board[column].length);
          });

          board[column].forEach(function (card) {
            var el = document.createElement('div');
            el.className = 'board-card';
            el.draggable = true;

            var num = document.createElement('span');
            num.className = 'card-number';
            num.textContent = '#' + card.issueNumber;
            el.appendChild(num);

            var title = document.createElement('div');
            title.className = 'card-title';
            title.textContent = card.title;
            el.appendChild(title);

            el.dataset.number = card.issueNumber;

            var rel = makeRelationChips(card.issueNumber);
            if (rel.childNodes.length) {
              var relBox = document.createElement('div');
              relBox.className = 'card-rel';
              relBox.appendChild(rel);
              el.appendChild(relBox);
            }

            var labelEls = makeLabels(card.labels);
            if (labelEls) el.appendChild(labelEls);
            applyRot(el, card);

            el.addEventListener('dragstart', function (e) {
              e.dataTransfer.setData('text/plain', String(card.issueNumber));
            });

            // 掴んで動かすだけでなく、押して中身を直せるようにする
            el.addEventListener('click', function () {
              openIssueByNumber(card.issueNumber, el);
            });
            el.tabIndex = 0;
            el.addEventListener('keydown', function (e) {
              if (e.key !== 'Enter' && e.key !== ' ') return;
              e.preventDefault();
              openIssueByNumber(card.issueNumber, el);
            });

            var foot = document.createElement('div');
            foot.className = 'card-foot';

            var when = document.createElement('span');
            when.className = 'row-meta';
            when.textContent = card.dueDate
              ? '期限 ' + String(card.dueDate).substring(0, 10) : '';

            var cardStale = makeStaleBadge(card);
            if (cardStale) when.appendChild(cardStale);
            foot.appendChild(when);
            foot.appendChild(makeAvatar(card.assignee));

            // 一覧と同じく、カードからも捨てられるようにする。
            // 板だけ捨てられないと、捨てるために一覧へ移る手間が要る
            foot.appendChild(makeArchiveButton(
              { number: card.issueNumber, title: card.title }, panelIssues));

            el.appendChild(foot);

            col.appendChild(el);
          });

          boardEl.appendChild(col);
        });
      })
      .withFailureHandler(function (err) {
        boardEl.textContent = 'エラー: ' + err.message;
      })
      .apiProjectBoard();
  }

  }

  /**
   * 報告を書いてもらう。
   *
   * 白紙の1枚に「詳しく書いてください」と頼んでも、何を書けば直せるのか
   * は伝わらない。順番に尋ねて、こちらで1つの本文に組み立てる。
   *
   * @param {HTMLElement} [sourceEl]
   */
  function createReport(sourceEl) {
    var shots = [];

    var form = openInlineForm(
      'うまく動かないことを伝える',
      [
        { name: 'kind', label: '種類', choices: REPORT_KINDS },
        {
          name: 'summary',
          label: 'ひとことで言うと',
          required: true,
          placeholder: '例: 工程表の棒が伸ばせない',
        },
        {
          name: 'steps',
          label: '何をしましたか',
          required: true,
          multiline: true,
          placeholder: '例:\n1. やること → 工程表 を開く\n2. 棒の右端を掴む\n3. 右に引く',
        },
        {
          name: 'actual',
          label: 'どうなりましたか',
          required: true,
          multiline: true,
          placeholder: '例: 棒が伸びず、幅が変わらなかった',
        },
        {
          name: 'expected',
          label: 'どうなってほしかったですか',
          multiline: true,
          placeholder: '例: 期限が右に延びてほしかった',
        },
      ],
      '送る',
      function (v) {
        google.script.run
          .withSuccessHandler(function (row) {
            showSnack('受付 #' + row.number + ' として送りました', { kind: 'ok' });
            closeSide();
            loadReports();
          })
          .withFailureHandler(function (err) {
            showSnack(err.message, { kind: 'ng' });
          })
          .apiInquiryCreate(v.kind, reportBody(v), reportContext(), shots);
      },
      sourceEl
    );

    form.insertBefore(makeShotPicker(shots, form),
      form.querySelector('.inline-form-actions'));

    // 本文の欄では人を呼べるようにする
    var areas = form.querySelectorAll('textarea');
    for (var i = 0; i < areas.length; i++) attachMentionPicker(areas[i]);

    var note = document.createElement('p');
    note.className = 'row-meta';
    note.textContent = '送ると、見ている画面と使っている環境も一緒に記録されます。';
    form.insertBefore(note, form.querySelector('.inline-form-actions'));

    form.querySelector('input').focus();
  }

  /**
   * 尋ねた答えを1つの本文に組み立てる。
   *
   * 見出しを揃えておくと、後から読む人が同じ順番で追える。
   *
   * @param {Object<string,string>} v
   * @returns {string}
   */
  function reportBody(v) {
    var parts = [v.summary];

    parts.push('', '【何をしたか】', v.steps);
    parts.push('', '【どうなったか】', v.actual);
    if (String(v.expected || '').replace(/^\s+|\s+$/g, '')) {
      parts.push('', '【どうなってほしかったか】', v.expected);
    }
    return parts.join('\n');
  }

  /**
   * 画像を添える欄を作る。
   *
   * 選ぶだけでなく貼り付けでも入れられるようにする。画面の写真は
   * 撮った直後がいちばん貼りやすい。
   *
   * @param {string[]} shots 入れ物。ここに data URL を貯める
   * @param {HTMLElement} form 貼り付けを拾う相手
   * @returns {HTMLElement}
   */
  function makeShotPicker(shots, form) {
    var MAX = 4;
    var wrap = document.createElement('div');
    wrap.className = 'shot-picker';

    var label = document.createElement('div');
    label.className = 'row-meta';
    label.textContent = '画面の写真 (任意・' + MAX + '枚まで)';
    wrap.appendChild(label);

    var list = document.createElement('div');
    list.className = 'shot-list';
    wrap.appendChild(list);

    var pick = document.createElement('input');
    pick.type = 'file';
    pick.accept = 'image/png,image/jpeg,image/gif,image/webp';
    pick.multiple = true;
    pick.className = 'shot-input';
    pick.setAttribute('aria-label', '画面の写真を選ぶ');
    wrap.appendChild(pick);

    var hint = document.createElement('div');
    hint.className = 'row-meta';
    hint.textContent = 'ここに貼り付け (Ctrl+V) でも入れられます';
    wrap.appendChild(hint);

    function draw() {
      list.textContent = '';

      shots.forEach(function (data, i) {
        var item = document.createElement('div');
        item.className = 'shot-item';

        var img = document.createElement('img');
        img.src = data;
        img.alt = '添えた写真 ' + (i + 1) + '枚目';
        item.appendChild(img);

        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn btn-danger';
        del.appendChild(makeIcon('trash'));
        del.title = 'この写真を外す';
        del.setAttribute('aria-label', del.title);
        del.addEventListener('click', function () {
          shots.splice(i, 1);
          draw();
        });
        item.appendChild(del);

        list.appendChild(item);
      });
    }

    function add(file) {
      if (!file || String(file.type).indexOf('image/') !== 0) return;
      if (shots.length >= MAX) {
        showSnack('写真は' + MAX + '枚までです', { kind: 'ng' });
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        showSnack('写真は1枚5MBまでです', { kind: 'ng' });
        return;
      }

      var reader = new FileReader();
      reader.onload = function () {
        shots.push(String(reader.result));
        draw();
      };
      reader.readAsDataURL(file);
    }

    pick.addEventListener('change', function () {
      for (var i = 0; i < pick.files.length; i++) add(pick.files[i]);
      pick.value = '';
    });

    form.addEventListener('paste', function (e) {
      var items = (e.clipboardData && e.clipboardData.items) || [];
      for (var i = 0; i < items.length; i++) {
        if (String(items[i].type).indexOf('image/') !== 0) continue;
        add(items[i].getAsFile());
        e.preventDefault();
      }
    });

    return wrap;
  }

  /**
   * 画面に出す呼び名を決める。
   *
   * ふだんは名前だけで足りる。同じ名前が2人いるときだけ、どちらか
   * 分かるようにアドレスごと出す。
   *
   * @param {string} email
   * @returns {string}
   */
  function mentionLabel(email) {
    var name = String(email || '').split('@')[0];
    var same = roster.filter(function (one) {
      return String(one).split('@')[0].toLowerCase() === name.toLowerCase();
    });

    return same.length > 1 ? String(email) : name;
  }

  /**
   * 呼び名を名簿の誰かに結び付ける。src/core/Mention.js と同じもの。
   *
   * @param {string} token
   * @returns {string}
   */
  function mentionMatch(token) {
    var want = String(token || '').toLowerCase();
    if (!want) return '';

    for (var i = 0; i < roster.length; i++) {
      var one = String(roster[i] || '');
      var low = one.toLowerCase();

      if (low === want) return one;
      if (want.indexOf('@') < 0 && low.split('@')[0] === want) return one;
    }
    return '';
  }

  /**
   * 呼び出しに色を付けた本文を作る。
   *
   * 画面は textContent だけで組み立てる決まりなので、切り分けてから
   * 節ごとに要素にする。
   *
   * @param {string} text
   * @returns {HTMLElement}
   */
  function makeBodyWithMentions(text) {
    var box = document.createElement('div');
    box.className = 'comment-body';

    var src = String(text || '');
    var re = /@([A-Za-z0-9._%+-]+(?:@[A-Za-z0-9.-]+\.[A-Za-z]{2,})?)/g;
    var at = 0;
    var m;

    while ((m = re.exec(src)) !== null) {
      var who = mentionMatch(m[1]);
      if (!who) continue;

      if (m.index > at) {
        box.appendChild(document.createTextNode(src.substring(at, m.index)));
      }

      var tag = document.createElement('span');
      tag.className = 'mention' + (who === currentUser ? ' me' : '');
      tag.textContent = m[0];
      tag.title = who;
      box.appendChild(tag);

      at = m.index + m[0].length;
    }

    if (at < src.length) box.appendChild(document.createTextNode(src.substring(at)));
    return box;
  }

  /**
   * 「@」を打ったら名簿から選べるようにする。
   *
   * 名簿に無い呼び出しは誰にも届かない。打ち間違いに気づけるよう、
   * 候補を出して選ばせる。
   *
   * @param {HTMLTextAreaElement} input
   */
  function attachMentionPicker(input) {
    var box = document.createElement('div');
    box.className = 'mention-picker';
    box.hidden = true;
    input.parentNode.insertBefore(box, input.nextSibling);

    function close() {
      box.hidden = true;
      box.textContent = '';
    }

    function pick(who, from) {
      var before = input.value.substring(0, from);
      var after = input.value.substring(input.selectionStart);
      var name = mentionLabel(who);

      input.value = before + '@' + name + ' ' + after;
      input.focus();
      input.selectionStart = input.selectionEnd = (before + '@' + name + ' ').length;
      close();
    }

    input.addEventListener('input', function () {
      var upto = input.value.substring(0, input.selectionStart);
      var m = /@([A-Za-z0-9._%+-]*)$/.exec(upto);
      if (!m) return close();

      var want = m[1].toLowerCase();
      var hits = roster.filter(function (one) {
        return !want || String(one).toLowerCase().indexOf(want) >= 0;
      }).slice(0, 6);

      if (!hits.length) return close();

      box.textContent = '';
      hits.forEach(function (who) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mention-option';
        btn.appendChild(makeAvatar(who));

        var name = document.createElement('span');
        name.className = 'mention-name';
        name.textContent = String(who).split('@')[0];
        btn.appendChild(name);

        var addr = document.createElement('span');
        addr.className = 'row-meta';
        addr.textContent = who;
        btn.appendChild(addr);

        btn.addEventListener('click', function () {
          pick(who, m.index);
        });
        box.appendChild(btn);
      });
      box.hidden = false;
    });

    input.addEventListener('blur', function () {
      // 候補を押すより先に閉じてしまわないよう、一拍おく
      window.setTimeout(close, 150);
    });
  }

  /**
   * 添えられた写真を並べる。
   *
   * @param {Array<{url:string, thumb:string}>} shots
   * @returns {HTMLElement|null}
   */
  function makeShotStrip(shots) {
    if (!shots || !shots.length) return null;

    var strip = document.createElement('div');
    strip.className = 'shot-list';

    shots.forEach(function (shot, i) {
      var a = document.createElement('a');
      a.className = 'shot-item';
      a.href = shot.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = '大きく見る';

      var img = document.createElement('img');
      img.src = shot.thumb;
      img.alt = '添えられた写真 ' + (i + 1) + '枚目';
      img.loading = 'lazy';
      // 見られないときは代わりに文字の手がかりを出す
      img.addEventListener('error', function () {
        img.remove();
        a.textContent = '写真 ' + (i + 1) + '枚目を開く';
      });
      a.appendChild(img);

      strip.appendChild(a);
    });
    return strip;
  }

  /**
   * 報告を並べる。
   *
   * 全員が全部を読める。同じところでつまずいた人が先に答えを知って
   * いることがあり、自分のぶんしか見えないと誰も助け合えない。
   */
  function loadReports() {
    showSkeleton(reportListEl, 'list', 3);

    google.script.run
      .withSuccessHandler(function (list) {
        var rows = list || [];
        reportListEl.textContent = '';
        setCount('count-reports', rows.filter(function (r) {
          return r.state === 'open';
        }).length);

        var shown = rows.filter(matchesReport);

        if (rows.length && !shown.length) {
          reportDetail.textContent = '';
          reportListEl.appendChild(makeBlankState(
            '絞り込みに合う報告がありません',
            '絞り込みを消すか、「未解決だけ」を外してみてください。'
          ));
          return;
        }

        if (!rows.length) {
          reportDetail.textContent = '';
          reportListEl.appendChild(makeBlankState(
            'まだ何も伝えていません',
            'うまく動かないこと、こうしてほしいことを送ってください。' +
            '見ている画面と環境も一緒に届きます。',
            { label: 'うまく動かないことを伝える', onClick: createReport }
          ));
          return;
        }

        shown.forEach(function (r) {
          var btn = document.createElement('button');
          btn.className = 'row-item';
          btn.dataset.number = r.number;

          var main = document.createElement('div');
          main.className = 'row-main';

          var title = document.createElement('div');
          title.className = 'row-title';
          title.textContent = '#' + r.number + ' ' + r.title;
          main.appendChild(title);

          var meta = document.createElement('div');
          meta.className = 'row-meta';
          meta.textContent = r.kindLabel + ' · ' + r.by + ' · ' +
            String(r.at).substring(0, 10) +
            (r.replyCount ? ' · 返信 ' + r.replyCount + '件' : '');
          main.appendChild(meta);

          var open = document.createElement('div');
          open.className = 'row-open';
          open.appendChild(makeIcon(r.state === 'done' ? 'check' : 'inbox'));
          open.appendChild(main);
          btn.appendChild(open);

          var state = document.createElement('span');
          state.className = 'state' + (r.state === 'done' ? ' state-merged' : '');
          state.textContent = r.state === 'done' ? '解決' : '未解決';
          btn.appendChild(state);

          btn.addEventListener('click', function () { openReport(r.number); });
          reportListEl.appendChild(btn);
        });

        // 開いていた話を開き直す。返信するたび先頭に戻ると読み進められない
        var keep = reportShown &&
          shown.filter(function (r) { return r.number === reportShown; })[0];
        openReport(keep ? keep.number : (shown[0] && shown[0].number));
      })
      .withFailureHandler(function (err) {
        reportListEl.textContent = 'エラー: ' + err.message;
      })
      .apiInquiryList();
  }

  /**
   * 絞り込みに残すかを決める。
   *
   * @param {object} r
   * @returns {boolean}
   */
  function matchesReport(r) {
    if (reportOpenOnly && r.state === 'done') return false;

    var q = String(reportFilterEl.value || '').toLowerCase()
      .replace(/^\s+|\s+$/g, '');
    if (!q) return true;

    return ['#' + r.number, r.title, r.body, r.kindLabel, r.by]
      .join(' ').toLowerCase().indexOf(q) >= 0;
  }

  /**
   * 話を開く。
   *
   * @param {number} number
   */
  function openReport(number) {
    reportShown = number || null;

    var items = reportListEl.querySelectorAll('.row-item');
    for (var i = 0; i < items.length; i++) {
      items[i].setAttribute('aria-current',
        String(Number(items[i].dataset.number) === Number(number)));
    }

    if (!number) {
      reportDetail.textContent = '';
      return;
    }
    showSkeleton(reportDetail, 'block');

    google.script.run
      .withSuccessHandler(function (thread) {
        if (!thread) return;
        renderReportThread(thread.inquiry, thread.replies || []);
      })
      .withFailureHandler(function (err) {
        reportDetail.textContent = 'エラー: ' + err.message;
      })
      .apiInquiryThread(number);
  }

  /**
   * 話の中身を描く。
   *
   * @param {object} q
   * @param {object[]} replies
   */
  function renderReportThread(q, replies) {
    reportDetail.textContent = '';

    var head = document.createElement('div');
    head.className = 'pr-title';
    head.textContent = '#' + q.number + ' ' + q.title;
    reportDetail.appendChild(head);

    var meta = document.createElement('div');
    meta.className = 'row-meta';
    meta.textContent = q.kindLabel + ' · ' + q.by + ' · ' +
      String(q.at).substring(0, 10) +
      (q.state === 'done' ? ' · 解決' + (q.closedBy ? ' (' + q.closedBy + ')' : '') : '');
    reportDetail.appendChild(meta);

    if (q.canClose) {
      var actions = document.createElement('div');
      actions.className = 'pr-actions';

      var toggle = document.createElement('button');
      toggle.className = 'btn' + (q.state === 'done' ? '' : ' btn-primary');
      toggle.appendChild(makeIcon(q.state === 'done' ? 'back' : 'check'));
      toggle.appendChild(document.createTextNode(
        q.state === 'done' ? 'まだ解決していない' : '解決した'));

      toggle.addEventListener('click', function () {
        toggle.disabled = true;
        var run = google.script.run
          .withSuccessHandler(function () { loadReports(); })
          .withFailureHandler(function (err) {
            toggle.disabled = false;
            showSnack(err.message, { kind: 'ng' });
          });

        if (q.state === 'done') run.apiInquiryReopen(q.number);
        else run.apiInquiryClose(q.number);
      });

      actions.appendChild(toggle);
      reportDetail.appendChild(actions);
    }

    var first = document.createElement('div');
    first.className = 'comment';
    first.appendChild(makeCommentHead(q.by, 'が報告'));

    first.appendChild(makeBodyWithMentions(q.body));

    var firstShots = makeShotStrip(q.shots);
    if (firstShots) first.appendChild(firstShots);

    if (q.context) {
      var ctx = document.createElement('details');
      ctx.className = 'report-context';

      var sum = document.createElement('summary');
      sum.textContent = 'そのときの状況';
      ctx.appendChild(sum);

      var pre = document.createElement('div');
      pre.className = 'comment-body';
      pre.textContent = q.context;
      ctx.appendChild(pre);
      first.appendChild(ctx);
    }
    reportDetail.appendChild(first);

    replies.forEach(function (r) {
      var el = document.createElement('div');
      el.className = 'comment';

      var h = makeCommentHead(r.by, String(r.at).substring(0, 10) +
        (r.editedAt ? ' · 直しました' : ''));
      if (r.canEdit) h.appendChild(makeReplyTools(r, el));
      el.appendChild(h);

      el.appendChild(makeBodyWithMentions(r.body));

      var replyShots = makeShotStrip(r.shots);
      if (replyShots) el.appendChild(replyShots);

      reportDetail.appendChild(el);
    });

    reportDetail.appendChild(makeReplyForm(q));
  }

  /**
   * 自分の返信を直す / 消す。
   *
   * @param {object} reply
   * @param {HTMLElement} host
   * @returns {HTMLElement}
   */
  function makeReplyTools(reply, host) {
    var tools = document.createElement('span');
    tools.className = 'comment-tools';

    var edit = document.createElement('button');
    edit.className = 'icon-btn';
    edit.appendChild(makeIcon('pencil'));
    edit.title = 'この返信を直す';
    edit.setAttribute('aria-label', edit.title);
    edit.addEventListener('click', function () {
      var form = openInlineForm(
        '返信を直す',
        [{ name: 'body', label: '中身', required: true, multiline: true }],
        '直す',
        function (v) {
          google.script.run
            .withSuccessHandler(function () {
              showSnack('返信を直しました', { kind: 'ok' });
              closeSide();
              openReport(reply.inquiryNumber);
            })
            .withFailureHandler(function (err) {
              showSnack(err.message, { kind: 'ng' });
            })
            .apiInquiryReplyEdit(reply.id, v.body);
        },
        host
      );
      form.querySelector('textarea').value = reply.body || '';
    });
    tools.appendChild(edit);

    var del = document.createElement('button');
    del.className = 'btn btn-danger';
    del.appendChild(makeIcon('trash'));
    del.title = 'この返信を消す';
    del.setAttribute('aria-label', del.title);
    del.addEventListener('click', function () {
      openConfirmStrip(reportDetail,
        'この返信を消します。元には戻せません。',
        '消す',
        function () {
          google.script.run
            .withSuccessHandler(function (msg) {
              showSnack(msg, { kind: 'ok' });
              openReport(reply.inquiryNumber);
            })
            .withFailureHandler(function (err) {
              showSnack(err.message, { kind: 'ng' });
            })
            .apiInquiryReplyDelete(reply.id);
        });
    });
    tools.appendChild(del);
    return tools;
  }

  /**
   * 返信を書く欄。
   *
   * @param {object} q
   * @returns {HTMLElement}
   */
  function makeReplyForm(q) {
    var shots = [];
    var form = document.createElement('div');
    form.className = 'comment-form';

    var input = document.createElement('textarea');
    input.placeholder =
      '同じことが起きた、こうしたら直った、など (@ で人を呼べます)';
    form.appendChild(input);
    attachMentionPicker(input);

    form.appendChild(makeShotPicker(shots, form));

    var send = document.createElement('button');
    send.className = 'btn btn-primary';
    send.textContent = '返信する';
    send.addEventListener('click', function () {
      if (!input.value) return;
      send.disabled = true;

      google.script.run
        .withSuccessHandler(function () {
          showSnack('返信しました', { kind: 'ok' });
          openReport(q.number);
        })
        .withFailureHandler(function (err) {
          send.disabled = false;
          showSnack(err.message, { kind: 'ng' });
        })
        .apiInquiryReply(q.number, input.value, shots);
    });

    form.appendChild(send);
    return form;
  }

  // ===== Google ToDo との同期 (オプション) =====

  var tasksState = { available: false, listId: '', lists: [] };

  /**
   * 使える環境かを見て、使えるときだけ入口を出す。
   *
   * 拡張サービスを足していない環境で押せるボタンを出しても、押した先で
   * 断られるだけになる。
   */
  function loadTasksState() {
    google.script.run
      .withSuccessHandler(function (res) {
        tasksState = res || { available: false, listId: '', lists: [] };
        var btn = document.getElementById('tasks-btn');

        btn.hidden = !tasksState.available;
        btn.title = tasksState.listId
          ? '自分の担当を Google ToDo と同期します'
          : '入れ先の ToDo リストを選びます';
      })
      .withFailureHandler(function () { /* 使えないだけ */ })
      .apiTasksState();
  }

  /**
   * 同期の入口。入れ先が決まっていなければ先に選んでもらう。
   *
   * @param {HTMLElement} sourceEl
   */
  function openTasks(sourceEl) {
    if (!tasksState.listId) return chooseTasksList(sourceEl);

    var btn = document.getElementById('tasks-btn');
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        var msg = (res.pushed || 0) + '件を ToDo に送りました';
        if (res.closed) msg += ' / ' + res.closed + '件を完了にしました';

        showSnack(msg, { kind: 'ok' });
        refreshIssueViews();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        showSnack(err.message, { kind: 'ng' });
      })
      .apiTasksSync();
  }

  /**
   * 入れ先の ToDo リストを選ばせる。
   *
   * @param {HTMLElement} sourceEl
   */
  function chooseTasksList(sourceEl) {
    var choices = (tasksState.lists || []).map(function (one) {
      return [one.id, one.title];
    });

    if (!choices.length) {
      showSnack('ToDo リストが見つかりません', { kind: 'ng' });
      return;
    }

    var form = openInlineForm(
      'Google ToDo と同期する',
      [{ name: 'listId', label: '入れ先のリスト', choices: choices }],
      '決める',
      function (v) {
        google.script.run
          .withSuccessHandler(function (id) {
            tasksState.listId = id;
            showSnack('入れ先を決めました。もう一度押すと同期します',
              { kind: 'ok' });
            loadTasksState();
          })
          .withFailureHandler(function (err) {
            showSnack(err.message, { kind: 'ng' });
          })
          .apiTasksChooseList(v.listId);
      },
      sourceEl
    );

    var note = document.createElement('p');
    note.className = 'row-meta';
    note.textContent =
      '自分が担当で、まだ終わっていないやることだけを送ります。' +
      'ToDo 側で完了にすると、こちらも完了になります。';
    form.insertBefore(note, form.querySelector('.inline-form-actions'));
  }

  // ===== 知らせ =====

  /**
   * デスクトップ通知が使えるかを見る。
   *
   * この画面は枠の中で動くため、ブラウザや設定によっては許可そのものを
   * 求められない。使えないときは画面の中の知らせだけで済ませる。
   *
   * @returns {string} 'granted' | 'denied' | 'default' | 'unavailable'
   */
  function desktopState() {
    try {
      if (!window.Notification) return 'unavailable';
      return window.Notification.permission;
    } catch (e) {
      return 'unavailable';
    }
  }

  function renderDesktopButton() {
    var btn = document.getElementById('notice-desktop');
    var note = document.getElementById('notice-desktop-note');
    var state = desktopState();

    btn.hidden = state !== 'default';
    note.textContent = {
      granted: 'デスクトップ通知は入になっています',
      denied: 'デスクトップ通知はブラウザ側で断られています。ここの一覧で見てください',
      unavailable: 'この環境ではデスクトップ通知を出せません。ここの一覧で見てください',
      'default': '',
    }[state] || '';
  }

  /**
   * デスクトップに出す。出せなければ何もしない。
   *
   * @param {object} notice
   */
  function popDesktop(notice) {
    if (desktopState() !== 'granted') return;

    try {
      var n = new window.Notification(notice.title, { body: notice.body });
      n.onclick = function () {
        window.focus();
        openNoticeLink(notice);
      };
    } catch (e) { /* 出せなくても画面の中には残っている */ }
  }

  /**
   * 知らせの指す場所を開く。
   *
   * @param {object} notice
   */
  function openNoticeLink(notice) {
    var parts = String(notice.link || '').split(':');
    if (parts[0] === 'report') {
      switchTab('report');
      openReport(Number(parts[1]));
    } else if (parts[0] === 'pull') {
      switchTab('pulls');
    }
    noticePanel.hidden = true;
    bellBtn.setAttribute('aria-expanded', 'false');
  }

  /**
   * 知らせを取ってくる。
   *
   * @param {boolean} [quiet] 初回は前からあるぶんで驚かせない
   */
  function loadNotices(quiet) {
    google.script.run
      .withSuccessHandler(function (res) {
        var data = res || { items: [], unread: 0 };
        renderNotices(data.items);

        bellCount.textContent = data.unread;
        bellCount.hidden = !data.unread;
        bellBtn.title = data.unread
          ? '知らせが' + data.unread + '件あります' : '知らせ';
        bellBtn.setAttribute('aria-label', bellBtn.title);

        // 前に見た番号より新しく、まだ読んでいないものだけを前に出す
        var fresh = data.items.filter(function (n) {
          return !n.read && n.id > seenNoticeId;
        });

        data.items.forEach(function (n) {
          if (n.id > seenNoticeId) seenNoticeId = n.id;
        });

        if (quiet || !fresh.length) return;

        showSnack(fresh[0].title, { kind: 'ok' });
        fresh.forEach(popDesktop);
      })
      .withFailureHandler(function () { /* 知らせが出ないだけ */ })
      .apiNotifications(30);
  }

  /**
   * @param {object[]} items
   */
  function renderNotices(items) {
    noticeBody.textContent = '';

    if (!items.length) {
      noticeBody.appendChild(makeBlankState(
        '知らせはありません',
        '名前を呼ばれたときや、返信があったときにここに出ます。'
      ));
      return;
    }

    var labels = { mention: '呼ばれました', reply: '返信', review: '確認の依頼' };

    items.forEach(function (n) {
      var row = document.createElement('button');
      row.className = 'notice-item' + (n.read ? '' : ' unread');

      var head = document.createElement('div');
      head.className = 'row-meta';
      head.textContent = (labels[n.kind] || n.kind) + ' · ' +
        String(n.at).substring(0, 10);
      row.appendChild(head);

      var title = document.createElement('div');
      title.className = 'row-title';
      title.textContent = n.title;
      row.appendChild(title);

      if (n.body) {
        var body = document.createElement('div');
        body.className = 'row-meta notice-quote';
        body.textContent = n.body;
        row.appendChild(body);
      }

      row.addEventListener('click', function () {
        google.script.run
          .withSuccessHandler(function () { loadNotices(true); })
          .withFailureHandler(function () {})
          .apiNotificationsRead([n.id]);
        openNoticeLink(n);
      });

      noticeBody.appendChild(row);
    });
  }

  // ===== 初期化 =====

  var navTargets = document.querySelectorAll('[data-tab]');
  for (var i = 0; i < navTargets.length; i++) {
    (function (btn) {
      var icon = TAB_ICONS[btn.dataset.tab];
      if (icon && btn.classList.contains('nav-item')) {
        btn.insertBefore(makeIcon(icon), btn.firstChild);
      } else if (icon && btn.classList.contains('tab')) {
        btn.insertBefore(makeIcon(icon), btn.firstChild);
      }
      btn.addEventListener('click', function () { switchTab(btn.dataset.tab); });
    })(navTargets[i]);
  }

  [[commitBtn, 'check'], [stashBtn, 'archive'], [branchCreateBtn, 'git-branch'],
   [draftCreateBtn, 'git-branch'], [bulkCommitBtn, 'check'],
   [issueCreateBtn, 'plus'], [editSaveBtn, 'save'],
   [viewBtns.list, 'circle-dot'], [viewBtns.board, 'columns'], [viewBtns.gantt, 'calendar'],
   [modeEditBtn, 'pencil'], [modeViewBtn, 'file-text'], [crumbBack, 'back']]
    .forEach(function (pair) {
      if (pair[0]) pair[0].insertBefore(makeIcon(pair[1]), pair[0].firstChild);
    });

  crumbBack.addEventListener('click', function () {
    current.fileId = null;
    switchTab('docs');
  });

  branchSelect.addEventListener('change', function () {
    openDoc(branchSelect.value, current.docPath);
  });

  commitBtn.addEventListener('click', doCommit);
  stashBtn.addEventListener('click', stashMainDrift);
  editSaveBtn.addEventListener('click', saveEditor);
  modeViewBtn.addEventListener('click', function () { setDocMode('view'); });
  modeEditBtn.addEventListener('click', function () { setDocMode('edit'); });
  draftCreateBtn.addEventListener('click', createDraft);
  branchCreateBtn.addEventListener('click', function () {
    if (current.docFileId) {
      switchTab('drafts');
      createDraft();
      return;
    }
    showSnack('先に文書を選んでください。文書を開くと改訂版を作れます');
    switchTab('docs');
  });
  /**
   * 画面にずっと居る要素に補足を付ける。
   *
   * 作られては消える要素は、作るところで付ける。
   */
  function applyHints() {
    var byTab = {
      content: 'tab:content', history: 'tab:history', drafts: 'tab:drafts',
    };
    var byNav = {
      docs: 'nav:docs', issues: 'nav:issues', branches: 'nav:branches',
      pulls: 'nav:pulls', help: 'nav:help', report: 'nav:report',
    };

    var targets = document.querySelectorAll('[data-tab]');
    for (var i = 0; i < targets.length; i++) {
      var el = targets[i];
      var key = el.classList.contains('tab')
        ? byTab[el.dataset.tab] : byNav[el.dataset.tab];
      if (key) hint(el, key);
    }

    hint(branchChip, 'chip:official');
    hint(dirtyBadge, 'badge:dirty');
    hint(document.getElementById('branch-switch'), 'select:branch');
    hint(openLink, 'link:file');
    hint(themeBtn, 'act:theme');
    hint(bellBtn, 'act:bell');

    hint(viewBtns.list, 'seg:list');
    hint(viewBtns.board, 'seg:board');
    hint(viewBtns.gantt, 'seg:gantt');
    hint(viewBtns.trash, 'seg:trash');
    hint(issueGroupSel.parentNode, 'group:issue');
    hint(mineBtn, 'filter:mine');
    hint(reportOpenBtn, 'filter:open');

    hint(document.querySelector('.graph-col-graph'), 'col:graph');
    hint(document.querySelector('.graph-col-desc'), 'col:desc');
    hint(document.querySelector('.graph-col-sha'), 'col:sha');
  }

  attachHint(bulkCommitBtn,
    '改訂中の版をすべて見て、まだ記録していない変更を探します。' +
    '見つかったものを選んで、ひとつの説明でまとめて記録します');
  attachHint(document.getElementById('branch-create-btn'),
    '正式版をコピーして、直す用の版を作ります。正式版には影響しません');
  // 上の帯の右寄りにあるものは、補足を左に開かせる。画面の外に出ると読めない
  attachHint(commitBtn,
    'いまの中身をその時点として残します。あとから見比べて戻せます')
    .classList.add('hint-left');
  attachHint(stashBtn,
    '正式版を直接なおしてしまったとき、その変更を別の版に移して逃がします')
    .classList.add('hint-left');

  bulkCommitBtn.addEventListener('click', bulkCommit);
  issueCreateBtn.addEventListener('click', createIssue);
  themeBtn.addEventListener('click', cycleTheme);
  sideClose.addEventListener('click', closeSide);

  guidelineToggle.addEventListener('click', function () {
    var open = guidelineBody.hidden;
    guidelineBody.hidden = !open;
    guidelineToggle.setAttribute('aria-expanded', String(open));
    guidelineToggle.querySelector('.guideline-mark').textContent = open ? '▾' : '▸';

    try {
      window.localStorage.setItem('guideline', open ? 'open' : 'closed');
    } catch (e) { /* 覚えられなくても開閉はできる */ }
  });

  /**
   * はじめの案内を出す / しまう。
   *
   * 一度しまうと二度と出せない案内は、しまうのをためらわせる。
   * 使い方の頁からいつでも出し直せるようにしておく。
   *
   * @param {boolean} on
   */
  function setGuideline(on) {
    guidelineEl.hidden = !on;

    try {
      window.localStorage.setItem('guidelineHidden', on ? '' : '1');
    } catch (e) { /* 覚えられなくても表示は切り替わる */ }
  }

  document.getElementById('guideline-hide').addEventListener('click', function () {
    setGuideline(false);
    showSnack('案内をしまいました。「使い方」からいつでも出せます');
  });

  try {
    if (window.localStorage.getItem('guideline') === 'closed') guidelineToggle.click();
    if (window.localStorage.getItem('guidelineHidden') === '1') setGuideline(false);
  } catch (e) { /* 既定は開いたまま */ }
  issueGroupSel.addEventListener('change', reloadIssueView);
  issueFilterEl.addEventListener('input', reloadIssueView);

  dropRootEl.addEventListener('dragover', function (e) {
    e.preventDefault();
    dropRootEl.classList.add('over');
  });
  dropRootEl.addEventListener('dragleave', function () {
    dropRootEl.classList.remove('over');
  });
  dropRootEl.addEventListener('drop', function (e) {
    e.preventDefault();
    dropRootEl.classList.remove('over');

    var moving = Number(e.dataTransfer.getData('text/plain'));
    if (moving) setIssueParent(moving, '');
  });
  Object.keys(viewBtns).forEach(function (k) {
    viewBtns[k].addEventListener('click', function () { setIssueView(k); });
  });

  document.getElementById('report-btn')
    .addEventListener('click', function () { createReport(this); });

  reportFilterEl.addEventListener('input', loadReports);
  setToggle(reportOpenBtn, reportOpenOnly);
  reportOpenBtn.addEventListener('click', function () {
    reportOpenOnly = !reportOpenOnly;
    setToggle(reportOpenBtn, reportOpenOnly);
    loadReports();
  });

  makeResizable(document.getElementById('report-resizer'),
    '--report-pane-w', 'reportPaneWidth',
    function (e) {
      var box = document.querySelector('#panel-report .graph-split')
        .getBoundingClientRect();
      return e.clientX - box.left;
    }, { min: 260, max: 1200 });

  setToggle(mineBtn, mineOnly);
  document.getElementById('tasks-btn').addEventListener('click', function () {
    openTasks(this);
  });
  loadTasksState();

  bellBtn.appendChild(makeIcon('bell'));
  bellBtn.insertBefore(bellBtn.lastChild, bellCount);

  bellBtn.addEventListener('click', function () {
    var open = noticePanel.hidden;
    noticePanel.hidden = !open;
    bellBtn.setAttribute('aria-expanded', String(open));
    if (open) {
      renderDesktopButton();
      loadNotices(true);
    }
  });

  document.getElementById('notice-close').addEventListener('click', function () {
    noticePanel.hidden = true;
    bellBtn.setAttribute('aria-expanded', 'false');
  });

  document.getElementById('notice-read-all').addEventListener('click', function () {
    google.script.run
      .withSuccessHandler(function () { loadNotices(true); })
      .withFailureHandler(function (err) { showSnack(err.message, { kind: 'ng' }); })
      .apiNotificationsRead([]);
  });

  document.getElementById('notice-desktop').addEventListener('click', function () {
    // 許可を求められるのは人が押した直後だけ
    try {
      window.Notification.requestPermission().then(function () {
        renderDesktopButton();
      });
    } catch (e) {
      renderDesktopButton();
    }
  });

  loadNotices(true);
  window.setInterval(function () { loadNotices(false); }, 60000);

  mineBtn.addEventListener('click', function () {
    mineOnly = !mineOnly;
    setToggle(mineBtn, mineOnly);
    reloadIssueView();
  });

  diffExpandBtn.addEventListener('click', function () {
    setDiffFull(!diffPane.classList.contains('full'));
  });
  setDiffFull(false);

  // どこにいても Escape で入力を閉じられる。広げた差分もここで畳む
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!sidePanel.hidden) closeSide();
    else if (diffPane.classList.contains('full')) setDiffFull(false);
  });

  google.script.run
    .withSuccessHandler(function (who) { currentUser = (who || {}).activeUser || ''; })
    .withFailureHandler(function () { /* 判定できなければ従来どおり押せる */ })
    .apiWhoAmI();

  google.script.run
    .withSuccessHandler(function (list) { tags = list || []; })
    .withFailureHandler(function () { /* 選べないだけで手で書ける */ })
    .apiTagList();

  google.script.run
    .withSuccessHandler(function (list) { roster = list || []; })
    .withFailureHandler(function () { /* 呼べないだけで書き込みはできる */ })
    .apiKnownPeople();

  google.script.run
    .withSuccessHandler(function (days) { archiveKeepDays = Number(days) || 30; })
    .withFailureHandler(function () { /* 既定の30日で表示する */ })
    .apiArchiveKeepDays();

  makeResizable(resizer, '--sidebar-w', 'sidebarWidth',
    function (e) { return e.clientX; }, { min: 180, max: 560 });

  makeResizable(document.getElementById('pr-resizer'), '--pr-pane-w', 'prPaneWidth',
    function (e) {
      var box = document.querySelector('#panel-pulls .graph-split').getBoundingClientRect();
      return e.clientX - box.left;
    }, { min: 280, max: 1200 });

  makeResizable(diffResizer, '--graph-pane-w', 'graphPaneWidth',
    function (e) {
      var box = document.querySelector('.graph-split').getBoundingClientRect();
      return e.clientX - box.left;
    }, { min: 280, max: 1200 });
  applyTheme(readTheme());

  try {
    var savedView = window.localStorage.getItem('issueView');
    if (savedView && viewBtns[savedView]) issueView = savedView;
  } catch (e) { /* 既定の一覧でよい */ }
  setIssueView(issueView);

  applyHints();
  loadFiles(function () { switchTab('docs'); });
})();
</script>
