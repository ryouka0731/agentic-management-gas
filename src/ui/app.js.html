      steps: ['何をしようとしていますか', '例: 使わなくなった改訂版を片付けたい'],
      actual: ['どこまで試しましたか', '例: 「改訂中の版」を見たが、それらしい操作が見つからない'],
      expected: ['補足があれば', ''],
    },
    other: {
      summary: ['ひとことで言うと', ''],
      steps: ['くわしく', ''],
      actual: ['いま分かっていること', ''],
      expected: ['補足があれば', ''],
    },
  };

  /**
   * どこで起きたかを集める。
   *
   * 「動かない」だけでは直せない。人に思い出させるより、そのとき
   * 画面が持っている手がかりを添える。
   *
   * @returns {string}
   */
  function reportContext() {
    var parts = ['画面: ' + currentTab];

    if (current.docPath) parts.push('文書: ' + current.docPath);
    if (current.branch) parts.push('版: ' + current.branch);
    if (currentTab === 'issues') parts.push('見え方: ' + issueView);

    parts.push('画面幅: ' + window.innerWidth + 'x' + window.innerHeight);
    parts.push('環境: ' + window.navigator.userAgent);
    return parts.join(' / ');
  }

  /**
   * 報告を書いてもらう。
   *
   * 白紙の1枚に「詳しく書いてください」と頼んでも、何を書けば直せるのか
   * は伝わらない。順番に尋ねて、こちらで1つの本文に組み立てる。
   *
   * @param {HTMLElement} [sourceEl]
   */
  function createReport(sourceEl) {
    var shots = [];

    var form = openInlineForm(
      '開発者に伝える',
      [
        { name: 'kind', label: '種類', choices: REPORT_KINDS },
        {
          name: 'summary',
          label: 'ひとことで言うと',
          required: true,
          placeholder: '例: 工程表の棒が伸ばせない',
        },
        {
          name: 'steps',
          label: '何をしましたか',
          required: true,
          multiline: true,
          placeholder: '例:\n1. やること → 工程表 を開く\n2. 棒の右端を掴む\n3. 右に引く',
        },
        {
          name: 'actual',
          label: 'どうなりましたか',
          required: true,
          multiline: true,
          placeholder: '例: 棒が伸びず、幅が変わらなかった',
        },
        {
          name: 'expected',
          label: 'どうなってほしかったですか',
          multiline: true,
          placeholder: '例: 期限が右に延びてほしかった',
        },
      ],
      '送る',
      function (v) {
        call('apiInquiryCreate', [v.kind, reportBody(v), reportContext(), shots], function (row) {
          showSnack('受付 #' + row.number + ' として送りました', { kind: 'ok' });
          closeSide();
          loadReports();
        });
      },
      sourceEl
    );

    form.insertBefore(makeShotPicker(shots, form),
      form.querySelector('.inline-form-actions'));

    // 本文の欄では人を呼べるようにする
    var areas = form.querySelectorAll('textarea');
    for (var i = 0; i < areas.length; i++) attachMentionPicker(areas[i]);

    // 種類によって聞くべきことが違う。選び直したら尋ね方も変える
    var kindSel = form.querySelector('select');
    var labels = form.querySelectorAll('label');
    var order = ['summary', 'steps', 'actual', 'expected'];

    function askAs(kind) {
      var asks = REPORT_ASKS[kind] || REPORT_ASKS.bug;

      order.forEach(function (name, at) {
        var label = labels[at + 1];
        if (!label) return;

        var field = label.querySelector('input, textarea');
        label.firstChild.textContent = asks[name][0];
        if (field) field.placeholder = asks[name][1];
      });
    }

    kindSel.addEventListener('change', function () { askAs(kindSel.value); });
    askAs(kindSel.value);

    var note = document.createElement('p');
    note.className = 'row-meta';
    note.textContent = '送ると、見ている画面と使っている環境も一緒に記録され、' +
      '開発者のやることに積まれます。';
    form.insertBefore(note, form.querySelector('.inline-form-actions'));

    form.querySelector('input').focus();
  }

  /**
   * 尋ねた答えを1つの本文に組み立てる。
   *
   * 見出しを揃えておくと、後から読む人が同じ順番で追える。
   *
   * @param {Object<string,string>} v
   * @returns {string}
   */
  function reportBody(v) {
    var parts = [v.summary];

    parts.push('', '【何をしたか】', v.steps);
    parts.push('', '【どうなったか】', v.actual);
    if (String(v.expected || '').replace(/^\s+|\s+$/g, '')) {
      parts.push('', '【どうなってほしかったか】', v.expected);
    }
    return parts.join('\n');
  }

  /**
   * 画像を添える欄を作る。
   *
   * 選ぶだけでなく貼り付けでも入れられるようにする。画面の写真は
   * 撮った直後がいちばん貼りやすい。
   *
   * @param {string[]} shots 入れ物。ここに data URL を貯める
   * @param {HTMLElement} form 貼り付けを拾う相手
   * @returns {HTMLElement}
   */
  function makeShotPicker(shots, form) {
    var MAX = 4;
    var wrap = document.createElement('div');
    wrap.className = 'shot-picker';

    var label = document.createElement('div');
    label.className = 'row-meta';
    label.textContent = '画面の写真 (任意・' + MAX + '枚まで)';
    wrap.appendChild(label);

    var list = document.createElement('div');
    list.className = 'shot-list';
    wrap.appendChild(list);

    var pick = document.createElement('input');
    pick.type = 'file';
    pick.accept = 'image/png,image/jpeg,image/gif,image/webp';
    pick.multiple = true;
    pick.className = 'shot-input';
    pick.setAttribute('aria-label', '画面の写真を選ぶ');
    wrap.appendChild(pick);

    var hint = document.createElement('div');
    hint.className = 'row-meta';
    hint.textContent = 'ここに貼り付け (Ctrl+V) でも入れられます';
    wrap.appendChild(hint);

    function draw() {
      list.textContent = '';

      shots.forEach(function (data, i) {
        var item = document.createElement('div');
        item.className = 'shot-item';

        var img = document.createElement('img');
        img.src = data;
        img.alt = '添えた写真 ' + (i + 1) + '枚目';
        item.appendChild(img);

        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn btn-danger';
        del.appendChild(makeIcon('trash'));
        del.title = 'この写真を外す';
        del.setAttribute('aria-label', del.title);
        del.addEventListener('click', function () {
          shots.splice(i, 1);
          draw();
        });
        item.appendChild(del);

        list.appendChild(item);
      });
    }

    function add(file) {
      if (!file || String(file.type).indexOf('image/') !== 0) return;
      if (shots.length >= MAX) {
        showSnack('写真は' + MAX + '枚までです', { kind: 'ng' });
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        showSnack('写真は1枚5MBまでです', { kind: 'ng' });
        return;
      }

      var reader = new FileReader();
      reader.onload = function () {
        shots.push(String(reader.result));
        draw();
      };
      reader.readAsDataURL(file);
    }

    pick.addEventListener('change', function () {
      for (var i = 0; i < pick.files.length; i++) add(pick.files[i]);
      pick.value = '';
    });

    form.addEventListener('paste', function (e) {
      var items = (e.clipboardData && e.clipboardData.items) || [];
      for (var i = 0; i < items.length; i++) {
        if (String(items[i].type).indexOf('image/') !== 0) continue;
        add(items[i].getAsFile());
        e.preventDefault();
      }
    });

    return wrap;
  }

  /**
   * 画面に出す呼び名を決める。
   *
   * ふだんは名前だけで足りる。同じ名前が2人いるときだけ、どちらか
   * 分かるようにアドレスごと出す。
   *
   * @param {string} email
   * @returns {string}
   */
  function mentionLabel(email) {
    var name = String(email || '').split('@')[0];
    var same = roster.filter(function (one) {
      return String(one).split('@')[0].toLowerCase() === name.toLowerCase();
    });

    return same.length > 1 ? String(email) : name;
  }

  /**
   * 呼び名を名簿の誰かに結び付ける。src/core/Mention.js と同じもの。
   *
   * @param {string} token
   * @returns {string}
   */
  function mentionMatch(token) {
    var want = String(token || '').toLowerCase();
    if (!want) return '';

    for (var i = 0; i < roster.length; i++) {
      var one = String(roster[i] || '');
      var low = one.toLowerCase();

      if (low === want) return one;
      if (want.indexOf('@') < 0 && low.split('@')[0] === want) return one;
    }
    return '';
  }

  /**
   * 呼び出しに色を付けた本文を作る。
   *
   * 画面は textContent だけで組み立てる決まりなので、切り分けてから
   * 節ごとに要素にする。
   *
   * @param {string} text
   * @returns {HTMLElement}
   */
  function makeBodyWithMentions(text) {
    var box = document.createElement('div');
    box.className = 'comment-body';

    var src = String(text || '');
    var re = /@([A-Za-z0-9._%+-]+(?:@[A-Za-z0-9.-]+\.[A-Za-z]{2,})?)/g;
    var at = 0;
    var m;

    while ((m = re.exec(src)) !== null) {
      var who = mentionMatch(m[1]);
      if (!who) continue;

      if (m.index > at) {
        box.appendChild(document.createTextNode(src.substring(at, m.index)));
      }

      var tag = document.createElement('span');
      tag.className = 'mention' + (who === currentUser ? ' me' : '');
      tag.textContent = m[0];
      tag.title = who;
      box.appendChild(tag);

      at = m.index + m[0].length;
    }

    if (at < src.length) box.appendChild(document.createTextNode(src.substring(at)));
    return box;
  }

  /**
   * 「@」を打ったら名簿から選べるようにする。
   *
   * 名簿に無い呼び出しは誰にも届かない。打ち間違いに気づけるよう、
   * 候補を出して選ばせる。
   *
   * @param {HTMLTextAreaElement} input
   */
  function attachMentionPicker(input) {
    var box = document.createElement('div');
    box.className = 'mention-picker';
    box.hidden = true;
    input.parentNode.insertBefore(box, input.nextSibling);

    function close() {
      box.hidden = true;
      box.textContent = '';
    }

    function pick(who, from) {
      var before = input.value.substring(0, from);
      var after = input.value.substring(input.selectionStart);
      var name = mentionLabel(who);

      input.value = before + '@' + name + ' ' + after;
      input.focus();
      input.selectionStart = input.selectionEnd = (before + '@' + name + ' ').length;
      close();
    }

    input.addEventListener('input', function () {
      var upto = input.value.substring(0, input.selectionStart);
      var m = /@([A-Za-z0-9._%+-]*)$/.exec(upto);
      if (!m) return close();

      var want = m[1].toLowerCase();
      var hits = roster.filter(function (one) {
        if (!want) return true;

        // 名前でもアドレスでも探せるようにする。どちらで覚えているかは人による
        return String(one).toLowerCase().indexOf(want) >= 0 ||
          personName(one).toLowerCase().indexOf(want) >= 0;
      }).slice(0, 6);

      if (!hits.length) return close();

      box.textContent = '';
      hits.forEach(function (who) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mention-option';
        btn.appendChild(makeAvatar(who));

        var name = document.createElement('span');
        name.className = 'mention-name';
        name.textContent = personName(who);
        btn.appendChild(name);

        var addr = document.createElement('span');
        addr.className = 'row-meta';
        addr.textContent = who;
        btn.appendChild(addr);

        btn.addEventListener('click', function () {
          pick(who, m.index);
        });
        box.appendChild(btn);
      });
      box.hidden = false;
    });

    input.addEventListener('blur', function () {
      // 候補を押すより先に閉じてしまわないよう、一拍おく
      window.setTimeout(close, 150);
    });
  }

  /**
   * 添えられた写真を並べる。
   *
   * @param {Array<{url:string, thumb:string}>} shots
   * @returns {HTMLElement|null}
   */
  function makeShotStrip(shots) {
    if (!shots || !shots.length) return null;

    var strip = document.createElement('div');
    strip.className = 'shot-list';

    shots.forEach(function (shot, i) {
      var a = document.createElement('a');
      a.className = 'shot-item';
      a.href = shot.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = '大きく見る';

      var img = document.createElement('img');
      img.src = shot.thumb;
      img.alt = '添えられた写真 ' + (i + 1) + '枚目';
      img.loading = 'lazy';
      // 見られないときは代わりに文字の手がかりを出す
      img.addEventListener('error', function () {
        img.remove();
        a.textContent = '写真 ' + (i + 1) + '枚目を開く';
      });
      a.appendChild(img);

      strip.appendChild(a);
    });
    return strip;
  }

  /**
   * 報告を並べる。
   *
   * 全員が全部を読める。同じところでつまずいた人が先に答えを知って
   * いることがあり、自分のぶんしか見えないと誰も助け合えない。
   */
  function loadReports() {
    // 送ったり返したりするたびに取り直すので、先に頼んだぶんの返事で描き直さない
    var still = latest('reports');
    showSkeleton(reportListEl, 'list', 3);

    call('apiInquiryList', [], function (list) {
      if (!still()) return;
      var rows = list || [];
      reportListEl.textContent = '';
      setCount('count-reports', rows.filter(function (r) {
        return r.state === 'open';
      }).length);

      var shown = rows.filter(matchesReport);

      if (rows.length && !shown.length) {
        reportDetail.textContent = '';
        reportListEl.appendChild(makeBlankState(
          '絞り込みに合う報告がありません',
          '絞り込みを消すか、「未解決だけ」を外してみてください。'
        ));
        return;
      }

      if (!rows.length) {
        reportDetail.textContent = '';
        reportListEl.appendChild(makeBlankState(
          'まだ何も伝えていません',
          'うまく動かないこと、こうしてほしいこと、分からないことを送って' +
          'ください。見ている画面と環境も一緒に届き、開発者のやることに積まれます。',
          { label: '開発者に伝える', onClick: createReport }
        ));
        return;
      }

      shown.forEach(function (r) {
        var btn = document.createElement('button');
        // 済んだものは一段沈める。まだ手の要るものを先に拾えるようにする
        btn.className = 'row-item' + (r.state === 'done' ? ' resolved' : '');
        btn.dataset.number = r.number;

        var main = document.createElement('div');
        main.className = 'row-main';

        var title = document.createElement('div');
        title.className = 'row-title';
        title.textContent = '#' + r.number + ' ' + r.title;
        main.appendChild(title);

        var meta = document.createElement('div');
        meta.className = 'row-meta';
        meta.textContent = r.kindLabel + ' · ' + personName(r.by) + ' · ' +
          tokyoDay(r.at) +
          (r.replyCount ? ' · 返信 ' + r.replyCount + '件' : '');
        main.appendChild(meta);

        var open = document.createElement('div');
        open.className = 'row-open';
        open.appendChild(makeIcon(r.state === 'done' ? 'check' : 'inbox'));
        open.appendChild(main);
        btn.appendChild(open);

        var state = document.createElement('span');
        state.className = 'state' + (r.state === 'done' ? ' state-merged' : '');
        state.textContent = r.state === 'done' ? '解決' : '未解決';
        btn.appendChild(state);

        btn.addEventListener('click', function () { openReport(r.number); });
        reportListEl.appendChild(btn);
      });

      // 開いていた話を開き直す。返信するたび先頭に戻ると読み進められない
      var keep = reportShown &&
        shown.filter(function (r) { return r.number === reportShown; })[0];
      openReport(keep ? keep.number : (shown[0] && shown[0].number));
    }, still.only(failInto(reportListEl)));
  }

  /**
   * 絞り込みに残すかを決める。
   *
   * @param {object} r
   * @returns {boolean}
   */
  function matchesReport(r) {
    if (reportOpenOnly && r.state === 'done') return false;

    var q = String(reportFilterEl.value || '').toLowerCase()
      .replace(/^\s+|\s+$/g, '');
    if (!q) return true;

    return ['#' + r.number, r.title, r.body, r.kindLabel, r.by]
      .join(' ').toLowerCase().indexOf(q) >= 0;
  }

  /**
   * 話を開く。
   *
   * @param {number} number
   */
  function openReport(number) {
    reportShown = number || null;
    // 続けて開いたとき・閉じたとき、前の話の返事で中身を上書きしない
    var still = latest('reportThread');

    var items = reportListEl.querySelectorAll('.row-item');
    for (var i = 0; i < items.length; i++) {
      items[i].setAttribute('aria-current',
        String(Number(items[i].dataset.number) === Number(number)));
    }

    if (!number) {
      reportDetail.textContent = '';
      return;
    }
    showSkeleton(reportDetail, 'block');

    call('apiInquiryThread', [number], function (thread) {
      if (!still() || !thread) return;
      renderReportThread(thread.inquiry, thread.replies || []);
    }, still.only(failInto(reportDetail)));
  }

  /**
   * 話の中身を描く。
   *
   * @param {object} q
   * @param {object[]} replies
   */
  function renderReportThread(q, replies) {
    reportDetail.textContent = '';

    var head = document.createElement('div');
    head.className = 'pr-title';
    head.textContent = '#' + q.number + ' ' + q.title;
    reportDetail.appendChild(head);

    var meta = document.createElement('div');
    meta.className = 'row-meta';
    meta.textContent = q.kindLabel + ' · ' + personName(q.by) + ' · ' +
      tokyoDay(q.at) +
      (q.state === 'done'
        ? ' · 解決' + (q.closedBy ? ' (' + personName(q.closedBy) + ')' : '') : '');
    reportDetail.appendChild(meta);

    if (q.issueNumber) {
      var link = document.createElement('button');
      link.className = 'rel-chip';
      link.appendChild(makeIcon('corner-down-right'));
      link.appendChild(document.createTextNode('やること #' + q.issueNumber));
      attachHint(link, 'この報告から作られた、開発者のやることに移ります');

      link.addEventListener('click', function () {
        switchTab('issues');
        setIssueView('list');
        focusIssue(q.issueNumber);
      });
      reportDetail.appendChild(link);
    }

    if (q.canClose) {
      var actions = document.createElement('div');
      actions.className = 'pr-actions';

      var toggle = document.createElement('button');
      toggle.className = 'btn' + (q.state === 'done' ? '' : ' btn-primary');
      toggle.appendChild(makeIcon(q.state === 'done' ? 'back' : 'check'));
      toggle.appendChild(document.createTextNode(
        q.state === 'done' ? 'まだ解決していない' : '解決した'));

      toggle.addEventListener('click', function () {
        toggle.disabled = true;
        // call() を通す。横断検索の一覧が、解決・取り消しを知る
        call(q.state === 'done' ? 'apiInquiryReopen' : 'apiInquiryClose', [q.number],
          function () { loadReports(); }, failEnable(toggle));
      });

      actions.appendChild(toggle);
      reportDetail.appendChild(actions);
    }

    var first = document.createElement('div');
    first.className = 'comment';
    first.appendChild(makeCommentHead(q.by, 'が報告'));

    first.appendChild(makeBodyWithMentions(q.body));

    var firstShots = makeShotStrip(q.shots);
    if (firstShots) first.appendChild(firstShots);

    if (q.context) {
      var ctx = document.createElement('details');
      ctx.className = 'report-context';

      var sum = document.createElement('summary');
      sum.textContent = 'そのときの状況';
      ctx.appendChild(sum);

      var pre = document.createElement('div');
      pre.className = 'comment-body';
      pre.textContent = q.context;
      ctx.appendChild(pre);
      first.appendChild(ctx);
    }
    reportDetail.appendChild(first);

    replies.forEach(function (r) {
      var el = document.createElement('div');
      el.className = 'comment';

      var h = makeCommentHead(r.by, tokyoDay(r.at) +
        (r.editedAt ? ' · 直しました' : ''));
      if (r.canEdit) h.appendChild(makeReplyTools(r, el));
      el.appendChild(h);

      el.appendChild(makeBodyWithMentions(r.body));

      var replyShots = makeShotStrip(r.shots);
      if (replyShots) el.appendChild(replyShots);

      reportDetail.appendChild(el);
    });

    reportDetail.appendChild(makeReplyForm(q));
  }

  /**
   * 自分の返信を直す / 消す。
   *
   * @param {object} reply
   * @param {HTMLElement} host
   * @returns {HTMLElement}
   */
  function makeReplyTools(reply, host) {
    var tools = document.createElement('span');
    tools.className = 'comment-tools';

    var edit = document.createElement('button');
    edit.className = 'icon-btn';
    edit.appendChild(makeIcon('pencil'));
    edit.title = 'この返信を直す';
    edit.setAttribute('aria-label', edit.title);
    edit.addEventListener('click', function () {
      var form = openInlineForm(
        '返信を直す',
        [{ name: 'body', label: '中身', required: true, multiline: true }],
        '直す',
        function (v) {
          call('apiInquiryReplyEdit', [reply.id, v.body], function () {
            showSnack('返信を直しました', { kind: 'ok' });
            closeSide();
            openReport(reply.inquiryNumber);
          });
        },
        host
      );
      form.querySelector('textarea').value = reply.body || '';
    });
    tools.appendChild(edit);

    var del = document.createElement('button');
    del.className = 'btn btn-danger';
    del.appendChild(makeIcon('trash'));
    del.title = 'この返信を消す';
    del.setAttribute('aria-label', del.title);
    del.addEventListener('click', function () {
      openConfirmStrip(reportDetail,
        'この返信を消します。元には戻せません。',
        '消す',
        function () {
          call('apiInquiryReplyDelete', [reply.id], function (msg) {
            showSnack(msg, { kind: 'ok' });
            openReport(reply.inquiryNumber);
          });
        });
    });
    tools.appendChild(del);
    return tools;
  }

  /**
   * 返信を書く欄。
   *
   * @param {object} q
   * @returns {HTMLElement}
   */
  function makeReplyForm(q) {
    var shots = [];
    var form = document.createElement('div');
    form.className = 'comment-form';

    var input = document.createElement('textarea');
    input.placeholder =
      '同じことが起きた、こうしたら直った、など (@ で人を呼べます)';
    form.appendChild(input);
    attachMentionPicker(input);

    form.appendChild(makeShotPicker(shots, form));

    var send = document.createElement('button');
    send.className = 'btn btn-primary';
    send.textContent = '返信する';
    send.addEventListener('click', function () {
      if (!input.value) return;
      send.disabled = true;

      call('apiInquiryReply', [q.number, input.value, shots], function () {
        showSnack('返信しました', { kind: 'ok' });
        openReport(q.number);
      }, failEnable(send));
    });

    form.appendChild(send);
    return form;
  }

  // ===== Google ToDo との同期 (オプション) =====

  var tasksState = { available: false, listId: '', lists: [] };

  /**
   * 使える環境かを見て、使えるときだけ入口を出す。
   *
   * 拡張サービスを足していない環境で押せるボタンを出しても、押した先で
   * 断られるだけになる。
   */
  function loadTasksState() {
    call('apiTasksState', [], function (res) {
      tasksState = res || { available: false, listId: '', lists: [] };
      var btn = document.getElementById('tasks-btn');

      btn.hidden = !tasksState.available;
      btn.title = tasksState.listId
        ? '自分の担当を Google ToDo と同期します'
        : '入れ先の ToDo リストを選びます';
    }, failQuiet('使えないだけ'));
  }

  /**
   * 同期の入口。入れ先が決まっていなければ先に選んでもらう。
   *
   * @param {HTMLElement} sourceEl
   */
  function openTasks(sourceEl) {
    if (!tasksState.listId) return chooseTasksList(sourceEl);

    var btn = document.getElementById('tasks-btn');
    btn.disabled = true;

    call('apiTasksSync', [], function (res) {
      btn.disabled = false;
      var msg = (res.pushed || 0) + '件を ToDo に送りました';
      if (res.closed) msg += ' / ' + res.closed + '件を完了にしました';

      showSnack(msg, { kind: 'ok' });
      refreshIssueViews();
    }, failEnable(btn));
  }

  /**
   * 入れ先の ToDo リストを選ばせる。
   *
   * @param {HTMLElement} sourceEl
   */
  function chooseTasksList(sourceEl) {
    var choices = (tasksState.lists || []).map(function (one) {
      return [one.id, one.title];
    });

    if (!choices.length) {
      showSnack('ToDo リストが見つかりません', { kind: 'ng' });
      return;
    }

    var form = openInlineForm(
      'Google ToDo と同期する',
      [{ name: 'listId', label: '入れ先のリスト', choices: choices }],
      '決める',
      function (v) {
        call('apiTasksChooseList', [v.listId], function (id) {
          tasksState.listId = id;
          showSnack('入れ先を決めました。もう一度押すと同期します',
            { kind: 'ok' });
          loadTasksState();
        });
      },
      sourceEl
    );

    var note = document.createElement('p');
    note.className = 'row-meta';
    note.textContent =
      '自分が担当で、まだ終わっていないやることだけを送ります。' +
      'ToDo 側で完了にすると、こちらも完了になります。';
    form.insertBefore(note, form.querySelector('.inline-form-actions'));
  }

  // ===== 文書を登録する =====

  /**
   * 正式版の入れ物にある文書を、画面から登録させる。
   *
   * ファイルの id を調べてスクリプトプロパティに書く、という手順は、
   * この道具を使う人の仕事ではない。入れ物を覗いて、見つかったものを
   * 選ばせる。
   *
   * @param {HTMLElement} [sourceEl]
   */
  function addDocs(sourceEl) {
    var box = openSideView('文書を登録する', sourceEl, null);

    var lead = document.createElement('p');
    lead.className = 'row-meta';
    lead.textContent = '正式版の入れ物 (main) を見ています…';
    box.appendChild(lead);

    call('apiFoundFiles', [],
      function (list) { draw(list || []); },
      failInto(lead));

    function draw(found) {
      box.textContent = '';

      if (!found.length) {
        box.appendChild(makeBlankState(
          '登録できる文書が見つかりません',
          'Google ドライブで、この道具の「main」フォルダに文書を入れてから、' +
          'もう一度開いてください。'
        ));
        addFolderLink(box);
        return;
      }

      var head = document.createElement('p');
      head.className = 'row-meta';
      head.textContent = '入れ物の中にある、まだ登録していない文書です。' +
        '管理したいものを選んでください。';
      box.appendChild(head);

      var list = document.createElement('div');
      list.className = 'bulk-list';
      var checks = [];

      found.forEach(function (one) {
        var row = document.createElement('label');
        row.className = 'bulk-row';

        var check = document.createElement('input');
        check.type = 'checkbox';
        check.value = one.fileId;
        check.checked = one.ok;
        check.disabled = !one.ok;
        checks.push(check);
        row.appendChild(check);

        row.appendChild(makeIcon(one.ok ? 'file-text' : 'help-circle'));

        var name = document.createElement('span');
        name.textContent = one.name;
        row.appendChild(name);

        if (!one.ok) {
          var why = document.createElement('span');
          why.className = 'row-meta';
          why.textContent = one.why;
          row.appendChild(why);
        }
        list.appendChild(row);
      });
      box.appendChild(list);

      var go = document.createElement('button');
      go.className = 'btn btn-primary';
      go.textContent = '登録する';
      go.addEventListener('click', function () {
        var ids = checks.filter(function (c) { return c.checked; })
          .map(function (c) { return c.value; });

        if (!ids.length) {
          showSnack('登録するものが選ばれていません', { kind: 'ng' });
          return;
        }
        go.disabled = true;

        call('apiRegisterFiles', [ids], function (res) {
          go.disabled = false;
          var text = res.added.length + '件を登録しました';

          if (res.failed.length) {
            text += ' / ' + res.failed.length + '件できませんでした';
          }
          showSnack(text, { kind: res.failed.length ? 'ng' : 'ok' });

          closeSide();
          loadFiles(function () { switchTab('docs'); });
        }, failEnable(go));
      });
      box.appendChild(go);

      addFolderLink(box);
    }

    function addFolderLink(host) {
      call('apiMainFolderUrl', [], function (url) {
        if (!url) return;

        var link = document.createElement('a');
        link.className = 'btn';
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = '入れ物を Drive で開く';
        host.appendChild(link);
      }, failQuiet('開く口が無いだけ'));
    }
  }

  // ===== 自分まわり =====

  /**
   * 自分まわりの操作を作る。
   *
   * 名前を決める・道具を落とす・案内を出し直すは、読み物ではなく操作で
   * ある。使い方の頁の底に置くと、困ったときにしか開かれない場所に
   * 埋もれる。上の帯からいつでも開ける形にする。
   *
   * @returns {HTMLElement[]}
   */
  /**
   * 道具を落とすボタンを作る。
   *
   * はじめの案内と、自分まわりの両方から同じものを出す。2つ書くと
   * 片方だけ直って食い違う。
   *
   * @param {string} [label]
   * @returns {HTMLElement}
   */
  function makeKitButton(label) {
    var kit = document.createElement('button');
    kit.className = 'btn btn-primary';
    kit.appendChild(makeIcon('save'));
    kit.appendChild(document.createTextNode(label || '手元から動かす道具を落とす'));
    if (kitOutdated) kit.appendChild(makePill('更新あり', 'stale-badge'));
    attachHint(kit,
      '画面を開かずに、やること・改訂版・確認依頼を作れる小さな道具です。' +
      'Claude や Codex に読ませる説明も入っています');

    kit.addEventListener('click', function () {
      kit.disabled = true;

      call('apiAgentKit', [], function (res) {
        kit.disabled = false;
        if (!res) return;

        // 落とす先は Drive。画面から直に流すと、大きさの上限に当たる
        window.open(res.url, '_blank');
        showSnack(res.name + ' を落としています', { kind: 'ok' });
        openKitSteps(res);
        // 落とし直した道具は最新。点と札を消す (サーバ側も apiAgentKit で覚え直している)
        if (kitOutdated) {
          kitOutdated = false;
          drawMe();
        }
      }, failEnable(kit));
    });
    return kit;
  }

  function makeMeActions() {
    var out = [];
    out.push(makeKitButton());

    var rename = document.createElement('button');
    rename.className = 'btn';
    rename.appendChild(makeIcon('user'));
    rename.appendChild(document.createTextNode('表示する名前を決める'));
    attachHint(rename,
      'ほかの人の画面にも、この名前で出ます。決めないとアドレスの手前が使われます');

    rename.addEventListener('click', function () {
      closeMe();

      var form = openInlineForm(
        '表示する名前',
        [{ name: 'name', label: '名前', required: true }],
        '決める',
        function (v) {

            peopleNames[currentUser] = row.name;

            closeSide();
            drawMe();
          });

      );

    });
    out.push(rename);

    var again = document.createElement('button');
    again.className = 'btn';
    again.appendChild(makeIcon('help-circle'));
    again.appendChild(document.createTextNode('はじめの案内をもう一度出す'));

    again.addEventListener('click', function () {
      closeMe();
      setGuideline(true);
      switchTab('home');
      showSnack('ホームに案内を出しました', { kind: 'ok' });
    });
    out.push(again);
    out.push(makeProgressToggle());
    // ゲームがオンのときだけ、参加の切り替えを出す。設定でオフと分かっていれば
    // 尋ねない (設定より先に描かれるときは settings がまだ無い)。切り替えは隠して
    // 並びに直に置き、返事で出す (包む箱に入れると、並びのボタンと幅が揃わない)
    if (!settings || settings.gameEnabled !== false) {
      var join = makeGameJoinToggle({ playing: false });
      join.hidden = true;
      out.push(join);
      call('apiGameState', [], function (state) {
        if (!state || !state.enabled) return;
        setToggle(join, !!state.playing);
        join.hidden = false;
      }, failQuiet('参加の切り替えが出なくても使える'));
    }

    return out;
  }

  /**

  /**
   * 写して貼れる一行を作る。
   *
   * 目で読んで打ち直させると、必ずどこかで間違える。
   *
   * @param {string} label
   * @param {string} value
   * @returns {HTMLElement}
   */
  function makeCopyRow(label, value) {
    var wrap = document.createElement('div');
    wrap.className = 'copy-row';

    var name = document.createElement('div');
    name.className = 'row-meta';
    name.textContent = label;
    wrap.appendChild(name);

    var line = document.createElement('div');
    line.className = 'copy-line';

    var text = document.createElement('code');
    text.textContent = value;
    line.appendChild(text);

    var btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '写す';
    btn.addEventListener('click', function () {
      var area = document.createElement('textarea');
      area.value = value;
      document.body.appendChild(area);
      area.select();

      // execCommand は断られても例外にならず false を返す。true のときだけ写せた
      var ok = false;
      try {
        ok = document.execCommand('copy') === true;
      } catch (e) {
        ok = false;
      }
      area.remove();
      if (ok) {
        showSnack('写しました', { kind: 'ok' });
        return;
      }
      // 字を選んだままにして、手で写せるようにする
      var range = document.createRange();
      range.selectNodeContents(text);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      showSnack('写せませんでした。選んだ字を手で写してください', { kind: 'ng' });
    });
    line.appendChild(btn);

    wrap.appendChild(line);
    return wrap;
  }

  function closeMe() {
    mePanel.hidden = true;
    meBtn.setAttribute('aria-expanded', 'false');
  }

  /**
   * 自分まわりの中身を描く。
   */
  function drawMe() {

    meBtn.appendChild(makeAvatar(currentUser));
    if (kitOutdated) {
      var dot = document.createElement('span');

  // ===== 使われ方の記録 =====

  /**
   * 溜めておく数。押すたびに送るとスプレッドシートが持たない。
   */
  var usageBuffer = {};

  /**
   * 場所の名前を決める。
   *
   * 名前を付けていないものは数えない。無名のものまで拾うと、作りかけの
   * 画面から知らない名前が大量に流れ込む。
   *
   * @param {EventTarget} target
   * @returns {string} 数えないなら空文字
   */
  function usageTargetOf(target) {
    var el = target;

    while (el && el !== document) {
      // 使い方の見出しは押す物ではない。数えると、節を開いた数 (guide-<id>) と紛れる
      if (el.dataset && el.dataset.guideHead) return '';
      if (el.id && /^[A-Za-z0-9:_-]{1,60}$/.test(el.id)) return el.id;

      if (el.dataset && el.dataset.tab) return 'tab-' + el.dataset.tab;
      if (el.dataset && el.dataset.track) return el.dataset.track;

      // 一覧の行やカードは、1つずつではなく種類でまとめて数える
      if (el.classList) {
        if (el.classList.contains('row-open')) return 'row-open';
        if (el.classList.contains('board-card')) return 'board-card';
        if (el.classList.contains('gantt-bar')) return 'gantt-bar';
        if (el.classList.contains('doc-open')) return 'doc-open';
        if (el.classList.contains('commit-item')) return 'commit-item';
        if (el.classList.contains('rel-chip')) return 'rel-chip';
      }
      el = el.parentNode;
    }
    return '';
  }

  /**
   * 1つ数える。
   *
   * @param {string} kind 'view' | 'action'
   * @param {string} target
   */
  function usageCount(kind, target) {
    if (!target) return;
    // チームか本人が止めていれば数えない (サーバでも断るが、送ること自体をやめる)
    if (!prefUsageOn()) return;

    var key = kind + '\t' + target;
    usageBuffer[key] = (usageBuffer[key] || 0) + 1;
  }

  /**
   * 溜めたぶんを送る。
   */
  function usageFlush() {
    var rows = [];

    for (var key in usageBuffer) {
      if (!Object.prototype.hasOwnProperty.call(usageBuffer, key)) continue;

      var parts = key.split('\t');
      rows.push({ kind: parts[0], target: parts[1], count: usageBuffer[key] });
    }
    if (!rows.length) return;

    usageBuffer = {};
    call('apiUsageRecord', [rows], function () {}, failQuiet('数えられなくても操作はできる'));
  }

  // ===== 使われ方のボード =====

  var USAGE_SPANS = [['7', '直近7日'], ['30', '直近30日'], ['90', '直近90日']];

  /**
   * 場所の名前を、人が読める言葉にする。
   *
   * @param {string} target
   * @returns {string}
   */
  function usageLabel(target) {
    var known = {
      'row-open': 'やること・報告の行を開く',
      'board-card': '進捗ボードのカード',
      'gantt-bar': '工程表の棒',
      'doc-open': '文書を開く',
      'commit-item': '履歴の記録',
      'rel-chip': '親子への行き先',
      'issue-create-btn': 'やることを作る',
      'report-btn': '開発者に伝える',
      'commit-btn': '変更を記録',
      'bulk-commit-btn': 'まとめて記録',
      'branch-create-btn': '改訂版を作る',
      'draft-create-btn': 'この文書の改訂版を作る',
      'bell-btn': '知らせ',
      'theme-btn': '画面の明るさ',
      'side-edit': '直す (鉛筆)',
      'mine-btn': '自分の担当だけ',
      'tasks-btn': 'Google ToDo と同期',
    };

    if (known[target]) return known[target];

    // 使い方の節。場所の名前は英数の id なので、見出しに直す
    var guide = /^guide-(.+)$/.exec(target);
    if (guide) {
      var section = GUIDE.filter(function (g) { return g.id === guide[1]; })[0];
      if (section) return '使い方: ' + section.title;
    }

    var tab = /^tab-(.+)$/.exec(target);
    if (tab) {
      var names = {
        docs: '文書', issues: 'やること', branches: '改訂中の版',
        pulls: '確認依頼', help: '使い方', report: '要望・不具合',
        usage: '使われ方', content: '本文', history: '改訂の履歴',
        drafts: 'この文書の改訂版',
      };
      return names[tab[1]] || tab[1];
    }
    return target;
  }

  /**
   * 使われ方を描く。
   *
   * どこが使われていないかを見るためのもの。場所ごとの合計は誰が見ても
   * 全員ぶん。人ごとの数と絞り込みは、本人と部下のぶんだけ届く
   * (サーバ側の apiUsageSummary が絞る。工数の集計と同じ)。
   */
  /**
   * 期間か対象を選び直すたびに頼み直す。届いた返事が最後のぶんでなければ捨てる。
   * 捨てないと、選び直したあとに前の期間のまとめや CSV が出る。
   */
  function loadUsage() {
    var still = latest('usage');
    fillSelect(usageDaysSel, USAGE_SPANS, '30');

    // いま溜めているぶんも含めて見たい
    usageFlush();
    showSkeleton(usageEl, 'list', 4);

    call('apiUsageSummary', [Number(usageDaysSel.value) || 30, usageWhoSel.value], function (res) {
      if (!still()) return;
      var data = res || { total: 0, byTarget: [], byDay: [], byUser: [] };
      fillUsageWho(data.byUser || []);
      usageEl.textContent = '';

      if (!data.total && !(data.byUser || []).length) {
        usageEl.appendChild(makeBlankState(
          'まだ記録がありません',
          'しばらく使うと、どこがよく押されているかがここに出ます。'
        ));
        return;
      }

      // 前の期間を持たない返事 (古い版のサーバ) でも描けるようにする
      var prev = data.prev || { total: 0, byTarget: [] };
      var before = {};
      (prev.byTarget || []).forEach(function (t) { before[t.kind + ':' + t.target] = t.count; });
      var views = data.byTarget.filter(function (t) { return t.kind === 'view'; });

      usageEl.appendChild(makeUsageSummary(data, prev.total || 0));
      usageEl.appendChild(makeUsagePeople(data.byUser || []));
      usageEl.appendChild(makeUsageRanking('よく押されている操作',
        data.byTarget.filter(function (t) { return t.kind === 'action'; }), before));
      usageEl.appendChild(makeUsageRanking('よく開かれている画面', views, before));
      usageEl.appendChild(makeUsageUnseen(views));
      usageEl.appendChild(makeUsageWeekdays(data.byWeekday || [0, 0, 0, 0, 0, 0, 0]));
      usageEl.appendChild(makeUsageDays(data.byDay));
    }, function (err) {
      if (still()) failInto(usageEl)(err);
    });
  }

  /**
   * 誰のぶんを見るかの選択肢を、記録に出てきた人から詰める。
   *
   * @param {object[]} people
   */
  function fillUsageWho(people) {
    var want = usageWhoSel.value;
    usageWhoSel.textContent = '';

    var pairs = [['', 'みんなの合計']];
    people.forEach(function (one) {
      pairs.push([one.who, personName(one.who) || '(不明)']);
    });

    pairs.forEach(function (pair) {
      var opt = document.createElement('option');
      opt.value = pair[0];
      opt.textContent = pair[1];
      usageWhoSel.appendChild(opt);
    });
    usageWhoSel.value = want;
  }

  /**
   * よく使っている人を多い順に並べる。
   *
   * 押すとその人のぶんに絞る。誰が使っているかを見てから、その人が
   * どこを使っているかに進める
   *
   * @param {object[]} people
   * @returns {HTMLElement}
   */
  function makeUsagePeople(people) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-block';

    var head = document.createElement('h3');
    head.textContent = 'よく使っている人';
    wrap.appendChild(head);

    if (!people.length) {
      var none = document.createElement('div');
      none.className = 'row-meta';
      none.textContent = 'まだ記録がありません';
      wrap.appendChild(none);
      return wrap;
    }

    var top = people[0].count || 1;
    var list = document.createElement('div');
    list.className = 'usage-list';

    people.slice(0, 15).forEach(function (row, at) {
      var line = document.createElement('button');
      line.className = 'usage-row usage-person';
      line.setAttribute('aria-label', personName(row.who) + ' のぶんだけを見る');
      attachHint(line, 'この人が使っているところだけを見ます');

      line.addEventListener('click', function () {
        usageWhoSel.value = row.who;
        loadUsage();
      });

      var rank = document.createElement('span');
      rank.className = 'usage-rank';
      rank.textContent = (at + 1);
      line.appendChild(rank);

      var name = document.createElement('span');
      name.className = 'usage-name';
      name.appendChild(makeAvatar(row.who));
      name.appendChild(document.createTextNode(personName(row.who) || '(不明)'));
      line.appendChild(name);

      var track = document.createElement('span');
      track.className = 'usage-track';

      var bar = document.createElement('span');
      bar.className = 'usage-bar';
      bar.style.width = Math.max(2, Math.round(row.count / top * 100)) + '%';
      track.appendChild(bar);
      line.appendChild(track);

      var count = document.createElement('span');
      count.className = 'usage-count';
      count.textContent = row.count;
      line.appendChild(count);

      list.appendChild(line);
    });

    wrap.appendChild(list);
    return wrap;
  }

  /**
   * 前の期間からの増減を、矢印と割合の字にする。
   *
   * 前の期間が0だと割合が決まらない (0で割る)。そのときは数を出さずにそう言う。
   *
   * @param {number} now
   * @param {number} before
   * @returns {string}
   */
  function usageTrend(now, before) {
    if (!before) return '前の期間は記録なし';
    var pct = Math.round((now - before) / before * 100);
    var arrow = pct > 0 ? '↑' : (pct < 0 ? '↓' : '→');
    return arrow + ' ' + Math.abs(pct) + '%';
  }

  /**
   * 前の期間との差を、符号の付いた字にする。
   *
   * @param {number} diff
   * @returns {string}
   */
  function usageDiff(diff) {
    if (diff > 0) return '+' + diff;
    if (diff < 0) return '−' + Math.abs(diff);
    return '±0';
  }

  /**
   * 開いた画面の名前。左の行き先に書いてある字を使う。
   *
   * 画面を開いたときは data-tab の名前 (issues など) のまま数えている。
   * usageLabel は tab- の付いた名前しか直さないため、そのままだと英字が出る。
   *
   * @param {string} target
   * @returns {string}
   */
  function usageViewName(target) {
    var nav = sidebarEl && sidebarEl.querySelector(
      '.nav-item[data-tab="' + String(target).replace(/["\\]/g, '') + '"] .nav-label');
    if (nav && nav.textContent) return nav.textContent;

    var tab = usageLabel('tab-' + target);
    return tab !== target ? tab : usageLabel(target);
  }

  /**
   * @param {object} data
   * @param {number} prevTotal 前の期間の回数
   * @returns {HTMLElement}
   */
  function makeUsageSummary(data, prevTotal) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-summary';

    [['数えた回数', data.total + '回', usageTrend(data.total, prevTotal)],
     ['数えた場所', data.byTarget.length + 'か所'],
     ['対象', data.who ? personName(data.who) : 'みんな'],
     ['期間', data.from + ' 〜 ' + data.to]].forEach(function (pair) {
      var box = document.createElement('div');
      box.className = 'tally-card';

      var label = document.createElement('div');
      label.className = 'row-meta';
      label.textContent = pair[0];
      box.appendChild(label);

      var value = document.createElement('div');
      value.className = 'tally-value';
      value.textContent = pair[1];
      box.appendChild(value);

      if (pair[2]) {
        var trend = document.createElement('div');
        trend.className = 'row-meta usage-delta';
        trend.textContent = pair[2];
        attachHint(trend, prevTotal
          ? '同じ長さの前の期間 (' + prevTotal + '回) と比べて'
          : '同じ長さの前の期間には記録がありません');
        box.appendChild(trend);
      }

      wrap.appendChild(box);
    });
    return wrap;
  }

  /**
   * 多い順に棒で並べる。
   *
   * 数字だけを並べても、どれが飛び抜けているのかは読み取れない。
   *
   * @param {string} title
   * @param {object[]} rows
   * @param {Object<string, number>} [before] 前の期間の数 (kind:target ごと)
   * @returns {HTMLElement}
   */
  function makeUsageRanking(title, rows, before) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-block';

    var head = document.createElement('h3');
    head.textContent = title;
    wrap.appendChild(head);

    if (!rows.length) {
      var none = document.createElement('div');
      none.className = 'row-meta';
      none.textContent = 'まだ記録がありません';
      wrap.appendChild(none);
      return wrap;
    }

    var top = rows[0].count || 1;
    var list = document.createElement('div');
    list.className = 'usage-list';

    rows.slice(0, 15).forEach(function (row) {
      var line = document.createElement('div');
      line.className = 'usage-row';

      var name = document.createElement('span');
      name.className = 'usage-name';
      name.textContent = row.kind === 'view' ? usageViewName(row.target) : usageLabel(row.target);
      attachHint(name, row.target);
      line.appendChild(name);

      var track = document.createElement('span');
      track.className = 'usage-track';

      var bar = document.createElement('span');
      bar.className = 'usage-bar';
      bar.style.width = Math.max(2, Math.round(row.count / top * 100)) + '%';
      track.appendChild(bar);
      line.appendChild(track);

      var count = document.createElement('span');
      count.className = 'usage-count';
      count.textContent = row.count;
      line.appendChild(count);

      if (before) {
        var was = before[row.kind + ':' + row.target] || 0;
        var delta = document.createElement('span');
        delta.className = 'usage-delta';
        delta.textContent = usageDiff(row.count - was);
        attachHint(delta, '前の期間は' + was + '回');
        line.appendChild(delta);
      }

      list.appendChild(line);
    });

    wrap.appendChild(list);
    return wrap;
  }

  /**
   * この期間に一度も開かれなかった画面を並べる。
   *
   * 行き先の一覧は左の帯から取る (画面が持っている一覧)。サーバに写しを
   * 持つと、画面を足したときに数え漏れる。スクラムがオフのあいだは
   * スプリントと障害物が出ないので、開かれなくて当然であり、数えない。
   *
   * @param {object[]} views この期間に開かれた画面 (kind: 'view')
   * @returns {HTMLElement}
   */
  function makeUsageUnseen(views) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-block';

    var head = document.createElement('h3');
    head.textContent = 'この期間に開かれなかった画面';
    wrap.appendChild(head);

    var seen = {};
    views.forEach(function (v) { if (v.count > 0) seen[v.target] = true; });

    var items = sidebarEl ? sidebarEl.querySelectorAll('.nav-item[data-tab]') : [];
    var missing = [];
    for (var i = 0; i < items.length; i++) {

      if (seen[tab]) continue;
      missing.push(usageViewName(tab));

    if (!missing.length) {
      var none = document.createElement('div');
      none.className = 'row-meta';
      none.textContent = 'どの画面も開かれていました';

      return wrap;

  /**
   * CSV の1つのセル。
   *
   * 表計算は = + - @ で始まる字を式として読む (式の差し込み)。先頭に ' を
   * 付けて字のまま読ませる。区切りや改行を含むものは " で囲む。
   *
   * @param {*} v
   * @returns {string}
   */
  function usageCsvCell(v) {
    var s = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  /**
   * 日・場所・人ごとの数を CSV の字にする。
   *
   * 先頭に BOM を付ける。付けないと Excel が日本語を化けさせる。
   *
   * @param {object[]} rows apiUsageRows の rows
   * @returns {string}
   */
  function usageCsv(rows) {
    var lines = [['日', '種類', '場所', '名前', '人', '回数']];
    rows.forEach(function (r) {
      lines.push([
        r.day, r.kind === 'view' ? '画面' : '操作', r.target,
        r.kind === 'view' ? usageViewName(r.target) : usageLabel(r.target),
        r.user, r.count,
      ]);
    });
    return '\uFEFF' + lines.map(function (line) {
      return line.map(usageCsvCell).join(',');
    }).join('\r\n') + '\r\n';
  }

  /**
   * ファイルとして落とす。落とせたかは分からないことがある。
   *
   * Apps Script の枠の中では、保存を断られても例外にならず黙って何も
   * 起きないことがある。そのため落とせたと思っても字は画面に出しておく。
   *
   * @param {string} name
   * @param {string} text
   * @returns {boolean} 落とそうとできたか
   */
  function usageDownload(name, text) {
    try {
      if (!window.Blob || !window.URL || typeof window.URL.createObjectURL !== 'function') {
        return false;
      }
      var url = window.URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.hidden = true;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () {
        try { window.URL.revokeObjectURL(url); } catch (e) { /* 消せなくても困らない */ }
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /**
   * 今見ている期間と対象の数を CSV で保存する。
   *
   * サーバは本人と部下のぶんだけを返す (apiUsageRows)。
   */
  function saveUsageCsv() {
    var still = latestSoFar('usage');
    usageCsvBtn.disabled = true;
    call('apiUsageRows', [Number(usageDaysSel.value) || 30, usageWhoSel.value], function (res) {
      usageCsvBtn.disabled = false;
      // 頼んだあとに期間か対象を選び直していたら、今見ている範囲の CSV ではない
      if (!still()) return;
      var data = res || { from: '', to: '', rows: [] };
      var text = usageCsv(data.rows || []);
      var saved = usageDownload('usage-' + data.from + '_' + data.to + '.csv', text);

      var old = usageEl.querySelector('.usage-export');
      if (old) old.remove();

      var wrap = document.createElement('div');
      wrap.className = 'tally-block usage-export';
      var note = document.createElement('div');
      note.className = 'row-meta';
      note.textContent = '見られない人のぶんは入っていません (画面の合計とは合わないことがあります)';
      wrap.appendChild(note);

      usageEl.insertBefore(wrap, usageEl.firstChild);

  /**

   * 求められない。使えないときは画面の中の知らせだけで済ませる。
   *
   * @returns {string} 'granted' | 'denied' | 'default' | 'unavailable'
   */
  function desktopState() {
    try {

      return window.Notification.permission;

  }

  function renderDesktopButton() {

      unavailable: 'この環境ではデスクトップ通知を出せません。ここの一覧で見てください',
      'default': '',
    }[state] || '';

  /**
   * デスクトップに出す。出せなければ何もしない。

  function popDesktop(notice) {

    try {

  /**
   * 知らせを取ってくる。

   * @param {boolean} [quiet] 初回は前からあるぶんで驚かせない
   */
  function loadNotices(quiet) {
    // 1分ごとと開いたときの両方で取るので、前に頼んだぶんの返事で読んだ印を戻さない
    var still = latest('notices');
    call('apiNotifications', [30], function (res) {
      if (!still()) return;
      var data = res || { items: [], unread: 0 };
      renderNotices(data.items);

      bellCount.textContent = data.unread;
      bellCount.hidden = !data.unread;
      bellBtn.title = data.unread
        ? '知らせが' + data.unread + '件あります' : '知らせ';
      bellBtn.setAttribute('aria-label', bellBtn.title);

      // 前に見た番号より新しく、まだ読んでいないものだけを前に出す
      var fresh = data.items.filter(function (n) {
        return !n.read && n.id > seenNoticeId;
      });

      data.items.forEach(function (n) {
        if (n.id > seenNoticeId) seenNoticeId = n.id;
      });

      if (quiet || !fresh.length) return;

      showSnack(fresh[0].title, { kind: 'ok' });
      fresh.forEach(popDesktop);
    }, failQuiet('知らせが出ないだけ'));
  }

  /** apiPrefs の返り。取れるまでは null (すべて既定 = 今の動きとして扱う) */

  var prefsSettled = false;

  var prefsSeq = 0;

  // ===== スクラムまわりの言葉 (#21) =====
  //
  // TERMS / term / termFill は src/core/Terms.js の写し (test/ui-parity.test.js が同じ答えを返すかを見ている)。
  // 画面のスクラムまわりの字は、すべて termOf(key) / termIn('…{key}…') を通す。字を直に書かない
  // (test/terms.test.js が見ている)。表し方は自分の設定 terms.style。届くまでは一般の言葉。

  /**
   * 言葉の対応。key → {plain: 一般の言葉, scrum: スクラムの言葉}。
   *
   * @returns {Object<string, {plain: string, scrum: string}>}
   */
  function TERMS() {
    return {
      feature: { plain: '期間で進める', scrum: 'エージェンティックスクラム' },
      sprint: { plain: '作業期間', scrum: 'スプリント' },
      sprintGoal: { plain: 'この期間の目標', scrum: 'スプリントゴール' },
      points: { plain: '大きさ', scrum: 'ポイント' },
      velocity: { plain: '期間ごとに終えた量', scrum: 'ベロシティ' },
      burndown: { plain: '残りの量の推移', scrum: 'バーンダウン' },
      impediment: { plain: '困りごと', scrum: '障害物' },
      productGoal: { plain: '目指すところ', scrum: 'プロダクトゴール' },
      definitionOfDone: { plain: '終わったと言える条件', scrum: '完了の定義' },
      acceptance: { plain: 'できたと言える条件', scrum: '受け入れ条件' },
    };
  }

  /**
   * 言葉を1つ返す。知らない表し方は一般の言葉。知らない key はそのまま返す
   * (空にすると画面から字が消えて気づけない)。
   *
   * @param {string} key
   * @param {string} [style] 'plain' | 'scrum'。省略すると一般の言葉
   * @returns {string}
   */
  function term(key, style) {
    var all = TERMS();
    var k = String(key == null ? '' : key);
    if (!Object.prototype.hasOwnProperty.call(all, k)) return k;
    return style === 'scrum' ? all[k].scrum : all[k].plain;
  }

  /**
   * 文の中の {key} を言葉に置き換える。文ごと両方の形を持たず、言葉だけを差し込むため。
   * 知らない {key} は触らない。
   *
   * @param {string} text
   * @param {string} [style]
   * @returns {string}
   */
  function termFill(text, style) {
    var all = TERMS();
    return String(text == null ? '' : text).replace(/\{([A-Za-z]+)\}/g, function (whole, k) {
      return Object.prototype.hasOwnProperty.call(all, k) ? term(k, style) : whole;
    });
  }

  /** いまの言葉の表し方。設定が届くまでは一般の言葉 */
  function termStyleNow() {
    var s = prefs && prefs.effective && prefs.effective.termStyle;
    return s === 'scrum' ? 'scrum' : 'plain';
  }

  /**
   * いまの表し方での言葉。
   *
   * @param {string} key TERMS() の key
   * @returns {string}
   */
  function termOf(key) {
    return term(key, termStyleNow());
  }

  /**
   * 文の中の {key} を、いまの表し方の言葉にする。
   *
   * @param {string} text
   * @returns {string}
   */
  function termIn(text) {
    return termFill(text, termStyleNow());
  }

  /**
   * 字を {key} 入りのひな形から埋め、表し方が変わったら applyTerms が埋め直せるよう印を付ける。
   * 人の書いた字 (題名など) は混ぜない (たまたま {sprint} と書いた題名まで置き換わる)。
   *
   * @param {Element} el
   * @param {string} template
   * @returns {Element} el
   */
  function termText(el, template) {
    var raw = String(template == null ? '' : template);
    el.textContent = termIn(raw);
    if (raw.indexOf('{') >= 0) el.setAttribute('data-term', raw);
    else el.removeAttribute('data-term');
    return el;
  }

  /**
   * 静の HTML に置いた言葉を埋める。data-term は字、data-term-label は aria-label。
   * 起動のときと、表し方が変わったときに呼ぶ。
   */
  function applyTerms() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-term]'), function (el) {
      el.textContent = termIn(el.getAttribute('data-term'));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-term-label]'), function (el) {
      el.setAttribute('aria-label', termIn(el.getAttribute('data-term-label')));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-hint-key]'), function (el) {
      setHintText(el, termIn(HINTS[el.getAttribute('data-hint-key')] || ''));
    });
  }

  /**
   * 言葉の表し方が変わった。静の字を埋め直し、開いているスクラムまわりの画面を描き直す
   * (描いた字は描いたときの言葉のまま残る)。設定の画面も、スクラムの節に言葉があるので描き直す。
   */
  function refreshTerms() {
    // 開いている右の欄 (やること・困りごとの詳細) も data-term で埋め直る
    applyTerms();
    updateCrumbs();

      renderSprint(lastSprintView);

    ['recent', 'home-recent']];

  /**

   *

  function homeCardOn(key) {

  /** 使われ方を数えるか。設定が取れていなければ数える (サーバでも見る) */
  function prefUsageOn() {

  /** ホームの区画を設定に合わせて出し入れする */

  /**
   * 届いた設定を画面に当てる。止めた使われ方は溜めたぶんも捨てる。
   *
   * @param {object} res apiPrefs
   * @param {number} [seq] 尋ねたときの prefsSeq。これより後に尋ねた返事を当てていれば何もしない
   * @returns {boolean} 当てたか
   */
  function applyPrefs(res, seq) {
    if (seq) {
      if (seq < prefsAppliedSeq) return false;
      prefsAppliedSeq = seq;
    }
    var styleBefore = termStyleNow();
    prefs = res || prefs;
    if (termStyleNow() !== styleBefore) refreshTerms();
    applyHomeCards();
    if (!prefUsageOn()) usageBuffer = {};
    // 描いてあるカードのうち止めたものを外す。出すほうはホームを開き直したとき (loadHome) に描く。
    // ここで取り直すと、起動のたびにカードの api を2回ずつ呼ぶ
    if (!homeCardOn('game')) removeAll(homeCardsEl, '.game-card');

  /** 起動のときの設定が届いた (または取れなかった)。待たせていたポイントのカードを描く */

  }

  /**

   */
  function removeAll(host, selector) {

  /**
   * 起動のときに設定を取り、自分の設定の「最初に出す画面」へ移る。
   *
   * 文書のリンクから開いたときと、返事を待つあいだに人が移ったときは移らない

   * @param {number} since 起動のときの navCount

  var settings = { scrumEnabled: false, canEdit: false, productGoal: '', definitionOfDone: '' };

  /**
   * 言葉の説明を返す。中身はサーバの SCRUM_GLOSSARY() を設定と一緒に受け取る。

  function scrumGlossaryOf(key) {
    var all = settings.glossary || {};

  /**
   * 用語の説明を、見出しの脇に出す「?」にする。

   * ポップアップにはしない。開いたまま画面の操作を続けられるように、押すと
   * すぐ下に説明を出す。
   *
   * @param {string} key 説明の key (TERMS() の key と roadmap / carryover)
   * @param {string} [name] 見せる言葉。省略すると termOf(key)
   * @returns {HTMLElement}
   */
  function makeTermHelp(key, name) {
    var wrap = document.createElement('span');
    wrap.className = 'term-help';

    var text = scrumGlossaryOf(key);
    if (!text) return wrap;
    var term = name || termOf(key);

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon-btn term-help-btn';
    btn.textContent = '?';
    btn.setAttribute('aria-label', term + ' とは');
    // ホバーでも出す。押すと下に開いたまま読める
    attachHint(btn, text);
    btn.setAttribute('aria-expanded', 'false');
    wrap.appendChild(btn);

    var note = document.createElement('span');
    note.className = 'row-meta term-help-text';
    note.textContent = text;
    note.hidden = true;
    wrap.appendChild(note);

    btn.addEventListener('click', function () {
      note.hidden = !note.hidden;
      btn.setAttribute('aria-expanded', String(!note.hidden));
    });
    return wrap;
  }

  /**
   * 見出しを作る。用語なら「?」を添える。

   * @param {string} text
   * @param {string} [key] 説明の key (makeTermHelp)
   * @param {string} [name] 説明に添える言葉。省略すると termOf(key)
   * @returns {HTMLElement}
   */
  function makeScrumHeading(text, key, name) {

    h.className = 'view-label scrum-heading';
    h.appendChild(document.createTextNode(text));
    if (key) h.appendChild(makeTermHelp(key, name));
    return h;
  }

  /**

   *
   * @param {object|null} issue 直すときはそのやること
   * @returns {object[]} openInlineForm の欄
   */
  function scrumIssueFields(issue) {
    if (!scrumOn()) return [];
    var current = issue ? issue.sprint : '';
    return [
      { name: 'sprint', label: termOf('sprint'), choices: sprintChoices(current), value: current },
      { name: 'points', label: termIn('{points} (ほかのやることと比べて選ぶ。時間ではありません)'),
        choices: scrumPointChoices(issue ? issue.points : ''),
        value: issue && issue.points !== '' && issue.points !== undefined ? String(issue.points) : '' },
      { name: 'acceptance', label: termIn('{acceptance} (1行に1つ)'), multiline: true,
        value: issue ? issue.acceptance : '' },

  /**
   * スクラムの欄の値を、送る中身に足す。オフなら何もしない。

   * @param {object} patch 送る中身 (書き足す)
   */
  function scrumIssuePatch(v, patch) {
    if (!scrumOn()) return;
    patch.sprint = v.sprint || '';
    patch.points = v.points;
    patch.acceptance = v.acceptance || '';
  }

  // ----- 設定 -----

  /**
   * 設定の画面を描く。
   */
  function loadSettingsPanel() {
    showSkeleton(settingsEl, 'list', 2);
    loadSettings(function () {
      // 設定の一覧が取れなくても、スクラム・ポイント・キューの節は出す
      // 管理者かを尋ねるのはこの画面だけ (起動のたびに Drive を待たせない)
      var seq = ++prefsSeq;
      call('apiPrefs', [{ team: true }], function (res) {
        if (res) applyPrefs(res, seq);
        renderSettingsPanel();
      }, function (err) {
        failQuiet('一覧が出なくても、期間で進めるなどの節は使える')(err);
        renderSettingsPanel();
      });
    });
  }

  /**
   * 設定の画面を、自分の設定とチームの設定に分けて描く。
   */
  function renderSettingsPanel() {
    settingsEl.textContent = '';
    var items = (prefs && prefs.items) || [];
    var canEditTeam = !!(prefs && prefs.canEditTeam);

    var mine = makeSettingsGroup('settings-mine', '自分の設定',
      'あなたにだけ効きます。どの端末で開いても同じです。');
    mine.appendChild(makeNotifyWarning());
    appendPrefSections(mine, items.filter(function (p) { return p.scope === 'me'; }), true);
    if (!prefs) mine.appendChild(makePill('設定の一覧を取れませんでした', 'chip'));
    settingsEl.appendChild(mine);

    var team = makeSettingsGroup('settings-team', 'チームの設定',
      canEditTeam ? '全員に効きます。変えられるのは管理者だけです。'
        : '全員に効きます。変えられるのは管理者 (持ち主と、入れ物のフォルダを編集できる人) だけなので、' +
          'ここでは今の値を出しています。変えたいときは管理者に頼んでください。');
    if (prefs) team.appendChild(makeTeamGoalField(canEditTeam));
    appendPrefSections(team, items.filter(function (p) { return p.scope === 'team'; }), canEditTeam);
    team.appendChild(makeScrumSettings());
    team.appendChild(makeGameSettings());
    if (settings.canEdit && settings.queue) team.appendChild(makeQueueSettings());
    settingsEl.appendChild(team);
  }

  /**
   * 確認を頼まれた知らせを止めた人への断り。止めていなければ空のまま (隠す)。
   *
   * @returns {HTMLElement}
   */
  function makeNotifyWarning() {
    var p = document.createElement('p');
    p.className = 'settings-warning';
    p.id = 'notify-warning';
    syncNotifyWarning(p);
    return p;
  }

  function syncNotifyWarning(el) {
    var target = el || document.getElementById('notify-warning');
    if (!target) return;
    var off = (prefs && prefs.effective && prefs.effective.notifyOff) || [];
    var reviewOff = off.indexOf('review') >= 0;
    target.textContent = reviewOff
      ? '確認を頼まれても知らせが届きません。ホームの「あなたの番」と、画面の中の知らせ (鈴) で確かめてください。'
      : '';
    target.hidden = !reviewOff;
  }

  /**
   * 項目を見出し (section) ごとに並べる。並びは届いた順のまま。
   *
   * @param {HTMLElement} host
   * @param {object[]} items
   * @param {boolean} editable
   */
  function appendPrefSections(host, items, editable) {
    var order = [];
    var by = {};
    items.forEach(function (p) {
      // 言葉の表し方は、期間で進めるを使っていなければ意味が無い (一覧には残す)
      if (p.key === 'terms.style' && !scrumOn()) return;
      var key = String(p.section || '');
      if (!by[key]) { by[key] = []; order.push(key); }
      by[key].push(p);
    });
    order.forEach(function (name) {
      var sec = document.createElement('section');
      sec.className = 'settings-section';
      if (name) {
        var h = document.createElement('h3');
        h.className = 'view-label';
        h.textContent = name;
        sec.appendChild(h);
      }
      by[name].forEach(function (p) { sec.appendChild(makePrefField(p, editable)); });
      host.appendChild(sec);
    });
  }

  /**
   * 値を人の読む字にする (読むだけの欄)。
   *
   * @param {object} item
   * @param {*} v
   * @returns {string}
   */
  function prefValueText(item, v) {
    if (item.type === 'bool') return v ? 'オン' : 'オフ';
    if (item.type === 'steps') return (v || []).join(' / ');
    if (item.type === 'enum') {
      var hit = (item.options || []).filter(function (o) { return o.value === v; })[0];
      // 選択肢の名前はサーバが {key} で渡すことがある (最初に出す画面のスクラムの画面)
      return hit ? termIn(hit.label) : String(v);
    }
    return String(v);
  }

  /**
   * 整数で範囲の中か。
   *
   * @param {object} item
   * @param {string} text
   * @returns {number|null}
   */
  function prefIntOf(item, text) {
    if (!/^\s*\d+\s*$/.test(String(text))) return null;
    var n = Number(text);
    return n >= Number(item.min) && n <= Number(item.max) ? n : null;
  }

  /**
   * 1つの項目の欄。bool はトグル、int は数、enum は選択、steps は3つの数。
   * 欄ごとに書き、届いた一覧で欄の値と「既定に戻す」をそろえる。失敗したら元の値に戻す。
   *
   * @param {object} item apiPrefs の items の1つ
   * @param {boolean} editable
   * @returns {HTMLElement}
   */
  function makePrefField(item, editable) {
    var wrap = document.createElement('div');
    wrap.className = 'settings-field pref-field';
    wrap.dataset.pref = item.key;
    var current = item;

    if (!editable) {
      var line = document.createElement('p');
      line.textContent = item.label + ': ' + prefValueText(item, item.value) + (item.type === 'steps' ? ' 日' : '');
      wrap.appendChild(line);
      appendPrefHelp(wrap, item);
      return wrap;
    }

    var control;
    var inputs = [];
    var reset = document.createElement('button');
    reset.type = 'button';
    reset.className = 'btn pref-reset';
    reset.textContent = '既定に戻す';

    function sync(next) {
      current = next || current;
      if (item.type === 'bool') setToggle(control, !!current.value);
      else if (item.type === 'steps') inputs.forEach(function (el, i) { el.value = String(current.value[i]); });
      else control.value = String(current.value);
      reset.hidden = !current.custom;
      attachHint(reset, '既定 (' + prefValueText(item, item.def) + ') に戻します');
    }

    function save(value, busy) {
      if (busy) busy.disabled = true;
      var seq = ++prefsSeq;
      call('apiPrefSet', [item.key, value], function (res) {
        if (busy) busy.disabled = false;
        if (res) applyPrefs(res, seq);
        // 古い返事だったときも、いま当たっている設定で欄をそろえる
        var next = ((prefs && prefs.items) || []).filter(function (p) { return p.key === item.key; })[0];
        sync(next || current);
        syncNotifyWarning();
        showSnack(value === null ? '「' + item.label + '」を既定に戻しました' : '「' + item.label + '」を保存しました',
          { kind: 'ok' });
      }, function (err) {
        sync(current);
        if (busy) failEnable(busy, '保存できませんでした: ')(err);
        else failSnack('保存できませんでした: ')(err);
      });
    }

    if (item.type === 'bool') {
      control = document.createElement('button');
      control.type = 'button';
      control.className = 'btn toggle-btn';
      control.textContent = item.label;
      control.addEventListener('click', function () {
        var want = !current.value;
        // 押した結果をすぐ形で返す。届かなければ sync で戻す
        setToggle(control, want);
        save(want, control);
      });
      wrap.appendChild(control);
    } else {
      var label = document.createElement('label');
      label.className = 'pref-label';
      label.appendChild(document.createTextNode(item.label));
      if (item.type === 'enum') {
        control = document.createElement('select');
        (item.options || []).forEach(function (o) {
          var opt = document.createElement('option');
          opt.value = o.value;
          opt.textContent = termIn(o.label);
          control.appendChild(opt);
        });
        control.addEventListener('change', function () { save(control.value); });
        label.appendChild(control);
        wrap.appendChild(label);
      } else if (item.type === 'int') {
        control = makePrefNumber(item);
        control.addEventListener('change', function () {
          var n = prefIntOf(item, control.value);
          if (n === null) {
            showSnack('「' + item.label + '」は ' + item.min + '〜' + item.max + ' の整数で入れてください', { kind: 'ng' });
            sync(current);
            return;
          }
          save(n);
        });
        label.appendChild(control);
        wrap.appendChild(label);
      } else {
        // steps: 小さい順に3つ
        wrap.appendChild(label);
        var row = document.createElement('div');
        row.className = 'pref-steps';
        for (var i = 0; i < 3; i++) {
          var one = makePrefNumber(item);
          one.setAttribute('aria-label', item.label + ' の ' + (i + 1) + ' 段目');
          inputs.push(one);
          row.appendChild(one);
        }
        inputs.forEach(function (el) {
          el.addEventListener('change', function () {
            var v = inputs.map(function (x) { return prefIntOf(item, x.value); });
            var ok = v.every(function (n, k) { return n !== null && (k === 0 || n > v[k - 1]); });
            if (!ok) {
              showSnack('「' + item.label + '」は ' + item.min + '〜' + item.max + ' の整数を小さい順に3つ入れてください',
                { kind: 'ng' });
              sync(current);
              return;
            }
            save(v);
          });
        });
        wrap.appendChild(row);
      }
      if (item.type === 'int' || item.type === 'steps') {
        var range = document.createElement('span');
        range.className = 'row-meta';
        range.textContent = item.min + '〜' + item.max;
        wrap.appendChild(range);
      }
    }

    reset.addEventListener('click', function () { save(null, reset); });
    wrap.appendChild(reset);
    appendPrefHelp(wrap, item);
    sync(item);
    return wrap;
  }

  /**
   * @param {object} item
   * @returns {HTMLInputElement}
   */
  function makePrefNumber(item) {
    var el = document.createElement('input');
    el.type = 'number';
    el.min = String(item.min);
    el.max = String(item.max);
    el.step = '1';
    el.inputMode = 'numeric';
    return el;
  }

  function appendPrefHelp(wrap, item) {
    if (!item.help) return;
    var help = document.createElement('p');
    help.className = 'row-meta';
    help.textContent = item.help;
    wrap.appendChild(help);
  }

  /**
   * チームの毎月の目標。保存先はホームの「チームの前進」と同じ (apiSetTeamGoal)。
   *
   * @param {boolean} editable
   * @returns {HTMLElement}
   */
  function makeTeamGoalField(editable) {
    var sec = document.createElement('section');
    sec.className = 'settings-section';
    var h = document.createElement('h3');
    h.className = 'view-label';
    h.textContent = 'チームの前進';
    sec.appendChild(h);

    var wrap = document.createElement('div');
    wrap.className = 'settings-field pref-field';
    wrap.id = 'team-goal-field';
    var goal = Number(prefs && prefs.teamGoal) || 0;
    var labelText = 'チームの毎月の目標 (片づけるやることの数)';
    if (!editable) {
      var line = document.createElement('p');
      line.textContent = labelText + ': ' + (goal ? goal + ' 件' : '決めていません');
      wrap.appendChild(line);
      sec.appendChild(wrap);
      return sec;
    }
    var label = document.createElement('label');
    label.className = 'pref-label';
    label.appendChild(document.createTextNode(labelText));
    var input = makePrefNumber({ min: 0, max: 9999 });
    input.value = String(goal);
    input.addEventListener('change', function () {
      var n = prefIntOf({ min: 0, max: 9999 }, input.value);
      if (n === null) {
        showSnack('目標は 0〜9999 の数で入れてください', { kind: 'ng' });
        input.value = String(goal);
        return;
      }
      call('apiSetTeamGoal', [n], function (p) {
        goal = Number(p && p.goal) || 0;
        if (prefs) prefs.teamGoal = goal;
        input.value = String(goal);
        showSnack(goal ? 'チームの目標を ' + goal + ' 件にしました' : 'チームの目標を消しました', { kind: 'ok' });
      }, function (err) {
        input.value = String(goal);
        failSnack('保存できませんでした: ')(err);
      });
    });
    label.appendChild(input);
    wrap.appendChild(label);
    var help = document.createElement('p');
    help.className = 'row-meta';
    help.textContent = '0 にすると目標を決めないことになります。ホームの「チームの前進」に出ます。';
    wrap.appendChild(help);
    sec.appendChild(wrap);
    return sec;
  }

  /**
   * エージェンティックスクラムの設定の節。
   *
   * @returns {HTMLElement}
   */
  function makeScrumSettings() {
    var box = document.createElement('section');
    box.className = 'settings-section';

    var head = document.createElement('h2');
    head.className = 'view-title';
    head.appendChild(document.createTextNode(termOf('feature') + ' '));
    head.appendChild(makePill(scrumOn() ? 'オン' : 'オフ',
      scrumOn() ? 'state state-open' : 'state'));
    box.appendChild(head);

    var about = document.createElement('p');
    about.textContent = termIn('AI のチームメンバー (手元の Claude Code) と一緒に、仕事を{sprint}に区切って進めるための機能です。' +
      '使わない人が多いので、はじめはオフにしてあります。オンにすると、左に「{sprint}」と「{impediment}」が出て、' +
      'やることに{sprint}・{points}・{acceptance}を入れられるようになります。');
    box.appendChild(about);

    var off = document.createElement('p');
    off.className = 'row-meta';
    off.textContent = termIn('オフにしても、書いた{sprint}や{impediment}は消えません。オンに戻せばそのまま使えます。');
    box.appendChild(off);

    if (settings.canEdit) {
      /*
       * 切り替えはトグルにする。「オフにする」と書いたボタンは、いまの状態を
       * 言っているのか押した結果を言っているのかが読めない (フリップフロップ
       * 問題)。名前は変えず、つまみの位置と aria-checked で状態を示す
       */
      var toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.id = 'scrum-toggle';
      toggle.className = 'btn toggle-btn';
      toggle.textContent = termIn('「{feature}」を使う');
      setToggle(toggle, scrumOn());
      hint(toggle, 'act:scrum-toggle');
      toggle.addEventListener('click', function () {
        toggle.disabled = true;
        // 押した結果をすぐ形で返す。届かなければ元に戻す
        setToggle(toggle, !scrumOn());
        call('apiSetScrumEnabled', [!scrumOn()], function (res) {
          settings = res || settings;
          showSnack(scrumOn()
            ? termIn('「{feature}」をオンにしました。左に「{feature}」が出ます')
            : termIn('「{feature}」をオフにしました'), { kind: 'ok' });
          loadSettingsPanel();
        }, function (err) {
          setToggle(toggle, scrumOn());
          failEnable(toggle, '切り替えられませんでした: ')(err);
        });
      });
      box.appendChild(toggle);
    } else {
      var who = document.createElement('p');
      who.className = 'row-meta';
      who.textContent = '切り替えられるのは、このアプリの管理者 (持ち主と、入れ物のフォルダを編集できる人) だけです。使いたいときは管理者に頼んでください。';
      box.appendChild(who);
    }

    if (scrumOn()) {
      box.appendChild(makeScrumTextEditor('productGoal', termOf('productGoal'), settings.productGoal));
      box.appendChild(makeScrumTextEditor('definitionOfDone', termOf('definitionOfDone'), settings.definitionOfDone));
    }

    box.appendChild(makeScrumKitGuide());
    return box;
  }

  /**
   * 手元からの命令を受け付ける仕掛け (コマンドキュー) の節。管理者にだけ出す。
   *
   * 仕掛けた人の権限で1分ごとに回る。その人が抜けると止まり、他人からは見えない。
   *
   * @returns {HTMLElement}
   */
  function makeQueueSettings() {
    var q = settings.queue || {};
    var box = document.createElement('section');
    box.className = 'settings-section';
    box.id = 'queue-settings';

    var head = document.createElement('h2');
    head.className = 'view-title';
    head.appendChild(document.createTextNode('手元からの命令の受付 '));
    // 仕掛けた人 (runner) は setupCommandQueue() を実行し直すまで入らない。前から
    // 動いている番頭では空なので、回った時刻 (lastRun) があれば動いているとみなす
    var known = !!(q.runner || q.lastRun);
    head.appendChild(makePill(!known ? '未設定' : q.stale ? '止まっています' : '動いています',
      !known || q.stale ? 'state' : 'state state-open'));
    box.appendChild(head);

    var at = q.lastRun ? new Date(q.lastRun) : null;
    // 台帳と同じく人が書き換えられる値なので、読めない時刻で Invalid Date と出さない
    var when = !at ? 'まだありません' : isNaN(at.getTime()) ? '不明' : at.toLocaleString('ja-JP');
    var who = document.createElement('p');
    // 止まっているときに「動いています」と書かない (札と本文が食い違う)
    var unknownWho = '仕掛けた人は分かりません。setupCommandQueue() を実行し直すと記録されます';
    who.textContent = !known ? 'まだ仕掛けていません。'
      : (q.stale
        ? (q.runner
          ? q.runner + ' さんの権限で動かしていましたが、止まっているようです。'
          : '止まっているようです (' + unknownWho + ')。')
        : (q.runner
          ? q.runner + ' さんの権限で1分ごとに動いています。'
          : '1分ごとに動いています (' + unknownWho + ')。')) +
        '最後に動いたのは ' + when + '。';
    box.appendChild(who);

    if (!known || q.stale) {
      var how = document.createElement('p');
      how.className = 'row-meta';
      // setupCommandQueue() は assertOwner_ で持ち主だけに通す。投稿者などの管理者には動かない
      how.textContent = '持ち主 (共有ドライブでは管理者の役割の人) が Apps Script のエディタで ' +
        'setupCommandQueue() を実行すると、その人の権限で動き始めます (前の人が抜けた場合も、これで引き継げます)。';
      box.appendChild(how);
    }
    return box;
  }

  /**
   * ポイント・レベル・週の上位の切り替え。既定はオフ。管理者だけ切り替えられる。
   *
   * @returns {HTMLElement}
   */
  function makeGameSettings() {
    var box = document.createElement('section');
    box.className = 'settings-section';

    var head = document.createElement('h2');
    head.className = 'view-title';
    head.appendChild(document.createTextNode('ポイントとレベル '));
    head.appendChild(makePill(settings.gameEnabled ? 'オン' : 'オフ',
      settings.gameEnabled ? 'state state-open' : 'state'));
    box.appendChild(head);

    var about = document.createElement('p');
    about.textContent = 'やることを片づけると、重さに応じてポイントが付き、レベルが上がります。' +
      '週の上位3人をホームに出します (載るのは自分で参加を選んだ人だけです)。人事の評価には使いません。';
    box.appendChild(about);

    if (settings.canEdit) {
      var toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.id = 'game-toggle';
      toggle.className = 'btn toggle-btn';
      toggle.textContent = 'ポイントとレベルを使う';
      setToggle(toggle, !!settings.gameEnabled);
      toggle.addEventListener('click', function () {
        toggle.disabled = true;
        var want = !settings.gameEnabled;
        setToggle(toggle, want);
        call('apiSetGameEnabled', [want], function (res) {
          settings = res || settings;
          showSnack(settings.gameEnabled ? 'ポイントとレベルをオンにしました' : 'ポイントとレベルをオフにしました',
            { kind: 'ok' });
          loadSettingsPanel();
          loadHomeCards();
        }, function (err) {
          setToggle(toggle, !!settings.gameEnabled);
          failEnable(toggle, '切り替えられませんでした: ')(err);
        });
      });
      box.appendChild(toggle);
    } else {
      var who = document.createElement('p');
      who.className = 'row-meta';
      who.textContent = '切り替えられるのは、このアプリの管理者だけです。';
      box.appendChild(who);
    }
    return box;
  }

  /**
   * プロダクトゴールか完了の定義を、読む・直す欄。直せるのは管理者だけ。
   *
   * @param {string} kind
   * @param {string} label
   * @param {string} value
   * @returns {HTMLElement}
   */
  function makeScrumTextEditor(kind, label, value) {
    var wrap = document.createElement('div');
    wrap.className = 'settings-field';
    // kind は TERMS() の key でもある (productGoal / definitionOfDone)
    wrap.appendChild(makeScrumHeading(label, kind));

    if (!settings.canEdit) {
      wrap.appendChild(value ? makeMarkdown(value) : makePill('まだ書かれていません', 'chip'));
      return wrap;
    }

    var area = document.createElement('textarea');
    area.id = 'scrum-text-' + kind;
    area.value = value || '';
    area.rows = 4;
    area.setAttribute('aria-label', label);
    wrap.appendChild(area);

    var save = document.createElement('button');
    save.type = 'button';
    save.className = 'btn';
    save.textContent = label + 'を保存する';
    save.addEventListener('click', function () {
      save.disabled = true;
      call('apiSetScrumText', [kind, area.value], function (res) {
        settings = res || settings;
        save.disabled = false;
        showSnack(label + 'を保存しました', { kind: 'ok' });
      }, failEnable(save, '保存できませんでした: '));
    });
    wrap.appendChild(save);
    return wrap;
  }

  /**
   * 手元の道具から使う案内。オフでも出す (オンにする前に何ができるか分かるように)。
   *
   * @returns {HTMLElement}
   */
  function makeScrumKitGuide() {
    var wrap = document.createElement('div');
    wrap.className = 'settings-field';
    wrap.appendChild(makeScrumHeading('手元の Claude Code をチームに加える'));

    var steps = document.createElement('ol');
    // `…` で囲んだところは打ち込む字なので、それと分かる形にする
    [
      '右上の自分の顔 →「手元から動かす道具を落とす」で道具を受け取り、案内どおりに置く',
      '`node agent.mjs scrum` で、この設定がオンになっているかを確かめる',
      termIn('Claude Code に「{sprint}の計画を立てて」などと頼む。道具に入っている') +
        ' `.claude/skills` のイベントと `.claude/agents` の役割に沿って進めます (読み替えは `SCRUM.md`)',
    ].forEach(function (text) {
      var li = document.createElement('li');
      text.split('`').forEach(function (part, i) {
        if (!part) return;
        if (i % 2) {
          var code = document.createElement('code');
          code.textContent = part;
          li.appendChild(code);
        } else {
          li.appendChild(document.createTextNode(part));
        }
      });
      steps.appendChild(li);
    });
    wrap.appendChild(steps);

    var note = document.createElement('p');
    note.className = 'row-meta';
    note.textContent = termIn('{sprint}や{impediment}は、手元の Claude Code も画面と同じ台帳に書きます。') +
      '会議の記録など文章の成果物は、手元の scrum/ フォルダに残ります。';
    wrap.appendChild(note);
    return wrap;
  }

  // ----- スプリント -----

  /** 最後に描いた apiScrumView の返り。言葉の表し方が変わったら、ここから描き直す */
  var lastSprintView = null;

  /** 最後に描いた困りごとの一覧 */
  var lastImpediments = null;

  /**
   * スプリントの画面を描く。
   *
   * 素早く切り替えると、前に頼んだぶんの返事があとから届いて選び直したものを
   * 上書きする。最後に頼んだぶんの返事だけを描く。
   */
  function loadSprint() {
    var still = latest('sprint');
    showSkeleton(sprintViewEl, 'list', 3);
    call('apiScrumView', [scrumSprint], function (view) {
      if (!still()) return;
      var v = view || {};
      scrumSprints = v.sprints || [];
      scrumSprint = v.sprint || '';
      fillSprintSelect();
      lastSprintView = v;
      renderSprint(v);
    }, function (err) {
      // 失敗の返事も、最後に頼んだぶんでなければ描かない
      if (still()) failInto(sprintViewEl)(err);
    });
  }

  /** スプリントの選択肢を詰める */
  function fillSprintSelect() {
    sprintSelect.textContent = '';
    if (!scrumSprints.length) {
      var none = document.createElement('option');
      none.value = '';
      none.textContent = 'まだありません';
      sprintSelect.appendChild(none);
    }
    scrumSprints.forEach(function (sp) {
      var opt = document.createElement('option');
      opt.value = sp.name;
      opt.textContent = sp.name;
      sprintSelect.appendChild(opt);
    });
    sprintSelect.value = scrumSprint;
    sprintSelect.disabled = !scrumSprints.length;
    sprintEditBtn.disabled = !scrumSprint;
    // 押せないときは、押せない理由を隣に字で出す。黙って灰色にすると壊れて
    // いると思われる。押せないボタンには焦点が当たらず、ホバーの補足だけでは
    // キーボードの人に届かないので、見える字にする
    var reason = scrumSprint ? ''
      : termIn(scrumSprints.length ? '上の「{sprint}」で選ぶと直せます' : 'まず{sprint}を作ると直せます');
    var reasonEl = document.getElementById('sprint-edit-reason');
    reasonEl.textContent = reason;
    reasonEl.hidden = !reason;
    setHintText(sprintEditBtn, reason || termIn(HINTS['act:sprint-edit']));
  }

  /**
   * 今日 (東京の暦日) を 'YYYY-MM-DD' で返す。
   *
   * @returns {string}
   */
  function scrumToday() {
    // サーバ (ScrumView.js の scrumDayOf_) と同じく東京の暦日で見る。端末の
    // 時刻帯で見ると、海外から開いた人だけ残り日数や「今日」の線がずれる
    return tokyoDay(new Date().toISOString());
  }

  /**
   * 2つの 'YYYY-MM-DD' の差 (日)。
   *
   * @param {string} from
   * @param {string} to
   * @returns {number}
   */
  function scrumDaysBetween(from, to) {
    return Math.round((Date.parse(to + 'T00:00:00Z') - Date.parse(from + 'T00:00:00Z')) / 86400000);
  }

  /**
   * スプリントがいまどこにいるかを、人が読める字にする。
   *
   * @param {object} sp
   * @returns {string}
   */
  function sprintPhaseText(sp) {
    // 台帳は手で書き換えられる。暦に無い日は、決まっていないものとして扱う
    // (サーバのバーンダウンも同じ扱い。そのまま引くと「残りNaN日」になる)
    var start = tokyoDay(sp.startDate);
    var end = tokyoDay(sp.endDate);
    if (!start || !end) return '期間が決まっていません';
    var today = scrumToday();
