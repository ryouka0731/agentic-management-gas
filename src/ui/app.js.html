  // ===== 工程表 =====

  /**
   * 期限つきのやることを時系列の棒で並べる。
   *
   * 配置の計算は src/core/Gantt.js の純関数と同じものをここに写している。
   * google.script.run の往復を増やさないための意図的な重複であり、
   * 片方だけ直すと表示と実体がずれる。
   *
   * @param {object[]} issues
   * @param {Date} today
   * @returns {object}
   */
  /** 目盛りの末尾に足す余白の日数。src/core/Gantt.js と同じ値 */
  var GANTT_TAIL_DAYS = 14;

  /**
   * 予定工数 (人日) を棒の日数に直す。src/core/Gantt.js と同じもの。
   *
   * @param {number|string} planned
   * @returns {number}
   */
  function ganttDaysForEffort(planned) {
    var n = Number(planned);
    if (!n || isNaN(n) || n <= 0) return 1;

    return Math.max(1, Math.round(n));
  }

  /**
   * 予定工数と棒の長さが食い違っているかを見る。
   *
   * @param {number|string} planned
   * @param {number} days
   * @returns {boolean}
   */
  function ganttEffortDiffers(planned, days) {
    return ganttDaysForEffort(planned) !== Math.max(1, Number(days) || 1);
  }

  function ganttLayout(issues, today) {
    var DAY = 24 * 60 * 60 * 1000;

    function startOfDay(value) {
      if (value === null || value === undefined || value === '') return null;
      // src/core/Gantt.js の ganttStartOfDay と同じ。'YYYY-MM-DD' はその土地の日
      var ymd = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value));
      if (ymd) return new Date(Number(ymd[1]), Number(ymd[2]) - 1, Number(ymd[3])).getTime();
      var d = new Date(value);
      if (isNaN(d.getTime())) return null;
      return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    }

    var now = startOfDay(today || new Date());
    var rows = [];
    var from = null;
    var to = null;

    (issues || []).forEach(function (issue) {
      // 開始日を入れていればそれを使う。無ければ作った日を仮の起点にする
      var planned = startOfDay(issue.startDate);
      var start = planned !== null ? planned : startOfDay(issue.createdAt);
      var due = startOfDay(issue.dueDate);
      if (start === null) return;

      var end = (due === null) ? start : Math.max(due, start);
      if (from === null || start < from) from = start;
      if (to === null || end > to) to = end;

      rows.push({
        number: Number(issue.number), title: issue.title, state: issue.state,
        assignee: issue.assignee, hasDue: due !== null,
        hasStart: planned !== null,
        planned: issue.plannedHours, parent: issue.parent,
        overdue: due !== null && String(issue.state) === 'open' && due < now,
        _start: start, _end: end,
      });
    });

    if (!rows.length) return { from: now, to: now, days: 1, todayOffset: 0, rows: [] };

    if (now < from) from = now;
    if (now > to) to = now;

    // 末尾に余白の日を足す。目盛りが最後の期限で終わっていると、棒を
    // 掴んで伸ばそうとしても伸ばす先の列が無く、縮められるだけになる
    to += GANTT_TAIL_DAYS * DAY;

    rows.forEach(function (r) {
      r.offset = Math.round((r._start - from) / DAY);
      r.span = Math.round((r._end - r._start) / DAY) + 1;
      delete r._start;
      delete r._end;
    });

    return {
      from: from, to: to,
      days: Math.round((to - from) / DAY) + 1,
      todayOffset: Math.round((now - from) / DAY),
      rows: rows,
    };
  }

  /**
   * 月ごとの幅を返す。src/core/Gantt.js と同じもの。
   *
   * @param {number} from
   * @param {number} days
   * @returns {Array<{label:string, span:number}>}
   */
  function ganttMonths(from, days) {
    var DAY = 24 * 60 * 60 * 1000;
    var out = [];

    for (var i = 0; i < days; i++) {
      var d = new Date(from + i * DAY);
      var year = d.getFullYear();
      var month = d.getMonth() + 1;
      var last = out.length ? out[out.length - 1] : null;

      if (last && last.year === year && last.month === month) {
        last.span++;
        continue;
      }
      out.push({ year: year, month: month, span: 1, label: year + '年' + month + '月' });
    }
    return out;
  }

  /**
   * 列の位置を日付に直す。src/core/Gantt.js と同じもの。
   *
   * @param {number} from
   * @param {number} offset
   * @returns {string} YYYY-MM-DD
   */
  function ganttDateAt(from, offset) {
    var d = new Date(from + offset * 24 * 60 * 60 * 1000);
    var m = String(d.getMonth() + 1);
    var day = String(d.getDate());
    return d.getFullYear() + '-' +
      (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
  }

  /**
   * やることを束ねる。src/core/Grouping.js と同じもの。
   *
   * @param {object[]} issues
   * @param {string} by
   * @returns {Array<{key:string, label:string, issues:object[]}>}
   */
  function groupIssues(issues, by) {
    var names = {};
    allFiles.forEach(function (f) {
      if (splitPath(f.path).branch === 'main') names[f.fileId] = f.path;
    });

    var order = [];
    var buckets = {};

    function put(key, label, issue) {
      if (!buckets[key]) {
        buckets[key] = { key: key, label: label, issues: [] };
        order.push(key);
      }
      buckets[key].issues.push(issue);
    }

    (issues || []).forEach(function (issue) {
      if (by === 'none') { put('all', 'すべて', issue); return; }

      if (by === 'assignee') {
        // 2人で持つ仕事は、両方の束に出す。片方にしか出さないと、
        // もう片方の人には自分の仕事が見えなくなる
        var who = issue.assignees ||
          String(issue.assignee || '').split(',')
            .map(function (x) { return x.replace(/^\s+|\s+$/g, ''); })
            .filter(function (x) { return !!x; });

        if (!who.length) {
          put('(未割当)', '担当なし', issue);
          return;
        }
        who.forEach(function (one) { put(one, personName(one), issue); });
        return;
      }

      if (by === 'state') {
        var open = String(issue.state) === 'open';
        put(open ? 'open' : 'closed', open ? '未完了' : '完了', issue);
        return;
      }

      if (by === 'label') {
        var added = false;
        String(issue.labels || '').split(',').forEach(function (raw) {
          var label = raw.replace(/^\s+|\s+$/g, '');
          if (!label) return;
          put(label, label, issue);
          added = true;
        });
        if (!added) put('(ラベルなし)', 'ラベルなし', issue);
        return;
      }

      var linked = false;
      String(issue.linkedFileIds || '').split(',').forEach(function (raw) {
        var id = raw.replace(/^\s+|\s+$/g, '');
        if (!id) return;
        put(id, names[id] || id, issue);
        linked = true;
      });
      if (!linked) put('(未紐付け)', '文書に紐づいていない', issue);
    });

    return order.map(function (k) { return buckets[k]; });
  }

  /**
   * 棒を掴んで日付を変える。
   *
   * 端を掴めば片側だけ、真ん中を掴めば全体が動く。放したときに保存する。
   * 数字を打ち込むより、期間を見ながら決めるほうが早い。
   *
   * @param {HTMLElement} bar
   * @param {object} row ganttLayout の行
   * @param {object} g ganttLayout の結果
   * @param {number} colWidth 1日の幅
   */
  function makeBarDraggable(bar, row, g, colWidth, hostEl) {
    var mode = null;
    var startX = 0;
    var origin = { offset: row.offset, span: row.span };

    function apply(offset, span) {
      bar.style.gridColumn = (offset + 1) + ' / span ' + Math.max(1, span);
    }

    bar.addEventListener('pointerdown', function (e) {
      var rect = bar.getBoundingClientRect();
      var edge = 10;

      if (e.clientX - rect.left <= edge) mode = 'start';
      else if (rect.right - e.clientX <= edge) mode = 'end';
      else mode = 'move';

      startX = e.clientX;
      origin = { offset: row.offset, span: row.span };
      bar.setPointerCapture(e.pointerId);
      bar.classList.add('dragging');
      e.preventDefault();
      e.stopPropagation();
    });

    bar.addEventListener('pointermove', function (e) {
      if (!mode) {
        // 掴める場所を形で示す
        var rect = bar.getBoundingClientRect();
        var near = e.clientX - rect.left <= 10 || rect.right - e.clientX <= 10;
        bar.style.cursor = near ? 'ew-resize' : 'grab';
        return;
      }

      var moved = Math.round((e.clientX - startX) / colWidth);

      if (mode === 'move') {
        row.offset = Math.max(0, origin.offset + moved);
        row.span = origin.span;
      } else if (mode === 'end') {
        row.span = Math.max(1, origin.span + moved);
      } else {
        var offset = Math.min(origin.offset + origin.span - 1,
          Math.max(0, origin.offset + moved));
        row.span = origin.span + (origin.offset - offset);
        row.offset = offset;
      }
      apply(row.offset, row.span);
    });

    bar.addEventListener('pointerup', function (e) {
      if (!mode) return;

      var was = mode;
      mode = null;
      bar.classList.remove('dragging');
      bar.releasePointerCapture(e.pointerId);

      // 動かさずに離したなら、押したのだと解して中身を開く
      if (row.offset === origin.offset && row.span === origin.span) {
        if (was === 'move') openIssueByNumber(row.number, hostEl);
        return;
      }

      var patch = { dueDate: ganttDateAt(g.from, row.offset + row.span - 1) };
      if (was !== 'end') patch.startDate = ganttDateAt(g.from, row.offset);

      // 棒の長さは予定工数そのもの。片方だけ変わると数え直しができない。
      // 半日きざみで入れた値は、丸めて同じなら書き換えない
      if (ganttEffortDiffers(row.planned, row.span)) patch.plannedHours = row.span;

      google.script.run
        .withSuccessHandler(function () {
          showSnack('#' + row.number + ' の期間を ' +
            ganttDateAt(g.from, row.offset) + ' 〜 ' + patch.dueDate + ' にしました' +
            (patch.plannedHours ? ' (予定 ' + patch.plannedHours + '人日)' : ''),
            { kind: 'ok' });
          loadGantt();
        })
        .withFailureHandler(function (err) {
          showSnack(err.message, { kind: 'ng' });
          loadGantt();
        })
        .apiIssueUpdate(row.number, patch);
    });
  }

  function loadGantt() {
    showSkeleton(ganttEl, 'gantt', 5);

    call('apiIssueList', [''], function (list) {
      var issues = list || [];
      ganttEl.textContent = '';

      lastIssues = issues;
      issues = issues.filter(matchesFilter);

      var g = ganttLayout(issues, new Date());
      issueCountEl.textContent = g.rows.length + ' / ' + issues.length + '件';

      if (!g.rows.length) {
        ganttEl.appendChild(makeBlankState(
          'やることがありません',
          '期限を入れたやることが、ここに時系列の棒で並びます。',
          { label: 'やることを作る', onClick: createIssue }
        ));
        return;
      }

      var COL = 26;
      var chart = document.createElement('div');
      chart.className = 'gantt';
      chart.style.setProperty('--gantt-days', String(g.days));
      chart.style.setProperty('--gantt-col', COL + 'px');

      // 目盛りの週の区切りを、先頭の日から月曜までのずれで合わせる
      var firstDay = new Date(g.from).getDay();
      chart.style.setProperty('--week-offset', String((firstDay + 6) % 7));

      // 上段に月、下段に日を出す。日だけでは何月か分からない
      var monthHead = document.createElement('div');
      monthHead.className = 'gantt-head';

      var monthName = document.createElement('div');
      monthName.className = 'gantt-name';
      monthHead.appendChild(monthName);

      var monthScale = document.createElement('div');
      monthScale.className = 'gantt-scale';

      ganttMonths(g.from, g.days).forEach(function (m) {
        var cell = document.createElement('div');
        cell.className = 'gantt-month';
        cell.style.gridColumn = 'span ' + m.span;
        cell.textContent = m.label;
        monthScale.appendChild(cell);
      });
      monthHead.appendChild(monthScale);
      chart.appendChild(monthHead);

      var head = document.createElement('div');
      head.className = 'gantt-head';

      var headName = document.createElement('div');
      headName.className = 'gantt-name';
      headName.textContent = 'やること';
      head.appendChild(headName);

      var scale = document.createElement('div');
      scale.className = 'gantt-scale';

      for (var d = 0; d < g.days; d++) {
        var day = new Date(g.from + d * 24 * 60 * 60 * 1000);
        var weekend = day.getDay() === 0 || day.getDay() === 6;

        var cell = document.createElement('div');
        cell.className = 'gantt-day' +
          (d === g.todayOffset ? ' today' : '') + (weekend ? ' weekend' : '');
        cell.textContent = day.getDate();
        cell.title = day.toLocaleDateString('ja-JP');
        scale.appendChild(cell);
      }
      head.appendChild(scale);
      chart.appendChild(head);

      /*
       * 目盛りと今日の線は、行ごとではなく1枚の下敷きに描く。
       * 行ごとに描くと行間で途切れ、日付を縦にたどれない。
       */
      var rows = document.createElement('div');
      rows.className = 'gantt-rows';

      var grid = document.createElement('div');
      grid.className = 'gantt-grid';
      rows.appendChild(grid);

      if (g.todayOffset >= 0 && g.todayOffset < g.days) {
        var todayLine = document.createElement('div');
        todayLine.className = 'gantt-today';
        todayLine.style.left = 'calc(var(--gantt-col) * ' + g.todayOffset + ')';
        grid.appendChild(todayLine);
      }

      // 行を束ねて見出しを付ける
      var byNumber = {};
      g.rows.forEach(function (r) { byNumber[r.number] = r; });

      groupIssues(issues, issueGroupSel.value).forEach(function (group) {
        var shown = group.issues
          .map(function (i) { return byNumber[i.number]; })
          .filter(function (r) { return !!r; });

        if (!shown.length) return;
        rows.appendChild(makeGroupHead(group.label, shown.length, group.key));
        if (collapsed[group.key]) return;

        shown.forEach(function (r) {
          var row = document.createElement('div');
          row.className = 'gantt-row';
          row.dataset.number = r.number;

          var name = document.createElement('button');
          name.className = 'gantt-name';

          // 親の下にあることを、字下げでも示す
          var depth = depthOf(r.number);
          if (depth) {
            row.classList.add('nested');
            name.style.paddingLeft = (depth * 14 + 8) + 'px';
          }

          name.appendChild(makeAvatars(r.assignee));

          var who = document.createElement('span');
          who.className = 'gantt-title';
          who.textContent = '#' + r.number + ' ' + r.title;
          name.appendChild(who);

          var rel = makeRelationChips(r.number);
          if (rel.childNodes.length) name.appendChild(rel);
          name.title = (r.assignee || '担当なし');
          name.addEventListener('click', function () {
            openIssueByNumber(r.number, row);
          });
          row.appendChild(name);

          var track = document.createElement('div');
          track.className = 'gantt-track';

          var bar = document.createElement('button');
          bar.className = 'gantt-bar' +
            (String(r.state) === 'closed' ? ' done' : '') +
            (r.overdue ? ' overdue' : '') +
            (r.hasDue ? '' : ' nodue');
          bar.style.gridColumn = (r.offset + 1) + ' / span ' + r.span;
          bar.appendChild(makeAvatars(r.assignee));

          var days = document.createElement('span');
          days.className = 'gantt-days';
          days.textContent = r.span + '人日';
          bar.appendChild(days);
          bar.title = '#' + r.number + ' ' + r.title +
            (r.hasDue ? '' : ' (期限なし)') + (r.overdue ? ' · 期限切れ' : '') +
            ' — 押すと中身を開きます。端を掴むと期限、真ん中を掴むと全体を動かせます';
          track.appendChild(bar);
          makeBarDraggable(bar, r, g, COL, row);

          row.appendChild(track);
          rows.appendChild(row);
        });
      });

      chart.appendChild(rows);
      ganttEl.appendChild(chart);
    }, failInto(ganttEl));
  }


  // ===== 工数の集計 =====

  var TALLY_UNITS = [
    ['week', '週ごと'], ['month', '月ごと'], ['quarter', '四半期ごと'],
    ['half', '半期ごと'], ['year', '年度ごと'],
  ];
  var TALLY_BASES = [
    ['due', '期限で数える'], ['closed', '完了日で数える'], ['start', '開始日で数える'],
  ];

  /**
   * 選択肢を詰める。
   *
   * @param {HTMLSelectElement} sel
   * @param {Array<Array<string>>} pairs
   */
  function fillSelect(sel, pairs, chosen) {
    if (sel.options.length) return;

    pairs.forEach(function (pair) {
      var opt = document.createElement('option');
      opt.value = pair[0];
      opt.textContent = pair[1];
      sel.appendChild(opt);
    });
    if (chosen) sel.value = chosen;
  }

  /**
   * 数を人日として出す。
   *
   * @param {number} n
   * @returns {string}
   */
  function daysText(n) {
    var v = Math.round((Number(n) || 0) * 100) / 100;
    return String(v);
  }

  /**
   * 差の出し方。超えていれば赤、下回っていれば緑。
   *
   * @param {number} diff
   * @returns {HTMLElement}
   */
  function makeDiffCell(diff) {
    var el = document.createElement('span');
    var v = Math.round((Number(diff) || 0) * 100) / 100;

    el.className = 'tally-diff' + (v > 0 ? ' over' : (v < 0 ? ' under' : ''));
    el.textContent = (v > 0 ? '+' : '') + v;
    return el;
  }

  /**
   * 集計を描く。
   *
   * 予定と実績を1件ずつ見ているうちは傾向が分からない。区切りごとに
   * 足し上げ、累計も並べる。
   */
  function loadTally() {
    // 既定は月ごと。週は細かすぎ、四半期は粗すぎて傾向が見えにくい
    fillSelect(tallyUnitSel, TALLY_UNITS, 'month');
    fillSelect(tallyBasisSel, TALLY_BASES, 'due');
    fillTallyWho();

    showSkeleton(tallyEl, 'list', 3);

    call('apiTallyEffort', [tallyUnitSel.value, tallyBasisSel.value, tallyWhoSel.value], function (result) {
      var res = result || { periods: [], people: [], total: {}, hidden: 0 };
      tallyEl.textContent = '';
      issueCountEl.textContent = 'チーム全体 ' + res.total.count + '件 / 予定 ' +
        daysText(res.total.planned) + '人日 · 実績 ' +
        daysText(res.total.actual) + '人日';

      if (!res.periods.length) {
        tallyEl.appendChild(makeBlankState(
          '集計できるやることがありません',
          '予定工数か実績工数を入れて、数える日 (期限・完了日・開始日) を' +
          '埋めたものが集まります。'
        ));
        return;
      }

      tallyEl.appendChild(makeTallySummary(res));
      tallyEl.appendChild(makeTallyTable(res));
      tallyEl.appendChild(makePeopleTable(res));

      if (res.hidden) {
        var scope = document.createElement('div');
        scope.className = 'tally-note row-meta';
        scope.textContent = '人ごとの内訳に出るのは自分' +
          (tallyScope.isManager ? 'と配下の人' : '') +
          'のぶんだけです。ほかの' + res.hidden +
          '件は全体の合計にだけ入っています。';
        tallyEl.appendChild(scope);
      }

      if (res.skipped) {
        var note = document.createElement('div');
        note.className = 'tally-note tally-skipped row-meta';
        note.textContent = res.skipped + '件は、数える日が空のため入っていません。' +
          '「数え方」を変えると入ることがあります。';
        tallyEl.appendChild(note);
      }
    }, failInto(tallyEl));
  }

  /**
   * 誰の内訳を見るかの選択肢を詰める。
   *
   * 見てよい人が自分だけなら、選ばせる意味がない。
   */
  function fillTallyWho() {
    if (tallyWhoSel.options.length) return;

    var pairs = [['', '見られる人ぜんぶ']];
    (tallyScope.canSee || []).forEach(function (who) {
      pairs.push([who, who === tallyScope.me
        ? '自分 (' + personName(who) + ')' : personName(who)]);
    });

    fillSelect(tallyWhoSel, pairs, '');
  }

  /**
   * 全体の合計。まず結論を出す。
   *
   * @param {object} res
   * @returns {HTMLElement}
   */
  function makeTallySummary(res) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-summary';

    [['予定', daysText(res.total.planned) + '人日'],
     ['実績', daysText(res.total.actual) + '人日'],
     ['差', null],
     ['件数', res.total.count + '件']].forEach(function (pair) {
      var box = document.createElement('div');
      box.className = 'tally-card';

      var label = document.createElement('div');
      label.className = 'row-meta';
      label.textContent = pair[0];
      box.appendChild(label);

      var value = document.createElement('div');
      value.className = 'tally-value';

      if (pair[1] === null) value.appendChild(makeDiffCell(res.total.diff));
      else value.textContent = pair[1];

      box.appendChild(value);
      wrap.appendChild(box);
    });
    return wrap;
  }

  /**
   * 区切りごとの表。累計も並べる。
   *
   * @param {object} res
   * @returns {HTMLElement}
   */
  function makeTallyTable(res) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-block';

    var head = document.createElement('h3');
    head.textContent = '区切りごと (チーム全体)';
    wrap.appendChild(head);

    var scroll = document.createElement('div');
    scroll.className = 'tally-scroll';

    var table = document.createElement('table');
    table.className = 'tally-table';

    var thead = document.createElement('thead');
    var hr = document.createElement('tr');
    ['区切り', '予定', '実績', '差', '累計予定', '累計実績', '件数']
      .forEach(function (name) {
        var th = document.createElement('th');
        th.textContent = name;
        hr.appendChild(th);
      });
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    res.periods.forEach(function (p) {
      var tr = document.createElement('tr');

      var name = document.createElement('th');
      name.scope = 'row';
      name.textContent = p.label;
      tr.appendChild(name);

      [daysText(p.sum.planned), daysText(p.sum.actual), null,
       daysText(p.cumulative.planned), daysText(p.cumulative.actual),
       String(p.sum.count)].forEach(function (text) {
        var td = document.createElement('td');
        if (text === null) td.appendChild(makeDiffCell(p.sum.diff));
        else td.textContent = text;
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    scroll.appendChild(table);
    wrap.appendChild(scroll);
    return wrap;
  }

  /**
   * 人ごとの表。区切りを横に並べる。
   *
   * @param {object} res
   * @returns {HTMLElement}
   */
  function makePeopleTable(res) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-block';

    var head = document.createElement('h3');
    head.textContent = '人ごと';
    hint(head, 'tally:people');
    wrap.appendChild(head);

    var scroll = document.createElement('div');
    scroll.className = 'tally-scroll';

    var table = document.createElement('table');
    table.className = 'tally-table';

    var thead = document.createElement('thead');
    var hr = document.createElement('tr');

    var corner = document.createElement('th');
    corner.textContent = '担当者';
    hr.appendChild(corner);

    res.periods.forEach(function (p) {
      var th = document.createElement('th');
      th.textContent = p.label;
      hr.appendChild(th);
    });

    var last = document.createElement('th');
    last.textContent = '合計';
    hr.appendChild(last);

    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    res.people.forEach(function (person) {
      var tr = document.createElement('tr');

      var name = document.createElement('th');
      name.scope = 'row';
      name.className = 'tally-who';
      var isNone = person.who === '(担当なし)';
      name.appendChild(makeAvatar(isNone ? '' : person.who));
      name.appendChild(isNone
        ? document.createTextNode('担当なし') : makePersonLabel(person.who));
      tr.appendChild(name);

      res.periods.forEach(function (p) {
        var cell = p.byPerson[person.who];
        var td = document.createElement('td');

        if (!cell) {
          td.className = 'tally-empty';
          td.textContent = '—';
        } else {
          td.appendChild(document.createTextNode(
            daysText(cell.planned) + ' / ' + daysText(cell.actual)));
          td.appendChild(makeDiffCell(cell.actual - cell.planned));
        }
        tr.appendChild(td);
      });

      var totalCell = document.createElement('td');
      totalCell.appendChild(document.createTextNode(
        daysText(person.total.planned) + ' / ' + daysText(person.total.actual)));
      totalCell.appendChild(makeDiffCell(person.total.diff));
      tr.appendChild(totalCell);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    scroll.appendChild(table);
    wrap.appendChild(scroll);

    var note = document.createElement('div');
    note.className = 'tally-note row-meta';
    note.textContent = 'それぞれ「予定 / 実績」と、その差です (人日)。' +
      '担当者が複数いる仕事は、頭数で割って数えています。';
    wrap.appendChild(note);
    return wrap;
  }

  var COLUMNS = [
    ['Backlog', 'これから'],
    ['In Progress', '作業中'],
    ['In Review', '確認中'],
    ['Done', '完了'],
  ];

  function loadBoard() {
    showSkeleton(boardEl, 'board');

    // 絞り込みに使うため、やることの中身も持っておく
    if (!lastIssues.length) {
      call('apiIssueList', [''],
        function (list) { lastIssues = list || []; },
        failQuiet('知らせなくてよい'));
    }

    call('apiProjectBoard', [], function (result) {
      var board = result || {};
      COLUMNS.forEach(function (c) { board[c[0]] = board[c[0]] || []; });
      boardEl.textContent = '';

      // 絞り込みは番号で当てる。カードは中身を全部持っていない
      var keep = null;
      if (String(issueFilterEl.value || '')) {
        keep = {};
        (lastIssues || []).filter(matchesFilter).forEach(function (i) {
          keep[i.number] = true;
        });
        COLUMNS.forEach(function (c) {
          board[c[0]] = board[c[0]].filter(function (card) {
            return keep[card.issueNumber];
          });
        });
      }

      var total = 0;
      COLUMNS.forEach(function (c) { total += board[c[0]].length; });
      issueCountEl.textContent = total + '枚';

      if (total === 0) {
        boardEl.appendChild(makeBlankState(
          'カードがありません',
          'カードは「やること」です。作ると「これから」に並び、' +
          '改訂版や確認依頼に応じて自動で右に動きます。',
          { label: 'やることを作る', onClick: createIssue }
        ));
        return;
      }

      COLUMNS.forEach(function (pair) {
        var column = pair[0];

        var col = document.createElement('div');
        col.className = 'board-column';

        var head = document.createElement('h3');
        head.textContent = pair[1] + ' (' + board[column].length + ')';
        hint(head, 'board:' + column);
        col.appendChild(head);

        col.addEventListener('dragover', function (e) {
          e.preventDefault();
          col.classList.add('drop-target');
        });
        col.addEventListener('dragleave', function () {
          col.classList.remove('drop-target');
        });
        col.addEventListener('drop', function (e) {
          e.preventDefault();
          col.classList.remove('drop-target');

          var issueNumber = Number(e.dataTransfer.getData('text/plain'));
          if (!issueNumber) return;

          call('apiProjectMove', [issueNumber, column, board[column].length],
            function () { loadBoard(); });
        });

        board[column].forEach(function (card) {
          var el = document.createElement('div');
          el.className = 'board-card';
          el.draggable = true;

          var num = document.createElement('span');
          num.className = 'card-number';
          num.textContent = '#' + card.issueNumber;
          el.appendChild(num);

          var title = document.createElement('div');
          title.className = 'card-title';
          title.textContent = card.title;
          el.appendChild(title);

          el.dataset.number = card.issueNumber;

          var rel = makeRelationChips(card.issueNumber);
          if (rel.childNodes.length) {
            var relBox = document.createElement('div');
            relBox.className = 'card-rel';
            relBox.appendChild(rel);
            el.appendChild(relBox);
          }

          var labelEls = makeLabels(card.labels);
          if (labelEls) el.appendChild(labelEls);
          applyRot(el, card);

          el.addEventListener('dragstart', function (e) {
            e.dataTransfer.setData('text/plain', String(card.issueNumber));
          });

          // 掴んで動かすだけでなく、押して中身を直せるようにする
          el.addEventListener('click', function () {
            openIssueByNumber(card.issueNumber, el);
          });
          el.tabIndex = 0;
          el.addEventListener('keydown', function (e) {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            e.preventDefault();
            openIssueByNumber(card.issueNumber, el);
          });

          var foot = document.createElement('div');
          foot.className = 'card-foot';

          var when = document.createElement('span');
          when.className = 'row-meta';
          when.textContent = card.dueDate
            ? '期限 ' + String(card.dueDate).substring(0, 10) : '';

          var cardPri = makePriorityChip(card);
          if (cardPri) when.appendChild(cardPri);

          var cardStale = makeStaleBadge(card);
          if (cardStale) when.appendChild(cardStale);
          foot.appendChild(when);
          foot.appendChild(makeAvatars(card.assignees || card.assignee));

          // 一覧と同じく、カードからも捨てられるようにする。
          // 板だけ捨てられないと、捨てるために一覧へ移る手間が要る
          foot.appendChild(makeArchiveButton(
            { number: card.issueNumber, title: card.title }, panelIssues));

          el.appendChild(foot);

          col.appendChild(el);
        });

        boardEl.appendChild(col);
      });
    }, failInto(boardEl));
  }

      'やることを捨てても、すぐには消えません。「捨てたもの」に30日置かれ、その間は戻せます。期限を過ぎたぶんは自動で片付きます。',
      'うまく動かないとき、こうしてほしいことがあるとき、使い方が分からないときは、左の「要望・不具合」から送ってください。見ている画面と使っている環境も一緒に届きます。',
      '送られたものは、開発者のやることに自動で積まれます。種類に応じて「不具合」「要望」のタグが付き、進捗ボードの「これから」に並びます。',
      '返信の中で「@名前」と書くと、その人に知らせが届きます。「@」を打つと候補が出るので、そこから選んでください。名簿に無い名前は誰にも届きません。',
      '報告はみんなが読めて、誰でも返信できます。同じことで困った人が先に答えを知っていることがあります。直ったら「解決した」を押してください (押せるのは出した本人と、このアプリの持ち主です)。',
      'やることが色あせて「◯日動きなし」と出るのは、しばらく動いていない印です。直すか、完了にするか、捨てるかを決めてください。完了したものは色あせません。',
    ]],
  ];

  function loadHelp() {
    if (guideEl.dataset.ready) return;

    /*
     * 目次は本文の右に置く。本文は 760px で止まるので、その右は空いている。
     *
     * 左の帯に出していたときは、道具そのものの行き先と混ざって何の目次か
     * 分からず、開くたびに左の並びが動いていた。
     */
    var toc = guideTocEl;
    toc.textContent = '';

    var tocHead = document.createElement('h2');
    tocHead.textContent = 'この頁の中身';
    toc.appendChild(tocHead);

    // 操作は読み物より先に置く。底に置くと、困ったときにしか開かれない
    // 場所に埋もれる
    var top = document.createElement('div');
    top.className = 'guide-foot guide-top';
    makeMeActions().forEach(function (el) { top.appendChild(el); });
    guideEl.appendChild(top);

    var tocItems = [];

    /**
     * 目次の項を作る。
     *
     * href の飛び先にはしない。この画面は枠の中で動いているため、
     * 場所が変わると外側の頁ごと動くことがある。押して寄せる
     *
     * @param {string} label
     * @param {HTMLElement} target 寄せたい見出し
     */
    function addToc(label, target) {
      var btn = document.createElement('button');
      btn.className = 'guide-toc-item';
      btn.textContent = label;
      btn.addEventListener('click', function () {
        target.scrollIntoView({ block: 'start', behavior: 'smooth' });
      });
      toc.appendChild(btn);
      tocItems.push({ btn: btn, target: target });
    }

    // 節ごとに、その話の図を先に置く。字だけの説明は読まれない。
    // 全部の節に置いてあるのは、図だけ見て帰れるようにするため
    var figures = {
      'このアプリについて': FLOW_DIAGRAM,
      '言葉の意味': VOCAB_DIAGRAM,
      '基本の流れ': STEPS_DIAGRAM,
      'はじめての設定 (最初の一人だけ)': SETUP_DIAGRAM,
      '手元から動かす (Claude / Codex)': QUEUE_DIAGRAM,
      'つまずきやすい点': CONFLICT_DIAGRAM,
    };

    GUIDE.forEach(function (section) {
      var h = document.createElement('h2');
      h.textContent = section[0];
      guideEl.appendChild(h);
      addToc(section[0], h);

      if (figures[section[0]]) {
        guideEl.appendChild(makeDiagram(figures[section[0]]));
      }

      var ul = document.createElement('ul');
      section[1].forEach(function (line) {
        var li = document.createElement('li');
        li.textContent = line;
        ul.appendChild(li);
      });
      guideEl.appendChild(ul);
    });

    var foot = document.createElement('div');
    foot.className = 'guide-foot';

    var who = document.createElement('span');
    who.className = 'row-meta';
    who.id = 'whoami';
    foot.appendChild(who);
    guideEl.appendChild(foot);

    /**
     * いま読んでいる節を目次の側で示す。
     *
     * どこを読んでいるのか分からないまま長い頁を送ると、戻る先を
     * 見失う。色だけでなく aria-current でも示す
     */
    function markToc() {
      var line = guideEl.scrollTop + 80;
      var at = 0;

      for (var i = 0; i < tocItems.length; i++) {
        if (tocItems[i].target.offsetTop <= line) at = i;
      }
      tocItems.forEach(function (item, i) {
        item.btn.setAttribute('aria-current', String(i === at));
      });
    }

    guideEl.addEventListener('scroll', markToc);
    markToc();

    guideEl.dataset.ready = '1';

    google.script.run
      .withSuccessHandler(function (info) {
        currentUser = info.activeUser;
        who.textContent = info.activeUser
          ? 'このアプリはあなたを ' + personName(info.activeUser) +
            ' (' + info.activeUser + ') として認識しています'
          : '警告: 利用者を特定できていません。この状態では記録に名前が残りません';
      })
      .withFailureHandler(function () { who.textContent = ''; })
      .apiWhoAmI();
  }

  // ===== 不具合を伝える =====

  var REPORT_KINDS = [
    ['bug', 'うまく動かない'],
    ['request', 'こうしてほしい (機能の要望)'],
    ['question', '使い方が分からない'],
    ['other', 'その他'],
  ];

  /**
   * 種類ごとの尋ね方。
   *
   * 不具合と要望では、聞くべきことが違う。「何をしましたか」は要望には
   * 答えようがなく、白紙のまま送られる。
   */
  var REPORT_ASKS = {
    bug: {
      summary: ['ひとことで言うと', '例: 工程表の棒が伸ばせない'],
      steps: ['何をしましたか', '例:\n1. やること → 工程表 を開く\n2. 棒の右端を掴む\n3. 右に引く'],
      actual: ['どうなりましたか', '例: 棒が伸びず、幅が変わらなかった'],
      expected: ['どうなってほしかったですか', '例: 期限が右に延びてほしかった'],
    },
    request: {
      summary: ['ひとことで言うと', '例: 期限が近いやることを先に出したい'],
      steps: ['いま何に困っていますか', '例: 一覧が番号順なので、急ぎのものを探すのに毎回スクロールしている'],
      actual: ['どうなるとよいですか', '例: 期限の近い順に並べ替えられるとよい'],
      expected: ['他に思いつくやり方があれば', '例: 期限が3日以内のものだけを出す絞り込みでもよい'],
    },
    question: {
      summary: ['ひとことで言うと', '例: 改訂版の消し方が分からない'],
      steps: ['何をしようとしていますか', '例: 使わなくなった改訂版を片付けたい'],
      actual: ['どこまで試しましたか', '例: 「改訂中の版」を見たが、それらしい操作が見つからない'],
      expected: ['補足があれば', ''],
    },
    other: {
      summary: ['ひとことで言うと', ''],
      steps: ['くわしく', ''],
      actual: ['いま分かっていること', ''],
      expected: ['補足があれば', ''],
    },
  };

  /**
   * どこで起きたかを集める。
   *
   * 「動かない」だけでは直せない。人に思い出させるより、そのとき
   * 画面が持っている手がかりを添える。
   *
   * @returns {string}
   */
  function reportContext() {
    var parts = ['画面: ' + currentTab];

    if (current.docPath) parts.push('文書: ' + current.docPath);
    if (current.branch) parts.push('版: ' + current.branch);
    if (currentTab === 'issues') parts.push('見え方: ' + issueView);

    parts.push('画面幅: ' + window.innerWidth + 'x' + window.innerHeight);
    parts.push('環境: ' + window.navigator.userAgent);
    return parts.join(' / ');
  }

  /**
   * 報告を書いてもらう。
   *
   * 白紙の1枚に「詳しく書いてください」と頼んでも、何を書けば直せるのか
   * は伝わらない。順番に尋ねて、こちらで1つの本文に組み立てる。
   *
   * @param {HTMLElement} [sourceEl]
   */
  function createReport(sourceEl) {
    var shots = [];

    var form = openInlineForm(
      '開発者に伝える',
      [
        { name: 'kind', label: '種類', choices: REPORT_KINDS },
        {
          name: 'summary',
          label: 'ひとことで言うと',
          required: true,
          placeholder: '例: 工程表の棒が伸ばせない',
        },
        {
          name: 'steps',
          label: '何をしましたか',
          required: true,
          multiline: true,
          placeholder: '例:\n1. やること → 工程表 を開く\n2. 棒の右端を掴む\n3. 右に引く',
        },
        {
          name: 'actual',
          label: 'どうなりましたか',
          required: true,
          multiline: true,
          placeholder: '例: 棒が伸びず、幅が変わらなかった',
        },
        {
          name: 'expected',
          label: 'どうなってほしかったですか',
          multiline: true,
          placeholder: '例: 期限が右に延びてほしかった',
        },
      ],
      '送る',
      function (v) {
        call('apiInquiryCreate', [v.kind, reportBody(v), reportContext(), shots], function (row) {
          showSnack('受付 #' + row.number + ' として送りました', { kind: 'ok' });
          closeSide();
          loadReports();
        });
      },
      sourceEl
    );

    form.insertBefore(makeShotPicker(shots, form),
      form.querySelector('.inline-form-actions'));

    // 本文の欄では人を呼べるようにする
    var areas = form.querySelectorAll('textarea');
    for (var i = 0; i < areas.length; i++) attachMentionPicker(areas[i]);

    // 種類によって聞くべきことが違う。選び直したら尋ね方も変える
    var kindSel = form.querySelector('select');
    var labels = form.querySelectorAll('label');
    var order = ['summary', 'steps', 'actual', 'expected'];

    function askAs(kind) {
      var asks = REPORT_ASKS[kind] || REPORT_ASKS.bug;

      order.forEach(function (name, at) {
        var label = labels[at + 1];
        if (!label) return;

        var field = label.querySelector('input, textarea');
        label.firstChild.textContent = asks[name][0];
        if (field) field.placeholder = asks[name][1];
      });
    }

    kindSel.addEventListener('change', function () { askAs(kindSel.value); });
    askAs(kindSel.value);

    var note = document.createElement('p');
    note.className = 'row-meta';
    note.textContent = '送ると、見ている画面と使っている環境も一緒に記録され、' +
      '開発者のやることに積まれます。';
    form.insertBefore(note, form.querySelector('.inline-form-actions'));

    form.querySelector('input').focus();
  }

  /**
   * 尋ねた答えを1つの本文に組み立てる。
   *
   * 見出しを揃えておくと、後から読む人が同じ順番で追える。
   *
   * @param {Object<string,string>} v
   * @returns {string}
   */
  function reportBody(v) {
    var parts = [v.summary];

    parts.push('', '【何をしたか】', v.steps);
    parts.push('', '【どうなったか】', v.actual);
    if (String(v.expected || '').replace(/^\s+|\s+$/g, '')) {
      parts.push('', '【どうなってほしかったか】', v.expected);
    }
    return parts.join('\n');
  }

  /**
   * 画像を添える欄を作る。
   *
   * 選ぶだけでなく貼り付けでも入れられるようにする。画面の写真は
   * 撮った直後がいちばん貼りやすい。
   *
   * @param {string[]} shots 入れ物。ここに data URL を貯める
   * @param {HTMLElement} form 貼り付けを拾う相手
   * @returns {HTMLElement}
   */
  function makeShotPicker(shots, form) {
    var MAX = 4;
    var wrap = document.createElement('div');
    wrap.className = 'shot-picker';

    var label = document.createElement('div');
    label.className = 'row-meta';
    label.textContent = '画面の写真 (任意・' + MAX + '枚まで)';
    wrap.appendChild(label);

    var list = document.createElement('div');
    list.className = 'shot-list';
    wrap.appendChild(list);

    var pick = document.createElement('input');
    pick.type = 'file';
    pick.accept = 'image/png,image/jpeg,image/gif,image/webp';
    pick.multiple = true;
    pick.className = 'shot-input';
    pick.setAttribute('aria-label', '画面の写真を選ぶ');
    wrap.appendChild(pick);

    var hint = document.createElement('div');
    hint.className = 'row-meta';
    hint.textContent = 'ここに貼り付け (Ctrl+V) でも入れられます';
    wrap.appendChild(hint);

    function draw() {
      list.textContent = '';

      shots.forEach(function (data, i) {
        var item = document.createElement('div');
        item.className = 'shot-item';

        var img = document.createElement('img');
        img.src = data;
        img.alt = '添えた写真 ' + (i + 1) + '枚目';
        item.appendChild(img);

        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn btn-danger';
        del.appendChild(makeIcon('trash'));
        del.title = 'この写真を外す';
        del.setAttribute('aria-label', del.title);
        del.addEventListener('click', function () {
          shots.splice(i, 1);
          draw();
        });
        item.appendChild(del);

        list.appendChild(item);
      });
    }

    function add(file) {
      if (!file || String(file.type).indexOf('image/') !== 0) return;
      if (shots.length >= MAX) {
        showSnack('写真は' + MAX + '枚までです', { kind: 'ng' });
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        showSnack('写真は1枚5MBまでです', { kind: 'ng' });
        return;
      }

      var reader = new FileReader();
      reader.onload = function () {
        shots.push(String(reader.result));
        draw();
      };
      reader.readAsDataURL(file);
    }

    pick.addEventListener('change', function () {
      for (var i = 0; i < pick.files.length; i++) add(pick.files[i]);
      pick.value = '';
    });

    form.addEventListener('paste', function (e) {
      var items = (e.clipboardData && e.clipboardData.items) || [];
      for (var i = 0; i < items.length; i++) {
        if (String(items[i].type).indexOf('image/') !== 0) continue;
        add(items[i].getAsFile());
        e.preventDefault();
      }
    });

    return wrap;
  }

  /**
   * 画面に出す呼び名を決める。
   *
   * ふだんは名前だけで足りる。同じ名前が2人いるときだけ、どちらか
   * 分かるようにアドレスごと出す。
   *
   * @param {string} email
   * @returns {string}
   */
  function mentionLabel(email) {
    var name = String(email || '').split('@')[0];
    var same = roster.filter(function (one) {
      return String(one).split('@')[0].toLowerCase() === name.toLowerCase();
    });

    return same.length > 1 ? String(email) : name;
  }

  /**
   * 呼び名を名簿の誰かに結び付ける。src/core/Mention.js と同じもの。
   *
   * @param {string} token
   * @returns {string}
   */
  function mentionMatch(token) {
    var want = String(token || '').toLowerCase();
    if (!want) return '';

    for (var i = 0; i < roster.length; i++) {
      var one = String(roster[i] || '');
      var low = one.toLowerCase();

      if (low === want) return one;
      if (want.indexOf('@') < 0 && low.split('@')[0] === want) return one;
    }
    return '';
  }

  /**
   * 呼び出しに色を付けた本文を作る。
   *
   * 画面は textContent だけで組み立てる決まりなので、切り分けてから
   * 節ごとに要素にする。
   *
   * @param {string} text
   * @returns {HTMLElement}
   */
  function makeBodyWithMentions(text) {
    var box = document.createElement('div');
    box.className = 'comment-body';

    var src = String(text || '');
    var re = /@([A-Za-z0-9._%+-]+(?:@[A-Za-z0-9.-]+\.[A-Za-z]{2,})?)/g;
    var at = 0;
    var m;

    while ((m = re.exec(src)) !== null) {
      var who = mentionMatch(m[1]);
      if (!who) continue;

      if (m.index > at) {
        box.appendChild(document.createTextNode(src.substring(at, m.index)));
      }

      var tag = document.createElement('span');
      tag.className = 'mention' + (who === currentUser ? ' me' : '');
      tag.textContent = m[0];
      tag.title = who;
      box.appendChild(tag);

      at = m.index + m[0].length;
    }

    if (at < src.length) box.appendChild(document.createTextNode(src.substring(at)));
    return box;
  }

  /**
   * 「@」を打ったら名簿から選べるようにする。
   *
   * 名簿に無い呼び出しは誰にも届かない。打ち間違いに気づけるよう、
   * 候補を出して選ばせる。
   *
   * @param {HTMLTextAreaElement} input
   */
  function attachMentionPicker(input) {
    var box = document.createElement('div');
    box.className = 'mention-picker';
    box.hidden = true;
    input.parentNode.insertBefore(box, input.nextSibling);

    function close() {
      box.hidden = true;
      box.textContent = '';
    }

    function pick(who, from) {
      var before = input.value.substring(0, from);
      var after = input.value.substring(input.selectionStart);
      var name = mentionLabel(who);

      input.value = before + '@' + name + ' ' + after;
      input.focus();
      input.selectionStart = input.selectionEnd = (before + '@' + name + ' ').length;
      close();
    }

    input.addEventListener('input', function () {
      var upto = input.value.substring(0, input.selectionStart);
      var m = /@([A-Za-z0-9._%+-]*)$/.exec(upto);
      if (!m) return close();

      var want = m[1].toLowerCase();
      var hits = roster.filter(function (one) {
        if (!want) return true;

        // 名前でもアドレスでも探せるようにする。どちらで覚えているかは人による
        return String(one).toLowerCase().indexOf(want) >= 0 ||
          personName(one).toLowerCase().indexOf(want) >= 0;
      }).slice(0, 6);

      if (!hits.length) return close();

      box.textContent = '';
      hits.forEach(function (who) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mention-option';
        btn.appendChild(makeAvatar(who));

        var name = document.createElement('span');
        name.className = 'mention-name';
        name.textContent = personName(who);
        btn.appendChild(name);

        var addr = document.createElement('span');
        addr.className = 'row-meta';
        addr.textContent = who;
        btn.appendChild(addr);

        btn.addEventListener('click', function () {
          pick(who, m.index);
        });
        box.appendChild(btn);
      });
      box.hidden = false;
    });

    input.addEventListener('blur', function () {
      // 候補を押すより先に閉じてしまわないよう、一拍おく
      window.setTimeout(close, 150);
    });
  }

  /**
   * 添えられた写真を並べる。
   *
   * @param {Array<{url:string, thumb:string}>} shots
   * @returns {HTMLElement|null}
   */
  function makeShotStrip(shots) {
    if (!shots || !shots.length) return null;

    var strip = document.createElement('div');
    strip.className = 'shot-list';

    shots.forEach(function (shot, i) {
      var a = document.createElement('a');
      a.className = 'shot-item';
      a.href = shot.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = '大きく見る';

      var img = document.createElement('img');
      img.src = shot.thumb;
      img.alt = '添えられた写真 ' + (i + 1) + '枚目';
      img.loading = 'lazy';
      // 見られないときは代わりに文字の手がかりを出す
      img.addEventListener('error', function () {
        img.remove();
        a.textContent = '写真 ' + (i + 1) + '枚目を開く';
      });
      a.appendChild(img);

      strip.appendChild(a);
    });
    return strip;
  }

  /**
   * 報告を並べる。
   *
   * 全員が全部を読める。同じところでつまずいた人が先に答えを知って
   * いることがあり、自分のぶんしか見えないと誰も助け合えない。
   */
  function loadReports() {
    showSkeleton(reportListEl, 'list', 3);

    call('apiInquiryList', [], function (list) {
      var rows = list || [];
      reportListEl.textContent = '';
      setCount('count-reports', rows.filter(function (r) {
        return r.state === 'open';
      }).length);

      var shown = rows.filter(matchesReport);

      if (rows.length && !shown.length) {
        reportDetail.textContent = '';
        reportListEl.appendChild(makeBlankState(
          '絞り込みに合う報告がありません',
          '絞り込みを消すか、「未解決だけ」を外してみてください。'
        ));
        return;
      }

      if (!rows.length) {
        reportDetail.textContent = '';
        reportListEl.appendChild(makeBlankState(
          'まだ何も伝えていません',
          'うまく動かないこと、こうしてほしいこと、分からないことを送って' +
          'ください。見ている画面と環境も一緒に届き、開発者のやることに積まれます。',
          { label: '開発者に伝える', onClick: createReport }
        ));
        return;
      }

      shown.forEach(function (r) {
        var btn = document.createElement('button');
        // 済んだものは一段沈める。まだ手の要るものを先に拾えるようにする
        btn.className = 'row-item' + (r.state === 'done' ? ' resolved' : '');
        btn.dataset.number = r.number;

        var main = document.createElement('div');
        main.className = 'row-main';

        var title = document.createElement('div');
        title.className = 'row-title';
        title.textContent = '#' + r.number + ' ' + r.title;
        main.appendChild(title);

        var meta = document.createElement('div');
        meta.className = 'row-meta';
        meta.textContent = r.kindLabel + ' · ' + personName(r.by) + ' · ' +
          String(r.at).substring(0, 10) +
          (r.replyCount ? ' · 返信 ' + r.replyCount + '件' : '');
        main.appendChild(meta);

        var open = document.createElement('div');
        open.className = 'row-open';
        open.appendChild(makeIcon(r.state === 'done' ? 'check' : 'inbox'));
        open.appendChild(main);
        btn.appendChild(open);

        var state = document.createElement('span');
        state.className = 'state' + (r.state === 'done' ? ' state-merged' : '');
        state.textContent = r.state === 'done' ? '解決' : '未解決';
        btn.appendChild(state);

        btn.addEventListener('click', function () { openReport(r.number); });
        reportListEl.appendChild(btn);
      });

      // 開いていた話を開き直す。返信するたび先頭に戻ると読み進められない
      var keep = reportShown &&
        shown.filter(function (r) { return r.number === reportShown; })[0];
      openReport(keep ? keep.number : (shown[0] && shown[0].number));
    }, failInto(reportListEl));
  }

  /**
   * 絞り込みに残すかを決める。
   *
   * @param {object} r
   * @returns {boolean}
   */
  function matchesReport(r) {
    if (reportOpenOnly && r.state === 'done') return false;

    var q = String(reportFilterEl.value || '').toLowerCase()
      .replace(/^\s+|\s+$/g, '');
    if (!q) return true;

    return ['#' + r.number, r.title, r.body, r.kindLabel, r.by]
      .join(' ').toLowerCase().indexOf(q) >= 0;
  }

  /**
   * 話を開く。
   *
   * @param {number} number
   */
  function openReport(number) {
    reportShown = number || null;

    var items = reportListEl.querySelectorAll('.row-item');
    for (var i = 0; i < items.length; i++) {
      items[i].setAttribute('aria-current',
        String(Number(items[i].dataset.number) === Number(number)));
    }

    if (!number) {
      reportDetail.textContent = '';
      return;
    }
    showSkeleton(reportDetail, 'block');

    call('apiInquiryThread', [number], function (thread) {
      if (!thread) return;
      renderReportThread(thread.inquiry, thread.replies || []);
    }, failInto(reportDetail));
  }

  /**
   * 話の中身を描く。
   *
   * @param {object} q
   * @param {object[]} replies
   */
  function renderReportThread(q, replies) {
    reportDetail.textContent = '';

    var head = document.createElement('div');
    head.className = 'pr-title';
    head.textContent = '#' + q.number + ' ' + q.title;
    reportDetail.appendChild(head);

    var meta = document.createElement('div');
    meta.className = 'row-meta';
    meta.textContent = q.kindLabel + ' · ' + personName(q.by) + ' · ' +
      String(q.at).substring(0, 10) +
      (q.state === 'done'
        ? ' · 解決' + (q.closedBy ? ' (' + personName(q.closedBy) + ')' : '') : '');
    reportDetail.appendChild(meta);

    if (q.issueNumber) {
      var link = document.createElement('button');
      link.className = 'rel-chip';
      link.appendChild(makeIcon('corner-down-right'));
      link.appendChild(document.createTextNode('やること #' + q.issueNumber));
      attachHint(link, 'この報告から作られた、開発者のやることに移ります');

      link.addEventListener('click', function () {
        switchTab('issues');
        setIssueView('list');
        focusIssue(q.issueNumber);
      });
      reportDetail.appendChild(link);
    }

    if (q.canClose) {
      var actions = document.createElement('div');
      actions.className = 'pr-actions';

      var toggle = document.createElement('button');
      toggle.className = 'btn' + (q.state === 'done' ? '' : ' btn-primary');
      toggle.appendChild(makeIcon(q.state === 'done' ? 'back' : 'check'));
      toggle.appendChild(document.createTextNode(
        q.state === 'done' ? 'まだ解決していない' : '解決した'));

      toggle.addEventListener('click', function () {
        toggle.disabled = true;
        var run = google.script.run
          .withSuccessHandler(function () { loadReports(); })
          .withFailureHandler(function (err) {
            toggle.disabled = false;
            showSnack(err.message, { kind: 'ng' });
          });

        if (q.state === 'done') run.apiInquiryReopen(q.number);
        else run.apiInquiryClose(q.number);
      });

      actions.appendChild(toggle);
      reportDetail.appendChild(actions);
    }

    var first = document.createElement('div');
    first.className = 'comment';
    first.appendChild(makeCommentHead(q.by, 'が報告'));

    first.appendChild(makeBodyWithMentions(q.body));

    var firstShots = makeShotStrip(q.shots);
    if (firstShots) first.appendChild(firstShots);

    if (q.context) {
      var ctx = document.createElement('details');
      ctx.className = 'report-context';

      var sum = document.createElement('summary');
      sum.textContent = 'そのときの状況';
      ctx.appendChild(sum);

      var pre = document.createElement('div');
      pre.className = 'comment-body';
      pre.textContent = q.context;
      ctx.appendChild(pre);
      first.appendChild(ctx);
    }
    reportDetail.appendChild(first);

    replies.forEach(function (r) {
      var el = document.createElement('div');
      el.className = 'comment';

      var h = makeCommentHead(r.by, String(r.at).substring(0, 10) +
        (r.editedAt ? ' · 直しました' : ''));
      if (r.canEdit) h.appendChild(makeReplyTools(r, el));
      el.appendChild(h);

      el.appendChild(makeBodyWithMentions(r.body));

      var replyShots = makeShotStrip(r.shots);
      if (replyShots) el.appendChild(replyShots);

      reportDetail.appendChild(el);
    });

    reportDetail.appendChild(makeReplyForm(q));
  }

  /**
   * 自分の返信を直す / 消す。
   *
   * @param {object} reply
   * @param {HTMLElement} host
   * @returns {HTMLElement}
   */
  function makeReplyTools(reply, host) {
    var tools = document.createElement('span');
    tools.className = 'comment-tools';

    var edit = document.createElement('button');
    edit.className = 'icon-btn';
    edit.appendChild(makeIcon('pencil'));
    edit.title = 'この返信を直す';
    edit.setAttribute('aria-label', edit.title);
    edit.addEventListener('click', function () {
      var form = openInlineForm(
        '返信を直す',
        [{ name: 'body', label: '中身', required: true, multiline: true }],
        '直す',
        function (v) {
          call('apiInquiryReplyEdit', [reply.id, v.body], function () {
            showSnack('返信を直しました', { kind: 'ok' });
            closeSide();
            openReport(reply.inquiryNumber);
          });
        },
        host
      );
      form.querySelector('textarea').value = reply.body || '';
    });
    tools.appendChild(edit);

    var del = document.createElement('button');
    del.className = 'btn btn-danger';
    del.appendChild(makeIcon('trash'));
    del.title = 'この返信を消す';
    del.setAttribute('aria-label', del.title);
    del.addEventListener('click', function () {
      openConfirmStrip(reportDetail,
        'この返信を消します。元には戻せません。',
        '消す',
        function () {
          call('apiInquiryReplyDelete', [reply.id], function (msg) {
            showSnack(msg, { kind: 'ok' });
            openReport(reply.inquiryNumber);
          });
        });
    });
    tools.appendChild(del);
    return tools;
  }

  /**
   * 返信を書く欄。
   *
   * @param {object} q
   * @returns {HTMLElement}
   */
  function makeReplyForm(q) {
    var shots = [];
    var form = document.createElement('div');
    form.className = 'comment-form';

    var input = document.createElement('textarea');
    input.placeholder =
      '同じことが起きた、こうしたら直った、など (@ で人を呼べます)';
    form.appendChild(input);
    attachMentionPicker(input);

    form.appendChild(makeShotPicker(shots, form));

    var send = document.createElement('button');
    send.className = 'btn btn-primary';
    send.textContent = '返信する';
    send.addEventListener('click', function () {
      if (!input.value) return;
      send.disabled = true;

      call('apiInquiryReply', [q.number, input.value, shots], function () {
        showSnack('返信しました', { kind: 'ok' });

      }, failEnable(send));

    form.appendChild(send);

  // ===== Google ToDo との同期 (オプション) =====

  var tasksState = { available: false, listId: '', lists: [] };

  /**
   * 使える環境かを見て、使えるときだけ入口を出す。
   *
   * 拡張サービスを足していない環境で押せるボタンを出しても、押した先で
   * 断られるだけになる。
   */
  function loadTasksState() {
    call('apiTasksState', [], function (res) {
      tasksState = res || { available: false, listId: '', lists: [] };
      var btn = document.getElementById('tasks-btn');

      btn.hidden = !tasksState.available;
      btn.title = tasksState.listId
        ? '自分の担当を Google ToDo と同期します'
        : '入れ先の ToDo リストを選びます';
    }, failQuiet('使えないだけ'));
  }

  /**
   * 同期の入口。入れ先が決まっていなければ先に選んでもらう。
   *
   * @param {HTMLElement} sourceEl
   */
  function openTasks(sourceEl) {
    if (!tasksState.listId) return chooseTasksList(sourceEl);

    var btn = document.getElementById('tasks-btn');
    btn.disabled = true;

    call('apiTasksSync', [], function (res) {
      btn.disabled = false;
      var msg = (res.pushed || 0) + '件を ToDo に送りました';
      if (res.closed) msg += ' / ' + res.closed + '件を完了にしました';

      showSnack(msg, { kind: 'ok' });
      refreshIssueViews();
    }, failEnable(btn));
  }

  /**
   * 入れ先の ToDo リストを選ばせる。
   *
   * @param {HTMLElement} sourceEl
   */
  function chooseTasksList(sourceEl) {
    var choices = (tasksState.lists || []).map(function (one) {
      return [one.id, one.title];
    });

    if (!choices.length) {
      showSnack('ToDo リストが見つかりません', { kind: 'ng' });
      return;
    }

    var form = openInlineForm(
      'Google ToDo と同期する',
      [{ name: 'listId', label: '入れ先のリスト', choices: choices }],
      '決める',
      function (v) {
        call('apiTasksChooseList', [v.listId], function (id) {
          tasksState.listId = id;
          showSnack('入れ先を決めました。もう一度押すと同期します',
            { kind: 'ok' });
          loadTasksState();
        });
      },
      sourceEl
    );

    var note = document.createElement('p');
    note.className = 'row-meta';
    note.textContent =
      '自分が担当で、まだ終わっていないやることだけを送ります。' +
      'ToDo 側で完了にすると、こちらも完了になります。';
    form.insertBefore(note, form.querySelector('.inline-form-actions'));
  }

  // ===== 文書を登録する =====

  /**
   * 正式版の入れ物にある文書を、画面から登録させる。
   *
   * ファイルの id を調べてスクリプトプロパティに書く、という手順は、
   * この道具を使う人の仕事ではない。入れ物を覗いて、見つかったものを
   * 選ばせる。
   *
   * @param {HTMLElement} [sourceEl]
   */
  function addDocs(sourceEl) {
    var box = openSideView('文書を登録する', sourceEl, null);

    var lead = document.createElement('p');
    lead.className = 'row-meta';
    lead.textContent = '正式版の入れ物 (main) を見ています…';
    box.appendChild(lead);

    call('apiFoundFiles', [],
      function (list) { draw(list || []); },
      failInto(lead));

    function draw(found) {
      box.textContent = '';

      if (!found.length) {
        box.appendChild(makeBlankState(
          '登録できる文書が見つかりません',
          'Google ドライブで、この道具の「main」フォルダに文書を入れてから、' +
          'もう一度開いてください。'
        ));
        addFolderLink(box);
        return;
      }

      var head = document.createElement('p');
      head.className = 'row-meta';
      head.textContent = '入れ物の中にある、まだ登録していない文書です。' +
        '管理したいものを選んでください。';
      box.appendChild(head);

      var list = document.createElement('div');
      list.className = 'bulk-list';
      var checks = [];

      found.forEach(function (one) {
        var row = document.createElement('label');
        row.className = 'bulk-row';

        var check = document.createElement('input');
        check.type = 'checkbox';
        check.value = one.fileId;
        check.checked = one.ok;
        check.disabled = !one.ok;
        checks.push(check);
        row.appendChild(check);

        row.appendChild(makeIcon(one.ok ? 'file-text' : 'help-circle'));

        var name = document.createElement('span');
        name.textContent = one.name;
        row.appendChild(name);

        if (!one.ok) {
          var why = document.createElement('span');
          why.className = 'row-meta';
          why.textContent = one.why;
          row.appendChild(why);
        }
        list.appendChild(row);
      });
      box.appendChild(list);

      var go = document.createElement('button');
      go.className = 'btn btn-primary';
      go.textContent = '登録する';
      go.addEventListener('click', function () {
        var ids = checks.filter(function (c) { return c.checked; })
          .map(function (c) { return c.value; });

        if (!ids.length) {
          showSnack('登録するものが選ばれていません', { kind: 'ng' });
          return;
        }
        go.disabled = true;

        call('apiRegisterFiles', [ids], function (res) {
          go.disabled = false;
          var text = res.added.length + '件を登録しました';

          if (res.failed.length) {
            text += ' / ' + res.failed.length + '件できませんでした';
          }
          showSnack(text, { kind: res.failed.length ? 'ng' : 'ok' });

          closeSide();
          loadFiles(function () { switchTab('docs'); });
        }, failEnable(go));
      });
      box.appendChild(go);

      addFolderLink(box);
    }

    function addFolderLink(host) {
      call('apiMainFolderUrl', [], function (url) {
        if (!url) return;

        var link = document.createElement('a');
        link.className = 'btn';
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = '入れ物を Drive で開く';
        host.appendChild(link);
      }, failQuiet('開く口が無いだけ'));
    }
  }

   * 名前を決める・道具を落とす・案内を出し直すは、読み物ではなく操作で
   * ある。使い方の頁の底に置くと、困ったときにしか開かれない場所に
   * 埋もれる。上の帯からいつでも開ける形にする。

   */
  /**
   * 道具を落とすボタンを作る。

   * 片方だけ直って食い違う。

  function makeKitButton(label) {
    var kit = document.createElement('button');
    kit.className = 'btn btn-primary';
    kit.appendChild(makeIcon('save'));
    kit.appendChild(document.createTextNode(label || '手元から動かす道具を落とす'));
    attachHint(kit,
      '画面を開かずに、やること・改訂版・確認依頼を作れる小さな道具です。' +
      'Claude や Codex に読ませる説明も入っています');

      call('apiAgentKit', [], function (res) {

        if (!res) return;

        window.open(res.url, '_blank');
        showSnack(res.name + ' を落としています', { kind: 'ok' });
        openKitSteps(res);

  /**
   * 写して貼れる一行を作る。
   *
   * 目で読んで打ち直させると、必ずどこかで間違える。
   *
   * @param {string} label
   * @param {string} value
   * @returns {HTMLElement}
   */
  function makeCopyRow(label, value) {
    var wrap = document.createElement('div');
    wrap.className = 'copy-row';

    var name = document.createElement('div');
    name.className = 'row-meta';
    name.textContent = label;
    wrap.appendChild(name);

    var line = document.createElement('div');
    line.className = 'copy-line';

    var text = document.createElement('code');
    text.textContent = value;
    line.appendChild(text);

    var btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '写す';
    btn.addEventListener('click', function () {
      var area = document.createElement('textarea');

    return wrap;

  // ===== 使われ方の記録 =====

  /**
   * 溜めておく数。押すたびに送るとスプレッドシートが持たない。
   */
  var usageBuffer = {};

  /**
   * 場所の名前を決める。
   *
   * 名前を付けていないものは数えない。無名のものまで拾うと、作りかけの
   * 画面から知らない名前が大量に流れ込む。
   *
   * @param {EventTarget} target
   * @returns {string} 数えないなら空文字
   */
  function usageTargetOf(target) {
    var el = target;

    while (el && el !== document) {
      if (el.id && /^[A-Za-z0-9:_-]{1,60}$/.test(el.id)) return el.id;

      if (el.dataset && el.dataset.tab) return 'tab-' + el.dataset.tab;
      if (el.dataset && el.dataset.track) return el.dataset.track;

      // 一覧の行やカードは、1つずつではなく種類でまとめて数える
      if (el.classList) {
        if (el.classList.contains('row-open')) return 'row-open';
        if (el.classList.contains('board-card')) return 'board-card';
        if (el.classList.contains('gantt-bar')) return 'gantt-bar';
        if (el.classList.contains('doc-open')) return 'doc-open';
        if (el.classList.contains('commit-item')) return 'commit-item';
        if (el.classList.contains('rel-chip')) return 'rel-chip';
      }
      el = el.parentNode;
    }
    return '';
  }

  /**
   * 1つ数える。
   *
   * @param {string} kind 'view' | 'action'
   * @param {string} target
   */
  function usageCount(kind, target) {
    if (!target) return;

    var key = kind + '\t' + target;
    usageBuffer[key] = (usageBuffer[key] || 0) + 1;
  }

  /**
   * 溜めたぶんを送る。
   */
  function usageFlush() {
    var rows = [];

    for (var key in usageBuffer) {
      if (!Object.prototype.hasOwnProperty.call(usageBuffer, key)) continue;

      var parts = key.split('\t');
      rows.push({ kind: parts[0], target: parts[1], count: usageBuffer[key] });
    }
    if (!rows.length) return;

    usageBuffer = {};
    call('apiUsageRecord', [rows], function () {}, failQuiet('数えられなくても操作はできる'));
  }

  /**

   *
   * @param {string} target
   * @returns {string}
   */
  function usageLabel(target) {
    var known = {
      'row-open': 'やること・報告の行を開く',
      'board-card': '進捗ボードのカード',
      'gantt-bar': '工程表の棒',
      'doc-open': '文書を開く',
      'commit-item': '履歴の記録',
      'rel-chip': '親子への行き先',
      'issue-create-btn': 'やることを作る',
      'report-btn': '開発者に伝える',
      'commit-btn': '変更を記録',
      'bulk-commit-btn': 'まとめて記録',
      'branch-create-btn': '改訂版を作る',
      'draft-create-btn': 'この文書の改訂版を作る',
      'bell-btn': '知らせ',
      'theme-btn': '画面の明るさ',
      'side-edit': '直す (鉛筆)',
      'mine-btn': '自分の担当だけ',
      'tasks-btn': 'Google ToDo と同期',
    };

    if (known[target]) return known[target];

    var tab = /^tab-(.+)$/.exec(target);
    if (tab) {
      var names = {
        docs: '文書', issues: 'やること', branches: '改訂中の版',
        pulls: '確認依頼', help: '使い方', report: '要望・不具合',
        usage: '使われ方', content: '本文', history: '改訂の履歴',
        drafts: 'この文書の改訂版',
      };
      return names[tab[1]] || tab[1];
    }
    return target;
  }

  /**
   * 使われ方を描く。
   *
   * どこが使われていないかを見るためのもの。場所ごとの合計は誰が見ても
   * 全員ぶん。人ごとの数と絞り込みは、本人と部下のぶんだけ届く
   * (サーバ側の apiUsageSummary が絞る。工数の集計と同じ)。
   */
  function loadUsage() {
    fillSelect(usageDaysSel, USAGE_SPANS, '30');

    // いま溜めているぶんも含めて見たい
    usageFlush();
    showSkeleton(usageEl, 'list', 4);

    call('apiUsageSummary', [Number(usageDaysSel.value) || 30, usageWhoSel.value], function (res) {
      var data = res || { total: 0, byTarget: [], byDay: [], byUser: [] };
      fillUsageWho(data.byUser || []);
      usageEl.textContent = '';

      if (!data.total && !(data.byUser || []).length) {
        usageEl.appendChild(makeBlankState(
          'まだ記録がありません',
          'しばらく使うと、どこがよく押されているかがここに出ます。'
        ));
        return;
      }

      usageEl.appendChild(makeUsageSummary(data));
      usageEl.appendChild(makeUsagePeople(data.byUser || []));
      usageEl.appendChild(makeUsageRanking('よく押されている操作',
        data.byTarget.filter(function (t) { return t.kind === 'action'; })));
      usageEl.appendChild(makeUsageRanking('よく開かれている画面',
        data.byTarget.filter(function (t) { return t.kind === 'view'; })));
      usageEl.appendChild(makeUsageDays(data.byDay));
    }, failInto(usageEl));
  }

   *
   * @param {object[]} people

  function fillUsageWho(people) {
    var want = usageWhoSel.value;
    usageWhoSel.textContent = '';

    var pairs = [['', 'みんなの合計']];
    people.forEach(function (one) {
      pairs.push([one.who, personName(one.who) || '(不明)']);
    });

      var opt = document.createElement('option');
      opt.value = pair[0];
      opt.textContent = pair[1];
      usageWhoSel.appendChild(opt);
    });

  }

  /**
   * よく使っている人を多い順に並べる。
   *
   * 押すとその人のぶんに絞る。誰が使っているかを見てから、その人が
   * どこを使っているかに進める
   *
   * @param {object[]} people
   * @returns {HTMLElement}
   */
  function makeUsagePeople(people) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-block';

    var head = document.createElement('h3');
    head.textContent = 'よく使っている人';
    wrap.appendChild(head);

    if (!people.length) {
      var none = document.createElement('div');
      none.className = 'row-meta';
      none.textContent = 'まだ記録がありません';
      wrap.appendChild(none);
      return wrap;
    }

    var top = people[0].count || 1;
    var list = document.createElement('div');
    list.className = 'usage-list';

    people.slice(0, 15).forEach(function (row, at) {
      var line = document.createElement('button');
      line.className = 'usage-row usage-person';
      line.setAttribute('aria-label', personName(row.who) + ' のぶんだけを見る');
      attachHint(line, 'この人が使っているところだけを見ます');

      line.addEventListener('click', function () {
        usageWhoSel.value = row.who;
        loadUsage();
      });

      var rank = document.createElement('span');
      rank.className = 'usage-rank';
      rank.textContent = (at + 1);
      line.appendChild(rank);

      var name = document.createElement('span');
      name.className = 'usage-name';
      name.appendChild(makeAvatar(row.who));
      name.appendChild(document.createTextNode(personName(row.who) || '(不明)'));
      line.appendChild(name);

      var track = document.createElement('span');
      track.className = 'usage-track';

      var bar = document.createElement('span');
      bar.className = 'usage-bar';
      bar.style.width = Math.max(2, Math.round(row.count / top * 100)) + '%';
      track.appendChild(bar);
      line.appendChild(track);

      var count = document.createElement('span');
      count.className = 'usage-count';
      count.textContent = row.count;
      line.appendChild(count);

      list.appendChild(line);
    });

    wrap.appendChild(list);
    return wrap;
  }

  /**
   * @param {object} data
   * @returns {HTMLElement}
   */
  function makeUsageSummary(data) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-summary';

    [['数えた回数', data.total + '回'],
     ['数えた場所', data.byTarget.length + 'か所'],
     ['対象', data.who ? personName(data.who) : 'みんな'],
     ['期間', data.from + ' 〜 ' + data.to]].forEach(function (pair) {
      var box = document.createElement('div');
      box.className = 'tally-card';

      var label = document.createElement('div');
      label.className = 'row-meta';
      label.textContent = pair[0];
      box.appendChild(label);

      var value = document.createElement('div');
      value.className = 'tally-value';
      value.textContent = pair[1];
      box.appendChild(value);

      wrap.appendChild(box);
    });
    return wrap;
  }

   * @param {string} title

  function makeUsageRanking(title, rows) {
    var wrap = document.createElement('div');

    var head = document.createElement('h3');

    }

    var top = rows[0].count || 1;
    var list = document.createElement('div');

    rows.slice(0, 15).forEach(function (row) {

      track.appendChild(bar);

  /**
   * 日ごとの回数を並べる。
   *
   * @param {object[]} rows
   * @returns {HTMLElement}
   */
  function makeUsageDays(rows) {
    var wrap = document.createElement('div');
    wrap.className = 'tally-block';

    var head = document.createElement('h3');
    head.textContent = '日ごと';
    wrap.appendChild(head);

    var top = 1;
    rows.forEach(function (r) { if (r.count > top) top = r.count; });

    var chart = document.createElement('div');
    chart.className = 'usage-days';

    rows.forEach(function (row) {
      var col = document.createElement('div');
      col.className = 'usage-day';
      attachHint(col, row.day + ' · ' + row.count + '回');

      var bar = document.createElement('span');
      bar.className = 'usage-day-bar';
      bar.style.height = Math.max(4, Math.round(row.count / top * 100)) + '%';
      col.appendChild(bar);

      chart.appendChild(col);
    });

    wrap.appendChild(chart);
    return wrap;
  }

  // ===== 知らせ =====

  /**
   * デスクトップ通知が使えるかを見る。
   *
   * この画面は枠の中で動くため、ブラウザや設定によっては許可そのものを
   * 求められない。使えないときは画面の中の知らせだけで済ませる。
   *
   * @returns {string} 'granted' | 'denied' | 'default' | 'unavailable'
   */
  function desktopState() {
    try {
      if (!window.Notification) return 'unavailable';
      return window.Notification.permission;
    } catch (e) {
      return 'unavailable';
    }
  }

  function renderDesktopButton() {
    var btn = document.getElementById('notice-desktop');
    var note = document.getElementById('notice-desktop-note');
    var state = desktopState();

    btn.hidden = state !== 'default';
    note.textContent = {
      granted: 'デスクトップ通知は入になっています',
      denied: 'デスクトップ通知はブラウザ側で断られています。ここの一覧で見てください',
      unavailable: 'この環境ではデスクトップ通知を出せません。ここの一覧で見てください',
      'default': '',
    }[state] || '';
  }

  /**
   * デスクトップに出す。出せなければ何もしない。
   *
   * @param {object} notice
   */
  function popDesktop(notice) {
    if (desktopState() !== 'granted') return;

    try {
      var n = new window.Notification(notice.title, { body: notice.body });
      n.onclick = function () {
        window.focus();
        openNoticeLink(notice);
      };
    } catch (e) { /* 出せなくても画面の中には残っている */ }
  }

  /**
   * 知らせの指す場所を開く。
   *
   * @param {object} notice
   */
  function openNoticeLink(notice) {
    var parts = String(notice.link || '').split(':');
    if (parts[0] === 'report') {
      switchTab('report');
      openReport(Number(parts[1]));
    } else if (parts[0] === 'pull') {
      switchTab('pulls');
    }
    noticePanel.hidden = true;
    bellBtn.setAttribute('aria-expanded', 'false');
  }

  /**
   * 知らせを取ってくる。
   *
   * @param {boolean} [quiet] 初回は前からあるぶんで驚かせない
   */
  function loadNotices(quiet) {
    call('apiNotifications', [30], function (res) {
      var data = res || { items: [], unread: 0 };
      renderNotices(data.items);

      bellCount.textContent = data.unread;
      bellCount.hidden = !data.unread;
      bellBtn.title = data.unread
        ? '知らせが' + data.unread + '件あります' : '知らせ';
      bellBtn.setAttribute('aria-label', bellBtn.title);

      // 前に見た番号より新しく、まだ読んでいないものだけを前に出す
      var fresh = data.items.filter(function (n) {
        return !n.read && n.id > seenNoticeId;
      });

      data.items.forEach(function (n) {
        if (n.id > seenNoticeId) seenNoticeId = n.id;
      });

      if (quiet || !fresh.length) return;

      showSnack(fresh[0].title, { kind: 'ok' });
      fresh.forEach(popDesktop);
    }, failQuiet('知らせが出ないだけ'));
  }

  /**
   * @param {object[]} items
   */
  function renderNotices(items) {
    noticeBody.textContent = '';

    if (!items.length) {
      noticeBody.appendChild(makeBlankState(
        '知らせはありません',
        '名前を呼ばれたときや、返信があったときにここに出ます。'
      ));
      return;
    }

    var labels = { mention: '呼ばれました', reply: '返信', review: '確認の依頼' };

    items.forEach(function (n) {
      var row = document.createElement('button');
      row.className = 'notice-item' + (n.read ? '' : ' unread');

      var head = document.createElement('div');
      head.className = 'row-meta';
      head.textContent = (labels[n.kind] || n.kind) + ' · ' +
        String(n.at).substring(0, 10);
      row.appendChild(head);

      var title = document.createElement('div');
      title.className = 'row-title';
      title.textContent = n.title;
      row.appendChild(title);

      if (n.body) {
        var body = document.createElement('div');
        body.className = 'row-meta notice-quote';
        body.textContent = n.body;
        row.appendChild(body);
      }

      row.addEventListener('click', function () {
        call('apiNotificationsRead', [[n.id]],
          function () { loadNotices(true); },
          failQuiet('知らせなくてよい'));
        openNoticeLink(n);
      });

      noticeBody.appendChild(row);
    });
  }

    .addEventListener('click', function () { addDocs(this); });

  document.getElementById('report-btn')
    .addEventListener('click', function () { createReport(this); });

  reportFilterEl.addEventListener('input', loadReports);
  setToggle(reportOpenBtn, reportOpenOnly);
  reportOpenBtn.addEventListener('click', function () {
    reportOpenOnly = !reportOpenOnly;
    setToggle(reportOpenBtn, reportOpenOnly);
    loadReports();
  });

  makeResizable(document.getElementById('report-resizer'),
    '--report-pane-w', 'reportPaneWidth',
    function (e) {
      var box = document.querySelector('#panel-report .graph-split')
        .getBoundingClientRect();
      return e.clientX - box.left;
    }, { min: 260, max: 1200 });

  setToggle(mineBtn, mineOnly);
  document.getElementById('tasks-btn').addEventListener('click', function () {
    openTasks(this);
  });
  loadTasksState();

  meBtn.addEventListener('click', function () {
    var open = mePanel.hidden;

    if (open) drawMe();
    mePanel.hidden = !open;
    meBtn.setAttribute('aria-expanded', String(open));
  });
  document.getElementById('me-close').addEventListener('click', closeMe);
  drawMe();

  bellBtn.appendChild(makeIcon('bell'));
  bellBtn.insertBefore(bellBtn.lastChild, bellCount);

  bellBtn.addEventListener('click', function () {
    var open = noticePanel.hidden;
    noticePanel.hidden = !open;
    bellBtn.setAttribute('aria-expanded', String(open));
    if (open) {
      renderDesktopButton();
      loadNotices(true);
    }
  });

  document.getElementById('notice-close').addEventListener('click', function () {
    noticePanel.hidden = true;
    bellBtn.setAttribute('aria-expanded', 'false');
  });

  document.getElementById('notice-read-all').addEventListener('click', function () {
    call('apiNotificationsRead', [[]], function () { loadNotices(true); });
  });

  document.getElementById('notice-desktop').addEventListener('click', function () {
    // 許可を求められるのは人が押した直後だけ
    try {
      window.Notification.requestPermission().then(function () {
        renderDesktopButton();
      });
    } catch (e) {
      renderDesktopButton();
    }
  });

  loadNotices(true);
  window.setInterval(function () { loadNotices(false); }, 60000);

  mineBtn.addEventListener('click', function () {
    mineOnly = !mineOnly;
    setToggle(mineBtn, mineOnly);
    reloadIssueView();
  });

  diffExpandBtn.addEventListener('click', function () {
    setDiffFull(!diffPane.classList.contains('full'));
  });
  setDiffFull(false);

  // どこにいても Escape で入力を閉じられる。広げた差分もここで畳む
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!sidePanel.hidden) closeSide();
    else if (diffPane.classList.contains('full')) setDiffFull(false);
  });

  call('apiWhoAmI', [], function (who) {
    currentUser = (who || {}).activeUser || '';
    drawMe();
  }, failQuiet('判定できなければ従来どおり押せる'));

  call('apiPeopleNames', [],
    function (map) { peopleNames = map || {}; },
    failQuiet('アドレスの手前で出る'));

  call('apiTemplateList', [],
    function (list) { templates = list || []; },
    failQuiet('差し込めないだけで書ける'));

  call('apiTagList', [],
    function (list) { tags = list || []; },
    failQuiet('選べないだけで手で書ける'));

  call('apiKnownPeople', [],
    function (list) { roster = list || []; },
    failQuiet('呼べないだけで書き込みはできる'));

  call('apiArchiveKeepDays', [],
    function (days) { archiveKeepDays = Number(days) || 30; },
    failQuiet('既定の30日で表示する'));

  makeResizable(resizer, '--sidebar-w', 'sidebarWidth',
    function (e) { return e.clientX; }, { min: 180, max: 560 });

  call('apiIssuePriorities', [], function (list) {
    if (list && list.length) priorities = list;
  }, failQuiet('取れなくても同じ並びを持っている'));

  // 右端のペインなので、左へ引くほど広がる
  makeResizable(sideResizer, '--side-pane-w', 'sidePaneWidth',
    function (e) { return window.innerWidth - e.clientX; },
    { min: 280, max: 900 });

  makeResizable(document.getElementById('pr-resizer'), '--pr-pane-w', 'prPaneWidth',
    function (e) {
      var box = document.querySelector('#panel-pulls .graph-split').getBoundingClientRect();
      return e.clientX - box.left;
    }, { min: 280, max: 1200 });

  makeResizable(diffResizer, '--graph-pane-w', 'graphPaneWidth',
    function (e) {
      var box = document.querySelector('.graph-split').getBoundingClientRect();
      return e.clientX - box.left;
    }, { min: 280, max: 1200 });
  applyTheme(readTheme());

  try {
    var savedView = window.localStorage.getItem('issueView');
    if (savedView && viewBtns[savedView]) issueView = savedView;
  } catch (e) { /* 既定の一覧でよい */ }
  setIssueView(issueView);

  // 出入りは画面全体で見る。要素ごとに見ると、押した拍子に一覧が
  // 描き直されたときに「離れた」が来ず、出たまま残る
  document.addEventListener('pointerover', function (e) { trackHint(e.target); });
  document.addEventListener('focusin', function (e) { trackHint(e.target); });
  document.addEventListener('focusout', hideHint);

  // 押したら引っ込める。多くの場合その先で画面が描き直される
  document.addEventListener('pointerdown', hideHint);

  // どこがよく使われているかを数える。誰が押したかは数えない
  document.addEventListener('click', function (e) {
    usageCount('action', usageTargetOf(e.target));
  }, true);

  window.setInterval(usageFlush, 60000);
  window.addEventListener('pagehide', usageFlush);

  document.addEventListener('pointermove', function (e) {
    // 出ているあいだだけ見る。相手が居なくなっていたらしまう
    if (!hintHost) return;
    if (!hintHostOf(e.target) || !document.body.contains(hintHost)) hideHint();
  });

  // 巻き取られると、測った位置とずれる。出したままにしない
  document.addEventListener('scroll', hideHint, true);
  window.addEventListener('resize', hideHint);

  fillBrand();
  applyHints();
  loadFiles(function () { switchTab('docs'); });
})();
</script>
