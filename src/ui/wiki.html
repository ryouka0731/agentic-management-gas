<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('ui/app.css') ?>
</head>
<body>
  <div class="layout">
    <nav class="sidebar" aria-label="対象の切り替え">
      <div class="nav-section">
        <h2>管理するもの</h2>
        <button class="nav-item" data-tab="docs">
          <span class="nav-label">文書</span>
          <span class="nav-desc">正式版と改訂版</span>
        </button>
        <button class="nav-item" data-tab="issues">
          <span class="nav-label">やること</span>
          <span class="nav-count" id="count-todos" hidden></span>
          <span class="nav-desc">一覧・ボード・工程表</span>
        </button>
      </div>

      <div class="nav-section">
        <h2>進行中</h2>
        <button class="nav-item" data-tab="branches">
          <span class="nav-label">改訂中の版</span>
          <span class="nav-count" id="count-drafts" hidden></span>
          <span class="nav-desc">直している途中の版</span>
        </button>
        <button class="nav-item" data-tab="pulls">
          <span class="nav-label">確認依頼</span>
          <span class="nav-count" id="count-requests" hidden></span>
          <span class="nav-desc">正式版に反映してよいか尋ねる</span>
        </button>
      </div>

      <div class="nav-section">
        <h2>困ったとき</h2>
        <button class="nav-item" data-tab="help">
          <span class="nav-label">使い方</span>
          <span class="nav-desc">はじめての方へ</span>
        </button>
        <button class="nav-item" data-tab="report">
          <span class="nav-label">要望・不具合</span>
          <span class="nav-count" id="count-reports" hidden></span>
          <span class="nav-desc">みんなで話せる相談板</span>
        </button>
      </div>
    </nav>

    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical"
         tabindex="0" aria-label="ペインの幅を変える (二度押しで元に戻す)"></div>

    <div class="main">
      <div class="toolbar">
        <nav class="crumbs" aria-label="現在の位置">
          <button class="crumb-back" id="crumb-back" hidden>文書</button>
          <span class="crumb-sep" id="crumb-sep" aria-hidden="true" hidden>/</span>
          <h1 id="doc-title">文書</h1>
          <span id="branch-chip" class="chip" hidden></span>
          <span id="dirty-badge" class="badge" hidden>記録していない変更</span>
        </nav>

        <span class="spacer"></span>
        <label class="branch-switch" id="branch-switch" hidden>
          <span class="row-meta">版</span>
          <select id="branch-select" aria-label="表示する版"></select>
        </label>
        <button id="commit-btn" class="btn btn-primary" hidden>変更を記録</button>
        <button id="stash-btn" class="btn" hidden>直接編集を退避</button>
        <a id="open-in-docs" href="#" target="_blank" hidden>元のファイルを開く</a>
        <button id="bell-btn" class="theme-btn bell" type="button"
                aria-expanded="false">
          <span class="bell-count" id="bell-count" hidden></span>
        </button>
        <button id="theme-btn" class="theme-btn" type="button"></button>
      </div>

      <div class="tabs" id="tabs" hidden>
        <button class="tab" data-tab="content" aria-current="true">本文</button>
        <button class="tab" data-tab="history">改訂の履歴</button>
        <button class="tab" data-tab="drafts">この文書の改訂版</button>
      </div>

      <div class="panel panel-col" id="panel-docs">
        <div class="list-area" id="doc-list"></div>

        <aside class="guideline" id="guideline">
          <button class="guideline-head" id="guideline-toggle" aria-expanded="true">
            <span class="guideline-tag">はじめに</span>
            <span class="guideline-lead">
              直すたびに「誰がいつ何を変えたか」が残り、いつでも前の状態と見比べられます
            </span>
            <span class="guideline-mark" aria-hidden="true">▾</span>
          </button>
          <button class="side-close" id="guideline-hide" type="button"
                  aria-label="この案内を閉じる">×</button>

          <div class="guideline-body" id="guideline-body">
            <ol class="flow-steps">
              <li class="flow-step">
                <button class="flow-btn" data-tab="issues">
                  <span class="flow-name">やること</span>
                  <span class="flow-count" id="flow-issues">—</span>
                </button>
                <span class="flow-desc">何をするか決める</span>
              </li>
              <li class="flow-arrow" aria-hidden="true">→</li>
              <li class="flow-step">
                <button class="flow-btn" data-tab="branches">
                  <span class="flow-name">改訂版</span>
                  <span class="flow-count" id="flow-branches">—</span>
                </button>
                <span class="flow-desc">文書を直す</span>
              </li>
              <li class="flow-arrow" aria-hidden="true">→</li>
              <li class="flow-step">
                <button class="flow-btn" data-tab="pulls">
                  <span class="flow-name">確認依頼</span>
                  <span class="flow-count" id="flow-prs">—</span>
                </button>
                <span class="flow-desc">見てもらう</span>
              </li>
              <li class="flow-arrow" aria-hidden="true">→</li>
              <li class="flow-step">
                <button class="flow-btn" data-tab="docs">
                  <span class="flow-name">正式版</span>
                  <span class="flow-count" id="flow-docs">—</span>
                </button>
                <span class="flow-desc">反映される</span>
              </li>
            </ol>
          </div>
        </aside>
      </div>

      <div class="panel panel-col" id="panel-content" hidden>
        <div class="linked-issues" id="linked-issues" hidden></div>

        <div class="doc-modes">
          <div class="segmented" role="group" aria-label="表示のしかた">
            <button class="seg" id="mode-view" aria-pressed="true">読む</button>
            <button class="seg" id="mode-edit" aria-pressed="false">直す</button>
          </div>
          <span class="row-meta" id="mode-hint"></span>
          <span class="spacer"></span>
          <button id="edit-save-btn" class="btn btn-primary" hidden>保存</button>
        </div>

        <iframe id="viewer" class="viewer" sandbox></iframe>
        <textarea id="editor" class="editor" spellcheck="false" hidden></textarea>
      </div>

      <div class="panel" id="panel-history" hidden>
        <div class="graph-split">
          <div class="graph-pane" id="graph-pane">
            <div class="graph-head">
              <span class="graph-col-graph">系統</span>
              <span class="graph-col-desc">変更の内容</span>
              <span class="graph-col-date">日時</span>
              <span class="graph-col-author">記録した人</span>
              <span class="graph-col-sha">記録番号</span>
            </div>
            <div class="history-list" id="history-list"></div>
          </div>

          <div class="resizer" id="diff-resizer" role="separator"
               aria-orientation="vertical" tabindex="0"
               aria-label="履歴と差分の幅を変える (二度押しで元に戻す)"></div>

          <div class="diff-pane" id="diff-pane">
            <div class="diff-bar">
              <span class="row-meta" id="diff-caption"></span>
              <span class="spacer"></span>
              <button class="icon-btn" id="diff-expand" type="button"
                      aria-pressed="false"></button>
            </div>
            <div class="diff-view" id="diff-view"></div>
          </div>
        </div>
      </div>

      <div class="panel panel-col" id="panel-drafts" hidden>
        <div class="panel-actions">
          <button id="draft-create-btn" class="btn btn-primary">この文書の改訂版を作る</button>
          <span class="row-meta">正式版をコピーして、直す用の版を作ります</span>
        </div>
        <div class="list-area" id="draft-list"></div>
      </div>

      <div class="panel panel-col" id="panel-branches" hidden>
        <div class="panel-actions">
          <button id="branch-create-btn" class="btn btn-primary">改訂版を作る</button>
          <button id="bulk-commit-btn" class="btn">まとめて記録</button>
        </div>
        <div class="list-area" id="branch-list"></div>
      </div>

      <div class="panel" id="panel-pulls" hidden>
        <div class="graph-split">
          <div class="graph-pane" id="pr-pane">
            <div class="history-list" id="pr-list"></div>
          </div>

          <div class="resizer" id="pr-resizer" role="separator"
               aria-orientation="vertical" tabindex="0"
               aria-label="一覧と中身の幅を変える (二度押しで元に戻す)"></div>

          <div class="diff-pane">
            <div class="diff-view" id="pr-detail"></div>
          </div>
        </div>
      </div>

      <div class="panel panel-col" id="panel-issues" hidden>
        <div class="view-bar">
          <div class="segmented" role="group" aria-label="見え方">
            <button class="seg" id="view-list" aria-pressed="true">一覧</button>
            <button class="seg" id="view-board" aria-pressed="false">ボード</button>
            <button class="seg" id="view-gantt" aria-pressed="false">工程表</button>
            <button class="seg" id="view-tally" aria-pressed="false">集計</button>
            <button class="seg" id="view-trash" aria-pressed="false">捨てたもの</button>
          </div>

          <label class="tally-switch" id="tally-unit-box" hidden>
            <span class="row-meta">区切り</span>
            <select id="tally-unit" aria-label="集計の区切り"></select>
          </label>

          <label class="tally-switch" id="tally-basis-box" hidden>
            <span class="row-meta">数え方</span>
            <select id="tally-basis" aria-label="どの日で数えるか"></select>
          </label>

          <label class="tally-switch" id="tally-who-box" hidden>
            <span class="row-meta">対象</span>
            <select id="tally-who" aria-label="誰の内訳を見るか"></select>
          </label>

          <button class="btn toggle-btn" id="mine-btn" type="button">
            自分の担当だけ
          </button>

          <label class="filter-box">
            <input id="issue-filter" type="search" placeholder="題名・担当・ラベル・文書名で絞る"
                   aria-label="やることを絞り込む">
          </label>

          <label class="group-switch">
            <span class="row-meta">まとめ方</span>
            <select id="issue-group" aria-label="やることのまとめ方">
              <option value="doc">文書ごと</option>
              <option value="assignee">担当者ごと</option>
              <option value="state">状態ごと</option>
              <option value="label">ラベルごと</option>
              <option value="none">まとめない</option>
            </select>
          </label>

          <span class="spacer"></span>
          <span class="row-meta panel-count" id="issue-count"></span>
          <button id="tasks-btn" class="btn" type="button" hidden>Google ToDo</button>
          <button id="issue-create-btn" class="btn btn-primary">やることを作る</button>
        </div>

        <div class="drop-root" id="drop-root" hidden>
          ここに落とすと親子を解除します
        </div>
        <div class="list-area" id="issue-list"></div>
        <div class="board" id="board" hidden></div>
        <div class="gantt-scroll" id="gantt" hidden></div>
        <div class="list-area" id="tally" hidden></div>
        <div class="list-area" id="trash-list" hidden></div>
      </div>

      <div class="panel" id="panel-help" hidden>
        <div class="guide" id="guide"></div>
      </div>

      <div class="panel panel-col" id="panel-report" hidden>
        <div class="panel-actions">
          <button id="report-btn" class="btn btn-primary">開発者に伝える</button>
          <label class="filter-box">
            <input id="report-filter" type="search" placeholder="内容・種類・書いた人で絞る"
                   aria-label="報告を絞り込む">
          </label>
          <button class="btn toggle-btn" id="report-open-btn" type="button">未解決だけ</button>
          <span class="spacer"></span>
          <span class="row-meta">
            みんなで読んで話せます。見ている画面と環境も一緒に届きます
          </span>
        </div>

        <div class="graph-split">
          <div class="graph-pane" id="report-pane">
            <div class="history-list" id="report-list"></div>
          </div>

          <div class="resizer" id="report-resizer" role="separator"
               aria-orientation="vertical" tabindex="0"
               aria-label="一覧と話の幅を変える (二度押しで元に戻す)"></div>

          <div class="diff-pane">
            <div class="diff-view" id="report-detail"></div>
          </div>
        </div>
      </div>
    </div>

    <aside class="notice-panel" id="notice-panel" hidden aria-label="知らせ">
      <div class="side-head">
        <h2>知らせ</h2>
        <button class="btn" id="notice-read-all" type="button">全部読んだ</button>
        <button class="side-close" id="notice-close" type="button"
                aria-label="閉じる">×</button>
      </div>
      <div class="notice-body" id="notice-body"></div>
      <div class="notice-foot">
        <button class="btn" id="notice-desktop" type="button" hidden>
          デスクトップ通知を受け取る
        </button>
        <span class="row-meta" id="notice-desktop-note"></span>
      </div>
    </aside>

    <aside class="side-panel" id="side-panel" hidden aria-labelledby="side-title">
      <div class="side-head">
        <h2 id="side-title"></h2>
        <button class="side-close" id="side-close" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="side-body" id="side-body"></div>
    </aside>
  </div>
  <?!= include('ui/app.js') ?>
</body>
</html>
