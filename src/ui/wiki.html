<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('ui/app.css') ?>
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <h2>ファイル</h2>
      <div id="file-list"></div>
    </nav>
    <div class="main">
      <div class="toolbar">
        <h1 id="doc-title">—</h1>
        <span id="branch-chip" class="chip" hidden></span>
        <span id="dirty-badge" class="badge" hidden>未コミットの変更</span>
        <span class="spacer"></span>
        <button id="commit-btn" class="btn" hidden>コミット</button>
        <button id="stash-btn" class="btn" hidden>直接編集を退避</button>
        <a id="open-in-docs" href="#" target="_blank" hidden>Google ドキュメントで開く</a>
      </div>

      <div class="tabs" id="tabs" hidden>
        <button class="tab" data-tab="content" aria-current="true">本文</button>
        <button class="tab" data-tab="edit">編集</button>
        <button class="tab" data-tab="history">履歴</button>
        <button class="tab" data-tab="branches">ブランチ</button>
        <button class="tab" data-tab="pulls">プルリクエスト</button>
        <button class="tab" data-tab="issues">Issue</button>
        <button class="tab" data-tab="board">ボード</button>
      </div>

      <div class="panel panel-col" id="panel-content" hidden>
        <div class="linked-issues" id="linked-issues" hidden></div>
        <iframe id="viewer" class="viewer" sandbox></iframe>
      </div>

      <div class="panel panel-col" id="panel-edit" hidden>
        <div class="panel-actions">
          <button id="edit-save-btn" class="btn">保存</button>
          <span class="row-meta" id="edit-hint"></span>
        </div>
        <textarea id="editor" class="editor" spellcheck="false"></textarea>
      </div>

      <div class="panel" id="panel-history" hidden>
        <div class="history-list" id="history-list"></div>
        <div class="diff-view" id="diff-view"></div>
      </div>

      <div class="panel panel-col" id="panel-branches" hidden>
        <div class="panel-actions">
          <button id="branch-create-btn" class="btn">ブランチを作成</button>
          <span class="row-meta">mainのファイルを選んでから作成してください</span>
        </div>
        <div class="list-area" id="branch-list"></div>
      </div>

      <div class="panel" id="panel-pulls" hidden>
        <div class="history-list" id="pr-list"></div>
        <div class="diff-view" id="pr-detail"></div>
      </div>

      <div class="panel panel-col" id="panel-issues" hidden>
        <div class="panel-actions">
          <button id="issue-create-btn" class="btn">Issueを作成</button>
          <span class="row-meta">選択中の文書に紐づけて作成します</span>
        </div>
        <div class="list-area" id="issue-list"></div>
      </div>

      <div class="panel" id="panel-board" hidden>
        <div class="board" id="board"></div>
      </div>

      <div id="empty" class="empty">左からファイルを選択してください</div>
    </div>
  </div>
  <?!= include('ui/app.js') ?>
</body>
</html>
