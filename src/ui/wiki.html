<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('ui/app.css') ?>
</head>
<body>
  <div class="layout">
    <nav class="sidebar" aria-label="対象の切り替え">
      <button class="nav-item" data-tab="docs">
        <span class="nav-label">文書</span>
        <span class="nav-desc">管理している文書</span>
      </button>
      <button class="nav-item" data-tab="branches">
        <span class="nav-label">改訂中の版</span>
        <span class="nav-count" id="count-drafts" hidden></span>
        <span class="nav-desc">直している途中の版</span>
      </button>
      <button class="nav-item" data-tab="pulls">
        <span class="nav-label">確認依頼</span>
        <span class="nav-count" id="count-requests" hidden></span>
        <span class="nav-desc">正式版に反映してよいか尋ねる</span>
      </button>
      <button class="nav-item" data-tab="issues">
        <span class="nav-label">やること</span>
        <span class="nav-count" id="count-todos" hidden></span>
        <span class="nav-desc">誰かがやるべき作業</span>
      </button>
      <button class="nav-item" data-tab="board">
        <span class="nav-label">進捗ボード</span>
        <span class="nav-desc">やることの進み具合</span>
      </button>
      <button class="nav-item" data-tab="gantt">
        <span class="nav-label">工程表</span>
        <span class="nav-desc">期限と進み具合を時系列で</span>
      </button>
      <button class="nav-item" data-tab="help">
        <span class="nav-label">使い方</span>
        <span class="nav-desc">はじめての方へ</span>
      </button>
    </nav>

    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical"
         tabindex="0" aria-label="ペインの幅を変える"></div>

    <div class="main">
      <div class="toolbar">
        <nav class="crumbs" aria-label="現在の位置">
          <button class="crumb-back" id="crumb-back" hidden>文書</button>
          <span class="crumb-sep" id="crumb-sep" aria-hidden="true" hidden>/</span>
          <h1 id="doc-title">文書</h1>
          <span id="branch-chip" class="chip" hidden></span>
          <span id="dirty-badge" class="badge" hidden>記録していない変更</span>
        </nav>

        <span class="spacer"></span>
        <label class="branch-switch" id="branch-switch" hidden>
          <span class="row-meta">版</span>
          <select id="branch-select" aria-label="表示する版"></select>
        </label>
        <button id="commit-btn" class="btn btn-primary" hidden>変更を記録</button>
        <button id="stash-btn" class="btn" hidden>直接編集を退避</button>
        <a id="open-in-docs" href="#" target="_blank" hidden>元のファイルを開く</a>
        <button id="theme-btn" class="theme-btn" type="button"></button>
      </div>

      <div class="tabs" id="tabs" hidden>
        <button class="tab" data-tab="content" aria-current="true">本文</button>
        <button class="tab" data-tab="history">改訂の履歴</button>
        <button class="tab" data-tab="drafts">この文書の改訂版</button>
      </div>

      <div class="panel panel-col" id="panel-docs">
        <div class="flow" id="flow">
          <p class="flow-lead">
            文書を直接なおさず、<strong>改訂版</strong>で変更し、
            <strong>確認依頼</strong>を経て<strong>正式版</strong>に反映します。
          </p>
          <ol class="flow-steps">
            <li class="flow-step">
              <button class="flow-btn" data-tab="issues">
                <span class="flow-name">やること</span>
                <span class="flow-count" id="flow-issues">—</span>
              </button>
              <span class="flow-desc">何をするか決める</span>
            </li>
            <li class="flow-arrow" aria-hidden="true">→</li>
            <li class="flow-step">
              <button class="flow-btn" data-tab="branches">
                <span class="flow-name">改訂版</span>
                <span class="flow-count" id="flow-branches">—</span>
              </button>
              <span class="flow-desc">文書を直す</span>
            </li>
            <li class="flow-arrow" aria-hidden="true">→</li>
            <li class="flow-step">
              <button class="flow-btn" data-tab="pulls">
                <span class="flow-name">確認依頼</span>
                <span class="flow-count" id="flow-prs">—</span>
              </button>
              <span class="flow-desc">見てもらう</span>
            </li>
            <li class="flow-arrow" aria-hidden="true">→</li>
            <li class="flow-step">
              <button class="flow-btn" data-tab="docs">
                <span class="flow-name">正式版</span>
                <span class="flow-count" id="flow-docs">—</span>
              </button>
              <span class="flow-desc">反映される</span>
            </li>
          </ol>
        </div>

        <div class="list-area" id="doc-list"></div>
      </div>

      <div class="panel panel-col" id="panel-content" hidden>
        <div class="linked-issues" id="linked-issues" hidden></div>

        <div class="doc-modes">
          <div class="segmented" role="group" aria-label="表示のしかた">
            <button class="seg" id="mode-view" aria-pressed="true">読む</button>
            <button class="seg" id="mode-edit" aria-pressed="false">直す</button>
          </div>
          <span class="row-meta" id="mode-hint"></span>
          <span class="spacer"></span>
          <button id="edit-save-btn" class="btn btn-primary" hidden>保存</button>
        </div>

        <iframe id="viewer" class="viewer" sandbox></iframe>
        <textarea id="editor" class="editor" spellcheck="false" hidden></textarea>
      </div>

      <div class="panel panel-col" id="panel-history" hidden>
        <div class="graph-head">
          <span class="graph-col-graph">系統</span>
          <span class="graph-col-desc">変更の内容</span>
          <span class="graph-col-date">日時</span>
          <span class="graph-col-author">記録した人</span>
          <span class="graph-col-sha">記録番号</span>
        </div>
        <div class="graph-split">
          <div class="history-list" id="history-list"></div>
          <div class="diff-view" id="diff-view"></div>
        </div>
      </div>

      <div class="panel panel-col" id="panel-drafts" hidden>
        <div class="panel-actions">
          <button id="draft-create-btn" class="btn btn-primary">この文書の改訂版を作る</button>
          <span class="row-meta">正式版をコピーして、直す用の版を作ります</span>
        </div>
        <div class="list-area" id="draft-list"></div>
      </div>

      <div class="panel panel-col" id="panel-branches" hidden>
        <div class="panel-actions">
          <button id="branch-create-btn" class="btn btn-primary">改訂版を作る</button>
          <button id="bulk-commit-btn" class="btn">まとめて記録</button>
        </div>
        <div class="list-area" id="branch-list"></div>
      </div>

      <div class="panel" id="panel-pulls" hidden>
        <div class="history-list" id="pr-list"></div>
        <div class="diff-view" id="pr-detail"></div>
      </div>

      <div class="panel panel-col" id="panel-issues" hidden>
        <div class="panel-actions">
          <button id="issue-create-btn" class="btn btn-primary">やることを作る</button>
          <label class="group-switch">
            <span class="row-meta">まとめ方</span>
            <select id="issue-group" aria-label="やることのまとめ方">
              <option value="doc">文書ごと</option>
              <option value="assignee">担当者ごと</option>
              <option value="state">状態ごと</option>
              <option value="label">ラベルごと</option>
              <option value="none">まとめない</option>
            </select>
          </label>
        </div>
        <div class="list-area" id="issue-list"></div>
      </div>

      <div class="panel panel-col" id="panel-board" hidden>
        <div class="panel-actions">
          <button id="board-create-btn" class="btn btn-primary">やることを作る</button>
          <span class="row-meta">カードはやることです</span>
        </div>
        <div class="board" id="board"></div>
      </div>

      <div class="panel panel-col" id="panel-gantt" hidden>
        <div class="panel-actions">
          <label class="group-switch">
            <span class="row-meta">まとめ方</span>
            <select id="gantt-group" aria-label="工程表のまとめ方">
              <option value="doc">文書ごと</option>
              <option value="assignee">担当者ごと</option>
              <option value="state">状態ごと</option>
              <option value="label">ラベルごと</option>
              <option value="none">まとめない</option>
            </select>
          </label>
          <span class="row-meta">棒の端を掴むと期限を、真ん中を掴むと全体を動かせます</span>
        </div>
        <div class="gantt-scroll" id="gantt"></div>
      </div>

      <div class="panel" id="panel-help" hidden>
        <div class="guide" id="guide"></div>
      </div>
    </div>

    <aside class="side-panel" id="side-panel" hidden aria-labelledby="side-title">
      <div class="side-head">
        <h2 id="side-title"></h2>
        <button class="side-close" id="side-close" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="side-body" id="side-body"></div>
    </aside>
  </div>
  <?!= include('ui/app.js') ?>
</body>
</html>
